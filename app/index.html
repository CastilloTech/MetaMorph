  /* ----- routine run ----- */

  function findRoutine(gate, id) { return S.gates[gate].find(r => r.id === id); }

  // A run belongs to the day it started, so a routine finished after midnight still counts for that night.
  function startRoutine(gate, id) {
    const r = findRoutine(gate, id);
    if (!r) return;
    const key = today();
    let idx = r.steps.findIndex(s => !isDone(s.id, key));
    if (idx < 0 || isDone(r.id, key)) idx = 0;
    unlockAudio(); lockScreen(); startTicker();
    run = { gate, rid: id, idx, key };
    beginStep(idx);
  }

  // keep the run in saved state so closing the app doesn't lose it
  function saveRun() { S.run = run ? { ...run } : null; save(); }
  function resumeRun() {
    const r0 = S.run;
    if (!r0 || !findRoutine(r0.gate, r0.rid)) { S.run = null; return; }
    // abandon runs left open for more than a day
    if (Date.now() - (r0.paused ? Date.now() : r0.end) > DAY) { S.run = null; save(); return; }
    run = { ...r0, entered: true };
    startTicker();
    if (run.autoAt && run.autoAt < Date.now()) run.autoAt = Date.now() + 1500;
    lockScreen();
  }

  function beginStep(i) {
    const r = findRoutine(run.gate, run.rid);
    run.idx = i;
    run.phase = 'step';
    run.autoAt = null;
    run.over = false;
    run.total = Math.max(1, Number(r.steps[i].minutes)) * 60000;
    run.end = Date.now() + run.total;
    run.paused = false;
    beep(880, 0.3);
    saveRun();
    renderRun();
  }

  function finishStep() {
    const r = findRoutine(run.gate, run.rid);
    if (run.over) {
      run.late = run.late || {};
      run.late[r.steps[run.idx].id] = Math.round((Date.now() - run.end) / 1000);
      run.over = false;
    }
    setDone(r.steps[run.idx].id, true, run.key);
    if (run.idx >= r.steps.length - 1) {
      for (const o of [...(run.open || [])]) closeLate(o);
      setDone(r.id, true, run.key);
      setFin(r.id, Date.now(), run.key); save();
      checkHeld(r, run.key);
      run.phase = 'complete';
      run.next = nextRoutine();
      run.autoAt = run.next && run.next.auto ? Date.now() + AUTO_MS : null;
      beep(660, 0.6);
    } else {
      run.phase = 'between';
      run.autoAt = Date.now() + AUTO_MS;
      beep(660, 0.3);
    }
    saveRun();
    renderRun();
  }

  // A step's time ran out. If another step follows, it starts now and the unfinished one stays open,
  // counting overtime until it's marked done. The last step has nowhere to go, so it runs over in place.
  function timeUp() {
    const r = findRoutine(run.gate, run.rid);
    if (run.idx < r.steps.length - 1) {
      run.open = run.open || [];
      run.open.push({ id: r.steps[run.idx].id, end: run.end });
      beep(440, 0.4, 0);
      beginStep(run.idx + 1);
    } else {
      run.over = true;
      beep(440, 0.5);
      saveRun();
      renderRun();
    }
  }
  // close a late step, recording how far past its time it ran
  function closeLate(o) {
    run.late = run.late || {};
    run.late[o.id] = Math.round((Date.now() - o.end) / 1000);
    setDone(o.id, true, run.key);
    run.open = (run.open || []).filter(x => x.id !== o.id);
  }

  const AUTO_MS = 5000;              // countdown before the next step or routine starts by itself
  const CHAIN_WINDOW = 15 * 60000;   // only auto-start a routine due within this long

  // the next undone routine on today's timeline after the one just finished
  function nextRoutine() {
    const cur = findRoutine(run.gate, run.rid);
    const items = allRoutines().filter(x => x.r.id !== run.rid && !isDone(x.r.id) && rel(toMin(startFor(x.r))) >= rel(toMin(startFor(cur))));
    if (!items.length) return null;
    const x = items[0], startAt = windowOf(x.r).start;
    return { gate: x.gate, id: x.r.id, title: x.r.title, start: startFor(x.r), auto: startAt - Date.now() <= CHAIN_WINDOW };
  }

  function autoRing() {
    const C = 2 * Math.PI * 28;
    return `<svg class="autoring" viewBox="0 0 64 64" aria-hidden="true"><circle class="bg" cx="32" cy="32" r="28"/><circle class="fg" id="autofg" cx="32" cy="32" r="28" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg>`;
  }

  function endRun() {
    run = null;
    saveRun();
    stopTicker(); unlockScreen();
    render();
  }

  // finish this run and start the next routine on the timeline
  function chainNext() {
    const nx = run && run.next;
    if (!nx || !findRoutine(nx.gate, nx.id)) return endRun();
    run = null;
    startRoutine(nx.gate, nx.id);
  }

  const runLeft = () => run.paused ? run.remaining : run.end - Date.now();

  function renderRun() {
    const r = findRoutine(run.gate, run.rid);
    if (!r) return endRun();
    const g = gateOf(run.gate), s = r.steps[run.idx], next = r.steps[run.idx + 1];

    const segs = `<div class="segs">${r.steps.map((x, i) =>
      `<span class="${(run.phase === 'step' && i === run.idx && run.over) || (run.open || []).some(o => o.id === x.id) ? 'over' : isDone(x.id, run.key) && !(run.phase === 'step' && i === run.idx) ? 'done' : ''}" style="flex:${x.minutes}"><i ${i === run.idx && run.phase === 'step' ? 'id="seg"' : ''}></i></span>`).join('')}</div>
      <div class="seglabels"><span>${esc(r.title)}</span><span class="num">${run.phase === 'complete' ? r.steps.length : run.idx + 1}/${r.steps.length}</span></div>`;

    let center, controls;
    if (run.phase === 'step') {
      center = `
        ${(run.open || []).length ? `<div class="latebars">${run.open.map(o => {
          const st = r.steps.find(x => x.id === o.id);
          return `<div class="latebar"><span>${esc(st ? st.title : 'Step')}</span><b data-late-from="${o.end}">late +${mmss((Date.now() - o.end) / 1000)}</b><button class="btn" data-act="r-late-done" data-id="${o.id}">Done</button></div>`;
        }).join('')}</div>` : ''}
        ${orb(run.gate, (run.open || []).length ? 110 : 150, run.entered ? 'spin' : 'enter')}
        <div class="phase" style="color:${run.over ? 'var(--late)' : g.color}">STEP ${run.idx + 1}${run.over ? ' · LATE' : ''}</div>
        <div class="stepname">${esc(s.title)}</div>
        ${s.work ? `<div class="instr">${esc(s.work)}</div>` : ''}
        <div class="clock ${run.over ? 'late' : ''}" id="clock" style="font-size:72px;margin-top:10px">${run.over ? '+' + mmss(-runLeft() / 1000) : mmss(runLeft() / 1000)}</div>
        ${next ? `<div class="muted" style="font-size:14px">then ${esc(next.title)} · ${dur(next.minutes)}</div>` : ''}`;
      // in overtime the only way forward is Done
      controls = run.over
        ? `<div class="controls one"><button class="btn primary" data-act="r-done">Done</button></div>`
        : `<div class="controls">
          <button class="btn" data-act="r-pause">${run.paused ? 'Resume' : 'Pause'}</button>
          <button class="btn primary" data-act="r-done">Done</button>
        </div>`;
    } else if (run.phase === 'between') {
      const nx = r.steps[run.idx + 1];
      center = `
        ${run.autoAt ? autoRing() : '<div class="check">✓</div>'}
        <div class="muted">${esc(s.title)} done</div>
        <div class="upnext">UP NEXT</div>
        <div class="stepname">${esc(nx.title)}</div>
        <div class="muted num">${dur(nx.minutes)}${nx.work ? ` · ${esc(nx.work)}` : ''}</div>
        ${run.autoAt ? `<div class="autonext">Starts in <b id="autoleft">${Math.ceil((run.autoAt - Date.now()) / 1000)}</b>s</div>` : ''}`;
      controls = run.autoAt
        ? `<div class="controls"><button class="btn" data-act="r-hold">Hold</button><button class="btn primary" data-act="r-next">Start now</button></div>`
        : `<div class="controls"><button class="btn" data-act="r-end">End here</button><button class="btn primary" data-act="r-next">Start</button></div>`;
    } else {
      const nx = run.next;
      center = `
        ${orb(run.gate, 150, 'spin')}
        <div class="phase" style="color:${g.color}">${g.other ? 'DONE' : 'GATE HELD'}</div>
        <div class="stepname">${esc(r.title)}</div>
        <ul class="recap">${r.steps.map(x => `<li>${esc(x.title)}${run.late && run.late[x.id] ? ` <span class="ot">· late +${mmss(run.late[x.id])}</span>` : ''}</li>`).join('')}</ul>
        ${nx ? `<div class="upnext">NEXT ROUTINE</div>
          <div style="font-size:20px;font-weight:600">${esc(nx.title)} <span class="muted" style="font-weight:400;font-size:15px">· ${gateOf(nx.gate).name} · ${clock(nx.start)}</span></div>
          ${run.autoAt ? `<div class="autonext">Starts in <b id="autoleft">${Math.ceil((run.autoAt - Date.now()) / 1000)}</b>s</div>` : ''}` : ''}`;
      if (nx && run.autoAt) controls = `<div class="controls"><button class="btn" data-act="r-close">Stop here</button><button class="btn primary" data-act="r-chain">Start now</button></div>`;
      else if (nx) controls = `<div class="controls"><button class="btn" data-act="r-close">Close</button><button class="btn primary" data-act="r-chain">Start early</button></div>`;
      else controls = `<div class="controls one"><button class="btn primary" data-act="r-close">Close</button></div>`;
    }

    view.html = `
      <div class="run" style="--gc:${g.color}"><div class="inner">
        <div class="top"><span style="color:${g.color}">${g.name}</span>
          ${run.phase === 'complete' ? '<span></span>' : '<button class="btn small ghost" data-act="r-exit">Exit</button>'}</div>
        ${segs}
        <div class="center">${center}</div>
        ${controls}
      </div></div>`;
    run.entered = true;
    tick();
  }

  /* ----- drill ----- */

  const DRILL_OPTS = { focus: [20, 30, 45, 60], release: [20, 30, 45, 60], rounds: [5, 8, 10, 12], jitter: [0, 5, 8, 12] };
  const sessAvg = x => { const ok = x.latencies.filter(v => v != null); return ok.length ? avg(ok) : null; };

  // Phase changes are announced by sound and vibration only, so the screen gives nothing away.
  function cueReturn() {   // rising pair: come back to the orb
    beep(660, 0.12, 0); setTimeout(() => beep(990, 0.2, 0), 130);
    try { navigator.vibrate && navigator.vibrate([40, 60, 40]); } catch (e) {}
  }
  function cueRelease() {  // single low tone: let go
    beep(330, 0.4, 0);
    try { navigator.vibrate && navigator.vibrate(220); } catch (e) {}
  }

  function spark(vals) {
    if (vals.length < 2) return '';
    const Wd = 300, H = 44, mx = Math.max(...vals), mn = Math.min(...vals), rng = mx - mn || 1;
    const pts = vals.map((v, i) => `${(i / (vals.length - 1)) * Wd},${4 + (1 - (v - mn) / rng) * (H - 8)}`).join(' ');
    return `<svg class="spark" viewBox="0 0 ${Wd} ${H}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
  }

  function drillView() {
    const d = S.drill;
    if (V.summary) return drillSummary(V.summary);
    const ss = d.sessions, avgs = ss.map(sessAvg).filter(x => x != null);
    const recent = avgs.slice(-7), prior = avgs.slice(-14, -7);
    const ra = recent.length ? avg(recent) : null, pa = prior.length ? avg(prior) : null;
    const delta = ra != null && pa != null ? ra - pa : null;
    const est = Math.max(1, Math.round((d.rounds * d.focus + (d.rounds - 1) * d.release + 6) / 60));
    const opt = (k, v, label) => `<button data-act="dset" data-k="${k}" data-v="${v}" class="${d[k] === v ? 'on' : ''}">${label}</button>`;
    return `
      <div class="card"><div class="drillhero">${orb('chaos', 96, 'still')}<div>
        <h2>Switch Drill</h2>
        <p class="muted" style="margin:0;font-size:14px">Hold the orb. Let it go. Come back on the chime. The skill is the return.</p>
      </div></div></div>
      <div class="card">
        <p class="label">Recovery latency${recent.length ? ` · last ${recent.length}` : ''}</p>
        <div class="bigstat"><b>${ra == null ? '—' : ra.toFixed(1)}</b><span class="muted">sec</span>
          ${delta == null ? '' : `<span class="delta ${delta <= 0 ? 'good' : 'bad'}">${delta <= 0 ? '↓' : '↑'} ${Math.abs(delta).toFixed(1)}s vs previous ${prior.length}</span>`}</div>
        ${spark(avgs.slice(-20))}
        <p class="muted" style="margin:6px 0 0;font-size:12px">${avgs.length ? 'Lower is better. It should shorten over weeks.' : 'No sessions yet.'}</p>
      </div>
      <div class="card">
        <div class="setrow"><span>Focus</span><div class="opts">${DRILL_OPTS.focus.map(v => opt('focus', v, v + 's')).join('')}</div></div>
        <div class="setrow"><span>Release</span><div class="opts">${DRILL_OPTS.release.map(v => opt('release', v, v + 's')).join('')}</div></div>
        <div class="setrow"><span>Randomize</span><div class="opts">${DRILL_OPTS.jitter.map(v => opt('jitter', v, v ? '±' + v + 's' : 'Off')).join('')}</div></div>
        <div class="setrow" style="margin:0"><span>Rounds</span><div class="opts">${DRILL_OPTS.rounds.map(v => opt('rounds', v, v)).join('')}</div></div>
        <p class="muted" style="margin:12px 0 0;font-size:13px">About ${est} min. ${d.jitter ? 'Release length varies, so the return chime can’t be anticipated.' : 'Fixed timing: you may start anticipating the chime, which flatters your latency.'}</p>
      </div>
      <div class="card">
        <div class="row spread"><span style="font-size:14px">Hear the cues</span>
          <span class="row" style="gap:8px"><button class="btn small" data-act="cue-return">▲ Return</button><button class="btn small" data-act="cue-release">▼ Let go</button></span></div>
        <details class="how" style="margin-top:12px"><summary>How it works ›</summary><ol>
          <li><b>▲ Rising chime:</b> bring attention back to the orb and tap the pad the instant you're on it. That gap is your recovery latency.</li>
          <li>Hold the orb. Whenever you catch yourself drifting, come back and tap again.</li>
          <li><b>▼ Low chime:</b> let go completely. Hold nothing. Taps during release count as false starts.</li>
          <li>The screen never changes between phases, so only the sound tells you where you are.</li>
        </ol></details>
      </div>
      <button class="btn primary block" data-act="drill-start" style="margin-bottom:16px;padding:16px">Begin</button>
      ${ss.length ? `<div class="card"><p class="label">History</p><ul class="hist">${ss.slice(-10).reverse().map(x => {
          const a = sessAvg(x), miss = x.latencies.filter(v => v == null).length;
          const when = new Date(x.t).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
          return `<li><span>${esc(when)} <span class="muted">· ${x.rounds}r${miss ? ` · ${miss} missed` : ''}${x.jitter === 0 ? ' · fixed' : ''}</span></span><b class="num">${a == null ? '—' : a.toFixed(1) + ' s'}</b></li>`;
        }).join('')}</ul></div>` : ''}`;
  }

  function drillSummary(x) {
    const lats = x.latencies, ok = lats.filter(v => v != null), a = ok.length ? avg(ok) : null;
    const prev = S.drill.sessions.slice(0, -1).slice(-7).map(sessAvg).filter(v => v != null);
    const pa = prev.length ? avg(prev) : null, delta = a != null && pa != null ? a - pa : null;
    const mx = Math.max(...ok, 1);
    return `
      <div class="card" style="text-align:center">
        <div style="display:flex;justify-content:center">${orb('chaos', 72, 'still')}</div>
        <p class="label" style="margin:10px 0 4px">Session complete</p>
        <div class="bigstat" style="justify-content:center"><b>${a == null ? '—' : a.toFixed(1)}</b><span class="muted">sec average</span></div>
        ${delta == null ? '' : `<div class="delta ${delta <= 0 ? 'good' : 'bad'}" style="margin-top:4px">${delta <= 0 ? '↓ faster' : '↑ slower'} than your last ${prev.length} (${pa.toFixed(1)}s)</div>`}
        <div class="lat">${lats.map(v => v == null ? '<i class="miss" title="missed"></i>' : `<i style="height:${Math.max(4, 100 * v / mx)}%" title="${v.toFixed(1)}s"></i>`).join('')}</div>
        <p class="muted" style="margin:0;font-size:12px">One bar per return. Shorter is better; dashed means no return was tapped.</p>
        <div class="stats4">
          <div><b>${ok.length ? Math.min(...ok).toFixed(1) : '—'}</b><span>Best</span></div>
          <div><b>${x.catches}</b><span>Drifts caught</span></div>
          <div><b>${lats.filter(v => v == null).length}</b><span>Missed</span></div>
          <div><b>${x.falseTaps || 0}</b><span>False starts</span></div>
        </div>
      </div>
      <button class="btn primary block" data-act="summary-ok">Done</button>`;
  }

  // The run screen is identical in every phase: still orb, same text, same tap pad.
  function renderDrillRun() {
    const r = drillRun, d = S.drill;
    view.html = `
      <div class="run drillrun"><div class="inner">
        <div class="top"><span class="num">${r.doneRounds} of ${d.rounds} rounds</span><button class="btn small ghost" data-act="drill-stop">End</button></div>
        <div class="dots" style="margin-top:12px">${Array.from({ length: d.rounds }, (_, i) => `<i class="${i < r.doneRounds ? 'on' : ''}"></i>`).join('')}</div>
        <div class="stage">
          ${orb('chaos', 210, 'still')}
          <div class="legend2">▲ rising chime: return and tap<br>▼ low chime: let go</div>
        </div>
        <button class="tapzone" id="tapzone" aria-label="Tap when you're back on the orb"><span class="rip"></span>Tap when you're back on the orb</button>
      </div></div>`;
  }

  function startDrill() {
    unlockAudio();
    const t = Date.now();
    // a short settle-in before the first return cue
    drillRun = { phase: 'settle', start: t, end: t + 6000, round: 0, doneRounds: 0, latencies: [], catches: 0, falseTaps: 0, locked: false };
    lockScreen(); startTicker(); renderDrillRun();
  }

  function setDrillPhase(phase) {
    const r = drillRun, d = S.drill;
    let sec = phase === 'focus' ? d.focus : d.release;
    if (phase === 'release' && d.jitter) sec = Math.max(5, sec + (Math.random() * 2 - 1) * d.jitter);
    r.phase = phase;
    r.start = Date.now();
    r.end = r.start + sec * 1000;
    if (phase === 'focus') {
      r.round++;
      r.locked = false;
      cueReturn();
    } else {
      closeRound();
      cueRelease();
      renderDrillRun();
    }
  }

  // a focus phase that ends without a tap is a missed return
  function closeRound() {
    const r = drillRun;
    if (!r.locked) r.latencies.push(null);
    r.doneRounds++;
  }

  function advanceDrill() {
    const r = drillRun;
    if (r.phase === 'settle') return setDrillPhase('focus');
    if (r.phase === 'focus') {
      if (r.round >= S.drill.rounds) { closeRound(); return finishDrill(); }
      return setDrillPhase('release');
    }
    setDrillPhase('focus');
  }

  function drillTap() {
    const r = drillRun;
    if (!r) return;
    const z = document.getElementById('tapzone');
    if (z) { z.classList.remove('hit'); void z.offsetWidth; z.classList.add('hit'); }
    buzz();
    if (r.phase === 'focus') {
      if (!r.locked) { r.latencies.push(Math.round((Date.now() - r.start) / 100) / 10); r.locked = true; }
      else r.catches++;
    } else if (r.phase === 'release') r.falseTaps++;
  }

  function finishDrill() {
    const r = drillRun;
    stopTicker(); unlockScreen();
    drillRun = null;
    if (r.latencies.length) {
      const x = { t: Date.now(), rounds: r.latencies.length, latencies: r.latencies, catches: r.catches, falseTaps: r.falseTaps, jitter: S.drill.jitter, object: 'orb' };
      S.drill.sessions.push(x);
      if (S.drill.sessions.length > 500) S.drill.sessions.shift();
      save();
      V.summary = x;
      beep(523, 0.2, 0); setTimeout(() => beep(784, 0.45), 200);
    }
    render();
  }

  /* ----- water ----- */

  const ML_OZ = 29.5735;
  const DROP = '<svg class="drop" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c-3.6 4.6-7 8.7-7 12.3a7 7 0 0 0 14 0c0-3.6-3.4-7.7-7-12.3z" fill="var(--water)"/></svg>';
  const W = () => S.water;
  const fmtIn = (ml, unit) => unit === 'oz' ? Math.round(ml / ML_OZ * 10) / 10 : Math.round(ml);
  const fmtW = (ml, unit = W().unit) => `${fmtIn(ml, unit).toLocaleString()} ${unit}`;

  // spread the target across the waking window, ending two hours before bed
  function autoSchedule(target, pour, wake, bed) {
    // small tolerance so unit rounding (64 oz / 16 oz) doesn't add a 1 ml sip
    const n = Math.max(1, Math.ceil(target / pour - 0.02));
    const a = toMin(wake), b0 = toMin(bed) - 120;
    const b = b0 > a + 60 ? b0 : a + 8 * 60;
    const out = [];
    for (let i = 0; i < n; i++) {
      const m = Math.round((n === 1 ? a : a + i * (b - a) / (n - 1)) / 5) * 5;
      out.push({ id: uid(), time: `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`,
                 amount: i === n - 1 ? target - pour * (n - 1) : pour });
    }
    return out;
  }
  function ensureWater() {
    const w = W();
    if (!w.scheduleInit) { w.schedule = autoSchedule(w.target, w.pour, w.wake, w.bed); w.scheduleInit = true; save(); }
  }

  const wLog = (k = today()) => W().log[k] || [];
  const wTotal = (k = today()) => wLog(k).reduce((t, e) => t + e.ml, 0);
  const wSched = () => [...W().schedule].sort((a, b) => rel(toMin(a.time)) - rel(toMin(b.time)));
  const SIP_GRACE = 45 * 60000;   // a sip counts as missed this long after its time

  // Each sip is done when you log during its window; one that passes unlogged is missed and the
  // schedule moves on to the next. The fill and pace still come from what you actually drank.
  function wState() {
    ensureWater();
    const k = today(), got = wTotal(k), t = Date.now(), hit = (W().hit || {})[k] || {}, rows = [];
    let expected = 0, next = null;
    for (const e of wSched()) {
      const at = atOf(k, e.time);
      const done = !!hit[e.id], missed = !done && at + SIP_GRACE < t;
      const row = { ...e, at, done, missed };
      rows.push(row);
      if (at <= t) expected += e.amount;
      if (!done && !missed && !next) next = row;
    }
    return { rows, next, got, target: W().target, expected: Math.min(expected, W().target), due: !!(next && next.at <= t),
             missed: rows.filter(x => x.missed).length };
  }
  function waterDue() {
    if (drillRun || run || featRun || !on('water')) return null;
    const st = wState();
    if (!st.due || st.got >= st.target) return null;
    return st;
  }
  function addWater(ml) {
    const k = today(), st = wState();
    // logging during a sip's window (or a little before it) checks that sip off
    if (st.next && st.next.at <= Date.now() + 20 * 60000) { W().hit[k] = W().hit[k] || {}; W().hit[k][st.next.id] = true; }
    (W().log[k] = W().log[k] || []).push({ t: Date.now(), ml: Math.max(1, Math.round(ml)) });
    save();
  }
  function waterMark(d) {
    const k = keyOf(d);
    if (k < W().since) return 'none';
    const t = wTotal(k);
    if (t >= W().target) return 'full';
    if (k > today()) return 'future';
    if (t > 0) return 'part';
    return k === today() ? 'future' : 'miss';
  }

  function waterView() {
    const w = W(), st = wState();
    const pct = Math.min(100, 100 * st.got / st.target), pacePct = Math.min(100, 100 * st.expected / st.target);
    const diff = st.got - st.expected;
    let pill;
    if (st.got >= st.target) pill = '<span class="pill ok">Target reached ✓</span>';
    else if (Math.abs(diff) < w.pour / 2) pill = '<span class="pill ok">On pace</span>';
    else pill = diff < 0 ? `<span class="pill behind">Behind by ${fmtW(-diff)}</span>` : `<span class="pill ahead">Ahead by ${fmtW(diff)}</span>`;
    const nx = st.next, log = wLog().slice().reverse();
    const days = Array.from({ length: 7 }, (_, i) => addDays(new Date(), i - 6));
    const totals = days.map(d => wTotal(keyOf(d))), mx = Math.max(w.target, ...totals) * 1.08;
    const from = V.wFrom != null ? V.wFrom : pct;
    return `
      <div class="card">
        <div class="vessel-wrap">
          <div class="vessel" role="img" aria-label="${Math.round(pct)}% of today's water">
            <div class="fill" style="height:${from}%" data-h="${pct}"></div>
            ${st.got < st.target && st.expected > 0 ? `<div class="pace" style="bottom:${pacePct}%"><span>PACE</span></div>` : ''}
          </div>
          <div>
            <p class="label" style="margin:0">Water today</p>
            <div class="wbig">${fmtIn(st.got, w.unit).toLocaleString()}<small> / ${fmtW(st.target)}</small></div>
            <div class="muted num" style="font-size:14px">${Math.round(pct)}%</div>
            ${pill}
          </div>
        </div>
        <div class="quick" style="margin-top:16px">
          <button class="btn water" data-act="w-add" data-ml="${w.pour}">+ ${fmtW(w.pour)}</button>
          <button class="btn" data-act="w-add" data-ml="${w.pour / 2}">+ ${fmtW(w.pour / 2)}</button>
          <button class="btn" data-act="w-undo" ${log.length ? '' : 'disabled'}>Undo</button>
        </div>
        <form class="custom" id="wcustom" autocomplete="off"><input name="amt" type="number" inputmode="decimal" min="0.1" step="any" placeholder="Custom amount (${w.unit})"><button class="btn" type="submit">Add</button></form>
      </div>
      ${nx ? `<div class="card"><div class="row spread"><div>
          <p class="label" style="margin:0 0 4px">${st.due ? 'Due now' : 'Next sip'}</p>
          <div style="font-size:18px;font-weight:600" class="num">${fmtW(nx.amount)} <span class="muted" style="font-weight:400">${st.due ? 'since' : 'at'} ${clock(nx.time)}</span></div></div>
          <button class="btn water" data-act="w-add" data-ml="${nx.amount}">Log it</button></div></div>` : ''}
      <div class="card">
        <div class="row spread"><p class="label" style="margin:0">Schedule</p><button class="linkbtn" data-act="w-edit">Edit</button></div>
        <ul class="sched" style="margin-top:6px">${st.rows.map(e => `<li class="${e.done ? 'done' : e.missed ? 'missed' : nx && e.id === nx.id ? 'next' : ''}"><span class="d"></span><span class="num">${clock(e.time)}</span><span class="num">${fmtW(e.amount)}</span></li>`).join('') || '<li><span></span><span>No sips scheduled</span><span></span></li>'}</ul>
        <button class="btn block" data-act="w-ics" style="margin-top:12px">Add reminders to my calendar</button>
        <p class="note">Phones only give reliable alerts through their own calendar, so this adds each sip as a daily event with an alert. While MetaMorph is open it also nudges you when a sip is due.</p>
      </div>
      <div class="card">
        <p class="label">Last 7 days</p>
        <div class="week7">${days.map((d, i) => `<div class="col"><div class="bw"><div class="tl2" style="bottom:${100 * w.target / mx}%"></div><div class="b ${totals[i] >= w.target ? 'hit' : ''}" style="height:${100 * totals[i] / mx}%" title="${fmtW(totals[i])}"></div></div><span class="lbl ${i === 6 ? 'today' : ''}">${WD[d.getDay()][0]}</span></div>`).join('')}</div>
      </div>
      ${log.length ? `<div class="card"><p class="label">Today's log</p><ul class="wlog">${log.map(e => `<li><span class="num">${new Date(e.t).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })}</span><span class="num">${fmtW(e.ml)}<button data-act="w-del" data-t="${e.t}" aria-label="Remove">✕</button></span></li>`).join('')}</ul></div>` : ''}`;
  }

  function waterSheet() {
    const e = V.wedit, u = e.unit, tot = e.schedule.reduce((t, x) => t + x.amount, 0);
    return `
      <div class="sheet-bg ${e.fresh ? 'enter' : ''}" data-act="w-cancel-bg">
        <form class="sheet" id="wform" autocomplete="off"><div class="grab" aria-hidden="true"></div>
          <h2>Water schedule</h2>
          <p class="label">Units</p>
          <div class="chips">${['ml', 'oz'].map(x => `<label class="chip"><input type="radio" name="w_unit" value="${x}" ${u === x ? 'checked' : ''}><span>${x}</span></label>`).join('')}</div>
          <div class="grid2">
            <div class="field"><label>Daily target (${u})</label><input name="w_target" type="number" inputmode="decimal" min="0.1" step="any" value="${fmtIn(e.target, u)}"></div>
            <div class="field"><label>Pour size (${u})</label><input name="w_pour" type="number" inputmode="decimal" min="0.1" step="any" value="${fmtIn(e.pour, u)}"></div>
            <div class="field"><label>Wake</label><input name="w_wake" type="time" value="${e.wake}"></div>
            <div class="field"><label>Bed</label><input name="w_bed" type="time" value="${e.bed}"></div>
          </div>
          <button class="btn block" type="button" data-act="w-auto">Auto-space from wake to 2h before bed</button>
          <p class="label" style="margin-top:16px">Sips</p>
          ${e.schedule.map((x, i) => `<div class="wrow"><input name="wt${i}" type="time" value="${x.time}" aria-label="Time"><input name="wa${i}" type="number" inputmode="decimal" min="0.1" step="any" value="${fmtIn(x.amount, u)}" aria-label="Amount (${u})"><button type="button" data-act="w-rm" data-i="${i}" aria-label="Remove sip">✕</button></div>`).join('')}
          <button class="btn block" type="button" data-act="w-addrow" style="margin-bottom:8px">+ Add sip</button>
          <div class="total num">${e.schedule.length} sips · ${fmtW(tot, u)} scheduled${Math.abs(tot - e.target) > 1 ? ` · target is ${fmtW(e.target, u)}` : ''}</div>
          <button class="btn primary block" type="submit" style="margin-bottom:8px">Save</button>
          <button class="btn block" type="button" data-act="w-cancel">Cancel</button>
        </form>
      </div>`;
  }

  // read typed values (in the unit they were typed in) before any re-render of the sheet
  function syncWEdit() {
    const f = document.getElementById('wform');
    if (!f || !V.wedit) return;
    const e = V.wedit, el = f.elements, k = e.unit === 'oz' ? ML_OZ : 1;
    const num = (v, d) => { const n = Number(v); return n > 0 ? Math.round(n * k) : d; };
    e.target = num(el.w_target.value, e.target);
    e.pour = num(el.w_pour.value, e.pour);
    e.wake = el.w_wake.value || e.wake;
    e.bed = el.w_bed.value || e.bed;
    e.schedule.forEach((x, i) => { x.time = el['wt' + i].value || x.time; x.amount = num(el['wa' + i].value, x.amount); });
    e.unit = (f.querySelector('input[name=w_unit]:checked') || {}).value || e.unit;
  }

  function waterICS() {
    const pad = n => String(n).padStart(2, '0'), d = new Date();
    const ymd = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
    const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
    const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//MetaMorph//Water//EN', 'CALSCALE:GREGORIAN'];
    for (const e of wSched()) {
      const [h, m] = e.time.split(':');
      // floating local time, so alerts follow the phone's timezone
      lines.push('BEGIN:VEVENT', `UID:water-${e.id}@metamorph`, `DTSTAMP:${stamp}`, `DTSTART:${ymd}T${h}${m}00`, 'DURATION:PT5M', 'RRULE:FREQ=DAILY',
        `SUMMARY:Water · ${fmtW(e.amount)}`, 'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:Water · ${fmtW(e.amount)}`, 'TRIGGER:PT0M', 'END:VALARM', 'END:VEVENT');
    }
    lines.push('END:VCALENDAR');
    return new Blob([lines.join('\r\n') + '\r\n'], { type: 'text/calendar' });
  }

  function deliver(blob, name, title) {
    const file = new File([blob], name, { type: blob.type });
    const download = () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    };
    // sharing needs a fresh tap; if the browser refuses (not a user cancel), save the file instead
    if (navigator.canShare && navigator.canShare({ files: [file] })) return navigator.share({ files: [file], title }).catch(err => { if (err && err.name !== 'AbortError') download(); });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  /* ----- routine clock ----- */

  // A routine's timer runs on the clock from its start time; no tap needed.
  function windowOf(r, k = today()) {
    const s0 = atOf(k, startFor(r, parseKey(k)));
    return { start: s0, end: s0 + total(r) * 60000 };
  }
  function clockBar(r, thin = false) {
    const w = windowOf(r);
    let t = w.start;
    const segs = r.steps.map(x => {
      const a = t; t += x.minutes * 60000;
      return `<span class="${isDone(x.id) ? 'done' : ''}" style="flex:${x.minutes}"><i data-s="${a}" data-e="${t}"></i></span>`;
    }).join('');
    return `<div class="clockbar ${thin ? 'thin' : ''}" data-end="${w.end}">${segs}</div>`;
  }
  // moves the bars and "left / over" labels every second without a full re-render
  function updateClocks() {
    const now = Date.now();
    document.querySelectorAll('.clockbar i[data-s]').forEach(i => {
      const a = +i.dataset.s, b = +i.dataset.e;
      i.style.width = Math.max(0, Math.min(100, 100 * (now - a) / (b - a))) + '%';
    });
    document.querySelectorAll('.clockbar[data-end]').forEach(b => b.classList.toggle('over', now > +b.dataset.end));
    document.querySelectorAll('[data-left]').forEach(x => {
      const d = (+x.dataset.left - now) / 1000;
      x.textContent = d >= 0 ? `${mmss(d)} left` : `+${mmss(-d)} over`;
      x.classList.toggle('over', d < 0);
    });
  }
  setInterval(() => { if (!drillRun && !run && !featRun) updateClocks(); }, 1000);

  // when a routine was finished, and whether that was after its scheduled end
  const finOf = (id, k = today()) => (S.fin[k] || {})[id] || null;
  function setFin(id, ts, k = today()) {
    S.fin[k] = S.fin[k] || {};
    if (ts) S.fin[k][id] = ts; else delete S.fin[k][id];
  }
  function completeRoutine(r, v, k = today(), stamp = true) {
    setDone(r.id, v, k);
    r.steps.forEach(x => setDone(x.id, v, k));
    setFin(r.id, v && stamp ? Date.now() : null, k);
    save();
    if (v && stamp) checkHeld(r, k);
  }
  const hm = ts => new Date(ts).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  function finText(r, k = today()) {
    const ts = finOf(r.id, k);
    if (!ts) return { txt: '✓ done', late: false };
    const end = windowOf(r, k).end;
    return ts > end + 60000 ? { txt: `late · ${hm(ts)}`, late: true } : { txt: `✓ ${hm(ts)}`, late: false };
  }

  /* ----- practice ----- */

  function practiceView() {
    const seg = `<div class="seg" style="grid-template-columns:1fr 1fr">${[['feature', 'Feature Law'], ['drill', 'Switch Drill']].map(([k, l]) =>
      `<button data-act="ptab" data-v="${k}" class="${V.ptab === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;
    return seg + (V.ptab === 'drill' ? drillView() : featureView());
  }

  /* ----- to-do ----- */

  // due moment: the set time, or the end of the day for untimed tasks
  // due moment within its personal day: the set time, or the end of that day
  const todoDue = x => x.date ? (x.time ? atOf(x.date, x.time) : atOf(x.date, fromMinHM(dayStart())) + DAY - 1) : null;
  const todoLate = x => x.done && x.doneAt && x.date && x.doneAt > todoDue(x) + 60000;
  function dayLabel(k) {
    if (k === today()) return 'Today';
    if (k === keyOf(addDays(new Date(), 1))) return 'Tomorrow';
    if (k === keyOf(addDays(new Date(), -1))) return 'Yesterday';
    return parseKey(k).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }
  function todoMeta(x) {
    const parts = [];
    if (x.date) parts.push(dayLabel(x.date));
    if (x.time) parts.push(clock(x.time));
    if (x.done && x.doneAt) parts.push(todoLate(x) ? `<span class="late">late · ${hm(x.doneAt)}</span>` : `done ${hm(x.doneAt)}`);
    return parts.join(' · ');
  }
  function todoRow(x) {
    const overdue = !x.done && x.date && todoDue(x) < Date.now();
    return `<li class="${x.done ? 'done' : ''}">
      <button class="chk ${x.done ? 'done' : ''}" data-act="todo-toggle" data-id="${x.id}" aria-label="${x.done ? 'Mark not done' : 'Mark done'}">✓</button>
      <span class="tx" data-act="todo-edit" data-id="${x.id}"><div>${esc(x.text)}</div>${x.date || x.done ? `<div class="t ${overdue ? 'overdue' : ''}">${todoMeta(x)}${overdue ? ' · overdue' : ''}</div>` : ''}</span>
      <button class="x" data-act="todo-del" data-id="${x.id}" aria-label="Delete">✕</button>
    </li>`;
  }
  function todoTimelineItem(x) {
    const due = todoDue(x), late = todoLate(x);
    const st = x.done ? 'done' : due < Date.now() ? 'open' : 'upcoming';
    const right = x.done ? `<span class="st ${late ? 'late' : ''}">${late ? 'late · ' : '✓ '}${hm(x.doneAt)}</span>`
      : st === 'open' ? '<span class="st late">overdue</span>' : `<span class="st">in ${dur(Math.max(1, Math.round((due - Date.now()) / 60000)))}</span>`;
    return `<li><div class="swbg"><span class="l">✓ Done</span><span class="r">Undo</span></div>
      <div class="it todo ${st}" data-act="todo-toggle" data-id="${x.id}" data-todo="1">
        <span class="t num">${clock(x.time)}</span><span class="dot sq"></span>
        <span><div class="nm">${esc(x.text)}</div><div class="sub">To-do</div></span>
        ${right}
      </div></li>`;
  }
  function setTodo(x, v) { x.done = v; x.doneAt = v ? Date.now() : null; save(); }

  function todoView() {
    const k = today(), open = S.todos.filter(x => !x.done);
    const by = (a, b) => (a.date || '~').localeCompare(b.date || '~') || (a.time || '~').localeCompare(b.time || '~') || a.created - b.created;
    const groups = [
      ['Overdue', open.filter(x => x.date && x.date < k).sort(by), 'overdue'],
      ['Today', open.filter(x => x.date === k).sort(by), ''],
      ['Upcoming', open.filter(x => x.date && x.date > k).sort(by), ''],
      ['Someday', open.filter(x => !x.date).sort(by), ''],
    ];
    const done = S.todos.filter(x => x.done).sort((a, b) => b.doneAt - a.doneAt).slice(0, 20);
    const when = V.todoWhen;
    return `
      <form class="card" id="todoadd" autocomplete="off">
        <div class="custom" style="margin:0"><input name="text" placeholder="Add a task…" aria-label="New task" autocapitalize="sentences" enterkeyhint="done" value="${esc(V.todoDraft.text)}"><button class="btn primary" type="submit">Add</button></div>
        <div class="opts" style="margin-top:10px">${[['today', 'Today'], ['tomorrow', 'Tomorrow'], ['someday', 'Someday']].map(([v, l]) =>
          `<button type="button" data-act="todo-when" data-v="${v}" class="${when === v ? 'on' : ''}">${l}</button>`).join('')}</div>
        <div class="grid2" style="margin-top:10px">
          <div class="field" style="margin:0"><label>Or a date</label><input name="date" type="date" value="${V.todoDraft.date}"></div>
          <div class="field" style="margin:0"><label>Time (puts it on the timeline)</label><input name="time" type="time" value="${V.todoDraft.time}"></div>
        </div>
      </form>
      ${groups.map(([name, list, cls]) => list.length ? `
        <div class="grouphead ${cls}"><h3>${name}</h3><span class="muted num" style="font-size:13px">${list.length}</span></div>
        <div class="card" style="padding-top:6px;padding-bottom:6px"><ul class="todos">${list.map(todoRow).join('')}</ul></div>` : '').join('')}
      ${!open.length ? `<p class="muted" style="text-align:center;margin:24px 0">Nothing to do. Add a task above.</p>` : ''}
      ${done.length ? `
        <div class="grouphead"><h3>Done</h3><button class="linkbtn" data-act="todo-clear">Clear done</button></div>
        <div class="card" style="padding-top:6px;padding-bottom:6px"><ul class="todos">${done.map(todoRow).join('')}</ul></div>` : ''}`;
  }

  function todoSheet() {
    const e = V.tedit;
    return `<div class="sheet-bg ${e.fresh ? 'enter' : ''}" data-act="todo-cancel-bg">
      <form class="sheet" id="todoform" autocomplete="off"><div class="grab" aria-hidden="true"></div>
        <h2>Edit task</h2>
        <div class="field"><label>Task</label><input name="text" required value="${esc(e.text)}"></div>
        <div class="grid2">
          <div class="field"><label>Date</label><input name="date" type="date" value="${e.date || ''}"></div>
          <div class="field"><label>Time</label><input name="time" type="time" value="${e.time || ''}"></div>
        </div>
        <button class="btn primary block" type="submit" style="margin-bottom:8px">Save</button>
        <div class="grid2"><button class="btn" type="button" data-act="todo-cancel">Cancel</button><button class="btn danger" type="button" data-act="todo-del" data-id="${e.id}">Delete</button></div>
      </form></div>`;
  }

  /* ----- nutrition: calories & macros ----- */

  const N = () => S.nutri;
  const MEALS = ['Breakfast', 'Lunch', 'Dinner', 'Snacks'];
  const MAC = [['kcal', 'Calories', ' kcal'], ['p', 'Protein', 'g'], ['c', 'Carbs', 'g'], ['f', 'Fat', 'g']];
  const MCOL = { kcal: 'var(--gc)', p: '#ff7a59', c: '#f2c14e', f: '#6fb7ff' };
  const r1 = n => Math.round(n * 10) / 10;
  const kcalOf = (p, c, f) => Math.round(4 * p + 4 * c + 9 * f);
  const nLog = (k = today()) => N().log[k] || [];
  const nTotals = (k = today()) => nLog(k).reduce((t, e) => { for (const [m] of MAC) t[m] += e[m] * e.qty; return t; }, { kcal: 0, p: 0, c: 0, f: 0 });
  const macLine = (x, q = 1) => `${Math.round(x.kcal * q)} kcal · P ${r1(x.p * q)} · C ${r1(x.c * q)} · F ${r1(x.f * q)}`;
  function mealNow() { const h = new Date().getHours(); return h < 11 ? 'Breakfast' : h < 15 ? 'Lunch' : h < 21 ? 'Dinner' : 'Snacks'; }
  const nk = () => V.nday || today();       // the day being viewed in Fuel
  function goalsFor(k) {
    const h = N().goalHist.filter(x => x.from <= k);
    return h.length ? h[h.length - 1].goals : N().goals;
  }
  function logFood(meal, item, qty, src, ref, k = nk()) {
    (N().log[k] = N().log[k] || []).push({ id: uid(), t: Date.now(), meal, name: item.name, qty,
      kcal: +item.kcal || 0, p: +item.p || 0, c: +item.c || 0, f: +item.f || 0, src, ref: ref || null, ...(item.items ? { items: item.items } : {}) });
    if (src === 'prep') { const pr = N().preps.find(x => x.id === ref); if (pr) pr.left = Math.max(0, r1(pr.left - qty)); }
    save();
  }

  const mealTotals = items => items.reduce((t, x) => { for (const [m] of MAC) t[m] += (+x[m] || 0) * (+x.qty || 1); return t; }, { kcal: 0, p: 0, c: 0, f: 0 });

  function nutritionPanel() {
    const n = N(), k = nk(), isToday = k === today(), tot = nTotals(k), g = goalsFor(k), log = nLog(k);
    const bars = MAC.map(([m, label, u]) => {
      const pct = g[m] ? Math.min(100, 100 * tot[m] / g[m]) : 0, over = g[m] && tot[m] > g[m] * 1.02;
      return `<div class="mac"><div class="row spread"><span>${label}</span><span class="num muted"><b class="${over ? 'late' : ''}" style="color:var(--text)">${Math.round(tot[m]).toLocaleString()}</b> / ${g[m].toLocaleString()}${u}</span></div>
        <div class="mbar"><i class="${over ? 'over' : ''}" style="width:${pct}%;background:${MCOL[m]}"></i></div></div>`;
    }).join('');
    const meals = MEALS.map(meal => {
      const es = log.filter(e => e.meal === meal), mk = es.reduce((t, e) => t + e.kcal * e.qty, 0);
      return `<div class="meal"><div class="row spread"><b>${meal}</b><span class="row" style="gap:10px"><span class="muted num" style="font-size:13px">${Math.round(mk)} kcal</span><button class="btn small" data-act="n-add" data-meal="${meal}">+ Add</button></span></div>
        ${es.length ? `<ul class="flog">${es.map(e => `<li><span><div>${esc(e.name)}${e.qty !== 1 ? ` <span class="muted">× ${r1(e.qty)}</span>` : ''}${e.items ? ` <span class="mtag">MEAL · ${e.items.length}</span>` : ''}</div><div class="t num">${macLine(e, e.qty)}</div></span><button data-act="n-del" data-id="${e.id}" aria-label="Remove">✕</button></li>`).join('')}</ul>` : ''}
        ${es.length > 1 ? `<button class="linkbtn" data-act="n-savemeal" data-meal="${meal}" style="margin-top:4px">Save as a meal</button>` : ''}</div>`;
    }).join('');
    const preps = n.preps.filter(x => x.left > 0 || Date.now() - x.created < 7 * DAY);
    return `
      <div class="sechead"><h3>Fuel</h3><button class="linkbtn" data-act="n-goals">Daily goals</button></div>
      <div class="calnav"><button class="arrow" data-act="n-day" data-d="-1" aria-label="Previous day">‹</button>
        <div class="ttl">${isToday ? 'Today' : esc(dayLabel(k))}<small>${isToday ? esc(parseKey(k).toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' })) : '<button class="linkbtn" data-act="n-day-today">Back to today</button>'}</small></div>
        <button class="arrow" data-act="n-day" data-d="1" aria-label="Next day" ${isToday ? 'disabled' : ''}>›</button></div>
      <div class="card" style="--gc:${gateOf('nutrition').color}">${bars}</div>
      <div class="card">${meals}</div>
      ${myMealsPanel()}
      ${nutriHistory()}
      <div class="sechead"><h3>Meal prep</h3><button class="linkbtn" data-act="n-prep-new">+ New prep</button></div>
      ${preps.length ? preps.map(x => `<div class="card" style="--gc:${gateOf('nutrition').color}"><div class="row spread" style="align-items:flex-start"><div>
          <b>${esc(x.name)}</b>
          <div class="muted num" style="font-size:13px">${r1(x.left)}/${x.portions} portions left · made ${dayLabel(x.made)}</div>
          <div class="muted num" style="font-size:13px">Per portion: ${macLine(x.per)}</div></div>
          <div class="row" style="gap:6px"><button class="btn small ghost" data-act="n-prep-del" data-id="${x.id}" aria-label="Delete prep">✕</button><button class="btn small primary" data-act="n-prep-log" data-id="${x.id}" ${x.left > 0 ? '' : 'disabled'}>Eat 1</button></div></div>
          <div class="mbar" style="margin-top:10px"><i style="width:${100 * x.left / x.portions}%"></i></div></div>`).join('')
        : '<p class="muted" style="margin:0 0 12px">Cook once, log portions all week. Add a prep to start.</p>'}`;
  }

  function myMealsPanel() {
    const ms = N().meals;
    return `<div class="sechead"><h3>My meals</h3><button class="linkbtn" data-act="n-meal-new">+ New meal</button></div>
      ${ms.length ? `<div class="card"><ul class="flog">${ms.map(m => { const t = mealTotals(m.items); return `<li><span>
          <div style="font-weight:600">${esc(m.name)}</div>
          <div class="t num">${macLine(t)}</div>
          <div class="t">${m.items.map(x => esc(x.name)).join(' · ')}</div></span>
          <span class="row" style="gap:6px"><button class="btn small ghost" data-act="n-meal-del" data-id="${m.id}" aria-label="Delete meal">✕</button><button class="btn small primary" data-act="n-meal-log" data-id="${m.id}">Log</button></span></li>`; }).join('')}</ul></div>`
        : '<p class="muted" style="margin:0 0 12px">Combine foods you eat together (like a usual breakfast) and log them in one tap. Build one here, or tap “Save as a meal” under any meal you’ve logged.</p>'}`;
  }

  function nutriHistory() {
    const n = V.nhist, end = parseKey(today());
    const days = Array.from({ length: n }, (_, i) => keyOf(addDays(end, i - n + 1)));
    const rows = days.map(k => ({ k, t: nTotals(k), g: goalsFor(k), logged: nLog(k).length > 0 }));
    const logged = rows.filter(r => r.logged);
    const mx = Math.max(...rows.map(r => Math.max(r.t.kcal, r.g.kcal || 0)), 1) * 1.1;
    const avgOf = m => logged.length ? Math.round(logged.reduce((a, r) => a + r.t[m], 0) / logged.length) : null;
    const onTarget = logged.filter(r => r.g.kcal && Math.abs(r.t.kcal - r.g.kcal) <= r.g.kcal * 0.1).length;
    const proteinHit = logged.filter(r => r.g.p && r.t.p >= r.g.p * 0.95).length;

  function prepTotals(items) {
    return items.reduce((t, x) => {
      const kc = x.kcal === '' || x.kcal == null ? kcalOf(+x.p || 0, +x.c || 0, +x.f || 0) : +x.kcal;
      t.kcal += kc; t.p += +x.p || 0; t.c += +x.c || 0; t.f += +x.f || 0; return t;
    }, { kcal: 0, p: 0, c: 0, f: 0 });
  }
  function prepTotalsText(e) {
    const t = prepTotals(e.items), n = Math.max(1, +e.portions || 1);
    return `<b>Batch:</b> ${macLine(t)}<br><b>Per portion (${n}):</b> ${macLine({ kcal: t.kcal / n, p: t.p / n, c: t.c / n, f: t.f / n })}`;

  function prepSheet() {

          <div class="grid4"><input name="ik${i}" type="number" inputmode="decimal" min="0" step="any" value="${v(x.kcal)}" placeholder="auto"><input name="ip${i}" type="number" inputmode="decimal" min="0" step="any" value="${v(x.p)}"><input name="ic${i}" type="number" inputmode="decimal" min="0" step="any" value="${v(x.c)}"><input name="if${i}" type="number" inputmode="decimal" min="0" step="any" value="${v(x.f)}"></div>
        </div>`).join('')}

          <button class="btn block" type="button" data-act="n-ing-food" style="margin-bottom:8px">+ Add from my foods</button>` : ''}

  function syncPrep() {
    const f = document.getElementById('nprepf');
    if (!f || !V.nprep) return;
    const e = V.nprep, el = f.elements;
    e.name = el.name.value;
    e.portions = Math.max(1, Math.round(+el.portions.value || 1));
    e.items.forEach((x, i) => {
      x.name = el['in' + i].value;
      x.kcal = el['ik' + i].value === '' ? '' : +el['ik' + i].value;

  /* ----- food lookup: Open Food Facts ----- */

  const OFF = 'https://world.openfoodfacts.org';
  const OFF_FIELDS = 'code,product_name,brands,serving_size,nutriments';
  // per serving when the product lists it, otherwise per 100 g
  function offItem(pr) {
    const n = pr.nutriments || {};
    const per = n['energy-kcal_serving'] != null || n.proteins_serving != null ? 'serving' : '100g';
    const g = k => +(n[`${k}_${per}`] ?? 0) || 0;
    let kcal = g('energy-kcal');
    if (!kcal && n[`energy_${per}`]) kcal = n[`energy_${per}`] / 4.184;   // kJ -> kcal
    const brand = pr.brands ? pr.brands.split(',')[0].trim() : '';
    return { name: [pr.product_name, brand].filter(Boolean).join(' · ') || 'Unnamed product',
             serving: per === 'serving' ? (pr.serving_size || '1 serving') : '100 g',
             kcal: Math.round(kcal), p: r1(g('proteins')), c: r1(g('carbohydrates')), f: r1(g('fat')), code: pr.code || '' };
  }
  // Open Food Facts' search sometimes answers "busy" (and browsers can't read that reply), so retry a few times;
  // if it's still down, fall back to USDA FoodData Central (free demo key: a handful of searches an hour).
  async function offSearch(q) {
    const keep = list => (list || []).filter(x => x.product_name && x.nutriments).map(offItem);
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        const r = await fetch(`${OFF}/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=24&fields=${OFF_FIELDS}`);
        if (r.ok) { const res = keep((await r.json()).products); if (res.length) return res; break; }
      } catch (e) {}
      await new Promise(res => setTimeout(res, 900 * (attempt + 1)));
    }
    return fdcSearch(q);
  }
  async function fdcSearch(q) {
    const r = await fetch(`https://api.nal.usda.gov/fdc/v1/foods/search?api_key=DEMO_KEY&query=${encodeURIComponent(q)}&pageSize=20&dataType=Foundation,SR%20Legacy,Branded`);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    return (j.foods || []).map(x => {
      const n = {};
      for (const m of x.foodNutrients || []) {
        if (m.nutrientName === 'Energy' && m.unitName !== 'KCAL') continue;
        n[m.nutrientName] = +m.value || 0;
      }
      // USDA values are per 100 g; scale to the labelled serving when there is one
      const g = /^(g|ml|grm)$/i.test(x.servingSizeUnit || '') && x.servingSize ? x.servingSize : null;
      const k = g ? g / 100 : 1;
      const title = (x.description || 'Food').toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
      return { name: [title, x.brandName || x.brandOwner].filter(Boolean).join(' · '), serving: g ? `${r1(g)} ${String(x.servingSizeUnit).toLowerCase() === 'ml' ? 'ml' : 'g'}` : '100 g',
               kcal: Math.round((n.Energy || n['Energy (Atwater General Factors)'] || 0) * k), p: r1((n.Protein || 0) * k),
               c: r1((n['Carbohydrate, by difference'] || 0) * k), f: r1((n['Total lipid (fat)'] || 0) * k), code: x.gtinUpc || '' };
    }).filter(x => x.kcal || x.p || x.c || x.f);
  }
  async function offBarcode(code) {
    const r = await fetch(`${OFF}/api/v2/product/${encodeURIComponent(code)}.json?fields=${OFF_FIELDS}`);
    if (!r.ok && r.status !== 404) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    return j.status === 1 && j.product ? offItem(j.product) : null;
  }
  const canScan = () => 'BarcodeDetector' in window && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

  function lookupPane(a) {
    const res = a.results;
    return `
      <form id="offform" class="custom" style="margin:0 0 8px" autocomplete="off"><input name="q" class="search" placeholder="Search foods or type a barcode" type="search" enterkeyhint="search" value="${esc(a.oq)}"><button class="btn primary" type="submit">Search</button></form>
      ${canScan() ? '<button class="btn block" data-act="scan-open" style="margin-bottom:8px">Scan a barcode</button>' : ''}
      ${a.busy ? '<p class="muted">Searching…</p>' : a.err ? `<p class="hint warn">${esc(a.err)}</p>` : ''}
      ${res ? (res.length ? `<ul class="foodlist offres">${res.map((x, i) => `<li><span><div>${esc(x.name)}</div><div class="t num">${esc(x.serving)} · ${macLine(x)}</div></span>
          <button class="btn small primary" data-act="off-pick" data-i="${i}">Use</button></li>`).join('')}</ul>` : '<p class="muted">No matches. Try fewer words, or use New food.</p>') : ''}
      <p class="note">Results come from Open Food Facts (and USDA FoodData Central if it’s busy), free public databases. Only your search words are sent.</p>`;
  }
  async function runLookup(q) {
    const a = V.nadd;
    a.oq = q; a.busy = true; a.err = ''; a.results = null; render();
    try {
      if (/^\d{8,14}$/.test(q)) { const x = await offBarcode(q); a.results = x ? [x] : []; if (!x) a.err = 'That barcode isn’t in Open Food Facts yet.'; }
      else a.results = await offSearch(q);
    } catch (e) { a.err = navigator.onLine === false ? 'You’re offline. Food lookup needs internet.' : 'Couldn’t reach the food databases. Try again in a moment, or use New food.'; }
    a.busy = false;
    if (V.nadd === a) render();
  }

  let scanStream = null, scanRaf = 0;
  async function startScan() {
    V.scan = true; render();
    const msg = t => { const m = document.getElementById('scanmsg'); if (m) m.textContent = t; };
    try {
      scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      const v = document.getElementById('scanvid');
      v.srcObject = scanStream; await v.play();
      const det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e'] });
      const loop = async () => {
        if (!V.scan) return;
        try {
          const codes = await det.detect(v);
          if (codes.length) { const code = codes[0].rawValue; stopScan(); V.scan = false; buzz(); runLookup(code); return; }
        } catch (e) {}
        scanRaf = requestAnimationFrame(loop);
      };
      loop();
    } catch (e) { msg('Camera unavailable. Type the barcode number into the search box instead.'); }
  }
  function stopScan() {
    cancelAnimationFrame(scanRaf);
    if (scanStream) scanStream.getTracks().forEach(t => t.stop());
    scanStream = null;
  }

  /* ----- fitness: workout log ----- */

  const WK = () => S.workouts;
  const same = (a, b) => a.trim().toLowerCase() === b.trim().toLowerCase();
  const e1rm = (w, r) => (w > 0 && r > 0 ? w * (1 + r / 30) : 0);   // Epley estimate
  const barDefault = () => (WK().unit === 'kg' ? 20 : 45);
  const BAR_OPTIONS = () => (WK().unit === 'kg' ? [20, 15, 10, 0] : [45, 35, 25, 15, 0]);
  const PLATES = () => (WK().unit === 'kg' ? [25, 20, 15, 10, 5, 2.5, 1.25] : [45, 35, 25, 10, 5, 2.5]);
  const BAR_GUESS = /\b(bench|squat|deadlift|overhead press|ohp|military press|barbell|row|rdl|romanian|hip thrust|clean|snatch|good ?morning|incline press|close.grip|floor press|pause)/i;
  const libFor = name => WK().library.find(x => same(x.name, name));
  // a barbell set keeps the bar and the plates (per side) separate; its total is bar + both sides
  const isBB = x => x.bar != null && x.bar !== '';
  const setW = x => (isBB(x) ? (+x.bar || 0) + 2 * (+x.ps || 0) : +x.w || 0);
  const fmtWt = n => String(Math.round(n * 100) / 100);
  function platesFor(perSide) {
    let left = +perSide || 0;
    const out = [];
    for (const pl of PLATES()) while (left >= pl - 1e-9) { out.push(pl); left = Math.round((left - pl) * 100) / 100; }
    return out.length ? out.map(fmtWt).join(' + ') + (left > 0 ? ` (+${fmtWt(left)})` : '') : 'empty bar';
  }
  function lastFor(name) {
    for (let k = WK().log.length - 1; k >= 0; k--) {
      const it = WK().log[k].items.find(x => same(x.name, name));
      if (it) return { w: WK().log[k], it };
    }
    return null;
  }
  function bestFor(name, before = Infinity) {
    let best = 0;
    for (const w of WK().log) if (w.t < before) for (const it of w.items) if (it.kind === 'strength' && same(it.name, name))
      for (const x of it.sets) best = Math.max(best, e1rm(setW(x), +x.r));
    return best;
  }
  const distUnit = () => (WK().unit === 'lb' ? 'mi' : 'km');
  const setsText = it => it.kind === 'cardio'
    ? it.sets.filter(x => x.min || x.dist).map(x => `${x.min || 0} min${x.dist ? ` · ${x.dist} ${distUnit()}` : ''}`).join(', ')
    : it.sets.filter(x => x.r).map(x => `${x.r}×${fmtWt(setW(x))}`).join(', ');
  const volume = w => w.items.reduce((t, it) => t + (it.kind === 'strength' ? it.sets.reduce((a, x) => a + (+x.r || 0) * setW(x), 0) : 0), 0);
  const setCount = w => w.items.reduce((t, it) => t + it.sets.length, 0);
  // reuse last time's sets: same weights, reps cleared for fresh entry (last reps shown as hints)
  const freshSets = (it, kind) => it.sets.map(x => kind === 'strength' ? { ...x, r: '', hint: x.r } : { ...x, min: '', hint: x.min });

  function woItem(it, i) {
    const last = lastFor(it.name), str = it.kind === 'strength', bb = str && it.bar != null;
    const head = bb ? `<span>Set</span><span>Reps</span><span>Per side</span><span>Total</span><span></span>`
      : `<span>Set</span><span>${str ? 'Reps' : 'Min'}</span><span>${str ? WK().unit : distUnit()}</span><span></span>`;
    const row = (x, j) => {
      const reps = `<input class="wo-in" data-i="${i}" data-j="${j}" data-f="${str ? 'r' : 'min'}" type="number" inputmode="decimal" min="0" step="any" value="${(str ? x.r : x.min) ?? ''}" placeholder="${x.hint ?? ''}" aria-label="${str ? 'Reps' : 'Minutes'}">`;
      if (bb) return `<span class="n num">${j + 1}</span>${reps}
        <input class="wo-in" data-i="${i}" data-j="${j}" data-f="ps" type="number" inputmode="decimal" min="0" step="any" value="${x.ps ?? ''}" aria-label="Plates per side">
        <span class="tot num" id="tot-${i}-${j}">${fmtWt(setW(x))}<small>${platesFor(x.ps)}</small></span>
        <button class="x" data-act="wo-rmset" data-i="${i}" data-j="${j}" aria-label="Remove set">✕</button>`;
      const f2 = str ? 'w' : 'dist';
      return `<span class="n num">${j + 1}</span>${reps}

          <div class="field" style="margin:10px 0 6px"><input id="wo-title" value="${esc(d.title || '')}" placeholder="Name it (optional): Push, Legs…" autocapitalize="words" aria-label="Workout name"></div>
          <div class="opts" style="margin-bottom:4px">${titles.map(x => `<button data-act="wo-tchip" data-v="${esc(x)}" class="${d.title === x ? 'on' : ''}">${esc(x)}</button>`).join('')}</div>

        body = `<button class="btn primary block" data-act="wo-start" style="margin-bottom:12px">Start an empty workout</button>

            <p class="note" style="margin:8px 0 0">Repeating keeps the exercises and weights and clears the reps, with last time’s reps shown as hints.</p></div>` : ''}`;

      const mon = monOf(today()), wk = w.log.filter(x => monOf(x.date) === mon), prev = w.log.filter(x => monOf(x.date) === keyOf(addDays(parseKey(mon), -7)));

        <div><b>${Math.round(vol(wk)).toLocaleString()}</b><span>Volume ${w.unit}</span></div></div>
        ${prev.length ? `<p class="muted num" style="font-size:12px;margin:8px 0 0;text-align:center">Last week: ${prev.length} workouts · ${Math.round(vol(prev)).toLocaleString()} ${w.unit}</p>` : ''}</div>`;
    } else if (tab === 'history') {
      const groups = [];
      for (const x of w.log.slice().reverse()) { const m = monOf(x.date); let g = groups.find(y => y.m === m); if (!g) groups.push(g = { m, xs: [] }); g.xs.push(x); }
      body = groups.length ? groups.map(g => `<div class="grouphead"><h3>${esc(weekLabel(g.m))}</h3><span class="muted num" style="font-size:13px">${g.xs.length} workout${g.xs.length === 1 ? '' : 's'}</span></div>
        ${g.xs.map(x => woCard(x, V.woOpen === x.id)).join('')}`).join('') : '<p class="muted">Finished workouts will show here, grouped by week.</p>';
    } else {

        const pts = sessions.map(x => Math.max(0, ...x.items.filter(it => same(it.name, l.name)).flatMap(it => it.sets.map(s2 => e1rm(setW(s2), +s2.r)))));
        return { l, sessions, pts, last: sessions.length ? sessions[sessions.length - 1].date : '' };
      }).filter(x => x.sessions.length).sort((a, b) => b.last.localeCompare(a.last));
      body = lib.length ? `<div class="card"><ul class="flog">${lib.map(({ l, sessions, pts, last }) => `<li data-act="wo-ex" data-v="${esc(l.name)}" style="cursor:pointer"><span style="min-width:0">
          <div style="font-weight:600">${esc(l.name)}${l.bar != null ? ' <span class="mtag">BARBELL</span>' : ''}</div>
          <div class="t">${sessions.length} session${sessions.length === 1 ? '' : 's'} · last ${esc(dayLabel(last))}${l.kind === 'strength' && Math.max(...pts) ? ` · best e1RM ${Math.round(Math.max(...pts))} ${w.unit}` : ''}</div>
          ${pts.filter(Boolean).length > 1 ? spark(pts.filter(Boolean).slice(-12)) : ''}</span><span class="muted">›</span></li>`).join('')}</ul></div>`
        : '<p class="muted">Exercises you log will show here with their progress.</p>';
    }
    return `<div class="sechead"><h3>Workouts</h3><div class="opts">${['lb', 'kg'].map(u => `<button data-act="wo-unit" data-v="${u}" class="${w.unit === u ? 'on' : ''}">${u}</button>`).join('')}</div></div>${seg}${body}`;

  function exSheet() {
    const name = V.woEx, w = WK(), u = w.unit;
    const rows = w.log.filter(x => x.items.some(it => same(it.name, name))).reverse().map(x => {
      const it = x.items.find(y => same(y.name, name));
      const top = Math.max(0, ...it.sets.map(setW)), best = Math.max(0, ...it.sets.map(s2 => e1rm(setW(s2), +s2.r)));

      <h2>${esc(name)}</h2>
      ${pr ? `<p class="muted" style="margin:-6px 0 10px">Best estimated 1-rep max: <b style="color:var(--text)">${Math.round(pr)} ${u}</b></p>${spark(rows.map(r => r.best).reverse().filter(Boolean))}` : ''}
      <ul class="flog" style="margin-top:10px">${rows.map(r => `<li><span><div style="font-weight:600">${esc(dayLabel(r.x.date))}${r.x.title ? ` · ${esc(r.x.title)}` : ''}${(r.x.prs || []).includes(r.it.name) ? '<span class="pr">PR</span>' : ''}</div>
        <div class="t num">${esc(setsText(r.it))}</div></span><span class="muted num" style="font-size:13px">${r.best ? `${Math.round(r.best)} e1RM` : ''}</span></li>`).join('')}</ul>
      <button class="btn ghost block" data-act="wo-ex-close" style="margin-top:8px">Close</button></div></div>`;
  }

  /* ----- body: weight, measurements, Navy body fat, bulk/cut ----- */

  const B = () => S.body;
  const PARTS = [['neck', 'Neck'], ['waist', 'Waist (at navel)'], ['hips', 'Hips'], ['chest', 'Chest'], ['shoulders', 'Shoulders'],
                 ['armL', 'Arm L'], ['armR', 'Arm R'], ['thighL', 'Thigh L'], ['thighR', 'Thigh R'], ['calfL', 'Calf L'], ['calfR', 'Calf R']];
  // US Navy body fat (inches). Men: waist & neck; women: waist, hips & neck.
  function navyBF(e, prof = B().profile) {
    const h = +prof.heightIn, n = +e.neck, w = +e.waist, hip = +e.hips;
    if (!h || !n || !w) return null;
    let bf;
    if (prof.sex === 'female') { if (!hip || w + hip - n <= 0) return null; bf = 163.205 * Math.log10(w + hip - n) - 97.684 * Math.log10(h) - 78.387; }
    else { if (w - n <= 0) return null; bf = 86.010 * Math.log10(w - n) - 70.041 * Math.log10(h) + 36.76; }
    return bf > 2 && bf < 70 ? Math.round(bf * 10) / 10 : null;
  }
  const entriesSorted = () => [...B().entries].sort((a, b) => a.date.localeCompare(b.date) || a.t - b.t);
  const latestWith = f => { const es = entriesSorted().filter(e => e[f] != null && e[f] !== ''); return es.length ? es[es.length - 1] : null; };
  function latestBF() {
    const es = entriesSorted().map(e => ({ e, bf: navyBF(e) })).filter(x => x.bf != null);
    return es.length ? es[es.length - 1] : null;
  }
  const daysBetween = (a, b) => Math.round((parseKey(b) - parseKey(a)) / DAY);
  // least-squares slope of y per day over recent points
  function slopePerDay(pts) {
    if (pts.length < 2) return null;
    const n = pts.length, mx = pts.reduce((a, p) => a + p.x, 0) / n, my = pts.reduce((a, p) => a + p.y, 0) / n;
    const num = pts.reduce((a, p) => a + (p.x - mx) * (p.y - my), 0), den = pts.reduce((a, p) => a + (p.x - mx) ** 2, 0);
    return den ? num / den : null;
  }
  function weightTrend(days = 21) {
    const end = today(), es = entriesSorted().filter(e => +e.weight > 0 && daysBetween(e.date, end) <= days);
    return slopePerDay(es.map(e => ({ x: -daysBetween(e.date, end), y: +e.weight })));
  }
  // maintenance calories: from your own intake and weight change when there's enough data, otherwise Katch-McArdle
  function tdeeEstimate() {
    const end = today(), es = entriesSorted().filter(e => +e.weight > 0 && daysBetween(e.date, end) <= 21);
    const fed = Array.from({ length: 21 }, (_, i) => keyOf(addDays(parseKey(end), -i))).map(k => nTotals(k).kcal).filter(x => x > 0);
    const slope = weightTrend(21);
    if (es.length >= 4 && fed.length >= 10 && slope != null && daysBetween(es[0].date, end) >= 10) {
      return { kcal: Math.round(avg(fed) - slope * 3500), how: `from your last ${fed.length} days of food logs and weight trend` };
    }
    const w = latestWith('weight'), bf = latestBF();
    if (!w) return null;
    const lbm = +w.weight * (1 - (bf ? bf.bf : 20) / 100) * 0.4536;
    return { kcal: Math.round((370 + 21.6 * lbm) * (+B().profile.activity || 1.55)), how: `estimated (Katch-McArdle${bf ? '' : ', assuming 20% body fat'} × activity)` };
  }
  function phaseTargets() {
    const t = tdeeEstimate(), w = latestWith('weight'), mode = B().phase.mode;
    if (!t || !w) return null;
    const kcal = t.kcal + (mode === 'bulk' ? 250 : mode === 'cut' ? -500 : 0);
    const bw = +w.weight, p = Math.round(bw * 0.9), f = Math.round(bw * 0.3), c = Math.max(0, Math.round((kcal - p * 4 - f * 9) / 4));
    return { tdee: t, kcal, p, c, f };
  }
  function phaseAdvice(bf) {
    const ph = B().phase;
    if (bf == null) return 'Log neck and waist (and hips for women) with your height in Profile to get body fat.';
    if (bf >= ph.high) return ph.mode === 'cut' ? `Cutting toward ${ph.low}%. Keep going.` : `At ${bf}% you’ve reached the top of your band. Time to cut.`;
    if (bf <= ph.low) return ph.mode === 'bulk' ? `Bulking toward ${ph.high}%. Keep going.` : `At ${bf}% you’re at the bottom of your band. Time to bulk.`;
    return ph.mode === 'bulk' ? `Bulking: ${Math.round((ph.high - bf) * 10) / 10}% to go before cutting.` : ph.mode === 'cut' ? `Cutting: ${Math.round((bf - ph.low) * 10) / 10}% to go before bulking.` : 'Pick a phase to start the cycle.';
  }

  function lineChart(pts, { band, unit = '', height = 130 } = {}) {
    if (pts.length < 2) return '<p class="muted" style="margin:6px 0">Two or more entries draw a trend.</p>';
    const W2 = 320, H = height, pad = 6;
    const ys = pts.map(p => p.y).concat(band || []);
    let lo = Math.min(...ys), hi = Math.max(...ys);
    if (hi - lo < 1) { hi += 0.5; lo -= 0.5; }
    const span = hi - lo; lo -= span * 0.12; hi += span * 0.12;
    const x0 = pts[0].x, x1 = pts[pts.length - 1].x || 1;
    const X = x => pad + (W2 - 2 * pad) * ((x - x0) / Math.max(1, x1 - x0)), Y = y => pad + (H - 2 * pad) * (1 - (y - lo) / (hi - lo));
    const bandRect = band ? `<rect x="0" y="${Y(band[1])}" width="${W2}" height="${Math.max(0, Y(band[0]) - Y(band[1]))}" fill="color-mix(in srgb, var(--ok) 14%, transparent)"/>
      <line x1="0" x2="${W2}" y1="${Y(band[1])}" y2="${Y(band[1])}" stroke="var(--late)" stroke-dasharray="4 4" stroke-width="1"/>
      <line x1="0" x2="${W2}" y1="${Y(band[0])}" y2="${Y(band[0])}" stroke="var(--ok)" stroke-dasharray="4 4" stroke-width="1"/>` : '';
    return `<svg class="lchart" viewBox="0 0 ${W2} ${H}" preserveAspectRatio="none" role="img" aria-label="Trend">
      ${bandRect}<polyline points="${pts.map(p => `${X(p.x)},${Y(p.y)}`).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
      ${pts.map(p => `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="2.6" fill="var(--accent)"/>`).join('')}</svg>
      <div class="lchart-ax num"><span>${esc(dayLabel(pts[0].k))}</span><span>${Math.round(pts[pts.length - 1].y * 10) / 10}${unit}</span><span>${esc(dayLabel(pts[pts.length - 1].k))}</span></div>`;
  }

  function bodyView() {
    const tab = V.btab;
    const seg = `<div class="seg">${[['overview', 'Overview'], ['log', 'Log'], ['media', 'Media']].map(([k, l]) => `<button data-act="b-tab" data-v="${k}" class="${tab === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;
    return seg + (tab === 'log' ? bodyLog() : tab === 'media' ? mediaView() : bodyOverview());
  }

  function bodyOverview() {
    const b = B(), ph = b.phase, prof = b.profile, w = latestWith('weight'), lb = latestBF(), bf = lb ? lb.bf : null;
    const slope = weightTrend(21), wk = slope != null ? slope * 7 : null;
    const fat = w && bf != null ? +w.weight * bf / 100 : null;
    const tgt = phaseTargets();
    const rateGoal = ph.mode === 'bulk' ? [0.25, 0.5] : ph.mode === 'cut' ? [-1, -0.5] : null;
    const wkPct = wk != null && w ? 100 * wk / +w.weight : null;
    const onPace = rateGoal && wkPct != null ? (wkPct >= rateGoal[0] && wkPct <= rateGoal[1]) : null;
    const bfPts = entriesSorted().map(e => ({ k: e.date, x: daysBetween(entriesSorted()[0].date, e.date), y: navyBF(e) })).filter(p => p.y != null);
    const wPts = entriesSorted().filter(e => +e.weight > 0).map(e => ({ k: e.date, x: daysBetween(entriesSorted()[0].date, e.date), y: +e.weight }));
    // when will the band edge be reached at the current body-fat trend?
    const bfSlope = slopePerDay(bfPts.slice(-6).map(p => ({ x: p.x, y: p.y })));
    let eta = '';
    if (bf != null && bfSlope) {
      const goal = ph.mode === 'bulk' ? ph.high : ph.mode === 'cut' ? ph.low : null;
      if (goal != null && Math.sign(goal - bf) === Math.sign(bfSlope)) eta = `About ${Math.max(1, Math.round((goal - bf) / bfSlope / 7))} weeks to ${goal}% at this pace.`;
    }
    const pos = bf != null ? Math.max(0, Math.min(100, 100 * (bf - ph.low) / (ph.high - ph.low))) : null;
    const missing = !prof.heightIn;
    return `
      ${missing ? `<div class="card" style="border-color:var(--accent)"><b>Add your height</b><p class="muted" style="margin:4px 0 10px;font-size:14px">The Navy body-fat formula needs it.</p><button class="btn primary block" data-act="b-tab" data-v="log">Set up profile</button></div>` : ''}
      <div class="card bodyhead">
        <div><span class="label">Weight</span><b class="num">${w ? fmtWt(+w.weight) : '—'}<small> lb</small></b><span class="muted num">${wk != null ? `${wk >= 0 ? '+' : ''}${Math.round(wk * 10) / 10} lb/week` : '—'}</span></div>
        <div><span class="label">Body fat</span><b class="num">${bf != null ? bf : '—'}<small>%</small></b><span class="muted">US Navy</span></div>
        <div><span class="label">Lean</span><b class="num">${fat != null ? Math.round(+w.weight - fat) : '—'}<small> lb</small></b><span class="muted num">${fat != null ? `${Math.round(fat)} lb fat` : '—'}</span></div>
      </div>
      <div class="sechead"><h3>Bulk / cut</h3><button class="linkbtn" data-act="b-band">Band ${ph.low}–${ph.high}%</button></div>
      <div class="card">
        <div class="opts" style="margin-bottom:12px">${[['bulk', 'Bulk'], ['maintain', 'Maintain'], ['cut', 'Cut']].map(([k, l]) => `<button data-act="b-phase" data-v="${k}" class="${ph.mode === k ? 'on' : ''}">${l}</button>`).join('')}</div>
        ${pos != null ? `<div class="bandbar"><span class="lo">${ph.low}%</span><div class="track"><i style="left:${pos}%"></i></div><span class="hi">${ph.high}%</span></div>` : ''}
        <p style="margin:10px 0 4px;font-weight:600">${esc(phaseAdvice(bf))}</p>
        ${eta ? `<p class="muted" style="margin:0 0 4px;font-size:14px">${eta}</p>` : ''}
        ${ph.since ? `<p class="muted" style="margin:0 0 8px;font-size:13px">${ph.mode[0].toUpperCase() + ph.mode.slice(1)} since ${esc(dayLabel(ph.since))} (${Math.max(0, Math.round(daysBetween(ph.since, today()) / 7))} weeks)</p>` : ''}
        ${rateGoal ? `<p class="muted" style="margin:0 0 10px;font-size:13px">Target pace: ${rateGoal[0] > 0 ? '+' : ''}${rateGoal[0]} to ${rateGoal[1] > 0 ? '+' : ''}${rateGoal[1]}% of body weight a week${wkPct != null ? ` · you: <b class="${onPace ? '' : 'late'}" style="${onPace ? 'color:var(--ok)' : ''}">${wkPct >= 0 ? '+' : ''}${Math.round(wkPct * 100) / 100}%</b>` : ''}</p>` : ''}
        ${tgt ? `<div class="preptot num"><b>${ph.mode === 'bulk' ? 'Bulk' : ph.mode === 'cut' ? 'Cut' : 'Maintenance'} target:</b> ${tgt.kcal} kcal · P ${tgt.p}g · C ${tgt.c}g · F ${tgt.f}g<br><span class="muted" style="font-size:12px">Maintenance ≈ ${tgt.tdee.kcal} kcal, ${esc(tgt.tdee.how)}</span></div>
          <button class="btn block" data-act="b-apply">Use as my Nutrition goals</button>` : '<p class="muted" style="font-size:14px;margin:0">Log your weight to get calorie targets.</p>'}
      </div>
      <div class="sechead"><h3>Body fat</h3></div>

  // Everything the server should remind about. Times before the day rolls over belong to the previous

  function reminderItems() {
    const r = RM(), items = [], ds = dayStart(), k0 = today();
    const late = hhmm => hmToMin(hhmm) < ds;
    const shiftDays = (days, hhmm) => (late(hhmm) ? days.map(d => (d + 1) % 7) : days);
    const calDate = (k, hhmm) => (late(hhmm) ? keyOf(addDays(parseKey(k), 1)) : k);

      // already done or skipped today: no ping for today's run

      if (rp.type === 'monthly') {
        for (let i = 0; i < 35; i++) {

          const t = startFor(rt, d);
          items.push({ ...base, id: `${rt.id}-${k}`, at: t, date: calDate(k, t) });
        }
        continue;
      }

      if (rt.vary && rt.times && Object.keys(rt.times).length) {
        for (const d of days) { const t = rt.times[d] || rt.start; items.push({ ...base, id: `${rt.id}-${d}`, at: t, days: shiftDays([d], t), skip: skipToday }); }
      } else items.push({ ...base, id: rt.id, at: rt.start, days: shiftDays(days, rt.start), skip: skipToday });
    }

          n++;

    const tx = (mode, fn) => open().then(db => new Promise((res, rej) => {
      const t = db.transaction('files', mode), out = fn(t.objectStore('files'));
      t.oncomplete = () => res(out && out.result);
      t.onerror = () => rej(t.error);
    }));
    return { get: id => tx('readonly', st => st.get(id)), put: (id, blob) => tx('readwrite', st => { st.put(blob, id); }), del: id => tx('readwrite', st => { st.delete(id); }) };
  })();
  const MAX_SIDE = 1600;
  // previews are kept in the media database too (not in the main save), cached here for drawing
  const thumbs = {};
  async function loadThumbs() {
    let moved = 0;
    for (const x of S.media) {
      if (x.thumb) { thumbs[x.id] = x.thumb; await mdb.put('thumb:' + x.id, x.thumb).catch(() => {}); delete x.thumb; moved++; }
      else if (!thumbs[x.id]) { const t = await mdb.get('thumb:' + x.id).catch(() => null); if (t) thumbs[x.id] = t; }
    }
    if (moved) save();
    if (S.media.length) render();
  }
  const extOf = type => ({ 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'video/mp4': 'mp4', 'video/quicktime': 'mov', 'video/webm': 'webm' }[type] || (type.split('/')[1] || 'bin'));
  const fmtBytes = n => n > 1e9 ? `${(n / 1e9).toFixed(1)} GB` : n > 1e6 ? `${(n / 1e6).toFixed(1)} MB` : `${Math.max(1, Math.round(n / 1e3))} KB`;

  async function shrinkPhoto(file) {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, MAX_SIDE / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
    const t = document.createElement('canvas'), tk = 260 / Math.max(c.width, c.height);
    t.width = Math.round(c.width * tk); t.height = Math.round(c.height * tk);
    t.getContext('2d').drawImage(c, 0, 0, t.width, t.height);
    return { blob: blob || file, thumb: t.toDataURL('image/jpeg', 0.7), w: c.width, h: c.height };
  }
  function videoThumb(file) {
    return new Promise(res => {
      const v = document.createElement('video'), url = URL.createObjectURL(file);
      let done = false;
      const finish = th => { if (done) return; done = true; URL.revokeObjectURL(url); res(th); };
      v.muted = true; v.playsInline = true; v.preload = 'metadata'; v.src = url;
      v.onloadeddata = () => { try { v.currentTime = Math.min(0.5, (v.duration || 1) / 3); } catch (e) { finish(null); } };
      v.onseeked = () => {
        try {
          const c = document.createElement('canvas'), k = 260 / Math.max(v.videoWidth || 1, v.videoHeight || 1);
          c.width = Math.round((v.videoWidth || 260) * k); c.height = Math.round((v.videoHeight || 260) * k);
          c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
          finish({ thumb: c.toDataURL('image/jpeg', 0.7), dur: v.duration });
        } catch (e) { finish(null); }
      };
      v.onerror = () => finish(null);
      setTimeout(() => finish(null), 6000);
    });
  }

        await mdb.put(id, blob);

    if (window.JSZip) return Promise.resolve(window.JSZip);
    return new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'vendor/jszip.min.js'; sc.onload = () => res(window.JSZip); sc.onerror = rej; document.head.appendChild(sc); });
