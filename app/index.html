  }

  function exSheet() {
    const name = V.woEx, w = WK(), u = w.unit;
    const rows = w.log.filter(x => x.items.some(it => same(it.name, name))).reverse().map(x => {
      const it = x.items.find(y => same(y.name, name));
      const top = Math.max(0, ...it.sets.map(setW)), best = Math.max(0, ...it.sets.map(s2 => e1rm(setW(s2), +s2.r)));
      return { x, it, top, best };
    });
    const pr = Math.max(0, ...rows.map(r => r.best));
    return `<div class="sheet-bg ${V.woExFresh ? 'enter' : ''}" data-act="wo-ex-close-bg"><div class="sheet"><div class="grab" aria-hidden="true"></div>
      <h2>${esc(name)}</h2>
      ${pr ? `<p class="muted" style="margin:-6px 0 10px">Best estimated 1-rep max: <b style="color:var(--text)">${Math.round(pr)} ${u}</b></p>${spark(rows.map(r => r.best).reverse().filter(Boolean))}` : ''}
      <ul class="flog" style="margin-top:10px">${rows.map(r => `<li><span><div style="font-weight:600">${esc(dayLabel(r.x.date))}${r.x.title ? ` · ${esc(r.x.title)}` : ''}${(r.x.prs || []).includes(r.it.name) ? '<span class="pr">PR</span>' : ''}</div>
        <div class="t num">${esc(setsText(r.it))}</div></span><span class="muted num" style="font-size:13px">${r.best ? `${Math.round(r.best)} e1RM` : ''}</span></li>`).join('')}</ul>
      <button class="btn ghost block" data-act="wo-ex-close" style="margin-top:8px">Close</button></div></div>`;
  }

  /* ----- body: weight, measurements, Navy body fat, bulk/cut ----- */

  const B = () => S.body;
  const PARTS = [['neck', 'Neck'], ['waist', 'Waist (at navel)'], ['hips', 'Hips'], ['chest', 'Chest'], ['shoulders', 'Shoulders'],
                 ['armL', 'Arm L'], ['armR', 'Arm R'], ['thighL', 'Thigh L'], ['thighR', 'Thigh R'], ['calfL', 'Calf L'], ['calfR', 'Calf R']];
  // US Navy body fat (inches). Men: waist & neck; women: waist, hips & neck.
  function navyBF(e, prof = B().profile) {
    const h = +prof.heightIn, n = +e.neck, w = +e.waist, hip = +e.hips;
    if (!h || !n || !w) return null;
    let bf;
    if (prof.sex === 'female') { if (!hip || w + hip - n <= 0) return null; bf = 163.205 * Math.log10(w + hip - n) - 97.684 * Math.log10(h) - 78.387; }
    else { if (w - n <= 0) return null; bf = 86.010 * Math.log10(w - n) - 70.041 * Math.log10(h) + 36.76; }
    return bf > 2 && bf < 70 ? Math.round(bf * 10) / 10 : null;
  }
  // sorted once per change and reused (callers must not modify the list)
  let esCache = { key: '', list: [] };
  const entriesSorted = () => {
    const key = `${S.rev}|${B().entries.length}`;
    if (esCache.key !== key) esCache = { key, list: [...B().entries].sort((a, b) => a.date.localeCompare(b.date) || a.t - b.t) };
    return esCache.list;
  };
  const latestWith = f => { const es = entriesSorted().filter(e => e[f] != null && e[f] !== ''); return es.length ? es[es.length - 1] : null; };
  function latestBF() {
    const es = entriesSorted().map(e => ({ e, bf: navyBF(e) })).filter(x => x.bf != null);
    return es.length ? es[es.length - 1] : null;
  }
  const daysBetween = (a, b) => Math.round((parseKey(b) - parseKey(a)) / DAY);
  // least-squares slope of y per day over recent points
  function slopePerDay(pts) {
    if (pts.length < 2) return null;
    const n = pts.length, mx = pts.reduce((a, p) => a + p.x, 0) / n, my = pts.reduce((a, p) => a + p.y, 0) / n;
    const num = pts.reduce((a, p) => a + (p.x - mx) * (p.y - my), 0), den = pts.reduce((a, p) => a + (p.x - mx) ** 2, 0);
    return den ? num / den : null;
  }
  function weightTrend(days = 21) {
    const end = today(), es = entriesSorted().filter(e => +e.weight > 0 && daysBetween(e.date, end) <= days);
    return slopePerDay(es.map(e => ({ x: -daysBetween(e.date, end), y: +e.weight })));
  }
  // maintenance calories: from your own intake and weight change when there's enough data, otherwise Katch-McArdle
  function tdeeEstimate() {
    const end = today(), es = entriesSorted().filter(e => +e.weight > 0 && daysBetween(e.date, end) <= 21);
    const fed = Array.from({ length: 21 }, (_, i) => keyOf(addDays(parseKey(end), -i))).map(k => nTotals(k).kcal).filter(x => x > 0);
    const slope = weightTrend(21);
    if (es.length >= 4 && fed.length >= 10 && slope != null && daysBetween(es[0].date, end) >= 10) {
      return { kcal: Math.round(avg(fed) - slope * 3500), how: `from your last ${fed.length} days of food logs and weight trend` };
    }
    const w = latestWith('weight'), bf = latestBF();
    if (!w) return null;
    const lbm = +w.weight * (1 - (bf ? bf.bf : 20) / 100) * 0.4536;
    return { kcal: Math.round((370 + 21.6 * lbm) * (+B().profile.activity || 1.55)), how: `estimated (Katch-McArdle${bf ? '' : ', assuming 20% body fat'} × activity)` };
  }
  function phaseTargets() {
    const t = tdeeEstimate(), w = latestWith('weight'), mode = B().phase.mode;
    if (!t || !w) return null;
    const kcal = t.kcal + (mode === 'bulk' ? 250 : mode === 'cut' ? -500 : 0);
    const bw = +w.weight, p = Math.round(bw * 0.9), f = Math.round(bw * 0.3), c = Math.max(0, Math.round((kcal - p * 4 - f * 9) / 4));
    return { tdee: t, kcal, p, c, f };
  }
  function phaseAdvice(bf) {
    const ph = B().phase;
    if (bf == null) return 'Log neck and waist (and hips for women) with your height in Profile to get body fat.';
    if (bf >= ph.high) return ph.mode === 'cut' ? `Cutting toward ${ph.low}%. Keep going.` : `At ${bf}% you’ve reached the top of your band. Time to cut.`;
    if (bf <= ph.low) return ph.mode === 'bulk' ? `Bulking toward ${ph.high}%. Keep going.` : `At ${bf}% you’re at the bottom of your band. Time to bulk.`;
    return ph.mode === 'bulk' ? `Bulking: ${Math.round((ph.high - bf) * 10) / 10}% to go before cutting.` : ph.mode === 'cut' ? `Cutting: ${Math.round((bf - ph.low) * 10) / 10}% to go before bulking.` : 'Pick a phase to start the cycle.';
  }

  function lineChart(pts, { band, unit = '', height = 130 } = {}) {
    if (pts.length < 2) return '<p class="muted" style="margin:6px 0">Two or more entries draw a trend.</p>';
    const W2 = 320, H = height, pad = 6;
    const ys = pts.map(p => p.y).concat(band || []);
    let lo = Math.min(...ys), hi = Math.max(...ys);
    if (hi - lo < 1) { hi += 0.5; lo -= 0.5; }
    const span = hi - lo; lo -= span * 0.12; hi += span * 0.12;
    const x0 = pts[0].x, x1 = pts[pts.length - 1].x || 1;
    const X = x => pad + (W2 - 2 * pad) * ((x - x0) / Math.max(1, x1 - x0)), Y = y => pad + (H - 2 * pad) * (1 - (y - lo) / (hi - lo));
    const bandRect = band ? `<rect x="0" y="${Y(band[1])}" width="${W2}" height="${Math.max(0, Y(band[0]) - Y(band[1]))}" fill="color-mix(in srgb, var(--ok) 14%, transparent)"/>
      <line x1="0" x2="${W2}" y1="${Y(band[1])}" y2="${Y(band[1])}" stroke="var(--late)" stroke-dasharray="4 4" stroke-width="1"/>
      <line x1="0" x2="${W2}" y1="${Y(band[0])}" y2="${Y(band[0])}" stroke="var(--ok)" stroke-dasharray="4 4" stroke-width="1"/>` : '';
    return `<svg class="lchart" viewBox="0 0 ${W2} ${H}" preserveAspectRatio="none" role="img" aria-label="Trend">
      ${bandRect}<polyline points="${pts.map(p => `${X(p.x)},${Y(p.y)}`).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
      ${pts.map(p => `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="2.6" fill="var(--accent)"/>`).join('')}</svg>
      <div class="lchart-ax num"><span>${esc(dayLabel(pts[0].k))}</span><span>${Math.round(pts[pts.length - 1].y * 10) / 10}${unit}</span><span>${esc(dayLabel(pts[pts.length - 1].k))}</span></div>`;
  }

  function bodyView() {
    const tab = V.btab;
    const seg = `<div class="seg">${[['overview', 'Overview'], ['log', 'Log'], ['media', 'Media']].map(([k, l]) => `<button data-act="b-tab" data-v="${k}" class="${tab === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;
    return seg + (tab === 'log' ? bodyLog() : tab === 'media' ? mediaView() : bodyOverview());
  }

  function bodyOverview() {
    const b = B(), ph = b.phase, prof = b.profile, w = latestWith('weight'), lb = latestBF(), bf = lb ? lb.bf : null;
    const slope = weightTrend(21), wk = slope != null ? slope * 7 : null;
    const fat = w && bf != null ? +w.weight * bf / 100 : null;
    const tgt = phaseTargets();
    const rateGoal = ph.mode === 'bulk' ? [0.25, 0.5] : ph.mode === 'cut' ? [-1, -0.5] : null;
    const wkPct = wk != null && w ? 100 * wk / +w.weight : null;
    const onPace = rateGoal && wkPct != null ? (wkPct >= rateGoal[0] && wkPct <= rateGoal[1]) : null;
    const all = entriesSorted(), first = all.length ? all[0].date : today();
    const bfPts = all.map(e => ({ k: e.date, x: daysBetween(first, e.date), y: navyBF(e) })).filter(p => p.y != null);
    const wPts = all.filter(e => +e.weight > 0).map(e => ({ k: e.date, x: daysBetween(first, e.date), y: +e.weight }));
    // when will the band edge be reached at the current body-fat trend?
    const bfSlope = slopePerDay(bfPts.slice(-6).map(p => ({ x: p.x, y: p.y })));
    let eta = '';
    if (bf != null && bfSlope) {
      const goal = ph.mode === 'bulk' ? ph.high : ph.mode === 'cut' ? ph.low : null;
      if (goal != null && Math.sign(goal - bf) === Math.sign(bfSlope)) eta = `About ${Math.max(1, Math.round((goal - bf) / bfSlope / 7))} weeks to ${goal}% at this pace.`;
    }
    const pos = bf != null ? Math.max(0, Math.min(100, 100 * (bf - ph.low) / (ph.high - ph.low))) : null;
    const missing = !prof.heightIn;
    return `
      ${missing ? `<div class="card" style="border-color:var(--accent)"><b>Add your height</b><p class="muted" style="margin:4px 0 10px;font-size:14px">The Navy body-fat formula needs it.</p><button class="btn primary block" data-act="b-tab" data-v="log">Set up profile</button></div>` : ''}
      <div class="card bodyhead">
        <div><span class="label">Weight</span><b class="num">${w ? fmtWt(+w.weight) : '—'}<small> lb</small></b><span class="muted num">${wk != null ? `${wk >= 0 ? '+' : ''}${Math.round(wk * 10) / 10} lb/week` : '—'}</span></div>
        <div><span class="label">Body fat</span><b class="num">${bf != null ? bf : '—'}<small>%</small></b><span class="muted">US Navy</span></div>
        <div><span class="label">Lean</span><b class="num">${fat != null ? Math.round(+w.weight - fat) : '—'}<small> lb</small></b><span class="muted num">${fat != null ? `${Math.round(fat)} lb fat` : '—'}</span></div>
      </div>
      <div class="sechead"><h3>Bulk / cut</h3><button class="linkbtn" data-act="b-band">Band ${ph.low}–${ph.high}%</button></div>
      <div class="card">
        <div class="opts" style="margin-bottom:12px">${[['bulk', 'Bulk'], ['maintain', 'Maintain'], ['cut', 'Cut']].map(([k, l]) => `<button data-act="b-phase" data-v="${k}" class="${ph.mode === k ? 'on' : ''}">${l}</button>`).join('')}</div>
        ${pos != null ? `<div class="bandbar"><span class="lo">${ph.low}%</span><div class="track"><i style="left:${pos}%"></i></div><span class="hi">${ph.high}%</span></div>` : ''}
        <p style="margin:10px 0 4px;font-weight:600">${esc(phaseAdvice(bf))}</p>
        ${eta ? `<p class="muted" style="margin:0 0 4px;font-size:14px">${eta}</p>` : ''}
        ${ph.since ? `<p class="muted" style="margin:0 0 8px;font-size:13px">${ph.mode[0].toUpperCase() + ph.mode.slice(1)} since ${esc(dayLabel(ph.since))} (${Math.max(0, Math.round(daysBetween(ph.since, today()) / 7))} weeks)</p>` : ''}
        ${rateGoal ? `<p class="muted" style="margin:0 0 10px;font-size:13px">Target pace: ${rateGoal[0] > 0 ? '+' : ''}${rateGoal[0]} to ${rateGoal[1] > 0 ? '+' : ''}${rateGoal[1]}% of body weight a week${wkPct != null ? ` · you: <b class="${onPace ? '' : 'late'}" style="${onPace ? 'color:var(--ok)' : ''}">${wkPct >= 0 ? '+' : ''}${Math.round(wkPct * 100) / 100}%</b>` : ''}</p>` : ''}
        ${tgt ? `<div class="preptot num"><b>${ph.mode === 'bulk' ? 'Bulk' : ph.mode === 'cut' ? 'Cut' : 'Maintenance'} target:</b> ${tgt.kcal} kcal · P ${tgt.p}g · C ${tgt.c}g · F ${tgt.f}g<br><span class="muted" style="font-size:12px">Maintenance ≈ ${tgt.tdee.kcal} kcal, ${esc(tgt.tdee.how)}</span></div>
          <button class="btn block" data-act="b-apply">Use as my Nutrition goals</button>` : '<p class="muted" style="font-size:14px;margin:0">Log your weight to get calorie targets.</p>'}
      </div>
      <div class="sechead"><h3>Body fat</h3></div>
      <div class="card">${lineChart(bfPts, { band: [ph.low, ph.high], unit: '%' })}</div>
      <div class="sechead"><h3>Weight</h3></div>
      <div class="card">${lineChart(wPts, { unit: ' lb' })}</div>
      ${measureChanges()}
      <p class="note">The Navy method is an estimate (typically within a few percent). Measure the same way, same time of day, and trust the trend over any single reading.</p>`;
  }

  function measureChanges() {
    const es = entriesSorted(), parts = PARTS.filter(([k]) => es.some(e => +e[k] > 0));
    if (!parts.length) return '';
    const rows = parts.map(([k, l]) => {
      const withK = es.filter(e => +e[k] > 0), last = withK[withK.length - 1];
      const ref = withK.filter(e => daysBetween(e.date, last.date) >= 28).pop() || withK[0];
      const d = +last[k] - +ref[k];
      return `<li><span>${esc(l.replace(' (at navel)', ''))}</span><span class="num">${fmtWt(+last[k])}″ ${ref !== last ? `<span class="${d > 0 ? 'up2' : d < 0 ? 'down2' : 'muted'}">${d > 0 ? '+' : ''}${Math.round(d * 100) / 100}″</span> <span class="muted" style="font-size:11px">since ${esc(dayLabel(ref.date))}</span>` : ''}</span></li>`;
    }).join('');
    return `<div class="sechead"><h3>Measurements</h3></div><div class="card"><ul class="flog mlist">${rows}</ul></div>`;
  }

  function bodyLog() {
    const b = B(), prof = b.profile, f = V.bform || { date: today() };
    const ft = prof.heightIn ? Math.floor(prof.heightIn / 12) : '', inch = prof.heightIn ? Math.round((prof.heightIn % 12) * 10) / 10 : '';
    const preview = navyBF(f);
    const es = [...entriesSorted()].reverse();
    return `

      if (off.length === 3 && off.every(x => x.goal && Math.abs(x.got - x.goal) > x.goal * 0.1)) {
        const mean = Math.round(avg(off.map(x => x.got))), goal = off[0].goal;
        add('kcal-off', `Calories have been off target your last 3 logged days (about ${mean.toLocaleString()} vs ${goal.toLocaleString()} kcal). ${mean > goal ? 'Smaller portions or fewer snacks would bring it back.' : 'You’re under-eating; add a meal or a bigger portion.'}`);
      }
    }
    if (on('macros')) {
      const g = goalsFor(k), fed = [];
      for (let i = 1; i <= 7 && fed.length < 3; i++) { const kk = keyOf(addDays(d, -i)); if (nLog(kk).length) fed.push(nTotals(kk).p); }
      if (g.p && fed.length === 3 && fed.every(p => p < g.p * 0.85))
        add('protein', `Protein has come up short your last 3 logged days (about ${Math.round(avg(fed))}g of ${g.p}g). Eggs, Greek yogurt, chicken or a shake would close the gap.`);
    }
    for (const g of activeGates()) for (const r of S.gates[g.id]) {
      if (r.vary) continue;
      const runs = [];
      for (let i = 1; i <= 10 && runs.length < 5; i++) {
        const dd = addDays(d, -i), kk = keyOf(dd);
        if (!scheduledOn(r, dd) || skipped(r.id, kk) || !finOf(r.id, kk)) continue;
        runs.push(finText(r, kk).late);
      }
      const late = runs.filter(Boolean).length;
      if (runs.length >= 3 && late >= 3) {
        const to = fromMinHM(toMin(r.start) + 15);
        add('late:' + r.id, `${r.title} has run late ${late} of the last ${runs.length} times. Want to give it more room?`,
          `<button class="btn small" data-act="sv-shift" data-gate="${g.id}" data-id="${r.id}" data-v="${to}">Move to ${clock(to)}</button>`);
      }
    }
    if (on('workouts') && WK().log.length) {
      const last = WK().log.map(x => x.date).sort().pop(), gap = daysBetween(last, k);
      if (gap >= 4) add('workout', `It’s been ${gap} days since your last workout. Even a short one keeps the habit alive.`, '<button class="btn small" data-act="sv-go" data-v="fitness">Log a workout</button>');
    }
    if (on('body')) {
      const lw = latestWith('weight');
      if (lw && daysBetween(lw.date, k) >= 7) add('weigh', `No weigh-in for ${daysBetween(lw.date, k)} days. A quick one keeps your trend honest.`, '<button class="btn small" data-act="sv-go" data-v="body">Weigh in</button>');
    }
    const y = addDays(d, -1), slipped = activeGates().filter(g => !g.other).filter(g => { const gd = gateDay(g.id, y); return gd.n && !gd.held && keyOf(y) >= pdayOf(SV().born || 0); });
    const all4 = slipped.length > 1 && slipped.length === activeGates().filter(g => !g.other && gateDay(g.id, y).n).length;
    if (slipped.length) add('slip', `Yesterday ${all4 ? 'every Gate' : `the ${svList(slipped.map(g => g.name))} Gate${slipped.length > 1 ? 's' : ''}`} slipped. Today’s a fresh start.`);
    const st = svStats();
    if (st.streak >= 3) add('streak', `${st.streak} days in a row at full charge. That’s what consistency looks like. Keep it going!`);
    const goals = SV().goals;
    if (goals.length) { const g = goals[Math.floor(parseKey(k) / DAY) % goals.length]; add('goal:' + g.id, `Remember what you’re working toward: “${g.text}”`); }
    return out;
  }

  // something to say when there's nothing to nudge about
  function svGreeting() {
    const h = new Date().getHours(), hi = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
    const items = allRoutines(), next = items.find(x => ['now', 'upcoming'].includes(status(x.r)));
    if (items.length && items.every(x => isDone(x.r.id))) return 'Every Gate held today. I’m proud of you.';
    if (next) return status(next.r) === 'now' ? `${next.r.title} is happening now. I’m with you.` : `${hi}! ${next.r.title} is next, at ${clock(startFor(next.r))}.`;
    return `${hi}! I’m here whenever you need me.`;
  }

  /* --- the companion's voice in reminders and celebrations --- */
  const SV_LINES = {
    routine: ['Time for {t}. I’ll be right here when you’re done.', '{t} starts now. Let’s keep the streak going.', 'It’s {t} time. Small steps, every day.', '{t} is up. You’ve got this.'],
    water: ['Sip time: {a}. Your future self says thanks.', 'Water check: {a} now keeps you on pace.', 'Time for {a} of water.'],
    todo: ['“{t}” is due now.', 'Quick one: “{t}” is due.'],
    review: ['Let’s look back on your week together.'],
    gate: ['That’s one Gate held. Nice work!', 'Held. I knew you would.', 'One more Gate kept. Proud of you.'],
    all: ['Every Gate held today. That’s the whole point. Amazing.', 'All four Gates held. You’re unstoppable today.'],
  };
  function svLine(kind, seed, vars = {}) {
    if (!svBorn()) return null;
    const list = SV_LINES[kind];
    let h = 0;
    for (const ch of String(seed)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return `${svName()}: ` + list[h % list.length].replace('{t}', vars.t || '').replace('{a}', vars.a || '');
  }

  /* --- morning message and evening check-in (sent by the reminder server) --- */
  const svVoiced = () => svBorn() && on('companion');
  // isToday: today's numbers (streak, charge) are known; later days only have the plan
  function morningText(k, isToday) {
    const d = parseKey(k), items = allRoutines(d), parts = [], g = goalsFor(k);
    parts.push(items.length ? `${items.length} routine${items.length === 1 ? '' : 's'} today, starting with ${items[0].r.title} at ${clock(startFor(items[0].r, d))}.` : 'Nothing scheduled today. A good day to rest or catch up.');
    if (on('macros') && g.kcal) parts.push(`Calorie goal: ${g.kcal.toLocaleString()}.`);
    if (on('water')) parts.push(`Water: ${fmtW(W().target)}.`);
    if (svVoiced()) {
      const st = isToday ? svStats() : null;
      if (st && st.streak >= 2) parts.push(`${st.streak} days in a row. Let’s keep it going.`);
      const goals = SV().goals;
      if (goals.length) parts.push(`Remember: “${goals[Math.floor(d / DAY) % goals.length].text}”`);
    }
    return { title: svVoiced() ? svName() : 'Good morning', body: (svVoiced() ? 'Good morning! ' : '') + parts.join(' ') };
  }
  function eveningText(k, isToday) {
    const title = svVoiced() ? svName() : 'Evening check-in';
    if (!isToday) return { title, body: `${svVoiced() ? 'Evening check-in. ' : ''}Open MetaMorph to see what’s left today and close it out strong.` };
    const items = allRoutines(), left = items.filter(x => !isDone(x.r.id)), parts = [];
    if (items.length && !left.length) parts.push(svVoiced() ? 'Every Gate held today. I’m proud of you. Rest well.' : 'Every routine done today.');
    else if (left.length) parts.push(`Still open: ${svList(left.slice(0, 3).map(x => `${x.r.title} (${clock(startFor(x.r))})`))}${left.length > 3 ? ` and ${left.length - 3} more` : ''}.`);
    if (on('water')) { const got = wTotal(); if (got < W().target) parts.push(`Water: ${fmtW(got)} of ${fmtW(W().target)}.`); }
    if (on('macros')) { const g = goalsFor(today()), t = Math.round(nTotals().kcal); if (g.kcal) parts.push(`Calories: ${t.toLocaleString()} of ${g.kcal.toLocaleString()}.`); }
    if (svVoiced() && left.length) parts.push(`Charge ${svStats().charge}%. You can still finish strong.`);
    return { title, body: (svVoiced() ? 'Evening check-in. ' : '') + parts.join(' ') };
  }

  /* --- weekly review draft --- */
  function weekSummary(mon) {
    const st = weekStats(mon), L = [];
    for (const x of st.gates) L.push(`${x.g.name}: ${x.held}/${x.n} routines held${x.late ? `, ${x.late} late` : ''}`);
    if (on('workouts')) L.push(`workouts: ${st.wo.length}${st.wo.length ? ` (${st.wo.map(w => w.title || 'Workout').join(', ')})` : ''}`);
    if (on('macros') && st.fed.length) {
      const onT = st.fed.filter(x => x.g.kcal && Math.abs(x.t.kcal - x.g.kcal) <= x.g.kcal * 0.1).length;
      L.push(`food logged ${st.fed.length}/${st.days.length} days; average ${Math.round(avg(st.fed.map(x => x.t.kcal)))} kcal vs goal ${st.fed[0].g.kcal}; calories on target ${onT}/${st.fed.length} days; average protein ${Math.round(avg(st.fed.map(x => x.t.p)))}g`);
    } else if (on('macros')) L.push('food: nothing logged');
    if (on('water') && st.water.length) L.push(`water target hit ${st.water.filter(Boolean).length}/${st.water.length} days`);
    if (on('body') && st.wFrom && st.wTo && st.wFrom !== st.wTo) L.push(`weight ${st.wFrom.weight} → ${st.wTo.weight} lb`);
    if (on('todo')) L.push(`tasks finished: ${st.todosDone}`);
    const days = st.days.map(d => chargeOf(keyOf(d)));
    L.push(`daily charge: ${days.map(c => c + '%').join(', ')}`);
    return L.join('\n');
  }
  async function svDraftReview(mon) {
    V.rvDraft = true; V.rvDraftErr = null; render();
    const range = `${parseKey(mon).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} – ${addDays(parseKey(mon), 6).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}`;
    const ask = `Please draft my weekly review for ${range}. The week's numbers:\n${weekSummary(mon)}\n\nDon't use any tools. Reply with exactly two lines and nothing else:\nKEEP: one or two warm sentences on what worked and should continue, citing a number.\nCHANGE: one concrete, small thing to do differently next week, tied to my goals if possible.`;
    try {
      const res = await fetch(PUSH_URL + '/chat', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Companion-Code': SV().code },
        body: JSON.stringify({ messages: [{ role: 'user', content: [{ type: 'text', text: `<app_state>\n${svSnapshot()}\n</app_state>` }, { type: 'text', text: ask }] }] }) });
      const out = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(SV_ERR[out.error] || `Couldn’t get a draft (${res.status}).`);
      const text = (out.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
      const keep = (text.match(/KEEP:\s*([\s\S]*?)(?=\n\s*CHANGE:|$)/i) || [])[1], change = (text.match(/CHANGE:\s*([\s\S]*)$/i) || [])[1];
      if (!keep && !change) throw new Error('The draft came back in an odd shape. Try again.');
      const r = S.reviews[mon] = S.reviews[mon] || {};
      if (keep) r.keep = keep.trim();
      if (change) r.change = change.trim();
      save();
    } catch (e) { V.rvDraftErr = /fetch|network|load failed/i.test(e.message) ? 'Couldn’t reach your companion.' : e.message; }
    V.rvDraft = false; render();
  }

  /* --- picture --- */
  function svAvatar(size, st, cls = '') {
    const src = SV().avatar || SV_DEFAULT_IMG;
    return `<span class="sv-av ${st.form} ${cls}" style="--s:${size}px;--p:${st.charge}" aria-hidden="true">
      <span class="sv-face">${src ? `<img src="${esc(src)}" alt="" draggable="false">` : orb('chaos', Math.round(size * 0.86))}</span></span>`;
  }
  async function svSetPicture(file) {
    try {
      const url = URL.createObjectURL(file), img = new Image();
      await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
      const n = 384, c = document.createElement('canvas'), side = Math.min(img.naturalWidth, img.naturalHeight);
      c.width = c.height = n;
      c.getContext('2d').drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, n, n);
      URL.revokeObjectURL(url);
      let data = c.toDataURL('image/webp', 0.86);
      if (!data.startsWith('data:image/webp')) data = c.toDataURL('image/jpeg', 0.86);
      SV().avatar = data; save(); render(); snack('New look saved');
    } catch (e) { snack('Couldn’t read that picture.'); }
  }

    return `<div class="sv-stats"><div><b class="num">${st.charge}%</b><span>today</span></div><div><b class="num">${st.streak}</b><span>day streak</span></div><div><b class="num">${st.best}</b><span>best</span></div></div>
      <div class="card sv-week">${bars}</div>
      <p class="note" style="margin:6px 0 0">Charge comes from your ${svChargeParts()} each day. ${FULL}% or more keeps the streak.</p>
      <p class="label">What I’ve noticed</p>
      ${nz.length ? `<div class="card sv-notes">${nz.map(x => `<div class="sv-note"><p>${esc(x.text)}</p><div class="sv-acts">${x.btn}<button class="linkbtn" data-act="sv-dismiss" data-id="${esc(x.id)}">Not now</button></div></div>`).join('')}</div>`
        : `<p class="muted" style="margin:4px 0 0">${esc(svGreeting())}</p>`}

      <form id="svgoalf" class="row" style="gap:8px;margin-top:6px"><input id="svgoal" maxlength="120" placeholder="e.g. Reach 12% body fat by spring" autocomplete="off" style="flex:1"><button class="btn" type="submit">Add</button></form>
      <p class="label">Look &amp; name</p>

      <div class="grid2"><label class="btn" for="svpic">${sv.avatar ? 'Change picture' : 'Choose a picture'}</label>${sv.avatar ? '<button class="btn" data-act="sv-pic-del">Use the orb</button>' : '<span></span>'}</div>
      <input type="file" id="svpic" accept="image/*" hidden>`;

  /* --- chat (through your own push server, which holds the API key) --- */
  const svChatReady = () => !!(PUSH_URL && SV().code);
  const r1sv = n => Math.round((+n || 0) * 10) / 10;
  function svFindRoutine(id) {
    for (const g of GATES) { const r = S.gates[g.id].find(x => x.id === id); if (r) return { gate: g.id, r }; }
    return null;
  }
  const svDate = k => (k === today() ? 'today' : parseKey(k).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }));
  function svToolLine(b) {
    const x = b.input || {};
    switch (b.name) {
      case 'log_food': return ['Log food', `${x.meal} · ${x.name}`, `${Math.round(+x.kcal || 0)} kcal · P ${r1sv(x.protein_g)} · C ${r1sv(x.carbs_g)} · F ${r1sv(x.fat_g)}`];
      case 'log_water': return ['Log water', fmtW(+x.amount_ml || 0), ''];
      case 'add_todo': return ['Add to-do', x.text, [/^\d{4}-\d{2}-\d{2}$/.test(x.date) ? svDate(x.date) : '', /^\d{2}:\d{2}$/.test(x.time) ? clock(x.time) : ''].filter(Boolean).join(' · ')];
      case 'move_routine': { const f = svFindRoutine(x.routine_id); return ['Move routine', f ? f.r.title : 'A routine that no longer exists', f && /^\d{2}:\d{2}$/.test(x.time) ? `${clock(f.r.start)} → ${clock(x.time)}` : '']; }
      case 'log_weight': return ['Log weight', `${r1sv(x.weight)} lb`, 'today'];
      case 'add_goal': return ['Save goal', x.text, ''];
      default: return ['Suggestion', b.name, ''];
    }
  }
  // apply an accepted suggestion; returns what to say, or null if it can't be applied
  function svApply(b) {
    const x = b.input || {}, num = (v, lo, hi) => Math.min(hi, Math.max(lo, +v || 0));
    switch (b.name) {
      case 'log_food':
        logFood(MEALS.includes(x.meal) ? x.meal : mealNow(), { name: String(x.name || 'Food').slice(0, 80), kcal: num(x.kcal, 0, 5000), p: num(x.protein_g, 0, 500), c: num(x.carbs_g, 0, 800), f: num(x.fat_g, 0, 400) }, 1, 'chat', null, today());
        return `Logged ${String(x.name || 'food').slice(0, 40)}`;
      case 'log_water': { const ml = num(x.amount_ml, 0, 3000); if (!ml) return null; addWater(ml); return `Logged ${fmtW(ml)} of water`; }
      case 'add_todo': {
        const text = String(x.text || '').trim().slice(0, 200); if (!text) return null;
        const date = /^\d{4}-\d{2}-\d{2}$/.test(x.date) ? x.date : null, time = date && /^\d{2}:\d{2}$/.test(x.time) ? x.time : null;
        S.todos.push({ id: uid(), text, date, time, done: false, doneAt: null, created: Date.now() }); save();
        return 'Added to your to-do list';
      }
      case 'move_routine': {
        const f = svFindRoutine(x.routine_id); if (!f || !/^\d{2}:\d{2}$/.test(x.time)) return null;
        f.r.start = x.time; save();
        return `${f.r.title} now starts at ${clock(x.time)}`;
      }
      case 'log_weight': { const w = num(x.weight, 0, 1500); if (!w) return null; B().entries.push({ id: uid(), t: Date.now(), date: today(), weight: r1sv(w) }); save(); return `Logged ${r1sv(w)} lb`; }
      case 'add_goal': { const text = String(x.text || '').trim().slice(0, 120); if (!text) return null; SV().goals.push({ id: uid(), text, t: Date.now() }); save(); return 'Goal saved'; }
    }
    return null;
  }

  // what the companion knows about your day, sent with each message
  function svSnapshot() {
    const k = today(), d = pdayDate(), now = new Date(), st = svStats(), L = [];
    let tz = '';
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) {}
    L.push(`now: ${now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })}, ${now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}${tz ? ` (${tz})` : ''}`);
    L.push(`app day: ${k} (a new day starts at ${clock(fromMinHM(dayStart()))})`);
    L.push(`your name: ${svName()}`);
    L.push(`your charge today: ${st.charge}% (from ${svChargeParts()}); days in a row at ${FULL}%+: ${st.streak}; best: ${st.best}`);
    L.push(`charge, last 7 days (oldest first): ${st.days.map(x => (x.c == null ? '-' : x.c + '%')).join(', ')}`);
    L.push(SV().goals.length ? 'their goals:\n' + SV().goals.map(g => `- ${g.text}`).join('\n') : 'their goals: none set yet');
    const items = allRoutines();
    L.push('routines today:' + (items.length ? '' : ' none'));
    for (const { gate, r } of items) {
      const s = status(r), fin = finOf(r.id);
      const x = s === 'done' ? (fin ? `done at ${hm(fin)}${finText(r).late ? ' (late)' : ''}` : 'done') : s === 'now' ? 'in progress now' : s === 'upcoming' ? 'upcoming' : 'overdue, not done yet';
      L.push(`- [${r.id}] ${clock(startFor(r))} ${r.title} (${gateOf(gate).name}, ${dur(total(r))}): ${x}`);
    }
    const sk = activeGates().flatMap(g => S.gates[g.id].filter(r => scheduledOn(r, d) && skipped(r.id)).map(r => r.title));
    if (sk.length) L.push('skipped today on purpose: ' + sk.join(', '));
    const others = activeGates().flatMap(g => S.gates[g.id].filter(r => !scheduledOn(r, d)).map(r => `[${r.id}] ${r.title} (${g.name}, ${repeatText(r)} at ${clock(r.start)})`));
    if (others.length) L.push('routines not on today: ' + others.join('; '));
    if (on('water')) { const w = wState(); L.push(`water: ${fmtW(w.got)} of ${fmtW(w.target)} so far; on pace would be ${fmtW(w.expected)}; usual glass ${fmtW(W().pour)}`); }
    if (on('macros')) {
      const t = nTotals(k), g = goalsFor(k), log = nLog(k);
      L.push(`food today (calories are the main focus; protein matters too): ${Math.round(t.kcal)} kcal, protein ${Math.round(t.p)}g, carbs ${Math.round(t.c)}g, fat ${Math.round(t.f)}g. Goals: ${g.kcal} kcal, protein ${g.p}g, carbs ${g.c}g, fat ${g.f}g`);
      if (log.length) L.push('eaten today: ' + log.map(e => `${e.meal}: ${e.name}${e.qty !== 1 ? ` ×${e.qty}` : ''} (${Math.round(e.kcal * e.qty)} kcal)`).join('; '));
      const foods = N().foods.slice(0, 25);
      if (foods.length) L.push('saved foods (per serving): ' + foods.map(f => `${f.name}: ${Math.round(+f.kcal || 0)} kcal, P ${r1sv(f.p)}, C ${r1sv(f.c)}, F ${r1sv(f.f)}`).join('; '));
    }
    if (on('workouts')) {
      const wl = [...WK().log].sort((a, b) => b.t - a.t).slice(0, 4);
      L.push(wl.length ? 'recent workouts: ' + wl.map(w => `${w.date} ${w.title || 'Workout'} (${(w.items || []).map(i => i.name).slice(0, 6).join(', ')})`).join('; ') : 'recent workouts: none logged');
    }
    if (on('body')) {
      const lw = latestWith('weight'), bf = latestBF();
      L.push(`body: ${lw ? `latest weight ${lw.weight} lb on ${lw.date}` : 'no weight logged'}${bf ? `; body fat ${bf.bf}% on ${bf.e.date}` : ''}; phase: ${B().phase.mode}`);
    }
    if (on('todo')) {
      const td = S.todos.filter(x => !x.done && x.date && x.date <= k);
      L.push(td.length ? 'to-dos due or overdue: ' + td.slice(0, 10).map(x => `${x.text} (${x.date === k ? 'today' : 'overdue since ' + x.date}${x.time ? ' ' + clock(x.time) : ''})`).join('; ') : 'to-dos due: none');

  const HISTORY = 30;
  // Only the last HISTORY messages are ever sent again, so older ones keep just what the chat shows.
  function svCompact(log) {
    for (let i = 0; i < log.length - HISTORY - 2; i++) {
      const m = log[i];
      if (m.compact) continue;
      m.content = m.content.filter(b => !(b.type === 'thinking' || b.type === 'redacted_thinking' || (b.type === 'text' && b.text.startsWith('<app_state>'))));
      m.compact = true;
    }
  }
  // the conversation as sent: recent turns only, starting on a user turn; earlier thinking is dropped from the front
  function svHistory() {
    let log = SV().chat.log.slice(-HISTORY);
    while (log.length && log[0].role !== 'user') log = log.slice(1);
    const lastA = log.map(m => m.role).lastIndexOf('assistant');
    return log.map((m, i) => {
      let content = m.content;
      if (i === 0) content = content.filter(b => b.type !== 'tool_result');   // its suggestion was trimmed away
      if (m.role === 'assistant' && i !== lastA) content = content.filter(b => b.type !== 'thinking' && b.type !== 'redacted_thinking');
      return { role: m.role, content };
    });
  }
  const SV_ERR = { not_configured: 'Chat isn’t switched on on your server yet.', bad_code: 'That pairing code didn’t work. Check it in the Chat tab.', daily_limit: 'We’ve hit today’s chat limit. Talk tomorrow!',
                   busy: 'I’m a bit overloaded. Try again in a minute.', bad_api_key: 'The server’s API key isn’t working.', too_large: 'This chat got too long. Clear it and start fresh.' };
  async function svRequest() {
    const c = SV().chat;
    V.svBusy = true; V.svErr = null; render(); svScroll();
    try {
      const res = await fetch(PUSH_URL + '/chat', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Companion-Code': SV().code }, body: JSON.stringify({ messages: svHistory() }) });
      const out = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(SV_ERR[out.error] || `Couldn’t get an answer (${res.status}).`);
      const content = (out.content || []).filter(b => ['text', 'tool_use', 'thinking', 'redacted_thinking'].includes(b.type));
      if (!content.some(b => (b.type === 'text' && b.text.trim()) || b.type === 'tool_use'))
        content.push({ type: 'text', text: out.stop_reason === 'refusal' ? 'I can’t help with that one, but I’m here for anything else.' : '…' });
      c.log.push({ role: 'assistant', t: Date.now(), content });
      svCompact(c.log);
      if (c.log.length > 200) { c.log.splice(0, c.log.length - 200); while (c.log.length && c.log[0].role !== 'user') c.log.shift(); }
      save();
    } catch (e) { V.svErr = e.message && !/fetch|network/i.test(e.message) ? e.message : 'Couldn’t reach your companion. Check your connection.'; }
    V.svBusy = false; render(); svScroll();
  }
  async function svSend(text) {
    const c = SV().chat;
    // an unanswered message (it failed) is replaced by this one
    if (c.log.length && c.log[c.log.length - 1].role === 'user') c.log.pop();
    const last = c.log[c.log.length - 1], results = [];
    if (last && last.role === 'assistant') for (const b of last.content) if (b.type === 'tool_use') {
      if (!c.props[b.id]) c.props[b.id] = 'ignored';
      const s = c.props[b.id];
      results.push({ type: 'tool_result', tool_use_id: b.id, content: s === 'accepted' ? 'The user accepted; it is now saved in the app.' : s === 'skipped' ? 'The user skipped this suggestion; nothing was changed.' : 'The user moved on without accepting; nothing was changed.' });
    }
    c.log.push({ role: 'user', t: Date.now(), text, content: [...results, { type: 'text', text: `<app_state>\n${svSnapshot()}\n</app_state>` }, { type: 'text', text }] });
    save();
    await svRequest();
  }
  function svScroll() { requestAnimationFrame(() => { const el = document.querySelector('.sv-msgs'); if (el) el.scrollTop = el.scrollHeight; }); }
  // light formatting for replies: paragraphs, line breaks, **bold**, simple lists
  const svFormat = t => esc(t.trim()).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').split(/\n{2,}/).map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');

  function svChatView() {

  /* --- companion events --- */

  /* ----- quick logging: Siri & Shortcuts inbox, reminder taps that open to the action, quick bar ----- */

  /* --- Siri & Shortcuts inbox --- */
  // log water at the moment it was sent, checking off the sip it belongs to
  function addWaterAt(ml, t) {
    const k = pdayOf(t);
    if (k === today()) {
      const row = wState().rows.find(e => !e.done && t >= e.at - 20 * 60000 && t <= e.at + SIP_GRACE);
      if (row) { W().hit[k] = W().hit[k] || {}; W().hit[k][row.id] = true; }
    }
    (W().log[k] = W().log[k] || []).push({ t, ml: Math.round(ml) });
  }
  // the routine that was on when "done" was sent (or the latest one that had started)
  function routineAt(t) {
    const k = pdayOf(t), list = allRoutines(parseKey(k)).filter(({ r }) => !isDone(r.id, k));
    return { k, pick: list.find(({ r }) => { const w = windowOf(r, k); return t >= w.start && t <= w.end; }) || list.filter(({ r }) => windowOf(r, k).start <= t).pop() };
  }
  function applyInbox(x) {
    if (x.kind === 'water') {
      const n = +x.amount || 0, unit = x.unit || W().unit;
      const ml = !n ? W().pour : unit === 'oz' ? n * ML_OZ : unit === 'l' ? n * 1000 : n;
      if (ml < 1 || ml > 5000) return null;
      addWaterAt(ml, x.t);
      return `${fmtW(ml)} water`;
    }
    if (x.kind === 'weight') {
      const lb = Math.round((x.unit === 'kg' ? x.value * 2.20462 : +x.value) * 10) / 10;
      if (!(lb > 50 && lb < 1000)) return null;
      B().entries.push({ id: uid(), t: x.t, date: pdayOf(x.t), weight: lb });
      return `weight ${lb} lb`;
    }
    if (x.kind === 'done') {
      const { k, pick } = routineAt(x.t);
      if (!pick) return `nothing was on at ${hm(x.t)} to mark done`;
      completeRoutine(pick.r, true, k, false);
      setFin(pick.r.id, x.t, k);
      if (k === today()) checkHeld(pick.r, k);
      return `${pick.r.title} done at ${hm(x.t)}`;
    }
    return null;
  }
  let inboxBusy = false;
  async function pullInbox() {
    if (inboxBusy || !PUSH_URL || !SV().code || document.visibilityState !== 'visible') return;
    inboxBusy = true;
    try {
      const res = await fetch(PUSH_URL + '/inbox', { headers: { 'X-Companion-Code': SV().code } });
      if (!res.ok) return;
      const items = ((await res.json()).items || []).filter(x => x && x.id);
      const seen = SV().inboxSeen || (SV().inboxSeen = []);
      const fresh = items.filter(x => !seen.includes(x.id)).sort((a, b) => a.t - b.t);
      const said = [], notes = [];
      for (const x of fresh) {
        seen.push(x.id);
        if (x.kind === 'note') { notes.push(x); continue; }
        const r = applyInbox(x);
        if (r) said.push(r);
      }
      if (seen.length > 300) seen.splice(0, seen.length - 300);
      if (notes.length) {
        const when = x => `${pdayOf(x.t) === today() ? '' : parseKey(pdayOf(x.t)).toLocaleDateString(undefined, { weekday: 'short' }) + ' '}${hm(x.t)}`;
        if (svBorn() && svChatReady()) {
          SV().unread = true;
          svSend(notes.map(x => `(Sent from my phone at ${when(x)}) ${x.text}`).join('\n'));
        } else for (const x of notes) S.todos.push({ id: uid(), text: `From Siri (${when(x)}): ${x.text}`.slice(0, 200), date: today(), time: null, done: false, doneAt: null, created: Date.now() });
      }
      if (fresh.length) { save(); render(); }
      if (said.length) snack('From your phone: ' + said.join(' · '));
      // clear everything we've now seen, including anything applied before a failed clean-up
      if (items.length) fetch(PUSH_URL + '/inbox/ack', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Companion-Code': SV().code }, body: JSON.stringify({ ids: items.map(x => x.id) }) }).catch(() => {});
    } catch (e) {
    } finally { inboxBusy = false; }
  }
  booted.then(() => setTimeout(pullInbox, 700));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') setTimeout(pullInbox, 300); });

  /* --- setup screen: Siri & Shortcuts --- */
  function siriSheet() {
    const code = SV().code, addr = PUSH_URL + '/inbox', name = svBorn() ? svName() : 'your companion';
    const step = (title, text, extra = '') => `<li><b>${title}</b><span>${text}</span>${extra}</li>`;

  /* --- events --- */
  $app.addEventListener('click', e => {

      case 'q-weigh': V.tab = 'body'; V.btab = 'log'; render(); scrollTo(0, 0); break;
      case 'siri-open': V.data = false; V.siri = true; V.siriFresh = true; render(); V.siriFresh = false; break;
      case 'siri-close-bg': if (e.target !== el) break;   // falls through
      case 'siri-close': V.siri = false; render(); break;
      case 'siri-copy': navigator.clipboard.writeText(el.dataset.v).then(() => snack('Copied'), () => snack('Couldn’t copy. Press and hold to select it instead.')); break;
      case 'siri-check': pullInbox().then(() => snack('Checked')); break;
    }

  /* ----- cloud backup: encrypted on this phone with your passphrase, kept on your own server ----- */
  // Format: "MMB1" | flags (1 = gzip) | salt (16) | iv (12) | AES-GCM ciphertext of the same JSON as a backup file.
  // The key is derived from your passphrase (PBKDF2-SHA256) and kept only on this device, never in your data,
  // a backup or on the server, so the server holds bytes it can't read.

  const CB = () => S.cloud;
  const CB_MAGIC = [0x4d, 0x4d, 0x42, 0x31], CB_ITER = 310000, CB_EVERY = 20 * 3600000;
  const te = new TextEncoder(), td = new TextDecoder();
  const b64 = u => btoa(String.fromCharCode(...u)), unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const cat = (...parts) => { const out = new Uint8Array(parts.reduce((n, p) => n + p.length, 0)); let o = 0; for (const p of parts) { out.set(p, o); o += p.length; } return out; };
  const gzip = async (bytes, back) => new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(back ? new DecompressionStream('gzip') : new CompressionStream('gzip'))).arrayBuffer());

  async function cbDerive(pass, salt) {
    const base = await crypto.subtle.importKey('raw', te.encode(pass.normalize('NFKC')), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: CB_ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  let cbKey = null;
  const cbKeyReady = idb.get('cloudKey').then(k => { cbKey = k || null; }).catch(() => {});

  async function cbEncrypt(json) {
    let bytes = te.encode(json), flags = 0;
    if (window.CompressionStream) { bytes = await gzip(bytes); flags = 1; }
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, cbKey, bytes));
    return cat(new Uint8Array(CB_MAGIC), new Uint8Array([flags]), unb64(CB().salt), iv, ct);
  }
  // returns { data, salt, key } or throws 'not_a_backup' / 'wrong_passphrase'
  async function cbDecrypt(buf, pass) {
    const u = new Uint8Array(buf);
    if (u.length < 40 || !CB_MAGIC.every((b, i) => u[i] === b)) throw new Error('not_a_backup');
    const flags = u[4], salt = u.slice(5, 21), iv = u.slice(21, 33), key = await cbDerive(pass, salt);
    let bytes;
    try { bytes = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, u.slice(33))); } catch (e) { throw new Error('wrong_passphrase'); }
    if (flags & 1) bytes = await gzip(bytes, true);
    const payload = JSON.parse(td.decode(bytes)), data = payload && payload.data ? payload.data : payload;
    if (!valid(data)) throw new Error('not_a_backup');
    return { data, salt, key, exported: payload.exported };
  }

  let cbBusy = false;
  async function cloudBackup(manual = false) {
    await cbKeyReady;
    if (!CB().on || !cbKey || !PUSH_URL || !SV().code || cbBusy) return false;
    cbBusy = true;
    try {
      const body = await cbEncrypt(JSON.stringify({ app: 'metamorph', exported: new Date().toISOString(), data: S }));
      const res = await fetch(`${PUSH_URL}/backup?date=${today()}`, { method: 'PUT', headers: { 'Content-Type': 'application/octet-stream', 'X-Companion-Code': SV().code }, body });
      if (!res.ok) throw new Error(res.status === 401 ? 'The pairing code was refused.' : res.status === 413 ? 'Your data is too large for a cloud backup.' : `The server answered ${res.status}.`);
      CB().last = Date.now(); CB().size = body.length; CB().err = null; save();
      if (V.data) render();
      if (manual) snack('Backed up to your server');
      return true;
    } catch (e) {
      CB().err = /fetch|network|load failed/i.test(e.message) ? 'Couldn’t reach your server.' : e.message; save();
      if (V.data) render();
      if (manual) snack(`Backup failed: ${CB().err}`);
      return false;
    } finally { cbBusy = false; }
  }
  // once a day, whenever the app is in use
  const cbDue = () => CB().on && Date.now() - (CB().last || 0) > CB_EVERY;
  booted.then(() => setTimeout(() => { if (cbDue()) cloudBackup(); }, 4000));
  document.addEventListener('visibilitychange', () => { if (cbDue()) cloudBackup(); });

  async function cbTurnOn(pass) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    snack('Securing your backups…');
    cbKey = await cbDerive(pass, salt);
    await idb.set('cloudKey', cbKey);
    Object.assign(CB(), { on: true, salt: b64(salt), err: null });
    save(); render();
    await cloudBackup(true);
  }
  async function cbTurnOff() {
    cbKey = null;
    await idb.set('cloudKey', null).catch(() => {});
    Object.assign(CB(), { on: false, salt: null });
    save(); render(); snack('Cloud backup off. Backups already on your server stay for up to 30 days.');
  }

  function cloudSettings() {
    if (!PUSH_URL) return '';

    if (!c.on) return `${head}<p class="note" style="margin:0 0 6px">Every day your data is encrypted on this phone with a passphrase only you know, then saved to your server, which can’t read it. If you lose or reset your phone, restore it here. Photos and videos aren’t included (use the media backup in Body → Media).</p>
      <form id="cbonf"><div class="field"><label>Passphrase</label><input type="password" id="cbpass" autocomplete="new-password" minlength="8" placeholder="At least 8 characters"></div>

      <div class="kv"><span>Last cloud backup</span><span class="v ${c.err ? 'warn' : c.last ? 'good' : ''}">${c.last ? `${when(c.last)} · ${Math.max(1, Math.round(c.size / 1024))} KB` : 'Not yet'}</span></div>

  async function cbFetchList() {
    const res = await fetch(PUSH_URL + '/backups', { headers: { 'X-Companion-Code': SV().code } });
    if (res.status === 401) throw new Error('That pairing code was refused.');
    if (!res.ok) throw new Error('Couldn’t reach your server.');
    return (await res.json()).backups || [];
  }
  async function cbRestore(date) {
    const r = V.cbr;
    r.busy = true; r.err = null; render();
    try {
      const res = await fetch(`${PUSH_URL}/backup?date=${encodeURIComponent(date)}`, { headers: { 'X-Companion-Code': SV().code } });
      if (!res.ok) throw new Error('not_found');
      const got = await cbDecrypt(await res.arrayBuffer(), r.pass);
      const label = parseKey(date).toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
      r.busy = false; render();
      if (!(await ask({ title: 'Replace this phone’s data?', text: `Everything here will be replaced with your backup from ${label}.`, ok: 'Restore', danger: true }))) return;
      const code = SV().code;
      replaceState(got.data);
      // keep this device connected and keep backing up with the same passphrase
      S.servitor.code = code; S.onboarded = true; V.onboard = null;
      cbKey = got.key; await idb.set('cloudKey', cbKey);
      Object.assign(S.cloud, { on: true, salt: b64(got.salt), err: null });
      save(); flushIdb();
      V.cbr = null; render(); snack(`Restored your data from ${label}`);
    } catch (e) {
      r.busy = false;
      r.err = e.message === 'wrong_passphrase' ? 'That passphrase doesn’t open this backup. (If you changed it, older backups use the old one.)' : e.message === 'not_a_backup' ? 'That backup couldn’t be read.' : 'Couldn’t download that backup.';
      render();
    }
  }

  $app.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');

  });

  /* ----- media: physique and form photos/videos ----- */

  // files are kept in a separate database so the main data stays small and fast
  const mdb = (() => {
    let dbp = null;
    const open = () => dbp || (dbp = new Promise((res, rej) => {
      const q = indexedDB.open('metamorph-media', 1);
      q.onupgradeneeded = () => q.result.createObjectStore('files');
      q.onsuccess = () => { const db = q.result; db.onversionchange = () => { db.close(); dbp = null; }; res(db); };
      q.onerror = () => rej(q.error);
    }));
    const tx = (mode, fn) => open().then(db => new Promise((res, rej) => {
      const t = db.transaction('files', mode), out = fn(t.objectStore('files'));
      t.oncomplete = () => res(out && out.result);
      t.onerror = () => rej(t.error);
    }));
    return { get: id => tx('readonly', st => st.get(id)), put: (id, blob) => tx('readwrite', st => { st.put(blob, id); }), del: id => tx('readwrite', st => { st.delete(id); }) };
  })();
  const MAX_SIDE = 1600;
  // previews are kept in the media database too (not in the main save), cached here for drawing
  const thumbs = {};
  async function loadThumbs() {
    let moved = 0;
    for (const x of S.media) {

  const fmtBytes = n => n > 1e9 ? `${(n / 1e9).toFixed(1)} GB` : n > 1e6 ? `${(n / 1e6).toFixed(1)} MB` : `${Math.max(1, Math.round(n / 1e3))} KB`;

  async function shrinkPhoto(file) {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, MAX_SIDE / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));

  }

        else { const r = await shrinkPhoto(file); blob = r.blob; thumb = r.thumb; extra = { w: r.w, h: r.h }; }
        await mdb.put(id, blob);
        if (thumb) { await mdb.put('thumb:' + id, thumb); thumbs[id] = thumb; }
        S.media.push({ id, kind: isVideo ? 'video' : 'photo', type: blob.type || file.type, size: blob.size, date: meta.date, t: Date.now(),

  // the JSZip library is only loaded when backing up or restoring media
  function loadZip() {
    if (window.JSZip) return Promise.resolve(window.JSZip);
    return new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'vendor/jszip.min.js'; sc.onload = () => res(window.JSZip); sc.onerror = rej; document.head.appendChild(sc); });
  }
  async function backupMedia() {
    const total = S.media.reduce((t, x) => t + (x.size || 0), 0);
    if (total > 600e6 && !(await ask({ title: 'Large backup', text: `About ${fmtBytes(total)}. Building it may be slow on a phone. Continue?`, ok: 'Continue' }))) return;
    snack('Building media backup…');
    const JSZip = await loadZip(), zip = new JSZip(), meta = [];
    for (const x of S.media) {
      const blob = await mdb.get(x.id).catch(() => null);
      if (!blob) continue;
      const name = `media/${x.id}.${extOf(x.type)}`;
      zip.file(name, blob, { binary: true });
      meta.push({ ...x, thumb: thumbs[x.id] || x.thumb || null, file: name });
    }
    zip.file('manifest.json', JSON.stringify({ app: 'metamorph-media', exported: new Date().toISOString(), items: meta }, null, 1));
    const out = await zip.generateAsync({ type: 'blob', compression: 'STORE' });
    S.lastMediaBackup = Date.now(); save();
    const zipBlob = new Blob([out], { type: 'application/zip' });
    // building takes a moment, so ask for a fresh tap before opening the share sheet
    if (await ask({ title: 'Media backup ready', text: `${meta.length} items · ${fmtBytes(zipBlob.size)}. Save it somewhere off this phone (Drive, Files, email).`, ok: 'Save / share' }))
      deliver(zipBlob, `metamorph-media-${today()}.zip`, 'MetaMorph media backup');
  }
  async function restoreMedia(file) {
    try {
      snack('Reading backup…');
      const JSZip = await loadZip(), zip = await JSZip.loadAsync(file);
      const man = JSON.parse(await zip.file('manifest.json').async('string'));
      if (man.app !== 'metamorph-media') return snack('That isn’t a MetaMorph media backup.');
      let n = 0;
      for (const it of man.items) {
        if (S.media.some(x => x.id === it.id)) continue;
        const f = zip.file(it.file); if (!f) continue;
        const blob = new Blob([await f.async('arraybuffer')], { type: it.type });
        await mdb.put(it.id, blob);
        const { file: _, thumb: th, ...meta } = it;
        if (th) { await mdb.put('thumb:' + it.id, th); thumbs[it.id] = th; }
        S.media.push(meta); n++;
      }
      save(); render(); snack(n ? `Restored ${n} item${n === 1 ? '' : 's'}` : 'Everything in that backup is already here.');
    } catch (e) { snack('Couldn’t read that file as a media backup.'); }
  }

  /* ----- feature law ----- */

  const F = () => S.features;
  const TRIALS_NEEDED = 30;

  function lintFeature(t) {
    const x = t.trim().toLowerCase();
    if (!x) return null;
    if (/[,;&+]|\band\b/.test(x)) return { lvl: 'warn', msg: 'One feature only. A Lantern given three bearings lights none of them.' };
    const notice = /^(notice|spot|watch for|listen for|catch)\b/.test(x);
    if (!notice && (/^(be|feel|get|have|win|close|achieve|succeed|make|become|improve|stop|try|land|nail|crush|do)\b/.test(x)
        || /\b(more|less|better|good day|confident|successful|happy|productive|great)\b/.test(x)))
      return { lvl: 'warn', msg: 'That’s an outcome, and the Lantern can’t aim at outcomes. Name something you could notice: “Notice …”' };
    if (notice) return { lvl: 'ok', msg: 'Loadable: something you could notice.' };
    return { lvl: 'info', msg: 'Tip: start with “Notice” and name something you could see or hear.' };
  }

  function featureView() {

    const ar = a => a.length ? avg(a.map(x => x.check.rating)) : null;
    const ub = a => a.length ? Math.round(100 * a.filter(x => x.check.unbidden).length / a.length) : null;
    const la = ar(L), ca = ar(C);
    const enough = done.length >= TRIALS_NEEDED && L.length >= 8 && C.length >= 8;
    let verdict = '';
    if (enough) verdict = la - ca >= 0.5
      ? `<p class="hint ok">Loaded contexts are noticed more (+${(la - ca).toFixed(1)}). The Feature Law is holding for you.</p>`
      : `<p class="hint warn">No clear difference after ${done.length} trials. The book says to mark the Feature Law Speculative in your copy.</p>`;
    const lint = lintFeature(V.fDraft.text);
    return `
      <div class="card">
        <p class="label" style="margin:0">The Feature Law</p>
