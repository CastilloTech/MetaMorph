<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MetaMorph</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #0f1115;
    --surface: #171a21;
    --surface-2: #1f232c;
    --line: #2a2f3a;
    --text: #e8e6e1;
    --muted: #8b8f98;
    --accent: #c9a45c;
    --accent-ink: #1a1408;
    --focus: #c9a45c;
    --release: #6f8fb5;
    --ok: #6fae8b;
    --danger: #c46a6a;
    --radius: 14px;
  }
  @font-face { font-family: 'Cinzel'; src: url('fonts/cinzel.woff2') format('woff2'); font-weight: 400 900; font-display: swap; }
  :root { --display: 'Cinzel', 'Trajan Pro', Georgia, serif; }
  :root[data-evening] {
    --bg: #120e0b; --surface: #1b1511; --surface-2: #251d17; --line: #362a20;
    --text: #ecdfca; --muted: #a08f7a; --accent: #dca46a; --accent-ink: #1e1306; --focus: #dca46a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    /* a faint glow from above and a soft vignette give the dark some depth */
    background:
      radial-gradient(120% 60% at 50% -12%, color-mix(in srgb, #8a6bff 13%, transparent), transparent 62%),
      radial-gradient(140% 90% at 50% 120%, rgba(0,0,0,.45), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-variant-emoji: text;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }

  #app { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
  header {
    padding: calc(14px + env(safe-area-inset-top)) 16px 10px;
    display: flex; align-items: baseline; justify-content: space-between;
  }
  header h1 { font-family: var(--display); font-size: 21px; margin: 0; letter-spacing: .08em; font-weight: 700; }
  header .date { color: var(--muted); font-size: 14px; }
  main { flex: 1; padding: 4px 16px calc(96px + env(safe-area-inset-bottom)); }

  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
  }
  nav.tabs .inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  nav.tabs button { padding: 12px 2px; font-size: 14px; border-radius: 12px; color: var(--muted); font-weight: 600; transition: background .2s, color .2s; }
  nav.tabs button.on { background: var(--surface-2); color: var(--text); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .label { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; margin: 0 0 8px; }
  .muted { color: var(--muted); }
  .row { display: flex; align-items: center; gap: 12px; }
  .spread { justify-content: space-between; }
  .num { font-variant-numeric: tabular-nums; }

  .btn { padding: 14px 18px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); font-weight: 600; transition: transform .1s; }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.ghost { background: none; }
  .btn.danger { color: var(--danger); }
  .btn.block { width: 100%; }
  .btn.small { padding: 8px 12px; font-size: 14px; }
  .btn:disabled { opacity: .45; }

  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideup { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); } 50% { box-shadow: 0 0 0 6px transparent; } }

  /* ---------- orbs ---------- */
  .orb { display: block; filter: drop-shadow(0 0 10px color-mix(in srgb, var(--glow) 45%, transparent)); user-select: none; -webkit-user-drag: none; }
  .orb.spin { animation: spin 90s linear infinite; }
  .orb.enter { animation: enter .7s cubic-bezier(.2,.8,.2,1), spin 90s linear .7s infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes enter { from { opacity: 0; transform: scale(.55) rotate(-40deg); filter: drop-shadow(0 0 40px var(--glow)) brightness(1.6); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .orb.spin, .orb.enter { animation: none; } }

  .nexus { display: flex; flex-direction: column; align-items: center; margin: 4px 0 16px; text-align: center; }
  .nexus .orb { width: 150px; height: 150px; }
  .nexus .cap { margin-top: 8px; color: var(--muted); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
  .nexus .cap b { color: var(--text); font-weight: 600; }

  .gatehead { display: flex; align-items: center; gap: 16px; margin: 0 0 14px; }
  .gatehead .orb { width: 92px; height: 92px; flex: none; }
  .gatehead .nm { font-size: 22px; font-weight: 600; }
  .gatehead .sub { color: var(--muted); font-size: 14px; }

  /* ---------- calendar ---------- */
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-bottom: 16px; }
  .seg button { padding: 9px 4px; border-radius: 9px; color: var(--muted); font-weight: 600; font-size: 14px; transition: background .2s, color .2s; }
  .seg button.on { background: var(--surface-2); color: var(--text); }
  .calnav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .calnav .ttl { font-weight: 600; text-align: center; }
  .calnav .ttl small { display: block; color: var(--muted); font-weight: 400; font-size: 13px; }
  .calnav button.arrow { width: 40px; height: 40px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: 18px; }
  .linkbtn { color: var(--accent); font-size: 13px; font-weight: 600; }

  .wk { display: grid; grid-template-columns: 30px repeat(7, 1fr); gap: 6px 2px; align-items: center; }
  .wk .dh { text-align: center; font-size: 11px; color: var(--muted); padding: 6px 0; border-radius: 10px; cursor: pointer; }
  .wk .dh b { display: block; font-size: 15px; color: var(--text); font-weight: 600; }
  .wk .dh.today b { color: var(--accent); }
  .wk .dh.sel { background: var(--surface-2); }
  .wk .g .orb { width: 24px; height: 24px; filter: none; }
  .wk .c { height: 28px; display: grid; place-items: center; color: var(--line); cursor: pointer; }
  .ring { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--gcol); }
  .ring.full { background: var(--gcol); }
  .ring.part { background: linear-gradient(90deg, var(--gcol) 50%, transparent 50%); }
  .ring.miss { opacity: .3; }
  .ring.future { opacity: .35; border-style: dashed; }

  .mo { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .mo .wd { text-align: center; font-size: 11px; color: var(--muted); padding-bottom: 2px; }
  .mo .d { aspect-ratio: 1; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); padding: 5px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; min-width: 0; }
  .mo .d.blank { visibility: hidden; }
  .mo .d.today { border-color: var(--accent); }
  .mo .d.sel { background: var(--surface-2); border-color: var(--text); }
  .mo .n { font-size: 12px; color: var(--muted); }
  .mo .d.today .n { color: var(--accent); font-weight: 700; }
  .mo .bars { display: flex; gap: 2px; }
  .mo .bars i { flex: 1; height: 4px; border-radius: 2px; background: var(--gcol); }
  .mo .bars i.none { background: transparent; }
  .mo .bars i.miss { opacity: .18; }
  .mo .bars i.future { opacity: .35; }
  .mo .bars i.part { opacity: .6; }
  .legend { display: flex; gap: 14px; justify-content: center; margin: 12px 0 0; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }

  .daylist { list-style: none; margin: 0; padding: 0; }
  .daylist li { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .daylist li:first-child { border-top: 0; }
  .daylist .orb { width: 28px; height: 28px; filter: none; }
  .daylist .t { color: var(--muted); font-size: 13px; }
  .daylist .chk:disabled { opacity: .35; }

  /* ---------- today ---------- */
  .hero { border-color: var(--gc, var(--accent)); }
  .hero .top { display: flex; gap: 14px; align-items: center; }
  .hero .top .orb { width: 56px; height: 56px; flex: none; }
  .hero .when { color: var(--gc, var(--accent)); font-size: 12px; font-weight: 700; letter-spacing: .2em; }
  .hero .ti { font-size: 22px; font-weight: 600; margin: 4px 0 2px; }
  .hero .meta { color: var(--muted); font-size: 14px; }
  .hero .chain { margin: 12px 0 14px; font-size: 14px; color: var(--muted); }
  .hero .chain b { color: var(--text); font-weight: 500; }
  .hero .chain s { text-decoration: none; color: var(--ok); }

  .tl { list-style: none; margin: 8px 0 0; padding: 0; }
  .tl > li { position: relative; overflow: hidden; border-radius: 12px; }
  .tl .it { user-select: none; -webkit-user-select: none; display: grid; grid-template-columns: 66px 16px 1fr auto; gap: 10px; align-items: start; padding: 10px 0; position: relative;
            background: var(--bg); cursor: pointer; touch-action: pan-y; will-change: transform; }
  .tl .it.snap { transition: transform .25s cubic-bezier(.2,.8,.2,1); }
  .tl .it::before { content: ""; position: absolute; left: 81px; top: 0; bottom: 0; width: 2px; background: var(--line); }
  .tl > li:first-child .it::before { top: 14px; }
  .tl > li:last-child .it::before { bottom: calc(100% - 18px); }
  .tl .t { font-size: 13px; color: var(--muted); padding-top: 2px; text-align: right; }
  .tl .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--bg); border: 2px solid var(--line); margin-top: 4px; position: relative; z-index: 1; }
  .tl .it.done .dot { background: var(--ok); border-color: var(--ok); }
  .tl .it.now .dot { border-color: var(--accent); background: var(--accent); animation: pulse 2s infinite; }
  .tl .nm { font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .tl .nm .orb { width: 22px; height: 22px; filter: none; }
  .tl .sub { font-size: 13px; color: var(--muted); }
  .tl .it.done .nm { color: var(--muted); }
  .tl .st { font-size: 13px; color: var(--muted); padding-top: 2px; white-space: nowrap; }
  .tl .it.now .st { color: var(--accent); font-weight: 600; }
  .tl .it.done .st { color: var(--ok); }
  .swbg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; font-weight: 700; font-size: 14px; opacity: 0; transition: opacity .15s; }
  .swbg .l { color: #0d1a12; } .swbg .r { color: var(--text); }
  .tl > li[data-dir="r"] .swbg { opacity: 1; background: color-mix(in srgb, var(--ok) 55%, var(--bg)); }
  .tl > li[data-dir="l"] .swbg { opacity: 1; background: var(--surface-2); }
  .tl > li[data-dir="r"] .swbg .r, .tl > li[data-dir="l"] .swbg .l { visibility: hidden; }
  .tl > li.armed[data-dir="r"] .swbg { background: var(--ok); }
  .tl > li.armed[data-dir="l"] .swbg { background: var(--danger); }
  .swhint { text-align: center; color: var(--muted); font-size: 12px; margin: 6px 0 0; }

  /* ---------- slide transitions ---------- */
  @keyframes inR { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
  @keyframes inL { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
  .slide-r { animation: inR .28s cubic-bezier(.2,.8,.2,1); }
  .slide-l { animation: inL .28s cubic-bezier(.2,.8,.2,1); }
  @media (prefers-reduced-motion: reduce) { .slide-r, .slide-l { animation: none; } }

  /* ---------- update prompt ---------- */
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom)); max-width: 528px; margin: 0 auto;
           background: var(--surface-2); border: 1px solid var(--accent); border-radius: 14px; padding: 12px 12px 12px 14px;
           display: flex; align-items: center; gap: 12px; z-index: 15; box-shadow: 0 12px 30px rgba(0,0,0,.45); }
  .toast.anim { animation: rise .3s ease; }
  main.has-toast { padding-bottom: calc(180px + env(safe-area-inset-bottom)); }
  .toast .orb { width: 36px; height: 36px; flex: none; }
  .toast .msg { flex: 1; font-size: 13px; color: var(--muted); }
  .toast .msg b { display: block; font-size: 15px; color: var(--text); }
  .toast .btn { padding: 9px 12px; font-size: 14px; }
  .news { margin: 0 0 6px; padding-left: 20px; }
  .news li { margin: 6px 0; }
  .whatsnew-head { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
  .whatsnew-head .orb { width: 56px; height: 56px; }
  .whatsnew-head h2 { margin: 0; }

  /* ---------- drill ---------- */
  .orb.still { animation: none !important; filter: brightness(.72) saturate(.85); }
  .drillhero { display: flex; gap: 16px; align-items: center; }
  .drillhero .orb { width: 96px; height: 96px; flex: none; }
  .drillhero h2 { margin: 0 0 4px; font-size: 20px; }
  .bigstat { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .bigstat b { font-size: 40px; font-weight: 300; font-variant-numeric: tabular-nums; line-height: 1; }
  .delta { font-size: 13px; font-weight: 600; }
  .delta.good { color: var(--ok); }
  .delta.bad { color: var(--danger); }
  .spark { width: 100%; height: 44px; display: block; margin-top: 10px; }
  .setrow { display: grid; grid-template-columns: 84px 1fr; align-items: center; gap: 10px; margin: 0 0 10px; }
  .setrow > span { color: var(--muted); font-size: 14px; }
  .opts { display: flex; gap: 6px; flex-wrap: wrap; }
  .opts button { padding: 8px 10px; min-width: 46px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .opts button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  details.how summary { cursor: pointer; color: var(--muted); font-size: 14px; list-style: none; }
  details.how summary::-webkit-details-marker { display: none; }
  details.how ol { margin: 10px 0 0; padding-left: 20px; color: var(--muted); font-size: 14px; }
  details.how li { margin: 6px 0; }
  .run.drillrun .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
  .run.drillrun .orb { width: 210px; height: 210px; }
  .run.drillrun .legend2 { color: var(--muted); font-size: 13px; text-align: center; line-height: 1.7; }
  .tapzone { width: 100%; height: 132px; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: 17px; font-weight: 600; position: relative; overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  .tapzone .rip { position: absolute; inset: 0; background: var(--text); opacity: 0; pointer-events: none; }
  .tapzone.hit .rip { animation: rip .35s ease-out; }
  @keyframes rip { from { opacity: .12; } to { opacity: 0; } }
  .lat { display: flex; align-items: flex-end; gap: 4px; height: 70px; margin: 14px 0 4px; }
  .lat i { flex: 1; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 3px; opacity: .85; }
  .lat i.miss { background: transparent; border: 1px dashed var(--danger); opacity: .6; height: 100%; }
  .stats4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; text-align: center; }
  .stats4 b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stats4 span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

  /* ---------- water ---------- */
  :root { --water: #2fd3c6; }
  .vessel-wrap { display: grid; grid-template-columns: 116px 1fr; gap: 18px; align-items: center; }
  .vessel { position: relative; height: 230px; border: 2px solid var(--line); border-top: 0; border-radius: 0 0 26px 26px; overflow: hidden; background: var(--surface-2); }
  .vessel .fill { position: absolute; left: 0; right: 0; bottom: 0; transition: height .7s cubic-bezier(.2,.8,.2,1);
                  background: linear-gradient(180deg, color-mix(in srgb, var(--water) 80%, white), var(--water) 35%, color-mix(in srgb, var(--water) 65%, black)); }
  .vessel .fill::before { content: ""; position: absolute; left: -20%; right: -20%; top: -6px; height: 12px; background: color-mix(in srgb, var(--water) 65%, white); border-radius: 50%; opacity: .55; }
  .vessel .pace { position: absolute; left: 0; right: 0; height: 0; border-top: 2px dashed var(--text); opacity: .75; }
  .vessel .pace span { position: absolute; right: 6px; top: -17px; font-size: 10px; letter-spacing: .12em; color: var(--text); }
  .wbig { font-size: 34px; font-weight: 300; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .wbig small { font-size: 15px; color: var(--muted); }
  .pill { display: inline-block; padding: 5px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--surface-2); color: var(--muted); margin-top: 8px; }
  .pill.ok { background: color-mix(in srgb, var(--ok) 22%, var(--surface)); color: var(--ok); }
  .pill.behind { background: color-mix(in srgb, var(--accent) 22%, var(--surface)); color: var(--accent); }
  .pill.ahead { background: color-mix(in srgb, var(--water) 20%, var(--surface)); color: var(--water); }
  .quick { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .quick .btn { padding: 12px 6px; }
  .btn.water { background: var(--water); border-color: var(--water); color: #04201d; }
  .custom { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 8px; }
  .custom input, .wrow input { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; width: 100%; }
  .sched { list-style: none; margin: 0; padding: 0; }
  .sched li { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 15px; color: var(--muted); }
  .sched li:first-child { border-top: 0; }
  .sched .d { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); }
  .sched li.done .d { background: var(--water); border-color: var(--water); }
  .sched li.next { color: var(--text); font-weight: 600; }
  .sched li.next .d { border-color: var(--water); }
  .wlog { list-style: none; margin: 0; padding: 0; }
  .wlog li { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .wlog li:first-child { border-top: 0; }
  .wlog button { color: var(--muted); padding: 4px 8px; }
  .week7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; height: 110px; margin-top: 8px; }
  .week7 .col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .week7 .bw { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; position: relative; }
  .week7 .b { width: 100%; max-width: 26px; border-radius: 6px 6px 2px 2px; background: color-mix(in srgb, var(--water) 40%, var(--surface-2)); min-height: 2px; }
  .week7 .b.hit { background: var(--water); }
  .week7 .tl2 { position: absolute; left: -3px; right: -3px; border-top: 1px dashed var(--muted); opacity: .6; }
  .week7 .lbl { font-size: 11px; color: var(--muted); }
  .week7 .lbl.today { color: var(--water); font-weight: 700; }
  .wrow { display: grid; grid-template-columns: 1fr 1fr 40px; gap: 8px; align-items: center; margin-bottom: 8px; }
  .wrow button { height: 40px; border-radius: 10px; background: var(--surface-2); color: var(--muted); }
  .drop { width: 22px; height: 22px; display: block; margin: 0 auto; flex: none; }
  .toast .drop { width: 32px; height: 32px; }
  .toast.watert { border-color: var(--water); }

  /* ---------- feature law ---------- */
  .lawq { font-size: 15px; line-height: 1.5; margin: 6px 0 0; color: var(--muted); }
  .lawq b { color: var(--text); font-weight: 600; }
  .hint { font-size: 13px; margin: 6px 0 0; min-height: 18px; }
  .hint.warn { color: var(--accent); }
  .hint.ok { color: var(--ok); }
  .hint.info { color: var(--muted); }
  .flist { list-style: none; margin: 0; padding: 0; }
  .flist li { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .flist li:first-child { border-top: 0; }
  .flist .ctx { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .flist .txt { font-weight: 600; }
  .mtag { font-size: 10px; padding: 2px 7px; border-radius: 999px; background: var(--surface-2); color: var(--muted); margin-left: 6px; font-weight: 700; letter-spacing: .06em; }
  .mtag.ctl { color: var(--release); }
  .cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .cmp > div { background: var(--surface-2); border-radius: 12px; padding: 12px; text-align: center; }
  .cmp b { display: block; font-size: 26px; font-weight: 300; font-variant-numeric: tabular-nums; }
  .cmp span { font-size: 12px; color: var(--muted); }
  .prog { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin-top: 12px; }
  .prog i { display: block; height: 100%; background: var(--accent); }
  .holdtext { font-size: 26px; font-weight: 600; max-width: 20ch; line-height: 1.3; }
  .checkrow { display: flex; gap: 10px; align-items: center; margin: 10px 0 14px; font-size: 14px; color: var(--muted); }
  .checkrow input { width: 18px; height: 18px; accent-color: var(--accent); }

  /* ---------- routine clock ---------- */
  :root { --late: #f0a05a; }
  .late, .tag.late, .tl .st.late { color: var(--late) !important; }
  .clockbar { display: flex; gap: 3px; margin: 14px 0 6px; }
  .clockbar > span { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; min-width: 6px; }
  .clockbar > span > i { display: block; height: 100%; width: 0; background: var(--gc, var(--accent)); transition: width 1s linear; }
  .clockbar > span.done > i { width: 100% !important; background: var(--ok); }
  .clockbar.over > span:not(.done) > i { background: var(--late); }
  .clockbar.thin { margin: 6px 0 2px; }
  .clockbar.thin > span { height: 4px; }
  .cleft { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cleft.over { color: var(--late); font-weight: 600; }
  .hero .chain { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 0; }
  .stepchip { padding: 6px 11px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-size: 13px; color: var(--text); }
  .stepchip.done { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
  .chain .arrow { color: var(--muted); margin: 0 5px; }
  .tl .dot.sq { border-radius: 4px; }
  .tl .it.todo .nm { font-weight: 500; }
  .tl .it.todo.done .nm { text-decoration: line-through; }

  /* ---------- to-do ---------- */
  .todos { list-style: none; margin: 0; padding: 0; }
  .todos li { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .todos li:first-child { border-top: 0; }
  .todos .tx { cursor: pointer; min-width: 0; }
  .todos .tx > div:first-child { overflow-wrap: anywhere; }
  .todos li.done .tx > div:first-child { color: var(--muted); text-decoration: line-through; }
  .todos .t { font-size: 13px; color: var(--muted); }
  .todos .t.overdue { color: var(--late); }
  .todos .x { color: var(--muted); padding: 6px 8px; }
  .grouphead { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 0 8px; }
  .grouphead h3 { margin: 0; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .grouphead.overdue h3 { color: var(--late); }

  /* ---------- nutrition ---------- */
  .sechead { display: flex; justify-content: space-between; align-items: baseline; margin: 22px 0 10px; }
  .sechead h3 { margin: 0; font-size: 18px; }
  .mac { margin-bottom: 12px; font-size: 14px; }
  .mac:last-child { margin-bottom: 0; }
  .mbar { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; margin-top: 5px; }
  .mbar i { display: block; height: 100%; background: var(--gc, var(--accent)); border-radius: 4px; transition: width .5s; }
  .mbar i.over { background: var(--late) !important; }
  .meal + .meal { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .flog, .foodlist { list-style: none; margin: 8px 0 0; padding: 0; }
  .flog li, .foodlist li { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .flog li:first-child, .foodlist li:first-child { border-top: 0; }
  .flog .t, .foodlist .t { font-size: 12px; color: var(--muted); }
  .flog button { color: var(--muted); padding: 4px 8px; }
  .foodlist { max-height: 46vh; max-height: 46dvh; overflow-y: auto; overscroll-behavior: contain; }
  .search { width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .qty { display: inline-flex; align-items: center; gap: 10px; }
  .qty button { width: 34px; height: 34px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); font-size: 18px; }
  .qty b { min-width: 34px; text-align: center; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .grid4 .field input { padding: 10px 8px; }
  .ing { border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 8px; display: grid; gap: 8px; }
  .ing .top { display: grid; grid-template-columns: 1fr 40px; gap: 8px; }
  .ing input, .sheet select { width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 8px; color: var(--text); }
  .ing .top button { border-radius: 10px; background: var(--surface-2); color: var(--muted); }
  .ing .grid4 input { text-align: center; }
  .ing .lbls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; font-size: 11px; color: var(--muted); text-align: center; margin-bottom: -4px; }
  .preptot { background: var(--surface-2); border-radius: 12px; padding: 12px; font-size: 14px; margin: 6px 0 12px; }

  /* ---------- workouts ---------- */
  .woex { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
  .woex .t { font-size: 12px; color: var(--muted); margin: 2px 0 8px; }
  .woex .x, .sets .x { color: var(--muted); padding: 4px 8px; }
  .sets { display: grid; grid-template-columns: 30px 1fr 1fr 34px; gap: 6px 8px; align-items: center; margin-bottom: 8px; }
  .sets > span { font-size: 11px; color: var(--muted); text-align: center; text-transform: uppercase; letter-spacing: .06em; }
  .sets > span.n { font-size: 14px; letter-spacing: 0; }
  .sets input { width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px; text-align: center; font-variant-numeric: tabular-nums; }
  .wo textarea { width: 100%; margin-top: 10px; min-height: 52px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; resize: vertical; }
  .wohist .line { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .wohist .line b { color: var(--text); font-weight: 600; }
  .pr { font-size: 10px; font-weight: 700; letter-spacing: .08em; color: #1a1408; background: var(--accent); border-radius: 999px; padding: 2px 7px; margin-left: 6px; }

  /* ---------- food lookup / scanner ---------- */
  .offres li { cursor: default; }
  .scanner { position: fixed; inset: 0; z-index: 40; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 20px; }
  .scanner video { width: 100%; max-width: 480px; border-radius: 16px; background: #111; }
  .scanner .frame { position: relative; width: 100%; max-width: 480px; }
  .scanner .frame::after { content: ""; position: absolute; left: 12%; right: 12%; top: 50%; height: 2px; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  .scanner p { color: #ddd; margin: 0; text-align: center; }

  /* ---------- supplies ---------- */
  .sup li { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; }
  .sup .nm { cursor: pointer; min-width: 0; }
  .sup .nm > div:first-child { overflow-wrap: anywhere; }
  .sup .t { font-size: 12px; color: var(--muted); }
  .sup .up { color: var(--danger); } .sup .down { color: var(--ok); }
  .sup .acts2 { display: flex; gap: 6px; grid-column: 2; flex-wrap: wrap; }
  .sup .acts2 .btn { padding: 7px 10px; font-size: 13px; }
  .sup .btn.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .sumrow { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--line); margin-top: 8px; padding-top: 10px; }
  .sumrow b { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .wm { color: #ffc220; }
  a.btn { color: var(--text); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }

  /* ---------- header + data sheet ---------- */
  header .right { display: flex; align-items: center; gap: 10px; }
  .iconbtn { position: relative; width: 34px; height: 34px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: 16px; display: grid; place-items: center; }
  .iconbtn .badge { position: absolute; top: -3px; right: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg); }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .kv:first-of-type { border-top: 0; }
  .kv .v { color: var(--muted); text-align: right; }
  .kv .v.good { color: var(--ok); }
  .kv .v.warn { color: var(--accent); }
  .stack { display: grid; gap: 8px; margin-top: 14px; }
  .note { color: var(--muted); font-size: 13px; margin: 12px 0 0; line-height: 1.5; }

  /* ---------- gates ---------- */
  .gatebar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-bottom: 14px; }
  .gatebar button { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 4px; text-align: center; transition: border-color .2s, background .2s; }
  .gatebar button.on { border-color: var(--gc); background: var(--surface-2); }
  .gatebar .orb { width: 40px; height: 40px; margin: 0 auto 2px; filter: none; transition: transform .25s, filter .25s; }
  .gatebar button.on .orb { transform: scale(1.12); filter: drop-shadow(0 0 8px var(--glow)); }
  .gatebar .nm { font-size: 12px; font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; }
  .gatebar .ct { font-size: 12px; color: var(--muted); display: block; }

  .rhead { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
  .chk { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; font-size: 16px; transition: background .2s, border-color .2s; }
  .chk.done { background: var(--ok); border-color: var(--ok); color: #0d1a12; }
  .rhead .t { color: var(--muted); font-size: 14px; }
  .rhead .ti { font-weight: 600; font-size: 17px; }
  .card.now { border-color: var(--gc, var(--accent)); }
  .tag { font-size: 11px; color: var(--accent); letter-spacing: .1em; text-transform: uppercase; margin-left: 6px; }

  .chainlist { list-style: none; margin: 12px 0 0; padding: 12px 0 0 0; border-top: 1px solid var(--line); }
  .chainlist li { display: grid; grid-template-columns: 66px 12px 1fr auto; gap: 10px; align-items: center; font-size: 14px; padding: 3px 0; position: relative; }
  .chainlist li + li::before { content: ""; position: absolute; left: 81px; top: -8px; height: 14px; width: 2px; background: var(--line); }
  .chainlist .t { color: var(--muted); text-align: right; font-size: 13px; }
  .chainlist .d { width: 8px; height: 8px; border-radius: 50%; background: var(--line); margin-left: 2px; }
  .chainlist li.done .d { background: var(--ok); }
  .chainlist .m { color: var(--muted); font-size: 13px; }
  .acts { display: flex; gap: 8px; margin-top: 12px; }
  .acts .btn { flex: 1; }

  /* ---------- drill ---------- */
  .stepper { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .step { background: var(--surface-2); border-radius: 12px; padding: 10px; text-align: center; }
  .step .v { font-size: 22px; font-weight: 600; }
  .step .k { font-size: 12px; color: var(--muted); }
  .step .pm { display: flex; justify-content: space-between; margin-top: 6px; }
  .step .pm button { width: 32px; height: 32px; border-radius: 8px; background: var(--surface); font-size: 18px; }
  .hist { list-style: none; margin: 0; padding: 0; }
  .hist li { display: flex; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .hist li:first-child { border-top: 0; }

  /* ---------- run screen ---------- */
  .run { position: fixed; inset: 0; background: var(--bg); z-index: 20; display: flex; flex-direction: column;
         padding: calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom)); animation: fade .25s ease; }
  .run .inner { max-width: 560px; width: 100%; margin: 0 auto; flex: 1; display: flex; flex-direction: column; }
  .run .top { display: flex; justify-content: space-between; align-items: center; color: var(--muted); gap: 12px; }
  .run .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; animation: rise .35s ease; }
  .phase { font-size: 15px; letter-spacing: .3em; font-weight: 700; }
  .clock { font-size: 84px; font-weight: 300; font-variant-numeric: tabular-nums; line-height: 1; }
  .instr { color: var(--muted); max-width: 30ch; font-size: 17px; }
  .ritual { font-size: 22px; max-width: 24ch; line-height: 1.35; }
  .stepname { font-size: 30px; font-weight: 600; max-width: 18ch; line-height: 1.2; }
  .bigtap { width: 100%; padding: 26px; border-radius: 18px; font-size: 20px; font-weight: 700; }
  .bigtap.lock { background: var(--focus); color: var(--accent-ink); }
  .bigtap.catch { background: var(--surface-2); border: 1px solid var(--line); }
  .bigtap.wait { background: none; border: 1px dashed var(--line); color: var(--muted); }
  .bar { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; width: 100%; }
  .bar > i { display: block; height: 100%; background: currentColor; width: 0; }
  .dots { display: flex; gap: 6px; justify-content: center; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--surface-2); }
  .dots i.on { background: var(--muted); }
  .dots i.now { background: var(--text); }
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .controls.one { grid-template-columns: 1fr; }

  .segs { display: flex; gap: 4px; margin: 14px 0 0; }
  .segs > span { height: 5px; border-radius: 3px; background: var(--surface-2); overflow: hidden; min-width: 8px; }
  .segs > span > i { display: block; height: 100%; width: 0; background: var(--gc, var(--accent)); }
  .segs > span.done > i { width: 100%; background: var(--ok); }
  .segs > span.over > i { width: 100% !important; background: var(--late); }
  .clock.late { color: var(--late); }
  .latebars { display: grid; gap: 6px; width: 100%; max-width: 420px; }
  .latebar { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 8px 8px 8px 14px; border-radius: 12px;
             background: color-mix(in srgb, var(--late) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--late) 45%, var(--line)); text-align: left; font-size: 14px; }
  .latebar b { color: var(--late); font-variant-numeric: tabular-nums; }
  .latebar .btn { padding: 7px 12px; font-size: 13px; }
  .recap .ot { color: var(--late); font-variant-numeric: tabular-nums; }
  .seglabels { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 8px; }
  .run .orb { width: 150px; height: 150px; margin-bottom: 6px; }
  .autonext { font-size: 15px; color: var(--muted); }
  .autonext b { color: var(--text); font-variant-numeric: tabular-nums; }
  .autoring { width: 64px; height: 64px; }
  .autoring circle { fill: none; stroke-width: 5; }
  .autoring .bg { stroke: var(--surface-2); }
  .autoring .fg { stroke: var(--gc, var(--accent)); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
  .check { width: 64px; height: 64px; border-radius: 50%; background: var(--ok); color: #0d1a12; display: grid; place-items: center; font-size: 30px; }
  .upnext { color: var(--muted); font-size: 12px; letter-spacing: .25em; font-weight: 700; margin-top: 18px; }
  .recap { list-style: none; padding: 0; margin: 4px 0 0; color: var(--muted); font-size: 15px; }
  .recap li::before { content: "✓  "; color: var(--ok); }

  /* ---------- sheet ---------- */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
  .sheet-bg.enter { animation: fade .2s ease; }
  .sheet-bg.enter .sheet { animation: slideup .28s cubic-bezier(.2,.8,.2,1); }
  .sheet { background: var(--surface); border-top-left-radius: 20px; border-top-right-radius: 20px; width: 100%; max-width: 560px;
           max-height: 92vh; max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); }
  .sheet h2 { margin: 0 0 14px; font-size: 18px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .field input, .srow input {
    width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px;
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .srow { border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 8px; display: grid; gap: 8px; }
  .srow .top { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: center; }
  .srow .hm { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .srow .hm label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip { position: relative; }
  .chip input { position: absolute; opacity: 0; pointer-events: none; }
  .chip span { display: block; min-width: 40px; text-align: center; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); font-size: 14px; cursor: pointer; }
  .chip input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .chips.days .chip span { min-width: 0; width: 38px; padding: 8px 0; }
  .rep .tag { margin-left: 0; }
  .srow .n { width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 13px; color: var(--muted); }
  .srow input { padding: 10px; }
  .srow .tools { display: flex; gap: 6px; justify-content: flex-end; }
  .srow .tools button { padding: 6px 10px; border-radius: 8px; background: var(--surface-2); font-size: 14px; color: var(--muted); }
  .srow .tools button:disabled { opacity: .35; }
  .total { color: var(--muted); font-size: 14px; margin: 4px 0 14px; }

  /* ---------- mobile ---------- */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
  .sheet { scroll-padding-bottom: 24px; }
  /* no pull-to-refresh or rubber-band behind the app */
  body { overscroll-behavior-y: none; }
  /* taps respond immediately (no double-tap-zoom delay) */
  button, a, label, input, select, textarea, [data-act] { touch-action: manipulation; }
  button, .btn, nav.tabs, .seg, .opts, .chip, .stepchip { -webkit-user-select: none; user-select: none; }
  /* 16px+ text in fields stops iPhone zooming in when you tap them */
  input, select, textarea { font-size: 16px; }
  .orb { -webkit-touch-callout: none; pointer-events: none; }
  header, main { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }

  /* press feedback, since the default tap highlight is off */
  .opts button:active, .seg button:active, nav.tabs button:active, .chip span:active, .stepchip:active,
  .gatebar button:active, .iconbtn:active, .chk:active, .x:active, .qty button:active { transform: scale(.96); }
  .tl .it:not(.locked):active, .daylist li:active, .todos .tx:active, .sup .nm:active { opacity: .7; }
  .opts button, .seg button, nav.tabs button, .chip span, .stepchip, .gatebar button, .iconbtn, .chk, .qty button { transition: transform .08s, background .2s, color .2s; }

  /* touch screens: every control at least ~44px tall */
  @media (pointer: coarse) {
    .btn { min-height: 44px; }
    .btn.small { min-height: 44px; padding: 10px 14px; }
    .opts button, .seg button { min-height: 44px; }
    .chip span { min-height: 44px; display: flex; align-items: center; justify-content: center; }
    .chips.days .chip span { width: 42px; }
    .stepchip { min-height: 40px; padding: 8px 13px; }
    .iconbtn { width: 44px; height: 44px; }
    .chk { width: 34px; height: 34px; position: relative; }
    .chk::after { content: ""; position: absolute; inset: -6px; }
    .x, .todos .x, .flog button, .wlog button, .woex .x, .sets .x { min-width: 44px; min-height: 44px; }
    .srow .tools button { min-width: 44px; min-height: 40px; }
    .qty button { width: 44px; height: 44px; }
    .checkrow { min-height: 44px; }
    .acts2 .btn, .latebar .btn { min-height: 42px; min-width: 42px; }
    .linkbtn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; min-width: 44px; padding: 0 6px; margin: -12px -6px; }
    .tapzone { height: 150px; }
  }

<script>
(() => {
  'use strict';

  /* ---------- data ---------- */

  const GATES = [
    { id: 'sleep',     name: 'Sleep',     color: '#a66bff' },
    { id: 'fitness',   name: 'Fitness',   color: '#ff5a3c' },

  const orb = (id, size, cls = '') =>

    10: [

    ],
    8: [

      'Feature: the Feature Law, with a phrasing check, a 30-second hold, check-ins and control trials',

    7: [

  const step = (title, minutes, work = '') => ({ id: uid(), title, minutes, work });
  const routine = (title, start, steps, repeat = { type: 'daily' }) => ({ id: uid(), title, start, steps, repeat });

  function seed() {
    return {
      v: 2,
      gates: {
        sleep: [
          routine('Night routine', '22:00', [step('Tidy the room', 10), step('Wind-down', 20, 'No screens. Let the day go.')]),

      for (const g of Object.keys(s.gates)) {

    return s;

  function monthView() {

  function dayView() {
    const items = allRoutines(), k = today();
    const timed = S.todos.filter(x => x.date === k && x.time);
    const loose = S.todos.filter(x => !x.done && x.date && (x.date < k || (x.date === k && !x.time)));

              <div class="sub">${r.steps.length > 1 ? r.steps.map(x => esc(x.title)).join(' → ') + ' · ' : ''}${dur(total(r))}</div>

  // after a routine is finished today: was that the last one for its Gate, or for every Gate?
  function checkHeld(r, k = today()) {
    if (k !== today()) return;
    const g = GATES.find(x => S.gates[x.id].some(y => y.id === r.id));
    if (!g || g.other) return;
    const d = pdayDate(), gd = gateDay(g.id, d);
    if (!gd.n || gd.held < gd.n) return;
    const gates = activeGates().filter(x => !x.other).map(x => gateDay(x.id, d)).filter(x => x.n);
    const all = gates.length > 1 && gates.every(x => x.held >= x.n);
    const key = k + (all ? ':all' : ':' + g.id);
    if (celebrated.has(key)) return;
    celebrated.add(key);
    setTimeout(() => celebrate(all ? 'all' : 'gate', all ? 'chaos' : g.id), 260);
  }
