      setFin(r.id, Date.now(), run.key); save();
      run.phase = 'complete';
      run.next = nextRoutine();
      run.autoAt = run.next && run.next.auto ? Date.now() + AUTO_MS : null;
      beep(660, 0.6);
    } else {
      run.phase = 'between';
      run.autoAt = Date.now() + AUTO_MS;
      beep(660, 0.3);
    }
    saveRun();
    renderRun();
  }

  // A step's time ran out. If another step follows, it starts now and the unfinished one stays open,
  // counting overtime until it's marked done. The last step has nowhere to go, so it runs over in place.
  function timeUp() {
    const r = findRoutine(run.gate, run.rid);
    if (run.idx < r.steps.length - 1) {
      run.open = run.open || [];
      run.open.push({ id: r.steps[run.idx].id, end: run.end });
      beep(440, 0.4, 0);
      beginStep(run.idx + 1);
    } else {
      run.over = true;
      beep(440, 0.5);
      saveRun();
      renderRun();
    }
  }
  // close a late step, recording how far past its time it ran
  function closeLate(o) {
    run.late = run.late || {};
    run.late[o.id] = Math.round((Date.now() - o.end) / 1000);
    setDone(o.id, true, run.key);
    run.open = (run.open || []).filter(x => x.id !== o.id);
  }

  const AUTO_MS = 5000;              // countdown before the next step or routine starts by itself
  const CHAIN_WINDOW = 15 * 60000;   // only auto-start a routine due within this long

  // the next undone routine on today's timeline after the one just finished
  function nextRoutine() {
    const cur = findRoutine(run.gate, run.rid);
    const items = allRoutines().filter(x => x.r.id !== run.rid && !isDone(x.r.id) && toMin(x.r.start) >= toMin(cur.start));
    if (!items.length) return null;
    const x = items[0], startAt = windowOf(x.r).start;
    return { gate: x.gate, id: x.r.id, title: x.r.title, start: x.r.start, auto: startAt - Date.now() <= CHAIN_WINDOW };
  }

  function autoRing() {
    const C = 2 * Math.PI * 28;
    return `<svg class="autoring" viewBox="0 0 64 64" aria-hidden="true"><circle class="bg" cx="32" cy="32" r="28"/><circle class="fg" id="autofg" cx="32" cy="32" r="28" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg>`;
  }

  function endRun() {
    run = null;
    saveRun();
    stopTicker(); unlockScreen();
    render();
  }

  // finish this run and start the next routine on the timeline
  function chainNext() {
    const nx = run && run.next;
    if (!nx || !findRoutine(nx.gate, nx.id)) return endRun();
    run = null;
    startRoutine(nx.gate, nx.id);
  }

  const runLeft = () => run.paused ? run.remaining : run.end - Date.now();

  function renderRun() {
    const r = findRoutine(run.gate, run.rid);
    if (!r) return endRun();
    const g = gateOf(run.gate), s = r.steps[run.idx], next = r.steps[run.idx + 1];

    const segs = `<div class="segs">${r.steps.map((x, i) =>
      `<span class="${(run.phase === 'step' && i === run.idx && run.over) || (run.open || []).some(o => o.id === x.id) ? 'over' : isDone(x.id, run.key) && !(run.phase === 'step' && i === run.idx) ? 'done' : ''}" style="flex:${x.minutes}"><i ${i === run.idx && run.phase === 'step' ? 'id="seg"' : ''}></i></span>`).join('')}</div>
      <div class="seglabels"><span>${esc(r.title)}</span><span class="num">${run.phase === 'complete' ? r.steps.length : run.idx + 1}/${r.steps.length}</span></div>`;

    let center, controls;
    if (run.phase === 'step') {
      center = `
        ${(run.open || []).length ? `<div class="latebars">${run.open.map(o => {
          const st = r.steps.find(x => x.id === o.id);
          return `<div class="latebar"><span>${esc(st ? st.title : 'Step')}</span><b data-late-from="${o.end}">late +${mmss((Date.now() - o.end) / 1000)}</b><button class="btn" data-act="r-late-done" data-id="${o.id}">Done</button></div>`;
        }).join('')}</div>` : ''}
        ${orb(run.gate, (run.open || []).length ? 110 : 150, run.entered ? 'spin' : 'enter')}
        <div class="phase" style="color:${run.over ? 'var(--late)' : g.color}">STEP ${run.idx + 1}${run.over ? ' · LATE' : ''}</div>
        <div class="stepname">${esc(s.title)}</div>
        ${s.work ? `<div class="instr">${esc(s.work)}</div>` : ''}
        <div class="clock ${run.over ? 'late' : ''}" id="clock" style="font-size:72px;margin-top:10px">${run.over ? '+' + mmss(-runLeft() / 1000) : mmss(runLeft() / 1000)}</div>
        ${next ? `<div class="muted" style="font-size:14px">then ${esc(next.title)} · ${dur(next.minutes)}</div>` : ''}`;
      // in overtime the only way forward is Done
      controls = run.over
        ? `<div class="controls one"><button class="btn primary" data-act="r-done">Done</button></div>`
        : `<div class="controls">
          <button class="btn" data-act="r-pause">${run.paused ? 'Resume' : 'Pause'}</button>
          <button class="btn primary" data-act="r-done">Done</button>
        </div>`;
    } else if (run.phase === 'between') {
      const nx = r.steps[run.idx + 1];
      center = `
        ${run.autoAt ? autoRing() : '<div class="check">✓</div>'}
        <div class="muted">${esc(s.title)} done</div>
        <div class="upnext">UP NEXT</div>
        <div class="stepname">${esc(nx.title)}</div>
        <div class="muted num">${dur(nx.minutes)}${nx.work ? ` · ${esc(nx.work)}` : ''}</div>
        ${run.autoAt ? `<div class="autonext">Starts in <b id="autoleft">${Math.ceil((run.autoAt - Date.now()) / 1000)}</b>s</div>` : ''}`;
      controls = run.autoAt
        ? `<div class="controls"><button class="btn" data-act="r-hold">Hold</button><button class="btn primary" data-act="r-next">Start now</button></div>`
        : `<div class="controls"><button class="btn" data-act="r-end">End here</button><button class="btn primary" data-act="r-next">Start</button></div>`;
    } else {
      const nx = run.next;
      center = `
        ${orb(run.gate, 150, 'spin')}
        <div class="phase" style="color:${g.color}">${g.other ? 'DONE' : 'GATE HELD'}</div>
        <div class="stepname">${esc(r.title)}</div>
        <ul class="recap">${r.steps.map(x => `<li>${esc(x.title)}${run.late && run.late[x.id] ? ` <span class="ot">· late +${mmss(run.late[x.id])}</span>` : ''}</li>`).join('')}</ul>
        ${nx ? `<div class="upnext">NEXT ROUTINE</div>
          <div style="font-size:20px;font-weight:600">${esc(nx.title)} <span class="muted" style="font-weight:400;font-size:15px">· ${gateOf(nx.gate).name} · ${clock(nx.start)}</span></div>
          ${run.autoAt ? `<div class="autonext">Starts in <b id="autoleft">${Math.ceil((run.autoAt - Date.now()) / 1000)}</b>s</div>` : ''}` : ''}`;
      if (nx && run.autoAt) controls = `<div class="controls"><button class="btn" data-act="r-close">Stop here</button><button class="btn primary" data-act="r-chain">Start now</button></div>`;
      else if (nx) controls = `<div class="controls"><button class="btn" data-act="r-close">Close</button><button class="btn primary" data-act="r-chain">Start early</button></div>`;
      else controls = `<div class="controls one"><button class="btn primary" data-act="r-close">Close</button></div>`;
    }

    $app.innerHTML = `
      <div class="run" style="--gc:${g.color}"><div class="inner">
        <div class="top"><span style="color:${g.color}">${g.name}</span>
          ${run.phase === 'complete' ? '<span></span>' : '<button class="btn small ghost" data-act="r-exit">Exit</button>'}</div>
        ${segs}
        <div class="center">${center}</div>
        ${controls}
      </div></div>`;
    run.entered = true;
    tick();
  }

  /* ----- drill ----- */

  const DRILL_OPTS = { focus: [20, 30, 45, 60], release: [20, 30, 45, 60], rounds: [5, 8, 10, 12], jitter: [0, 5, 8, 12] };
  const sessAvg = x => { const ok = x.latencies.filter(v => v != null); return ok.length ? avg(ok) : null; };

  // Phase changes are announced by sound and vibration only, so the screen gives nothing away.
  function cueReturn() {   // rising pair: come back to the orb
    beep(660, 0.12, 0); setTimeout(() => beep(990, 0.2, 0), 130);
    try { navigator.vibrate && navigator.vibrate([40, 60, 40]); } catch (e) {}
  }
  function cueRelease() {  // single low tone: let go
    beep(330, 0.4, 0);
    try { navigator.vibrate && navigator.vibrate(220); } catch (e) {}
  }

  function spark(vals) {
    if (vals.length < 2) return '';
    const Wd = 300, H = 44, mx = Math.max(...vals), mn = Math.min(...vals), rng = mx - mn || 1;
    const pts = vals.map((v, i) => `${(i / (vals.length - 1)) * Wd},${4 + (1 - (v - mn) / rng) * (H - 8)}`).join(' ');
    return `<svg class="spark" viewBox="0 0 ${Wd} ${H}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
  }

  function drillView() {
    const d = S.drill;
    if (V.summary) return drillSummary(V.summary);
    const ss = d.sessions, avgs = ss.map(sessAvg).filter(x => x != null);
    const recent = avgs.slice(-7), prior = avgs.slice(-14, -7);
    const ra = recent.length ? avg(recent) : null, pa = prior.length ? avg(prior) : null;
    const delta = ra != null && pa != null ? ra - pa : null;
    const est = Math.max(1, Math.round((d.rounds * d.focus + (d.rounds - 1) * d.release + 6) / 60));
    const opt = (k, v, label) => `<button data-act="dset" data-k="${k}" data-v="${v}" class="${d[k] === v ? 'on' : ''}">${label}</button>`;
    return `
      <div class="card"><div class="drillhero">${orb('chaos', 96, 'still')}<div>
        <h2>Switch Drill</h2>
        <p class="muted" style="margin:0;font-size:14px">Hold the orb. Let it go. Come back on the chime. The skill is the return.</p>
      </div></div></div>
      <div class="card">
        <p class="label">Recovery latency${recent.length ? ` · last ${recent.length}` : ''}</p>
        <div class="bigstat"><b>${ra == null ? '—' : ra.toFixed(1)}</b><span class="muted">sec</span>
          ${delta == null ? '' : `<span class="delta ${delta <= 0 ? 'good' : 'bad'}">${delta <= 0 ? '↓' : '↑'} ${Math.abs(delta).toFixed(1)}s vs previous ${prior.length}</span>`}</div>
        ${spark(avgs.slice(-20))}
        <p class="muted" style="margin:6px 0 0;font-size:12px">${avgs.length ? 'Lower is better. It should shorten over weeks.' : 'No sessions yet.'}</p>
      </div>
      <div class="card">
        <div class="setrow"><span>Focus</span><div class="opts">${DRILL_OPTS.focus.map(v => opt('focus', v, v + 's')).join('')}</div></div>
        <div class="setrow"><span>Release</span><div class="opts">${DRILL_OPTS.release.map(v => opt('release', v, v + 's')).join('')}</div></div>
        <div class="setrow"><span>Randomize</span><div class="opts">${DRILL_OPTS.jitter.map(v => opt('jitter', v, v ? '±' + v + 's' : 'Off')).join('')}</div></div>
        <div class="setrow" style="margin:0"><span>Rounds</span><div class="opts">${DRILL_OPTS.rounds.map(v => opt('rounds', v, v)).join('')}</div></div>
        <p class="muted" style="margin:12px 0 0;font-size:13px">About ${est} min. ${d.jitter ? 'Release length varies, so the return chime can’t be anticipated.' : 'Fixed timing: you may start anticipating the chime, which flatters your latency.'}</p>
      </div>
      <div class="card">
        <div class="row spread"><span style="font-size:14px">Hear the cues</span>
          <span class="row" style="gap:8px"><button class="btn small" data-act="cue-return">▲ Return</button><button class="btn small" data-act="cue-release">▼ Let go</button></span></div>
        <details class="how" style="margin-top:12px"><summary>How it works ›</summary><ol>
          <li><b>▲ Rising chime:</b> bring attention back to the orb and tap the pad the instant you're on it. That gap is your recovery latency.</li>
          <li>Hold the orb. Whenever you catch yourself drifting, come back and tap again.</li>
          <li><b>▼ Low chime:</b> let go completely. Hold nothing. Taps during release count as false starts.</li>
          <li>The screen never changes between phases, so only the sound tells you where you are.</li>
        </ol></details>
      </div>
      <button class="btn primary block" data-act="drill-start" style="margin-bottom:16px;padding:16px">Begin</button>
      ${ss.length ? `<div class="card"><p class="label">History</p><ul class="hist">${ss.slice(-10).reverse().map(x => {
          const a = sessAvg(x), miss = x.latencies.filter(v => v == null).length;
          const when = new Date(x.t).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
          return `<li><span>${esc(when)} <span class="muted">· ${x.rounds}r${miss ? ` · ${miss} missed` : ''}${x.jitter === 0 ? ' · fixed' : ''}</span></span><b class="num">${a == null ? '—' : a.toFixed(1) + ' s'}</b></li>`;
        }).join('')}</ul></div>` : ''}`;
  }

  function drillSummary(x) {
    const lats = x.latencies, ok = lats.filter(v => v != null), a = ok.length ? avg(ok) : null;
    const prev = S.drill.sessions.slice(0, -1).slice(-7).map(sessAvg).filter(v => v != null);
    const pa = prev.length ? avg(prev) : null, delta = a != null && pa != null ? a - pa : null;
    const mx = Math.max(...ok, 1);
    return `
      <div class="card" style="text-align:center">
        <div style="display:flex;justify-content:center">${orb('chaos', 72, 'still')}</div>
        <p class="label" style="margin:10px 0 4px">Session complete</p>
        <div class="bigstat" style="justify-content:center"><b>${a == null ? '—' : a.toFixed(1)}</b><span class="muted">sec average</span></div>
        ${delta == null ? '' : `<div class="delta ${delta <= 0 ? 'good' : 'bad'}" style="margin-top:4px">${delta <= 0 ? '↓ faster' : '↑ slower'} than your last ${prev.length} (${pa.toFixed(1)}s)</div>`}
        <div class="lat">${lats.map(v => v == null ? '<i class="miss" title="missed"></i>' : `<i style="height:${Math.max(4, 100 * v / mx)}%" title="${v.toFixed(1)}s"></i>`).join('')}</div>
        <p class="muted" style="margin:0;font-size:12px">One bar per return. Shorter is better; dashed means no return was tapped.</p>
        <div class="stats4">
          <div><b>${ok.length ? Math.min(...ok).toFixed(1) : '—'}</b><span>Best</span></div>
          <div><b>${x.catches}</b><span>Drifts caught</span></div>
          <div><b>${lats.filter(v => v == null).length}</b><span>Missed</span></div>
          <div><b>${x.falseTaps || 0}</b><span>False starts</span></div>
        </div>
      </div>
      <button class="btn primary block" data-act="summary-ok">Done</button>`;
  }

  // The run screen is identical in every phase: still orb, same text, same tap pad.
  function renderDrillRun() {
    const r = drillRun, d = S.drill;
    $app.innerHTML = `
      <div class="run drillrun"><div class="inner">
        <div class="top"><span class="num">${r.doneRounds} of ${d.rounds} rounds</span><button class="btn small ghost" data-act="drill-stop">End</button></div>
        <div class="dots" style="margin-top:12px">${Array.from({ length: d.rounds }, (_, i) => `<i class="${i < r.doneRounds ? 'on' : ''}"></i>`).join('')}</div>
        <div class="stage">
          ${orb('chaos', 210, 'still')}
          <div class="legend2">▲ rising chime: return and tap<br>▼ low chime: let go</div>
        </div>
        <button class="tapzone" id="tapzone" aria-label="Tap when you're back on the orb"><span class="rip"></span>Tap when you're back on the orb</button>
      </div></div>`;
  }

  function startDrill() {
    unlockAudio();
    const t = Date.now();
    // a short settle-in before the first return cue
    drillRun = { phase: 'settle', start: t, end: t + 6000, round: 0, doneRounds: 0, latencies: [], catches: 0, falseTaps: 0, locked: false };
    lockScreen(); startTicker(); renderDrillRun();
  }

  function setDrillPhase(phase) {
    const r = drillRun, d = S.drill;
    let sec = phase === 'focus' ? d.focus : d.release;
    if (phase === 'release' && d.jitter) sec = Math.max(5, sec + (Math.random() * 2 - 1) * d.jitter);
    r.phase = phase;
    r.start = Date.now();
    r.end = r.start + sec * 1000;
    if (phase === 'focus') {
      r.round++;
      r.locked = false;
      cueReturn();
    } else {
      closeRound();
      cueRelease();
      renderDrillRun();
    }
  }

  // a focus phase that ends without a tap is a missed return
  function closeRound() {
    const r = drillRun;
    if (!r.locked) r.latencies.push(null);
    r.doneRounds++;
  }

  function advanceDrill() {
    const r = drillRun;
    if (r.phase === 'settle') return setDrillPhase('focus');
    if (r.phase === 'focus') {
      if (r.round >= S.drill.rounds) { closeRound(); return finishDrill(); }
      return setDrillPhase('release');
    }
    setDrillPhase('focus');
  }

  function drillTap() {
    const r = drillRun;
    if (!r) return;
    const z = document.getElementById('tapzone');
    if (z) { z.classList.remove('hit'); void z.offsetWidth; z.classList.add('hit'); }
    buzz();
    if (r.phase === 'focus') {
      if (!r.locked) { r.latencies.push(Math.round((Date.now() - r.start) / 100) / 10); r.locked = true; }
      else r.catches++;
    } else if (r.phase === 'release') r.falseTaps++;
  }

  function finishDrill() {
    const r = drillRun;
    stopTicker(); unlockScreen();
    drillRun = null;
    if (r.latencies.length) {
      const x = { t: Date.now(), rounds: r.latencies.length, latencies: r.latencies, catches: r.catches, falseTaps: r.falseTaps, jitter: S.drill.jitter, object: 'orb' };
      S.drill.sessions.push(x);
      if (S.drill.sessions.length > 500) S.drill.sessions.shift();
      save();
      V.summary = x;
      beep(523, 0.2, 0); setTimeout(() => beep(784, 0.45), 200);
    }
    render();
  }

  /* ----- water ----- */

  const ML_OZ = 29.5735;
  const DROP = '<svg class="drop" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c-3.6 4.6-7 8.7-7 12.3a7 7 0 0 0 14 0c0-3.6-3.4-7.7-7-12.3z" fill="var(--water)"/></svg>';
  const W = () => S.water;
  const fmtIn = (ml, unit) => unit === 'oz' ? Math.round(ml / ML_OZ * 10) / 10 : Math.round(ml);
  const fmtW = (ml, unit = W().unit) => `${fmtIn(ml, unit).toLocaleString()} ${unit}`;

  // spread the target across the waking window, ending two hours before bed
  function autoSchedule(target, pour, wake, bed) {
    // small tolerance so unit rounding (64 oz / 16 oz) doesn't add a 1 ml sip
    const n = Math.max(1, Math.ceil(target / pour - 0.02));
    const a = toMin(wake), b0 = toMin(bed) - 120;
    const b = b0 > a + 60 ? b0 : a + 8 * 60;
    const out = [];
    for (let i = 0; i < n; i++) {
      const m = Math.round((n === 1 ? a : a + i * (b - a) / (n - 1)) / 5) * 5;
      out.push({ id: uid(), time: `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`,
                 amount: i === n - 1 ? target - pour * (n - 1) : pour });
    }
    return out;
  }
  function ensureWater() {
    const w = W();
    if (!w.scheduleInit) { w.schedule = autoSchedule(w.target, w.pour, w.wake, w.bed); w.scheduleInit = true; save(); }
  }

  const wLog = (k = today()) => W().log[k] || [];
  const wTotal = (k = today()) => wLog(k).reduce((t, e) => t + e.ml, 0);
  const wSched = () => [...W().schedule].sort((a, b) => toMin(a.time) - toMin(b.time));

  function wState() {
    ensureWater();
    const got = wTotal(), now = nowMin(), rows = [];
    let cum = 0, next = null, expected = 0;
    for (const e of wSched()) {
      cum += e.amount;
      const row = { ...e, cum, done: got >= cum };
      rows.push(row);
      if (toMin(e.time) <= now) expected = cum;
      if (!row.done && !next) next = row;
    }
    return { rows, next, got, target: W().target, expected: Math.min(expected, W().target), due: !!(next && toMin(next.time) <= now) };
  }
  function waterDue() {
    if (drillRun || run || featRun) return null;
    const st = wState();
    if (!st.due || st.got >= st.target) return null;
    if (W().snooze[today()] === st.next.id) return null;
    return st;
  }
  function addWater(ml) {
    const k = today();
    (W().log[k] = W().log[k] || []).push({ t: Date.now(), ml: Math.max(1, Math.round(ml)) });
    save();
  }
  function waterMark(d) {
    const k = keyOf(d);
    if (k < W().since) return 'none';
    const t = wTotal(k);
    if (t >= W().target) return 'full';
    if (k > today()) return 'future';
    if (t > 0) return 'part';
    return k === today() ? 'future' : 'miss';
  }

  function waterView() {
    const w = W(), st = wState();
    const pct = Math.min(100, 100 * st.got / st.target), pacePct = Math.min(100, 100 * st.expected / st.target);
    const diff = st.got - st.expected;
    let pill;
    if (st.got >= st.target) pill = '<span class="pill ok">Target reached ✓</span>';
    else if (Math.abs(diff) < w.pour / 2) pill = '<span class="pill ok">On pace</span>';
    else pill = diff < 0 ? `<span class="pill behind">Behind by ${fmtW(-diff)}</span>` : `<span class="pill ahead">Ahead by ${fmtW(diff)}</span>`;
    const nx = st.next, log = wLog().slice().reverse();
    const days = Array.from({ length: 7 }, (_, i) => addDays(new Date(), i - 6));
    const totals = days.map(d => wTotal(keyOf(d))), mx = Math.max(w.target, ...totals) * 1.08;
    const from = V.wFrom != null ? V.wFrom : pct;
    return `
      <div class="card">
        <div class="vessel-wrap">
          <div class="vessel" role="img" aria-label="${Math.round(pct)}% of today's water">
            <div class="fill" style="height:${from}%" data-h="${pct}"></div>
            ${st.got < st.target && st.expected > 0 ? `<div class="pace" style="bottom:${pacePct}%"><span>PACE</span></div>` : ''}
          </div>
          <div>
            <p class="label" style="margin:0">Water today</p>
            <div class="wbig">${fmtIn(st.got, w.unit).toLocaleString()}<small> / ${fmtW(st.target)}</small></div>
            <div class="muted num" style="font-size:14px">${Math.round(pct)}%</div>
            ${pill}
          </div>
        </div>
        <div class="quick" style="margin-top:16px">
          <button class="btn water" data-act="w-add" data-ml="${w.pour}">+ ${fmtW(w.pour)}</button>
          <button class="btn" data-act="w-add" data-ml="${w.pour / 2}">+ ${fmtW(w.pour / 2)}</button>
          <button class="btn" data-act="w-undo" ${log.length ? '' : 'disabled'}>Undo</button>
        </div>
        <form class="custom" id="wcustom" autocomplete="off"><input name="amt" type="number" inputmode="decimal" min="0.1" step="any" placeholder="Custom amount (${w.unit})"><button class="btn" type="submit">Add</button></form>
      </div>
      ${nx ? `<div class="card"><div class="row spread"><div>
          <p class="label" style="margin:0 0 4px">${st.due ? 'Due now' : 'Next sip'}</p>
          <div style="font-size:18px;font-weight:600" class="num">${fmtW(nx.cum - st.got)} <span class="muted" style="font-weight:400">${st.due ? 'since' : 'at'} ${clock(nx.time)}</span></div></div>
          <button class="btn water" data-act="w-add" data-ml="${nx.cum - st.got}">Log it</button></div></div>` : ''}
      <div class="card">
        <div class="row spread"><p class="label" style="margin:0">Schedule</p><button class="linkbtn" data-act="w-edit">Edit</button></div>
        <ul class="sched" style="margin-top:6px">${st.rows.map(e => `<li class="${e.done ? 'done' : nx && e.id === nx.id ? 'next' : ''}"><span class="d"></span><span class="num">${clock(e.time)}</span><span class="num">${fmtW(e.amount)}</span></li>`).join('') || '<li><span></span><span>No sips scheduled</span><span></span></li>'}</ul>
        <button class="btn block" data-act="w-ics" style="margin-top:12px">Add reminders to my calendar</button>
        <p class="note">Phones only give reliable alerts through their own calendar, so this adds each sip as a daily event with an alert. While MetaMorph is open it also nudges you when a sip is due.</p>
      </div>
      <div class="card">
        <p class="label">Last 7 days</p>
        <div class="week7">${days.map((d, i) => `<div class="col"><div class="bw"><div class="tl2" style="bottom:${100 * w.target / mx}%"></div><div class="b ${totals[i] >= w.target ? 'hit' : ''}" style="height:${100 * totals[i] / mx}%" title="${fmtW(totals[i])}"></div></div><span class="lbl ${i === 6 ? 'today' : ''}">${WD[d.getDay()][0]}</span></div>`).join('')}</div>
      </div>
      ${log.length ? `<div class="card"><p class="label">Today's log</p><ul class="wlog">${log.map(e => `<li><span class="num">${new Date(e.t).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })}</span><span class="num">${fmtW(e.ml)}<button data-act="w-del" data-t="${e.t}" aria-label="Remove">✕</button></span></li>`).join('')}</ul></div>` : ''}`;
  }

  function waterSheet() {
    const e = V.wedit, u = e.unit, tot = e.schedule.reduce((t, x) => t + x.amount, 0);
    return `
      <div class="sheet-bg ${e.fresh ? 'enter' : ''}" data-act="w-cancel-bg">
        <form class="sheet" id="wform" autocomplete="off">
          <h2>Water schedule</h2>
          <p class="label">Units</p>
          <div class="chips">${['ml', 'oz'].map(x => `<label class="chip"><input type="radio" name="w_unit" value="${x}" ${u === x ? 'checked' : ''}><span>${x}</span></label>`).join('')}</div>
          <div class="grid2">
            <div class="field"><label>Daily target (${u})</label><input name="w_target" type="number" inputmode="decimal" min="0.1" step="any" value="${fmtIn(e.target, u)}"></div>
            <div class="field"><label>Pour size (${u})</label><input name="w_pour" type="number" inputmode="decimal" min="0.1" step="any" value="${fmtIn(e.pour, u)}"></div>
            <div class="field"><label>Wake</label><input name="w_wake" type="time" value="${e.wake}"></div>
            <div class="field"><label>Bed</label><input name="w_bed" type="time" value="${e.bed}"></div>
          </div>
          <button class="btn block" type="button" data-act="w-auto">Auto-space from wake to 2h before bed</button>
          <p class="label" style="margin-top:16px">Sips</p>
          ${e.schedule.map((x, i) => `<div class="wrow"><input name="wt${i}" type="time" value="${x.time}" aria-label="Time"><input name="wa${i}" type="number" inputmode="decimal" min="0.1" step="any" value="${fmtIn(x.amount, u)}" aria-label="Amount (${u})"><button type="button" data-act="w-rm" data-i="${i}" aria-label="Remove sip">✕</button></div>`).join('')}
          <button class="btn block" type="button" data-act="w-addrow" style="margin-bottom:8px">+ Add sip</button>
          <div class="total num">${e.schedule.length} sips · ${fmtW(tot, u)} scheduled${Math.abs(tot - e.target) > 1 ? ` · target is ${fmtW(e.target, u)}` : ''}</div>
          <button class="btn primary block" type="submit" style="margin-bottom:8px">Save</button>
          <button class="btn block" type="button" data-act="w-cancel">Cancel</button>
        </form>
      </div>`;
  }

  // read typed values (in the unit they were typed in) before any re-render of the sheet
  function syncWEdit() {
    const f = document.getElementById('wform');
    if (!f || !V.wedit) return;
    const e = V.wedit, el = f.elements, k = e.unit === 'oz' ? ML_OZ : 1;
    const num = (v, d) => { const n = Number(v); return n > 0 ? Math.round(n * k) : d; };
    e.target = num(el.w_target.value, e.target);
    e.pour = num(el.w_pour.value, e.pour);
    e.wake = el.w_wake.value || e.wake;
    e.bed = el.w_bed.value || e.bed;
    e.schedule.forEach((x, i) => { x.time = el['wt' + i].value || x.time; x.amount = num(el['wa' + i].value, x.amount); });
    e.unit = (f.querySelector('input[name=w_unit]:checked') || {}).value || e.unit;
  }

  function waterICS() {
    const pad = n => String(n).padStart(2, '0'), d = new Date();
    const ymd = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
    const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
    const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//MetaMorph//Water//EN', 'CALSCALE:GREGORIAN'];
    for (const e of wSched()) {
      const [h, m] = e.time.split(':');
      // floating local time, so alerts follow the phone's timezone
      lines.push('BEGIN:VEVENT', `UID:water-${e.id}@metamorph`, `DTSTAMP:${stamp}`, `DTSTART:${ymd}T${h}${m}00`, 'DURATION:PT5M', 'RRULE:FREQ=DAILY',
        `SUMMARY:Water · ${fmtW(e.amount)}`, 'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:Water · ${fmtW(e.amount)}`, 'TRIGGER:PT0M', 'END:VALARM', 'END:VEVENT');
    }
    lines.push('END:VCALENDAR');
    return new Blob([lines.join('\r\n') + '\r\n'], { type: 'text/calendar' });
  }

  function deliver(blob, name, title) {
    const file = new File([blob], name, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) return navigator.share({ files: [file], title }).catch(() => {});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  /* ----- routine clock ----- */

  // A routine's timer runs on the clock from its start time; no tap needed.
  function windowOf(r, d = new Date()) {
    let s0 = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime() + toMin(r.start) * 60000;
    const len = total(r) * 60000;
    // a window that began yesterday and runs past midnight
    if (d.getTime() < s0 && s0 - DAY + len > d.getTime()) s0 -= DAY;
    return { start: s0, end: s0 + len };
  }
  function clockBar(r, thin = false) {
    const w = windowOf(r);
    let t = w.start;
    const segs = r.steps.map(x => {
      const a = t; t += x.minutes * 60000;
      return `<span class="${isDone(x.id) ? 'done' : ''}" style="flex:${x.minutes}"><i data-s="${a}" data-e="${t}"></i></span>`;
    }).join('');
    return `<div class="clockbar ${thin ? 'thin' : ''}" data-end="${w.end}">${segs}</div>`;
  }
  // moves the bars and "left / over" labels every second without a full re-render
  function updateClocks() {
    const now = Date.now();
    document.querySelectorAll('.clockbar i[data-s]').forEach(i => {
      const a = +i.dataset.s, b = +i.dataset.e;
      i.style.width = Math.max(0, Math.min(100, 100 * (now - a) / (b - a))) + '%';
    });
    document.querySelectorAll('.clockbar[data-end]').forEach(b => b.classList.toggle('over', now > +b.dataset.end));
    document.querySelectorAll('[data-left]').forEach(x => {
      const d = (+x.dataset.left - now) / 1000;
      x.textContent = d >= 0 ? `${mmss(d)} left` : `+${mmss(-d)} over`;
      x.classList.toggle('over', d < 0);
    });
  }
  setInterval(() => { if (!drillRun && !run && !featRun) updateClocks(); }, 1000);

  // when a routine was finished, and whether that was after its scheduled end
  const finOf = (id, k = today()) => (S.fin[k] || {})[id] || null;
  function setFin(id, ts, k = today()) {
    S.fin[k] = S.fin[k] || {};
    if (ts) S.fin[k][id] = ts; else delete S.fin[k][id];
  }
  function completeRoutine(r, v, k = today(), stamp = true) {
    setDone(r.id, v, k);
    r.steps.forEach(x => setDone(x.id, v, k));
    setFin(r.id, v && stamp ? Date.now() : null, k);
    save();
  }
  const hm = ts => new Date(ts).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  function finText(r, k = today()) {
    const ts = finOf(r.id, k);
    if (!ts) return { txt: '✓ done', late: false };
    const end = parseKey(k).getTime() + (toMin(r.start) + total(r)) * 60000;
    return ts > end + 60000 ? { txt: `late · ${hm(ts)}`, late: true } : { txt: `✓ ${hm(ts)}`, late: false };
  }

  /* ----- practice ----- */

  function practiceView() {
    const seg = `<div class="seg" style="grid-template-columns:1fr 1fr">${[['feature', 'Feature Law'], ['drill', 'Switch Drill']].map(([k, l]) =>
      `<button data-act="ptab" data-v="${k}" class="${V.ptab === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;
    return seg + (V.ptab === 'drill' ? drillView() : featureView());
  }

  /* ----- to-do ----- */

  // due moment: the set time, or the end of the day for untimed tasks
  const todoDue = x => x.date ? parseKey(x.date).getTime() + (x.time ? toMin(x.time) * 60000 : DAY - 1) : null;
  const todoLate = x => x.done && x.doneAt && x.date && x.doneAt > todoDue(x) + 60000;
  function dayLabel(k) {
    if (k === today()) return 'Today';
    if (k === keyOf(addDays(new Date(), 1))) return 'Tomorrow';
    if (k === keyOf(addDays(new Date(), -1))) return 'Yesterday';
    return parseKey(k).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }
  function todoMeta(x) {
    const parts = [];
    if (x.date) parts.push(dayLabel(x.date));
    if (x.time) parts.push(clock(x.time));
    if (x.done && x.doneAt) parts.push(todoLate(x) ? `<span class="late">late · ${hm(x.doneAt)}</span>` : `done ${hm(x.doneAt)}`);
    return parts.join(' · ');
  }
  function todoRow(x) {
    const overdue = !x.done && x.date && todoDue(x) < Date.now();
    return `<li class="${x.done ? 'done' : ''}">
      <button class="chk ${x.done ? 'done' : ''}" data-act="todo-toggle" data-id="${x.id}" aria-label="${x.done ? 'Mark not done' : 'Mark done'}">✓</button>
      <span class="tx" data-act="todo-edit" data-id="${x.id}"><div>${esc(x.text)}</div>${x.date || x.done ? `<div class="t ${overdue ? 'overdue' : ''}">${todoMeta(x)}${overdue ? ' · overdue' : ''}</div>` : ''}</span>
      <button class="x" data-act="todo-del" data-id="${x.id}" aria-label="Delete">✕</button>
    </li>`;
  }
  function todoTimelineItem(x) {
    const due = todoDue(x), late = todoLate(x);
    const st = x.done ? 'done' : due < Date.now() ? 'open' : 'upcoming';
    const right = x.done ? `<span class="st ${late ? 'late' : ''}">${late ? 'late · ' : '✓ '}${hm(x.doneAt)}</span>`
      : st === 'open' ? '<span class="st late">overdue</span>' : `<span class="st">in ${dur(Math.max(1, Math.round((due - Date.now()) / 60000)))}</span>`;
    return `<li><div class="swbg"><span class="l">✓ Done</span><span class="r">Undo</span></div>
      <div class="it todo ${st}" data-act="todo-toggle" data-id="${x.id}" data-todo="1">
        <span class="t num">${clock(x.time)}</span><span class="dot sq"></span>
        <span><div class="nm">${esc(x.text)}</div><div class="sub">To-do</div></span>
        ${right}
      </div></li>`;
  }
  function setTodo(x, v) { x.done = v; x.doneAt = v ? Date.now() : null; save(); }

  function todoView() {
    const k = today(), open = S.todos.filter(x => !x.done);
    const by = (a, b) => (a.date || '~').localeCompare(b.date || '~') || (a.time || '~').localeCompare(b.time || '~') || a.created - b.created;
    const groups = [
      ['Overdue', open.filter(x => x.date && x.date < k).sort(by), 'overdue'],
      ['Today', open.filter(x => x.date === k).sort(by), ''],
      ['Upcoming', open.filter(x => x.date && x.date > k).sort(by), ''],
      ['Someday', open.filter(x => !x.date).sort(by), ''],
    ];
    const done = S.todos.filter(x => x.done).sort((a, b) => b.doneAt - a.doneAt).slice(0, 20);
    const when = V.todoWhen;
    return `
      <form class="card" id="todoadd" autocomplete="off">
        <div class="custom" style="margin:0"><input name="text" placeholder="Add a task…" aria-label="New task" value="${esc(V.todoDraft.text)}"><button class="btn primary" type="submit">Add</button></div>
        <div class="opts" style="margin-top:10px">${[['today', 'Today'], ['tomorrow', 'Tomorrow'], ['someday', 'Someday']].map(([v, l]) =>
          `<button type="button" data-act="todo-when" data-v="${v}" class="${when === v ? 'on' : ''}">${l}</button>`).join('')}</div>
        <div class="grid2" style="margin-top:10px">
          <div class="field" style="margin:0"><label>Or a date</label><input name="date" type="date" value="${V.todoDraft.date}"></div>
          <div class="field" style="margin:0"><label>Time (puts it on the timeline)</label><input name="time" type="time" value="${V.todoDraft.time}"></div>
        </div>
      </form>
      ${groups.map(([name, list, cls]) => list.length ? `
        <div class="grouphead ${cls}"><h3>${name}</h3><span class="muted num" style="font-size:13px">${list.length}</span></div>
        <div class="card" style="padding-top:6px;padding-bottom:6px"><ul class="todos">${list.map(todoRow).join('')}</ul></div>` : '').join('')}
      ${!open.length ? `<p class="muted" style="text-align:center;margin:24px 0">Nothing to do. Add a task above.</p>` : ''}
      ${done.length ? `
        <div class="grouphead"><h3>Done</h3><button class="linkbtn" data-act="todo-clear">Clear done</button></div>
        <div class="card" style="padding-top:6px;padding-bottom:6px"><ul class="todos">${done.map(todoRow).join('')}</ul></div>` : ''}`;
  }

  function todoSheet() {
    const e = V.tedit;
    return `<div class="sheet-bg ${e.fresh ? 'enter' : ''}" data-act="todo-cancel-bg">
      <form class="sheet" id="todoform" autocomplete="off">
        <h2>Edit task</h2>
        <div class="field"><label>Task</label><input name="text" required value="${esc(e.text)}"></div>
        <div class="grid2">
          <div class="field"><label>Date</label><input name="date" type="date" value="${e.date || ''}"></div>
          <div class="field"><label>Time</label><input name="time" type="time" value="${e.time || ''}"></div>
        </div>
        <button class="btn primary block" type="submit" style="margin-bottom:8px">Save</button>
        <div class="grid2"><button class="btn" type="button" data-act="todo-cancel">Cancel</button><button class="btn danger" type="button" data-act="todo-del" data-id="${e.id}">Delete</button></div>
      </form></div>`;
  }

  /* ----- nutrition: calories & macros ----- */

  const N = () => S.nutri;
  const MEALS = ['Breakfast', 'Lunch', 'Dinner', 'Snacks'];
  const MAC = [['kcal', 'Calories', ' kcal'], ['p', 'Protein', 'g'], ['c', 'Carbs', 'g'], ['f', 'Fat', 'g']];
  const MCOL = { kcal: 'var(--gc)', p: '#ff7a59', c: '#f2c14e', f: '#6fb7ff' };
  const r1 = n => Math.round(n * 10) / 10;
  const kcalOf = (p, c, f) => Math.round(4 * p + 4 * c + 9 * f);
  const nLog = (k = today()) => N().log[k] || [];
  const nTotals = (k = today()) => nLog(k).reduce((t, e) => { for (const [m] of MAC) t[m] += e[m] * e.qty; return t; }, { kcal: 0, p: 0, c: 0, f: 0 });
  const macLine = (x, q = 1) => `${Math.round(x.kcal * q)} kcal · P ${r1(x.p * q)} · C ${r1(x.c * q)} · F ${r1(x.f * q)}`;
  function mealNow() { const h = new Date().getHours(); return h < 11 ? 'Breakfast' : h < 15 ? 'Lunch' : h < 21 ? 'Dinner' : 'Snacks'; }
  function logFood(meal, item, qty, src, ref) {
    const k = today();
    (N().log[k] = N().log[k] || []).push({ id: uid(), t: Date.now(), meal, name: item.name, qty,
      kcal: +item.kcal || 0, p: +item.p || 0, c: +item.c || 0, f: +item.f || 0, src, ref: ref || null });
    if (src === 'prep') { const pr = N().preps.find(x => x.id === ref); if (pr) pr.left = Math.max(0, r1(pr.left - qty)); }
    save();
  }

  function nutritionPanel() {
    const n = N(), tot = nTotals(), g = n.goals, log = nLog();
    const bars = MAC.map(([m, label, u]) => {
      const pct = g[m] ? Math.min(100, 100 * tot[m] / g[m]) : 0, over = g[m] && tot[m] > g[m] * 1.02;
      return `<div class="mac"><div class="row spread"><span>${label}</span><span class="num muted"><b class="${over ? 'late' : ''}" style="color:var(--text)">${Math.round(tot[m]).toLocaleString()}</b> / ${g[m].toLocaleString()}${u}</span></div>
        <div class="mbar"><i class="${over ? 'over' : ''}" style="width:${pct}%;background:${MCOL[m]}"></i></div></div>`;
    }).join('');
    const meals = MEALS.map(meal => {
      const es = log.filter(e => e.meal === meal), mk = es.reduce((t, e) => t + e.kcal * e.qty, 0);
      return `<div class="meal"><div class="row spread"><b>${meal}</b><span class="row" style="gap:10px"><span class="muted num" style="font-size:13px">${Math.round(mk)} kcal</span><button class="btn small" data-act="n-add" data-meal="${meal}">+ Add</button></span></div>
        ${es.length ? `<ul class="flog">${es.map(e => `<li><span><div>${esc(e.name)}${e.qty !== 1 ? ` <span class="muted">× ${r1(e.qty)}</span>` : ''}</div><div class="t num">${macLine(e, e.qty)}</div></span><button data-act="n-del" data-id="${e.id}" aria-label="Remove">✕</button></li>`).join('')}</ul>` : ''}</div>`;
    }).join('');
    const preps = n.preps.filter(x => x.left > 0 || Date.now() - x.created < 7 * DAY);
    return `
      <div class="sechead"><h3>Fuel</h3><button class="linkbtn" data-act="n-goals">Daily goals</button></div>
      <div class="card" style="--gc:${gateOf('nutrition').color}">${bars}</div>
      <div class="card">${meals}</div>
      <div class="sechead"><h3>Meal prep</h3><button class="linkbtn" data-act="n-prep-new">+ New prep</button></div>
      ${preps.length ? preps.map(x => `<div class="card" style="--gc:${gateOf('nutrition').color}"><div class="row spread" style="align-items:flex-start"><div>
          <b>${esc(x.name)}</b>
          <div class="muted num" style="font-size:13px">${r1(x.left)}/${x.portions} portions left · made ${dayLabel(x.made)}</div>
          <div class="muted num" style="font-size:13px">Per portion: ${macLine(x.per)}</div></div>
          <div class="row" style="gap:6px"><button class="btn small ghost" data-act="n-prep-del" data-id="${x.id}" aria-label="Delete prep">✕</button><button class="btn small primary" data-act="n-prep-log" data-id="${x.id}" ${x.left > 0 ? '' : 'disabled'}>Eat 1</button></div></div>
          <div class="mbar" style="margin-top:10px"><i style="width:${100 * x.left / x.portions}%"></i></div></div>`).join('')
        : '<p class="muted" style="margin:0 0 12px">Cook once, log portions all week. Add a prep to start.</p>'}`;
  }

  function addFoodSheet() {
    const a = V.nadd, n = N(), q = a.q.toLowerCase();
    const rows = [
      ...n.preps.filter(x => x.left > 0).map(x => ({ kind: 'prep', id: x.id, name: x.name, sub: `Meal prep · ${r1(x.left)} left`, ...x.per })),
      ...n.foods.map(x => ({ kind: 'food', id: x.id, name: x.name, sub: x.serving || '1 serving', kcal: x.kcal, p: x.p, c: x.c, f: x.f })),
    ];
    const fld = (name, label, extra = '') => `<div class="field"><label>${label}</label><input name="${name}" type="number" inputmode="decimal" min="0" step="any" ${extra}></div>`;
    return `<div class="sheet-bg ${a.fresh ? 'enter' : ''}" data-act="n-cancel-bg"><div class="sheet">
      <h2>Add to ${a.meal}</h2>
      <div class="seg" style="grid-template-columns:1fr 1fr">${[['saved', 'Saved'], ['new', 'New food']].map(([k, l]) => `<button data-act="n-mode" data-v="${k}" class="${a.mode === k ? 'on' : ''}">${l}</button>`).join('')}</div>
      ${a.mode === 'saved' ? `
        <div class="row spread" style="margin-bottom:10px"><span class="muted" style="font-size:14px">Servings</span>
          <span class="qty"><button data-act="n-qty" data-d="-0.5" aria-label="Fewer">−</button><b class="num">${r1(a.qty)}</b><button data-act="n-qty" data-d="0.5" aria-label="More">+</button></span></div>
        <input id="nsearch" class="search" placeholder="Search saved foods and preps" value="${esc(a.q)}" autocomplete="off">
        <ul class="foodlist">${rows.map(x => `<li data-name="${esc(x.name.toLowerCase())}" ${q && !x.name.toLowerCase().includes(q) ? 'hidden' : ''}>
            <span><div>${esc(x.name)}</div><div class="t num">${esc(x.sub)} · ${macLine(x)}</div></span>
            <span class="row" style="gap:6px">${x.kind === 'food' ? `<button class="btn small ghost" data-act="n-food-del" data-id="${x.id}" aria-label="Forget this food">✕</button>` : ''}<button class="btn small primary" data-act="n-pick" data-kind="${x.kind}" data-id="${x.id}">Add</button></span></li>`).join('')
          || '<li><span class="muted">Nothing saved yet. Use “New food”.</span></li>'}</ul>` : `
        <form id="nnew" autocomplete="off">
          <div class="grid2"><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Serving</label><input name="serving" placeholder="1 cup, 100 g…"></div></div>
          <div class="grid4">${fld('kcal', 'kcal', 'placeholder="auto"')}${fld('p', 'Protein g')}${fld('c', 'Carbs g')}${fld('f', 'Fat g')}</div>
          <p class="note" style="margin:0 0 12px">Leave calories blank to work them out from the macros (4 / 4 / 9 per gram).</p>
          <div class="field"><label>Servings eaten</label><input name="qty" type="number" inputmode="decimal" min="0.25" step="any" value="1"></div>
          <label class="checkrow"><input type="checkbox" name="keep" checked> Save to my foods</label>
          <button class="btn primary block" type="submit">Add to ${a.meal}</button>
        </form>`}
      <button class="btn ghost block" data-act="n-cancel" style="margin-top:8px">Close</button>
    </div></div>`;
  }

  function goalsSheet() {
    const e = V.ngoals;
    return `<div class="sheet-bg ${e.fresh ? 'enter' : ''}" data-act="n-goals-cancel-bg">
      <form class="sheet" id="ngoalf" autocomplete="off">
        <h2>Daily goals</h2>
        <div class="grid2">${MAC.map(([m, label, u]) => `<div class="field"><label>${label} (${u.trim()})</label><input name="${m}" type="number" inputmode="numeric" min="0" step="1" value="${e[m]}"></div>`).join('')}</div>
        <button class="btn block" type="button" data-act="n-goals-calc" style="margin-bottom:8px">Set calories from macros</button>
        <button class="btn primary block" type="submit" style="margin-bottom:8px">Save</button>
        <button class="btn block" type="button" data-act="n-goals-cancel">Cancel</button>
      </form></div>`;
  }

  function prepTotals(items) {
    return items.reduce((t, x) => {
      const kc = x.kcal === '' || x.kcal == null ? kcalOf(+x.p || 0, +x.c || 0, +x.f || 0) : +x.kcal;
      t.kcal += kc; t.p += +x.p || 0; t.c += +x.c || 0; t.f += +x.f || 0; return t;
    }, { kcal: 0, p: 0, c: 0, f: 0 });
  }
  function prepTotalsText(e) {
    const t = prepTotals(e.items), n = Math.max(1, +e.portions || 1);
    return `<b>Batch:</b> ${macLine(t)}<br><b>Per portion (${n}):</b> ${macLine({ kcal: t.kcal / n, p: t.p / n, c: t.c / n, f: t.f / n })}`;
  }
  function prepSheet() {
    const e = V.nprep, n = N();
    const v = x => x === '' || x == null ? '' : x;
    return `<div class="sheet-bg ${e.fresh ? 'enter' : ''}" data-act="n-prep-cancel-bg">
      <form class="sheet" id="nprepf" autocomplete="off">
        <h2>New meal prep</h2>
        <div class="grid2">
          <div class="field"><label>Name</label><input name="name" required value="${esc(e.name)}" placeholder="Chicken &amp; rice"></div>
          <div class="field"><label>Portions</label><input name="portions" type="number" inputmode="numeric" min="1" step="1" value="${e.portions}"></div>
        </div>
        <p class="label">Ingredients · amounts used in the whole batch</p>
        ${e.items.map((x, i) => `<div class="ing">
          <div class="top"><input name="in${i}" value="${esc(x.name)}" placeholder="Ingredient"><button type="button" data-act="n-ing-rm" data-i="${i}" aria-label="Remove ingredient">✕</button></div>
          <div class="lbls"><span>kcal</span><span>Protein g</span><span>Carbs g</span><span>Fat g</span></div>
          <div class="grid4"><input name="ik${i}" type="number" inputmode="decimal" min="0" step="any" value="${v(x.kcal)}" placeholder="auto"><input name="ip${i}" type="number" inputmode="decimal" min="0" step="any" value="${v(x.p)}"><input name="ic${i}" type="number" inputmode="decimal" min="0" step="any" value="${v(x.c)}"><input name="if${i}" type="number" inputmode="decimal" min="0" step="any" value="${v(x.f)}"></div>
        </div>`).join('')}
        <button class="btn block" type="button" data-act="n-ing-add" style="margin-bottom:8px">+ Add ingredient</button>
        ${n.foods.length ? `<div class="custom" style="margin:0 0 8px"><select name="pickfood" aria-label="Saved food">${n.foods.map(x => `<option value="${x.id}">${esc(x.name)}${x.serving ? ` (${esc(x.serving)})` : ''}</option>`).join('')}</select><input name="pickqty" type="number" inputmode="decimal" min="0.25" step="any" value="1" style="width:80px" aria-label="Servings"></div>
          <button class="btn block" type="button" data-act="n-ing-food" style="margin-bottom:8px">+ Add from my foods</button>` : ''}
        <div class="preptot num" id="preptot">${prepTotalsText(e)}</div>
        <button class="btn primary block" type="submit" style="margin-bottom:8px">Save meal prep</button>
        <button class="btn block" type="button" data-act="n-prep-cancel">Cancel</button>
      </form></div>`;
  }
  function syncPrep() {
    const f = document.getElementById('nprepf');
    if (!f || !V.nprep) return;
    const e = V.nprep, el = f.elements;
    e.name = el.name.value;
    e.portions = Math.max(1, Math.round(+el.portions.value || 1));
    e.items.forEach((x, i) => {
      x.name = el['in' + i].value;
      x.kcal = el['ik' + i].value === '' ? '' : +el['ik' + i].value;
      for (const [m, n] of [['p', 'ip'], ['c', 'ic'], ['f', 'if']]) x[m] = el[n + i].value === '' ? '' : +el[n + i].value;
    });
  }

  /* ----- feature law ----- */

  const F = () => S.features;
  const TRIALS_NEEDED = 30;

  function lintFeature(t) {
    const x = t.trim().toLowerCase();
    if (!x) return null;
    if (/[,;&+]|\band\b/.test(x)) return { lvl: 'warn', msg: 'One feature only. A Lantern given three bearings lights none of them.' };
    const notice = /^(notice|spot|watch for|listen for|catch)\b/.test(x);
    if (!notice && (/^(be|feel|get|have|win|close|achieve|succeed|make|become|improve|stop|try|land|nail|crush|do)\b/.test(x)
        || /\b(more|less|better|good day|confident|successful|happy|productive|great)\b/.test(x)))
      return { lvl: 'warn', msg: 'That’s an outcome, and the Lantern can’t aim at outcomes. Name something you could notice: “Notice …”' };
    if (notice) return { lvl: 'ok', msg: 'Loadable: something you could notice.' };
    return { lvl: 'info', msg: 'Tip: start with “Notice” and name something you could see or hear.' };
  }

  function featureView() {
    const f = F(), open = f.items.filter(x => !x.check), done = f.items.filter(x => x.check);
    const L = done.filter(x => x.mode === 'loaded'), C = done.filter(x => x.mode === 'control');
    const ar = a => a.length ? avg(a.map(x => x.check.rating)) : null;
    const ub = a => a.length ? Math.round(100 * a.filter(x => x.check.unbidden).length / a.length) : null;
    const la = ar(L), ca = ar(C);
    const enough = done.length >= TRIALS_NEEDED && L.length >= 8 && C.length >= 8;
    let verdict = '';
    if (enough) verdict = la - ca >= 0.5
      ? `<p class="hint ok">Loaded contexts are noticed more (+${(la - ca).toFixed(1)}). The Feature Law is holding for you.</p>`
      : `<p class="hint warn">No clear difference after ${done.length} trials. The book says to mark the Feature Law Speculative in your copy.</p>`;
    const lint = lintFeature(V.fDraft.text);
    return `
      <div class="card">
        <p class="label" style="margin:0">The Feature Law</p>
        <p class="lawq"><b>The Lantern biases perceptual features. It does not bias outcomes.</b> An intent you couldn’t <i>notice</i> gives it nothing to aim at.</p>
      </div>
      <div class="card">
        <p class="label">Load one feature</p>
        <div class="field"><label>For</label><input id="fctx" value="${esc(V.fDraft.ctx)}" placeholder="Today, a meeting, the gym…" autocomplete="off"></div>
        <div class="opts" style="margin:-4px 0 14px">${['Today', 'Meeting', 'Workout', 'Conversation'].map(c => `<button type="button" data-act="f-ctx" data-v="${c}" class="${V.fDraft.ctx === c ? 'on' : ''}">${c}</button>`).join('')}</div>
        <div class="field" style="margin-bottom:0"><label>The one thing you'll notice</label><input id="ftext" value="${esc(V.fDraft.text)}" placeholder="Notice the pause before they answer" autocomplete="off"></div>
        <p class="hint ${lint ? lint.lvl : ''}" id="fhint">${lint ? esc(lint.msg) : ''}</p>
        <label class="checkrow"><input type="checkbox" id="fexp" ${f.experiment ? 'checked' : ''}> Experiment: about 1 in 3 loads becomes a control trial</label>
        <button class="btn primary block" data-act="f-load">Load feature · 30s hold</button>
      </div>
      ${open.length ? `<div class="card"><p class="label">Check in afterwards</p><ul class="flist">${open.slice().reverse().map(x => `<li><span>
          <div class="ctx">${esc(x.ctx || 'Context')} · ${new Date(x.t).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })}${x.mode === 'control' ? '<span class="mtag ctl">CONTROL</span>' : ''}</div>
          <div class="txt">${esc(x.text)}</div></span>
          <span class="row" style="gap:6px"><button class="btn small ghost" data-act="f-discard" data-id="${x.id}" aria-label="Discard this trial">✕</button><button class="btn small primary" data-act="f-check" data-id="${x.id}">Check in</button></span></li>`).join('')}</ul></div>` : ''}
      <div class="card">
        <p class="label">Is it working for you?</p>
        <div class="cmp">
          <div><b>${la == null ? '—' : la.toFixed(1)}</b><span>Loaded · noticed 0–4<br>${L.length} trial${L.length === 1 ? '' : 's'}${ub(L) != null ? ` · ${ub(L)}% unbidden` : ''}</span></div>
          <div><b>${ca == null ? '—' : ca.toFixed(1)}</b><span>Control · noticed 0–4<br>${C.length} trial${C.length === 1 ? '' : 's'}${ub(C) != null ? ` · ${ub(C)}% unbidden` : ''}</span></div>
        </div>
        <div class="prog"><i style="width:${Math.min(100, 100 * done.length / TRIALS_NEEDED)}%"></i></div>
        <p class="muted num" style="font-size:12px;margin:6px 0 0">${done.length}/${TRIALS_NEEDED} checked-in trials${enough ? '' : ' before a verdict (at least 8 of each kind)'}</p>
        ${verdict}
      </div>
      ${done.length ? `<div class="card"><p class="label">Recent</p><ul class="flist">${done.slice(-8).reverse().map(x => `<li><span>
          <div class="ctx">${esc(x.ctx || 'Context')} · ${new Date(x.t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}<span class="mtag ${x.mode === 'control' ? 'ctl' : ''}">${x.mode === 'control' ? 'CONTROL' : 'LOADED'}</span></div>
          <div class="txt">${esc(x.text)}</div></span><span class="num muted">${x.check.rating}/4</span></li>`).join('')}</ul></div>` : ''}`;
  }

  function renderFeatRun() {
    const x = F().items.find(i => i.id === featRun.id);
    if (!x) { featRun = null; return render(); }
    let center, controls;
    if (featRun.mode === 'control') {
      center = `<div class="phase" style="color:var(--release)">CONTROL TRIAL</div>
        <div class="holdtext">${esc(x.text)}</div>
        <div class="instr">Don’t rehearse it. Put it out of mind and go in as you normally would. You’ll check in the same way afterwards, so the two can be compared.</div>`;
      controls = `<div class="controls one"><button class="btn primary" data-act="f-done">Got it</button></div>`;
    } else if (featRun.held) {
      center = `${orb('chaos', 110, 'still')}
        <div class="phase" style="color:var(--ok)">LOADED</div>
        <div class="holdtext">${esc(x.text)}</div>
        <div class="instr">Go in. Check in afterwards from the Feature tab.</div>`;
      controls = `<div class="controls one"><button class="btn primary" data-act="f-done">Done</button></div>`;
    } else {
      center = `${orb('chaos', 110, 'still')}
        <div class="phase" style="color:var(--accent)">HOLD THE FEATURE</div>
        <div class="holdtext">${esc(x.text)}</div>
        <div class="clock" id="clock" style="font-size:56px">${mmss((featRun.end - Date.now()) / 1000)}</div>
        <div class="bar" style="color:var(--accent);max-width:240px"><i id="bar"></i></div>
        <div class="instr">Keep it in view until the context begins.</div>`;
      controls = `<div class="controls one"><button class="btn ghost" data-act="f-done">Skip the hold</button></div>`;
    }
    $app.innerHTML = `<div class="run"><div class="inner">
      <div class="top"><span>${esc(x.ctx || 'Feature')}</span><span></span></div>
      <div class="center">${center}</div>${controls}</div></div>`;
    tick();
  }

  function checkSheet() {
    const c = V.fcheck, x = F().items.find(i => i.id === c.id);
    const opts = (k, list) => `<div class="opts" style="margin-bottom:16px">${list.map(([v, l]) =>
      `<button type="button" data-act="fc-set" data-k="${k}" data-v="${v}" class="${c[k] != null && String(c[k]) === String(v) ? 'on' : ''}">${l}</button>`).join('')}</div>`;
    return `<div class="sheet-bg ${c.fresh ? 'enter' : ''}" data-act="fc-cancel-bg"><div class="sheet">
      <h2>Check in</h2>
      <p class="muted" style="margin:-6px 0 16px">${esc(x.ctx || 'Context')}: <b style="color:var(--text)">${esc(x.text)}</b></p>
      <p class="label">How often did you notice it?</p>
      ${opts('rating', [[0, 'Never'], [1, 'Once'], [2, 'A few times'], [3, 'Often'], [4, 'Constantly']])}
      <p class="label">Did it come up without you calling it?</p>
      ${opts('unbidden', [[1, 'Yes'], [0, 'No']])}
      <p class="label">When did it stop presenting? <span style="text-transform:none;letter-spacing:0">(optional)</span></p>
      ${opts('stopped', [['still', 'Still going'], ['lt1', 'Under 1h'], ['1to3', '1–3h'], ['gt3', '3h+'], ['never', 'Didn’t start']])}
      <button class="btn primary block" data-act="fc-save" ${c.rating == null || c.unbidden == null ? 'disabled' : ''}>Save check-in</button>
      <button class="btn ghost block" data-act="fc-cancel" style="margin-top:8px">Cancel</button>
    </div></div>`;
  }

  const anySheet = () => !!(V.edit || V.data || V.whatsNew || V.wedit || V.fcheck || V.tedit || V.nadd || V.ngoals || V.nprep);

  /* ---------- timers ---------- */

  function tick() {
    const clock = document.getElementById('clock');
    if (drillRun) {
      // no countdown on screen: the drill only advances on its own clock
      if (Date.now() >= drillRun.end) advanceDrill();
    } else if (featRun && !featRun.held && featRun.end) {
      const left = featRun.end - Date.now(), bar = document.getElementById('bar');
      if (left <= 0) { featRun.held = true; stopTicker(); beep(784, 0.35); return renderFeatRun(); }
      if (clock) clock.textContent = mmss(left / 1000);
      if (bar) bar.style.width = (100 * (1 - left / 30000)) + '%';
    } else if (run && run.autoAt && run.phase !== 'step') {
      const left = run.autoAt - Date.now();
      if (left <= 0) return run.phase === 'between' ? beginStep(run.idx + 1) : chainNext();
      const a = document.getElementById('autoleft'), fg = document.getElementById('autofg');
      if (a) a.textContent = Math.ceil(left / 1000);
      if (fg) fg.style.strokeDashoffset = String(2 * Math.PI * 28 * (1 - left / AUTO_MS));
    } else if (run && run.phase === 'step') {
      const left = runLeft(), seg = document.getElementById('seg');
      if (!run.paused && left <= 0 && !run.over) return timeUp();
      if (clock) clock.textContent = run.over ? `+${mmss(-left / 1000)}` : mmss(left / 1000);
      document.querySelectorAll('[data-late-from]').forEach(x => { x.textContent = `late +${mmss((Date.now() - +x.dataset.lateFrom) / 1000)}`; });
      if (seg && !run.over) seg.style.width = (100 * (1 - left / run.total)) + '%';
    }
  }

  /* ---------- events ---------- */

  $app.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;

    switch (act) {
      case 'tab': V.slide = slideTo(TABS, V.tab, el.dataset.v); V.tab = el.dataset.v; V.summary = null; V.gateFx = V.tab === 'gates'; render(); break;
      case 'gate': V.gate = el.dataset.v; V.gateFx = true; render(); break;

      /* calendar */
      case 'cal': V.slide = slideTo(CALS, V.cal, el.dataset.v); V.cal = el.dataset.v; V.anchor = null; V.sel = null; render(); break;
      case 'cal-prev': case 'cal-next': {
        const a = parseKey(V.anchor || today()), dir = act === 'cal-next' ? 1 : -1;
        const nd = V.cal === 'month' ? new Date(a.getFullYear(), a.getMonth() + dir, 1) : addDays(a, 7 * dir);
        V.anchor = keyOf(nd);
        V.sel = V.cal === 'month' ? keyOf(nd) : keyOf(addDays(nd, -((nd.getDay() + 6) % 7)));
        if (keyOf(nd).slice(0, 7) === today().slice(0, 7) && V.cal === 'month') V.sel = today();
        V.slide = dir > 0 ? 'r' : 'l';
        render(); break;
      }
      case 'cal-today': V.slide = parseKey(V.anchor || today()) > new Date() ? 'l' : 'r'; V.anchor = null; V.sel = null; render(); break;
      case 'sel': V.sel = el.dataset.v; render(); break;
      case 'toggle-day': {
        // a finish time only means something when it's logged on the day itself
        const k = el.dataset.date, r = findRoutine(el.dataset.gate, el.dataset.id), v = !isDone(r.id, k);
        completeRoutine(r, v, k, k === today());
        render(); break;
      }

      /* updates */
      case 'update-later': V.update = null; render(); break;
      case 'update-now': applyUpdate(); break;
      case 'whatsnew-close-bg': if (e.target !== el) break;
      // fallthrough
      case 'whatsnew-close': V.whatsNew = false; S.seenVersion = APP_VERSION; save(); render(); break;

      /* backup */
      case 'data': V.data = true; render(); break;
      case 'data-close-bg': if (e.target !== el) break;
      // fallthrough
      case 'data-close': V.data = false; render(); break;
      case 'backup-save': {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(backupBlob());
        a.download = backupName();
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        markBackedUp(); break;
      }
      case 'backup-share': {
        const file = new File([backupBlob()], backupName(), { type: 'application/json' });
        navigator.share({ files: [file], title: 'MetaMorph backup' }).then(markBackedUp).catch(() => {});
        break;
      }
      case 'backup-restore': document.getElementById('restorefile').click(); break;
      case 'persist':
        (async () => {
          try { storageInfo.persisted = await navigator.storage.persist(); } catch (e) {}
          if (!storageInfo.persisted) alert('The browser declined. Installing the app to your home screen usually lets it protect storage.');
          render();
        })();
        break;

      /* routines */
      case 'run': if (swipe.justSwiped) break; startRoutine(el.dataset.gate, el.dataset.id); break;
      case 'toggle': {
        const r = findRoutine(V.gate, el.dataset.id);
        completeRoutine(r, !isDone(r.id));
        render(); break;
      }
      case 'complete': completeRoutine(findRoutine(el.dataset.gate, el.dataset.id), true); buzz(); render(); break;
      case 'step-toggle': {
        const r = findRoutine(el.dataset.gate, el.dataset.id), x = r.steps[Number(el.dataset.i)], v = !isDone(x.id);
        setDone(x.id, v);
        if (v && r.steps.every(y => isDone(y.id))) completeRoutine(r, true);
        else if (!v && isDone(r.id)) { setDone(r.id, false); setFin(r.id, null); save(); }
        buzz(); render(); break;
      }

      /* practice */
      case 'ptab': V.slide = slideTo(['feature', 'drill'], V.ptab, el.dataset.v); V.ptab = el.dataset.v; render(); break;

      /* to-do */
      case 'todo-when': V.todoWhen = el.dataset.v; render(); break;
      case 'todo-toggle': {
        if (swipe.justSwiped) break;
        const x = S.todos.find(t => t.id === el.dataset.id);
        if (x) { setTodo(x, !x.done); if (x.done) buzz(); }
        render(); break;
      }
      case 'todo-edit': { const x = S.todos.find(t => t.id === el.dataset.id); V.tedit = { ...x, fresh: true }; render(); break; }
      case 'todo-del':
        if (confirm('Delete this task?')) { S.todos = S.todos.filter(t => t.id !== el.dataset.id); V.tedit = null; save(); render(); }
        break;
      case 'todo-clear': S.todos = S.todos.filter(t => !t.done); save(); render(); break;
      case 'todo-cancel-bg': if (e.target !== el) break;
      // fallthrough
      case 'todo-cancel': V.tedit = null; render(); break;

      /* nutrition */
      case 'n-add': V.nadd = { meal: el.dataset.meal, mode: N().foods.length || N().preps.some(x => x.left > 0) ? 'saved' : 'new', q: '', qty: 1, fresh: true }; render(); break;
      case 'n-mode': V.nadd.mode = el.dataset.v; render(); break;
      case 'n-qty': V.nadd.qty = Math.max(0.5, r1(V.nadd.qty + Number(el.dataset.d))); render(); break;
      case 'n-pick': {
        const a = V.nadd;
        if (el.dataset.kind === 'prep') { const x = N().preps.find(y => y.id === el.dataset.id); logFood(a.meal, { name: x.name, ...x.per }, Math.min(a.qty, x.left), 'prep', x.id); }
        else { const x = N().foods.find(y => y.id === el.dataset.id); logFood(a.meal, x, a.qty, 'food', x.id); }
        V.nadd = null; buzz(); render(); break;
      }
      case 'n-food-del':
        if (confirm('Forget this saved food? Past entries stay.')) { N().foods = N().foods.filter(x => x.id !== el.dataset.id); save(); render(); }
        break;
      case 'n-del': {
        const k = today(), x = nLog(k).find(y => y.id === el.dataset.id);
        if (x && x.src === 'prep') { const pr = N().preps.find(y => y.id === x.ref); if (pr) pr.left = Math.min(pr.portions, r1(pr.left + x.qty)); }
        N().log[k] = nLog(k).filter(y => y.id !== el.dataset.id); save(); render(); break;
      }
      case 'n-cancel-bg': if (e.target !== el) break;
      // fallthrough
      case 'n-cancel': V.nadd = null; render(); break;
      case 'n-goals': V.ngoals = { ...N().goals, fresh: true }; render(); break;
      case 'n-goals-calc': {
        const f = document.getElementById('ngoalf'); const el2 = f.elements;
        el2.kcal.value = kcalOf(+el2.p.value || 0, +el2.c.value || 0, +el2.f.value || 0); break;
      }
      case 'n-goals-cancel-bg': if (e.target !== el) break;
      // fallthrough
      case 'n-goals-cancel': V.ngoals = null; render(); break;
      case 'n-prep-new': V.nprep = { fresh: true, name: '', portions: 4, items: [{ name: '', kcal: '', p: '', c: '', f: '' }] }; render(); break;
      case 'n-ing-add': syncPrep(); V.nprep.items.push({ name: '', kcal: '', p: '', c: '', f: '' }); render(); break;
      case 'n-ing-rm': syncPrep(); V.nprep.items.splice(Number(el.dataset.i), 1); render(); break;
      case 'n-ing-food': {
        syncPrep();
        const f = document.getElementById('nprepf'), x = N().foods.find(y => y.id === f.elements.pickfood.value), q = +f.elements.pickqty.value || 1;
        if (x) V.nprep.items.push({ name: `${x.name}${q !== 1 ? ' × ' + r1(q) : ''}`, kcal: r1(x.kcal * q), p: r1(x.p * q), c: r1(x.c * q), f: r1(x.f * q) });
        render(); break;
      }
      case 'n-prep-cancel-bg': if (e.target !== el) break;
      // fallthrough
      case 'n-prep-cancel': V.nprep = null; render(); break;
      case 'n-prep-log': { const x = N().preps.find(y => y.id === el.dataset.id); logFood(mealNow(), { name: x.name, ...x.per }, 1, 'prep', x.id); buzz(); render(); break; }
      case 'n-prep-del':
        if (confirm('Delete this meal prep? Logged portions stay in your history.')) { N().preps = N().preps.filter(x => x.id !== el.dataset.id); save(); render(); }
        break;
      case 'r-pause':
        if (run.over) break;
        if (run.paused) { run.end = Date.now() + run.remaining; run.paused = false; }
        else { run.remaining = run.end - Date.now(); run.paused = true; }
        saveRun(); renderRun(); break;
      case 'r-done': finishStep(); break;
      case 'r-next': beginStep(run.idx + 1); break;
      case 'r-late-done': {
        const o = (run.open || []).find(x => x.id === el.dataset.id);
        if (o) { closeLate(o); buzz(); saveRun(); renderRun(); }
        break;
      }
      case 'r-hold': run.autoAt = null; saveRun(); renderRun(); break;
      case 'r-chain': chainNext(); break;
      case 'r-end':
      case 'r-close': endRun(); break;
      case 'r-exit':
        if (run.phase !== 'step' || confirm('End the routine here? Finished steps stay done.')) endRun();
        break;

      /* editing */
      case 'add':
        V.edit = { gate: V.gate, isNew: true, fresh: true, r: routine('', '12:00', [step('', 10)]) };
        render(); break;
      case 'edit': {
        const r = findRoutine(V.gate, el.dataset.id);
        V.edit = { gate: V.gate, isNew: false, fresh: true, r: JSON.parse(JSON.stringify(r)) };
        render(); break;
      }
      case 's-add': syncEdit(); V.edit.r.steps.push(step('', 5)); render();
        setTimeout(() => { const f = document.getElementById('editform'); f && f.elements['st' + (V.edit.r.steps.length - 1)].focus(); }, 0);
        break;
      case 's-up': case 's-down': {
        syncEdit();
        const i = Number(el.dataset.i), j = act === 's-up' ? i - 1 : i + 1, st = V.edit.r.steps;
        [st[i], st[j]] = [st[j], st[i]];
        render(); break;
      }
      case 's-del': syncEdit(); V.edit.r.steps.splice(Number(el.dataset.i), 1); render(); break;
      case 'edit-cancel-bg': if (e.target !== el) break; // only when tapping the backdrop
      // fallthrough
      case 'edit-cancel': V.edit = null; render(); break;
      case 'delete':
        if (confirm('Delete this routine?')) {
          S.gates[V.edit.gate] = S.gates[V.edit.gate].filter(r => r.id !== V.edit.r.id);
          save(); V.edit = null; render();
        }
        break;

      /* drill */
      case 'dset': S.drill[el.dataset.k] = Number(el.dataset.v); save(); render(); break;
      case 'cue-return': unlockAudio(); cueReturn(); break;
      case 'cue-release': unlockAudio(); cueRelease(); break;
      case 'drill-start': startDrill(); break;
      case 'drill-stop': finishDrill(); break;
      case 'summary-ok': V.summary = null; render(); break;

      /* water */
      case 'w-add': {
        const st = wState();
        V.wFrom = Math.min(100, 100 * st.got / st.target);
        addWater(Number(el.dataset.ml)); buzz(); render(); break;
      }
      case 'w-undo': {
        const k = today(), st = wState();
        V.wFrom = Math.min(100, 100 * st.got / st.target);
        if (W().log[k] && W().log[k].length) { W().log[k].pop(); save(); }
        render(); break;
      }
      case 'w-del': {
        const k = today(), t = Number(el.dataset.t), st = wState();
        V.wFrom = Math.min(100, 100 * st.got / st.target);
        W().log[k] = wLog(k).filter(e => e.t !== t); save(); render(); break;
      }
      case 'w-snooze': W().snooze = { [today()]: el.dataset.id }; save(); render(); break;
      case 'w-ics': deliver(waterICS(), 'metamorph-water.ics', 'Water reminders'); break;
      case 'w-edit': {
        const w = W();
        V.wedit = { fresh: true, unit: w.unit, target: w.target, pour: w.pour, wake: w.wake, bed: w.bed, schedule: w.schedule.map(x => ({ ...x })) };
        render(); break;
      }
      case 'w-auto': syncWEdit(); V.wedit.schedule = autoSchedule(V.wedit.target, V.wedit.pour, V.wedit.wake, V.wedit.bed); render(); break;
      case 'w-addrow': {
        syncWEdit();
        const sc = V.wedit.schedule, last = sc.length ? sc[sc.length - 1].time : '11:00';
        sc.push({ id: uid(), time: fromMinHM(toMin(last) + 60), amount: V.wedit.pour });
        render(); break;
      }
      case 'w-rm': syncWEdit(); V.wedit.schedule.splice(Number(el.dataset.i), 1); render(); break;
      case 'w-cancel-bg': if (e.target !== el) break;
      // fallthrough
      case 'w-cancel': V.wedit = null; render(); break;

      /* feature law */
      case 'f-ctx': V.fDraft.ctx = el.dataset.v; render(); break;
      case 'f-load': {
        const text = V.fDraft.text.trim();
        if (!text) { alert('Write the one feature you’ll notice.'); break; }
        const mode = F().experiment && Math.random() < 1 / 3 ? 'control' : 'loaded';
        const item = { id: uid(), ctx: V.fDraft.ctx.trim(), text, t: Date.now(), mode, check: null };
        F().items.push(item);
        if (F().items.length > 1000) F().items.shift();
        save();
        V.fDraft.text = '';
        unlockAudio();
        featRun = { id: item.id, mode, end: mode === 'loaded' ? Date.now() + 30000 : null, held: false };
        if (mode === 'loaded') { lockScreen(); startTicker(); beep(660, 0.2); }
        render(); break;
      }
      case 'f-discard':
        if (confirm('Discard this trial? It won’t count toward the results.')) { F().items = F().items.filter(i => i.id !== el.dataset.id); save(); render(); }
        break;
      case 'f-done': featRun = null; stopTicker(); unlockScreen(); render(); break;
      case 'f-check': V.fcheck = { id: el.dataset.id, fresh: true, rating: null, unbidden: null, stopped: null }; render(); break;
      case 'fc-set': {
        const k = el.dataset.k, v = el.dataset.v;
        V.fcheck[k] = k === 'stopped' ? (V.fcheck.stopped === v ? null : v) : Number(v);
        render(); break;
      }
      case 'fc-save': {
        const c = V.fcheck, x = F().items.find(i => i.id === c.id);
        x.check = { rating: c.rating, unbidden: !!c.unbidden, stopped: c.stopped, t: Date.now() };
        save(); V.fcheck = null; render(); break;
      }
      case 'fc-cancel-bg': if (e.target !== el) break;
      // fallthrough
      case 'fc-cancel': V.fcheck = null; render(); break;
    }
  });

  // switching the repeat type shows its day/date pickers; restore reads the chosen backup file
  $app.addEventListener('change', e => {
    if (e.target.name === 'rt') { syncEdit(); render(); }
    if (e.target.name === 'w_unit') { syncWEdit(); render(); }
    if (e.target.id === 'fexp') { F().experiment = e.target.checked; save(); }
    if (e.target.id === 'restorefile' && e.target.files[0]) {
      e.target.files[0].text().then(txt => {
        let payload;
        try { payload = JSON.parse(txt); } catch (err) { return alert('That file is not a MetaMorph backup.'); }
        const data = payload && payload.app === 'metamorph' ? payload.data : payload;
        if (!valid(data)) return alert('That file is not a MetaMorph backup.');
        const when = payload.exported ? new Date(payload.exported).toLocaleString() : 'an unknown date';
        if (!confirm(`Replace everything on this device with the backup from ${when}?`)) return;
        stopTicker(); run = null; drillRun = null;
        replaceState(data);
        S.run = null;
        save();
        V.data = false;
        render();
        alert('Backup restored.');
      });
    }
  });

  /* ---------- swipe a timeline item: right = held, left = undo ---------- */
  const swipe = { s: null, justSwiped: false };
  const TRIGGER = 80;
  $app.addEventListener('pointerdown', e => {
    if (drillRun && e.target.closest('#tapzone')) { e.preventDefault(); drillTap(); return; }
    const it = e.target.closest('.tl .it');
    if (!it || e.button > 0) return;
    swipe.s = { it, li: it.parentElement, id: e.pointerId, x: e.clientX, y: e.clientY, dx: 0, on: false };
  });
  $app.addEventListener('pointermove', e => {
    const w = swipe.s;
    if (!w || e.pointerId !== w.id) return;
    const dx = e.clientX - w.x, dy = e.clientY - w.y;
    if (!w.on) {
      if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        w.on = true;
        try { w.it.setPointerCapture(e.pointerId); } catch (err) {}
      } else if (Math.abs(dy) > 10) { swipe.s = null; return; }
    }
    if (!w.on) return;
    w.dx = dx;
    w.it.classList.remove('snap');
    w.it.style.transform = `translateX(${dx}px)`;
    w.li.dataset.dir = dx > 0 ? 'r' : 'l';
    const armed = Math.abs(dx) > TRIGGER;
    if (armed !== w.li.classList.contains('armed')) { w.li.classList.toggle('armed', armed); if (armed) buzz(); }
  });
  function endSwipe(e) {
    const w = swipe.s;
    if (!w || e.pointerId !== w.id) return;
    swipe.s = null;
    if (!w.on) return;
    swipe.justSwiped = true;
    setTimeout(() => { swipe.justSwiped = false; }, 350);
    const go = Math.abs(w.dx) > TRIGGER && e.type === 'pointerup';
    w.it.classList.add('snap');
    w.it.style.transform = go ? `translateX(${w.dx > 0 ? '100%' : '-100%'})` : '';
    if (!go) { setTimeout(() => { delete w.li.dataset.dir; w.li.classList.remove('armed'); }, 250); return; }
    const v = w.dx > 0;
    if (w.it.dataset.todo) { const x = S.todos.find(t => t.id === w.it.dataset.id); if (x) setTodo(x, v); }
    else completeRoutine(findRoutine(w.it.dataset.gate, w.it.dataset.id), v);
    setTimeout(render, 220);
  }
  $app.addEventListener('pointerup', endSwipe);
  $app.addEventListener('pointercancel', endSwipe);

  // live phrasing check for the Feature Law, without re-rendering while typing
  $app.addEventListener('input', e => {
    const ta = e.target.closest && e.target.closest('#todoadd');
    if (ta) V.todoDraft = { text: ta.elements.text.value, date: ta.elements.date.value, time: ta.elements.time.value };
    if (e.target.id === 'nsearch') {
      const q = e.target.value.toLowerCase();
      V.nadd.q = e.target.value;
      document.querySelectorAll('.foodlist li[data-name]').forEach(li => { li.hidden = !!q && !li.dataset.name.includes(q); });
    }
    if (e.target.closest && e.target.closest('#nprepf')) {
      syncPrep();
      const t = document.getElementById('preptot');
      if (t) t.innerHTML = prepTotalsText(V.nprep);
    }
    if (e.target.id === 'fctx') V.fDraft.ctx = e.target.value;
    if (e.target.id === 'ftext') {
      V.fDraft.text = e.target.value;
      const h = document.getElementById('fhint'), l = lintFeature(e.target.value);
      if (h) { h.className = 'hint ' + (l ? l.lvl : ''); h.textContent = l ? l.msg : ''; }
    }
  });

  $app.addEventListener('submit', e => {
    const f = e.target;
    if (f.id === 'todoadd') {
      e.preventDefault();
      const text = f.elements.text.value.trim();
      if (!text) return;
      const date = f.elements.date.value || (V.todoWhen === 'today' ? today() : V.todoWhen === 'tomorrow' ? keyOf(addDays(new Date(), 1)) : null);
      S.todos.push({ id: uid(), text, date, time: f.elements.time.value || null, done: false, doneAt: null, created: Date.now() });
      V.todoDraft = { text: '', date: '', time: '' };
      save(); render();
      const inp = document.querySelector('#todoadd input[name=text]'); if (inp) inp.focus();
      return;
    }
    if (f.id === 'todoform') {
      e.preventDefault();
      const x = S.todos.find(t => t.id === V.tedit.id);
      if (x) Object.assign(x, { text: f.elements.text.value.trim() || x.text, date: f.elements.date.value || null, time: f.elements.time.value || null });
      save(); V.tedit = null; render();
      return;
    }
    if (f.id === 'nnew') {
      e.preventDefault();
      const el = f.elements, p = +el.p.value || 0, c = +el.c.value || 0, fat = +el.f.value || 0;
      const item = { id: uid(), name: el.name.value.trim(), serving: el.serving.value.trim(), p, c, f: fat, kcal: el.kcal.value === '' ? kcalOf(p, c, fat) : +el.kcal.value };
      if (!item.name) return;
      if (el.keep.checked) N().foods.push(item);
      logFood(V.nadd.meal, item, Math.max(0.25, +el.qty.value || 1), el.keep.checked ? 'food' : 'quick', el.keep.checked ? item.id : null);
      V.nadd = null; buzz(); render();
      return;
    }
    if (f.id === 'ngoalf') {
      e.preventDefault();
      for (const [m] of MAC) N().goals[m] = Math.max(0, Math.round(+f.elements[m].value || 0));
      save(); V.ngoals = null; render();
      return;
    }
    if (f.id === 'nprepf') {
      e.preventDefault();
      syncPrep();
      const ed = V.nprep, items = ed.items.filter(x => x.name.trim() || x.kcal !== '' || +x.p || +x.c || +x.f)
        .map(x => { const p = +x.p || 0, c = +x.c || 0, fat = +x.f || 0; return { name: x.name.trim() || 'Ingredient', kcal: x.kcal === '' ? kcalOf(p, c, fat) : x.kcal, p, c, f: fat }; });
      if (!items.length) return alert('Add at least one ingredient.');
      const t = prepTotals(items), n = ed.portions;
      N().preps.unshift({ id: uid(), name: ed.name.trim() || 'Meal prep', portions: n, left: n, made: today(), created: Date.now(), items,
        per: { kcal: t.kcal / n, p: t.p / n, c: t.c / n, f: t.f / n } });
      save(); V.nprep = null; render();
      return;
    }
    if (e.target.id === 'wcustom') {
      e.preventDefault();
      const v = Number(e.target.elements.amt.value);
      if (v > 0) {
        const st = wState();
        V.wFrom = Math.min(100, 100 * st.got / st.target);
        addWater(W().unit === 'oz' ? v * ML_OZ : v); buzz(); render();
      }
      return;
    }
    if (e.target.id === 'wform') {
      e.preventDefault();
      syncWEdit();
      const ed = V.wedit;
      Object.assign(W(), { unit: ed.unit, target: ed.target, pour: ed.pour, wake: ed.wake, bed: ed.bed, schedule: ed.schedule, scheduleInit: true });
      save(); V.wedit = null; render();
      return;
    }
    if (e.target.id !== 'editform') return;
    e.preventDefault();
    syncEdit();
    const r = V.edit.r;
    if (r.repeat.type === 'weekly' && !r.repeat.days.length) return alert('Pick at least one day of the week.');
    if (r.repeat.type === 'monthly' && !r.repeat.dates.length) return alert('Pick at least one date of the month.');
    r.title = r.title.trim() || 'Untitled';
    r.steps.forEach(s => { s.title = s.title.trim() || 'Step'; s.work = s.work.trim(); });
    const list = S.gates[V.edit.gate];
    const i = list.findIndex(x => x.id === r.id);
    if (i >= 0) list[i] = r; else list.push(r);
    save(); V.edit = null; render();
  });

  // keep "now" / "in Xm" fresh while idle
  const typing = () => $app.contains(document.activeElement) && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  setInterval(() => { if (!drillRun && !run && !featRun && !anySheet() && !swipe.s && !typing()) render(); }, 30000);

  // after an update (or the first open of a new version), show what changed
  try {
    if (localStorage.getItem('metamorph.updated')) { V.whatsNew = true; localStorage.removeItem('metamorph.updated'); }
  } catch (e) {}
  if (S.seenVersion !== APP_VERSION) {
    if (fromLocal) V.whatsNew = true;      // existing user on a new version
    else S.seenVersion = APP_VERSION;      // fresh install: nothing to announce
  }

  resumeRun();
  render();

  /* ---------- updates ---------- */

  let updating = false;
  function showUpdate(worker) {
    V.update = worker;
    V.toastFx = true;
    if (!run && !drillRun) render();
  }
  function applyUpdate() {
    const w = V.update;
    if (!w) return;
    if (drillRun && !confirm('Updating ends the current drill session. Update now?')) return;
    updating = true;
    try { localStorage.setItem('metamorph.updated', '1'); } catch (e) {}
    save();
    w.postMessage({ type: 'SKIP_WAITING' });
    // fallback in case the controller change event doesn't arrive
    setTimeout(() => location.reload(), 3000);
  }

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').then(reg => {
      const watch = w => w && w.addEventListener('statechange', () => {
        if (w.state === 'installed' && navigator.serviceWorker.controller) showUpdate(w);
      });
      // a new version may already be downloaded and waiting
      if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
      watch(reg.installing);
      reg.addEventListener('updatefound', () => watch(reg.installing));
      // look for new versions when the app comes back to the front, and hourly while open
      const check = () => reg.update().catch(() => {});
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
      setInterval(check, 60 * 60 * 1000);
    }).catch(() => {});

    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (updating) location.reload();
    });
  }
})();
</script>
</body>
</html>
