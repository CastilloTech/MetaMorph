<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MetaMorph</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #0f1115;
    --surface: #171a21;
    --surface-2: #1f232c;
    --line: #2a2f3a;
    --text: #e8e6e1;
    --muted: #8b8f98;
    --accent: #c9a45c;
    --accent-ink: #1a1408;
    --focus: #c9a45c;
    --release: #6f8fb5;
    --ok: #6fae8b;
    --danger: #c46a6a;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-variant-emoji: text;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }

  #app { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
  header {
    padding: calc(14px + env(safe-area-inset-top)) 16px 10px;
    display: flex; align-items: baseline; justify-content: space-between;
  }
  header h1 { font-size: 20px; margin: 0; letter-spacing: .04em; font-weight: 600; }
  header .date { color: var(--muted); font-size: 14px; }
  main { flex: 1; padding: 4px 16px calc(96px + env(safe-area-inset-bottom)); }

  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
  }
  nav.tabs .inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  nav.tabs button { padding: 12px 6px; border-radius: 12px; color: var(--muted); font-weight: 600; transition: background .2s, color .2s; }
  nav.tabs button.on { background: var(--surface-2); color: var(--text); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .label { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; margin: 0 0 8px; }
  .muted { color: var(--muted); }
  .row { display: flex; align-items: center; gap: 12px; }
  .spread { justify-content: space-between; }
  .num { font-variant-numeric: tabular-nums; }

  .btn { padding: 14px 18px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); font-weight: 600; transition: transform .1s; }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.ghost { background: none; }
  .btn.danger { color: var(--danger); }
  .btn.block { width: 100%; }
  .btn.small { padding: 8px 12px; font-size: 14px; }

  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideup { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); } 50% { box-shadow: 0 0 0 6px transparent; } }

  /* ---------- today ---------- */
  .hero { border-color: var(--accent); }
  .hero .when { color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .2em; }
  .hero .ti { font-size: 22px; font-weight: 600; margin: 4px 0 2px; }
  .hero .meta { color: var(--muted); font-size: 14px; }
  .hero .chain { margin: 12px 0 14px; font-size: 14px; color: var(--muted); }
  .hero .chain b { color: var(--text); font-weight: 500; }
  .hero .chain s { text-decoration: none; color: var(--ok); }

  .tl { list-style: none; margin: 8px 0 0; padding: 0; position: relative; }
  .tl::before { content: ""; position: absolute; left: 59px; top: 14px; bottom: 14px; width: 2px; background: var(--line); }
  .tl li { display: grid; grid-template-columns: 44px 16px 1fr auto; gap: 10px; align-items: start; padding: 10px 0; position: relative; }
  .tl .t { font-size: 13px; color: var(--muted); padding-top: 2px; text-align: right; }
  .tl .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--bg); border: 2px solid var(--line); margin-top: 4px; position: relative; z-index: 1; }
  .tl li.done .dot { background: var(--ok); border-color: var(--ok); }
  .tl li.now .dot { border-color: var(--accent); background: var(--accent); animation: pulse 2s infinite; }
  .tl .nm { font-weight: 600; }
  .tl .sub { font-size: 13px; color: var(--muted); }
  .tl li.done .nm { color: var(--muted); }
  .tl .st { font-size: 13px; color: var(--muted); padding-top: 2px; white-space: nowrap; }
  .tl li.now .st { color: var(--accent); font-weight: 600; }
  .tl li.done .st { color: var(--ok); }
  .tl li[data-act] { cursor: pointer; }

  /* ---------- gates ---------- */
  .gatebar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 14px; }
  .gatebar button { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 4px; text-align: center; transition: border-color .2s, background .2s; }
  .gatebar button.on { border-color: var(--accent); background: var(--surface-2); }
  .gatebar .ic { font-size: 20px; display: block; }
  .gatebar .nm { font-size: 13px; font-weight: 600; display: block; }
  .gatebar .ct { font-size: 12px; color: var(--muted); display: block; }

  .rhead { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
  .chk { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; font-size: 16px; transition: background .2s, border-color .2s; }
  .chk.done { background: var(--ok); border-color: var(--ok); color: #0d1a12; }
  .rhead .t { color: var(--muted); font-size: 14px; }
  .rhead .ti { font-weight: 600; font-size: 17px; }
  .card.now { border-color: var(--accent); }
  .tag { font-size: 11px; color: var(--accent); letter-spacing: .1em; text-transform: uppercase; margin-left: 6px; }

  .chainlist { list-style: none; margin: 12px 0 0; padding: 12px 0 0 0; border-top: 1px solid var(--line); }
  .chainlist li { display: grid; grid-template-columns: 44px 12px 1fr auto; gap: 10px; align-items: center; font-size: 14px; padding: 3px 0; position: relative; }
  .chainlist li + li::before { content: ""; position: absolute; left: 59px; top: -8px; height: 14px; width: 2px; background: var(--line); }
  .chainlist .t { color: var(--muted); text-align: right; font-size: 13px; }
  .chainlist .d { width: 8px; height: 8px; border-radius: 50%; background: var(--line); margin-left: 2px; }
  .chainlist li.done .d { background: var(--ok); }
  .chainlist .m { color: var(--muted); font-size: 13px; }
  .acts { display: flex; gap: 8px; margin-top: 12px; }
  .acts .btn { flex: 1; }

  /* ---------- drill ---------- */
  .stepper { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .step { background: var(--surface-2); border-radius: 12px; padding: 10px; text-align: center; }
  .step .v { font-size: 22px; font-weight: 600; }
  .step .k { font-size: 12px; color: var(--muted); }
  .step .pm { display: flex; justify-content: space-between; margin-top: 6px; }
  .step .pm button { width: 32px; height: 32px; border-radius: 8px; background: var(--surface); font-size: 18px; }
  .hist { list-style: none; margin: 0; padding: 0; }
  .hist li { display: flex; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .hist li:first-child { border-top: 0; }

  /* ---------- run screen ---------- */
  .run { position: fixed; inset: 0; background: var(--bg); z-index: 20; display: flex; flex-direction: column;
         padding: calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom)); animation: fade .25s ease; }
  .run .inner { max-width: 560px; width: 100%; margin: 0 auto; flex: 1; display: flex; flex-direction: column; }
  .run .top { display: flex; justify-content: space-between; align-items: center; color: var(--muted); gap: 12px; }
  .run .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; animation: rise .35s ease; }
  .phase { font-size: 15px; letter-spacing: .3em; font-weight: 700; }
  .clock { font-size: 84px; font-weight: 300; font-variant-numeric: tabular-nums; line-height: 1; }
  .instr { color: var(--muted); max-width: 30ch; font-size: 17px; }
  .ritual { font-size: 22px; max-width: 24ch; line-height: 1.35; }
  .stepname { font-size: 30px; font-weight: 600; max-width: 18ch; line-height: 1.2; }
  .bigtap { width: 100%; padding: 26px; border-radius: 18px; font-size: 20px; font-weight: 700; }
  .bigtap.lock { background: var(--focus); color: var(--accent-ink); }
  .bigtap.catch { background: var(--surface-2); border: 1px solid var(--line); }
  .bigtap.wait { background: none; border: 1px dashed var(--line); color: var(--muted); }
  .bar { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; width: 100%; }
  .bar > i { display: block; height: 100%; background: currentColor; width: 0; }
  .dots { display: flex; gap: 6px; justify-content: center; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--surface-2); }
  .dots i.on { background: var(--muted); }
  .dots i.now { background: var(--text); }
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .controls.one { grid-template-columns: 1fr; }

  .segs { display: flex; gap: 4px; margin: 14px 0 0; }
  .segs > span { height: 5px; border-radius: 3px; background: var(--surface-2); overflow: hidden; min-width: 8px; }
  .segs > span > i { display: block; height: 100%; width: 0; background: var(--accent); }
  .segs > span.done > i { width: 100%; background: var(--ok); }
  .seglabels { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 8px; }
  .check { width: 64px; height: 64px; border-radius: 50%; background: var(--ok); color: #0d1a12; display: grid; place-items: center; font-size: 30px; }
  .upnext { color: var(--muted); font-size: 12px; letter-spacing: .25em; font-weight: 700; margin-top: 18px; }
  .recap { list-style: none; padding: 0; margin: 4px 0 0; color: var(--muted); font-size: 15px; }
  .recap li::before { content: "✓  "; color: var(--ok); }

  /* ---------- sheet ---------- */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
  .sheet-bg.enter { animation: fade .2s ease; }
  .sheet-bg.enter .sheet { animation: slideup .28s cubic-bezier(.2,.8,.2,1); }
  .sheet { background: var(--surface); border-top-left-radius: 20px; border-top-right-radius: 20px; width: 100%; max-width: 560px;
           max-height: 92vh; overflow-y: auto; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); }
  .sheet h2 { margin: 0 0 14px; font-size: 18px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .field input, .srow input {
    width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px;
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .srow { border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 8px; display: grid; gap: 8px; }
  .srow .top { display: grid; grid-template-columns: 26px 1fr 76px; gap: 8px; align-items: center; }
  .srow .n { width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 13px; color: var(--muted); }
  .srow input { padding: 10px; }
  .srow .tools { display: flex; gap: 6px; justify-content: flex-end; }
  .srow .tools button { padding: 6px 10px; border-radius: 8px; background: var(--surface-2); font-size: 14px; color: var(--muted); }
  .srow .tools button:disabled { opacity: .35; }
  .total { color: var(--muted); font-size: 14px; margin: 4px 0 14px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(() => {
  'use strict';

  /* ---------- data ---------- */

  const GATES = [
    { id: 'sleep',     name: 'Sleep',     icon: '☾' },
    { id: 'fitness',   name: 'Fitness',   icon: '△' },
    { id: 'nutrition', name: 'Nutrition', icon: '◐' },
    { id: 'hygiene',   name: 'Hygiene',   icon: '◇' },
  ];
  const gateOf = id => GATES.find(g => g.id === id);

  const KEY = 'metamorph.v1';
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  const step = (title, minutes, work = '') => ({ id: uid(), title, minutes, work });
  const routine = (title, start, steps) => ({ id: uid(), title, start, steps });

  function seed() {
    return {
      v: 2,
      gates: {
        sleep: [
          routine('Night routine', '22:00', [step('Tidy the room', 10), step('Wind-down', 20, 'No screens. Let the day go.')]),
        ],
        fitness: [
          routine('Training', '07:00', [step('Warm-up', 10), step('Train', 30), step('Cool-down', 5)]),
        ],
        nutrition: [
          routine('Breakfast', '08:00', [step('Eat', 20, 'Water and protein.')]),
          routine('Lunch',     '12:30', [step('Eat', 30, 'Water and protein.')]),
          routine('Dinner',    '18:30', [step('Eat', 30, 'Water and protein.')]),
        ],
        hygiene: [
          routine('Morning routine', '06:30', [step('Cold water', 2), step('Teeth', 3), step('Skincare', 5)]),
          routine('Evening routine', '21:30', [step('Teeth', 3), step('Shower', 12)]),
        ],
      },
      done: {},
      drill: { focus: 30, release: 30, rounds: 8, sessions: [] },
    };
  }

  // v1 stored single blocks; each becomes a one-step routine (ids kept so today's done marks survive)
  function migrate(s) {
    if (s.v === 1) {
      for (const g of Object.keys(s.gates)) {
        s.gates[g] = s.gates[g].map(b => ({
          id: b.id, title: b.title, start: b.start,
          steps: [step(b.title, Math.max(1, Number(b.minutes) || 1), b.work || '')],
        }));
      }
      s.v = 2;
    }
    return s;
  }

  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s && (s.v === 1 || s.v === 2)) return migrate(s);
    } catch (e) {}
    return seed();
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  }

  const S = load();
  const today = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  };

  // drop done-marks older than 60 days
  (() => {
    const cutoff = Date.now() - 60 * 864e5;
    for (const k of Object.keys(S.done)) if (new Date(k).getTime() < cutoff) delete S.done[k];
    save();
  })();

  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

  /* ---------- helpers ---------- */

  const $app = document.getElementById('app');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const mmss = sec => {
    sec = Math.max(0, Math.ceil(sec));
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = String(sec % 60).padStart(2, '0');
    return h ? `${h}:${String(m).padStart(2, '0')}:${s}` : `${m}:${s}`;
  };
  const toMin = hhmm => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };
  const fromMin = m => { m = ((m % 1440) + 1440) % 1440; return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; };
  const dur = m => m < 60 ? `${m}m` : `${Math.floor(m / 60)}h${m % 60 ? ' ' + String(m % 60).padStart(2, '0') + 'm' : ''}`;
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };

  const total = r => r.steps.reduce((t, s) => t + Number(s.minutes), 0);
  const stepStarts = r => { let t = toMin(r.start); return r.steps.map(s => { const a = t; t += Number(s.minutes); return a; }); };
  const sorted = list => [...list].sort((a, b) => toMin(a.start) - toMin(b.start));
  const allRoutines = () => GATES.flatMap(g => S.gates[g.id].map(r => ({ gate: g.id, r })))
    .sort((a, b) => toMin(a.r.start) - toMin(b.r.start));

  const isDone = id => !!(S.done[today()] && S.done[today()][id]);
  function setDone(id, v) {
    const k = today();
    S.done[k] = S.done[k] || {};
    if (v) S.done[k][id] = true; else delete S.done[k][id];
    save();
  }
  const stepsDone = r => r.steps.filter(s => isDone(s.id)).length;

  function isNow(r) {
    const n = nowMin(), s = toMin(r.start), e = s + total(r);
    return e <= 1440 ? n >= s && n < e : n >= s || n < e - 1440;
  }
  // done | now | upcoming | open (time passed, not done)
  function status(r) {
    if (isDone(r.id)) return 'done';
    if (isNow(r)) return 'now';
    return toMin(r.start) > nowMin() ? 'upcoming' : 'open';
  }

  let ac = null;
  function unlockAudio() {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
    } catch (e) {}
  }
  function beep(freq = 660, d = 0.2) {
    try {
      unlockAudio();
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g).connect(ac.destination);
      o.start(t); o.stop(t + d + 0.05);
    } catch (e) {}
    try { navigator.vibrate && navigator.vibrate(150); } catch (e) {}
  }
  const buzz = () => { try { navigator.vibrate && navigator.vibrate(30); } catch (e) {} };

  let wake = null;
  async function lockScreen() { try { wake = await navigator.wakeLock.request('screen'); } catch (e) {} }
  function unlockScreen() { try { wake && wake.release(); } catch (e) {} wake = null; }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && (drillRun || run)) lockScreen();
  });

  /* ---------- view state ---------- */

  const V = { tab: 'today', gate: 'sleep', edit: null, summary: null };
  let drillRun = null;  // { round, phase, start, end, latencies[], catches, locked }
  let run = null;       // { gate, rid, idx, phase: step|between|complete, total, end, paused, remaining }
  let ticker = null;

  function startTicker() { stopTicker(); ticker = setInterval(tick, 200); }
  function stopTicker() { clearInterval(ticker); ticker = null; }

  /* ---------- render ---------- */

  function render() {
    if (drillRun) return renderDrillRun();
    if (run) return renderRun();

    const sheetScroll = document.querySelector('.sheet')?.scrollTop || 0;
    const dateStr = new Date().toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    const body = V.tab === 'today' ? todayView() : V.tab === 'gates' ? gatesView() : drillView();
    $app.innerHTML = `
      <header><h1>MetaMorph</h1><span class="date">${esc(dateStr)}</span></header>
      <main>${body}</main>
      <nav class="tabs"><div class="inner">
        ${[['today', 'Today'], ['gates', 'Gates'], ['drill', 'Drill']].map(([k, l]) =>
          `<button data-act="tab" data-v="${k}" class="${V.tab === k ? 'on' : ''}">${l}</button>`).join('')}
      </div></nav>
      ${V.edit ? editSheet() : ''}
    `;
    if (V.edit) {
      const sh = document.querySelector('.sheet');
      if (sh) sh.scrollTop = sheetScroll;
      V.edit.fresh = false;
    }
  }

  /* ----- today ----- */

  function chainText(r, current) {
    return r.steps.map((s, i) => {
      const t = esc(s.title);
      if (isDone(s.id)) return `<s>${t}</s>`;
      return i === current ? `<b>${t}</b>` : t;
    }).join(' → ');
  }

  function untilText(r) {
    let d = toMin(r.start) - nowMin();
    if (d < 0) d += 1440;
    return `in ${dur(d)}`;
  }

  function todayView() {
    const items = allRoutines();
    if (!items.length) return `<p class="muted">No routines yet. Add some in Gates.</p>`;

    const pick = items.find(x => status(x.r) === 'now')
      || items.find(x => status(x.r) === 'upcoming')
      || items.find(x => status(x.r) === 'open');

    let hero;
    if (pick) {
      const { gate, r } = pick, st = status(r), sd = stepsDone(r);
      const when = st === 'now' ? 'NOW' : st === 'upcoming' ? `UP NEXT · ${untilText(r).toUpperCase()}` : 'STILL OPEN';
      const firstOpen = r.steps.findIndex(s => !isDone(s.id));
      hero = `
        <div class="card hero">
          <div class="when">${when}</div>
          <div class="ti">${esc(r.title)}</div>
          <div class="meta">${gateOf(gate).icon} ${gateOf(gate).name} · <span class="num">${r.start}–${fromMin(toMin(r.start) + total(r))}</span> · ${dur(total(r))}${sd ? ` · ${sd}/${r.steps.length} steps` : ''}</div>
          <div class="chain">${chainText(r, firstOpen)}</div>
          <button class="btn primary block" data-act="run" data-gate="${gate}" data-id="${r.id}">${sd ? 'Continue' : 'Start'} ${r.steps.length > 1 ? 'routine' : ''}</button>
        </div>`;
    } else {
      hero = `<div class="card hero"><div class="when">ALL GATES HELD</div><div class="ti">Every routine is done today.</div></div>`;
    }

    const doneCount = items.filter(x => isDone(x.r.id)).length;
    return `
      ${hero}
      <div class="row spread" style="margin-top:18px"><p class="label" style="margin:0">Timeline</p><span class="muted num" style="font-size:13px">${doneCount}/${items.length} done</span></div>
      <ul class="tl">
        ${items.map(({ gate, r }) => {
          const st = status(r), sd = stepsDone(r);
          const right = st === 'done' ? '✓ done' : st === 'now' ? 'now' : st === 'upcoming' ? untilText(r) : (sd ? `${sd}/${r.steps.length}` : 'open');
          return `<li class="${st}" data-act="run" data-gate="${gate}" data-id="${r.id}">
            <span class="t num">${r.start}</span>
            <span class="dot"></span>
            <span><div class="nm">${gateOf(gate).icon} ${esc(r.title)}</div>
              <div class="sub">${r.steps.length > 1 ? r.steps.map(s => esc(s.title)).join(' → ') + ' · ' : ''}${dur(total(r))}</div></span>
            <span class="st">${right}</span>
          </li>`;
        }).join('')}
      </ul>`;
  }

  /* ----- gates ----- */

  function gatesView() {
    const g = gateOf(V.gate);
    const list = sorted(S.gates[V.gate]);
    return `
      <div class="gatebar">${GATES.map(x => {
        const rs = S.gates[x.id], n = rs.filter(r => isDone(r.id)).length;
        return `<button data-act="gate" data-v="${x.id}" class="${x.id === V.gate ? 'on' : ''}">
          <span class="ic">${x.icon}</span><span class="nm">${x.name}</span><span class="ct num">${n}/${rs.length}</span></button>`;
      }).join('')}</div>
      ${list.map(r => {
        const done = isDone(r.id), now = isNow(r) && !done, starts = stepStarts(r), sd = stepsDone(r);
        return `<div class="card ${now ? 'now' : ''}">
          <div class="rhead">
            <button class="chk ${done ? 'done' : ''}" data-act="toggle" data-id="${r.id}" aria-label="Mark routine done">✓</button>
            <div>
              <div class="t num">${r.start}–${fromMin(toMin(r.start) + total(r))} · ${dur(total(r))}${now ? '<span class="tag">now</span>' : ''}</div>
              <div class="ti">${esc(r.title)}</div>
            </div>
          </div>
          <ul class="chainlist">
            ${r.steps.map((s, i) => `<li class="${isDone(s.id) ? 'done' : ''}">
              <span class="t num">${fromMin(starts[i])}</span><span class="d"></span>
              <span>${esc(s.title)}${s.work ? ` <span class="muted">· ${esc(s.work)}</span>` : ''}</span>
              <span class="m num">${s.minutes}m</span></li>`).join('')}
          </ul>
          <div class="acts">
            <button class="btn small" data-act="edit" data-id="${r.id}">Edit</button>
            <button class="btn small primary" data-act="run" data-gate="${V.gate}" data-id="${r.id}">${sd && !done ? 'Continue' : 'Start'}</button>
          </div>
        </div>`;
      }).join('') || `<p class="muted">No routines for ${g.name} yet.</p>`}
      <button class="btn block" data-act="add">+ Add ${g.name} routine</button>`;
  }

  function editSheet() {
    const e = V.edit, r = e.r, n = r.steps.length;
    const t = total(r);
    return `
      <div class="sheet-bg ${e.fresh ? 'enter' : ''}" data-act="edit-cancel-bg">
        <form class="sheet" id="editform" autocomplete="off">
          <h2>${e.isNew ? 'New' : 'Edit'} ${gateOf(e.gate).name} routine</h2>
          <div class="grid2">
            <div class="field"><label>Name</label><input name="r_title" required value="${esc(r.title)}" placeholder="Morning routine"></div>
            <div class="field"><label>Starts at</label><input name="r_start" type="time" required value="${esc(r.start)}"></div>
          </div>
          <p class="label" style="margin-top:4px">Steps · chained in order</p>
          ${r.steps.map((s, i) => `
            <div class="srow">
              <div class="top">
                <span class="n">${i + 1}</span>
                <input name="st${i}" value="${esc(s.title)}" placeholder="Step" required>
                <input name="sm${i}" type="number" min="1" max="720" value="${esc(s.minutes)}" aria-label="Minutes">
              </div>
              <input name="sw${i}" value="${esc(s.work)}" placeholder="Ritual line (optional)">
              <div class="tools">
                <button type="button" data-act="s-up" data-i="${i}" ${i === 0 ? 'disabled' : ''} aria-label="Move up">↑</button>
                <button type="button" data-act="s-down" data-i="${i}" ${i === n - 1 ? 'disabled' : ''} aria-label="Move down">↓</button>
                <button type="button" data-act="s-del" data-i="${i}" ${n === 1 ? 'disabled' : ''} aria-label="Remove step">✕</button>
              </div>
            </div>`).join('')}
          <button class="btn block" type="button" data-act="s-add" style="margin-bottom:8px">+ Add step</button>
          <div class="total num">${dur(t)} total · ends ${fromMin(toMin(r.start || '00:00') + t)}</div>
          <button class="btn primary block" type="submit" style="margin-bottom:8px">Save</button>
          <div class="grid2">
            <button class="btn" type="button" data-act="edit-cancel">Cancel</button>
            ${e.isNew ? '<span></span>' : '<button class="btn danger" type="button" data-act="delete">Delete</button>'}
          </div>
        </form>
      </div>`;
  }

  // pull typed values into V.edit before any re-render of the sheet
  function syncEdit() {
    const f = document.getElementById('editform');
    if (!f || !V.edit) return;
    const r = V.edit.r, el = f.elements;
    r.title = el.r_title.value;
    r.start = el.r_start.value || r.start;
    r.steps.forEach((s, i) => {
      s.title = el['st' + i].value;
      s.minutes = Math.max(1, Number(el['sm' + i].value) || 1);
      s.work = el['sw' + i].value;
    });
  }

  /* ----- routine run ----- */

  function findRoutine(gate, id) { return S.gates[gate].find(r => r.id === id); }

  function startRoutine(gate, id) {
    const r = findRoutine(gate, id);
    if (!r) return;
    let idx = r.steps.findIndex(s => !isDone(s.id));
    if (idx < 0 || isDone(r.id)) idx = 0;
    unlockAudio(); lockScreen(); startTicker();
    run = { gate, rid: id, idx };
    beginStep(idx);
  }

  function beginStep(i) {
    const r = findRoutine(run.gate, run.rid);
    run.idx = i;
    run.phase = 'step';
    run.total = Math.max(1, Number(r.steps[i].minutes)) * 60000;
    run.end = Date.now() + run.total;
    run.paused = false;
    beep(880, 0.3);
    renderRun();
  }

  function finishStep() {
    const r = findRoutine(run.gate, run.rid);
    setDone(r.steps[run.idx].id, true);
    if (run.idx >= r.steps.length - 1) {
      setDone(r.id, true);
      run.phase = 'complete';
      beep(660, 0.6);
    } else {
      run.phase = 'between';
      beep(660, 0.3);
    }
    renderRun();
  }

  function endRun() {
    run = null;
    stopTicker(); unlockScreen();
    render();
  }

  const runLeft = () => run.paused ? run.remaining : run.end - Date.now();

  function renderRun() {
    const r = findRoutine(run.gate, run.rid);
    if (!r) return endRun();
    const g = gateOf(run.gate), s = r.steps[run.idx], next = r.steps[run.idx + 1];

    const segs = `<div class="segs">${r.steps.map((x, i) =>
      `<span class="${isDone(x.id) && !(run.phase === 'step' && i === run.idx) ? 'done' : ''}" style="flex:${x.minutes}"><i ${i === run.idx && run.phase === 'step' ? 'id="seg"' : ''}></i></span>`).join('')}</div>
      <div class="seglabels"><span>${g.icon} ${esc(r.title)}</span><span class="num">${run.phase === 'complete' ? r.steps.length : run.idx + 1}/${r.steps.length}</span></div>`;

    let center, controls;
    if (run.phase === 'step') {
      center = `
        <div class="phase" style="color:var(--accent)">STEP ${run.idx + 1}</div>
        <div class="stepname">${esc(s.title)}</div>
        ${s.work ? `<div class="instr">${esc(s.work)}</div>` : ''}
        <div class="clock" id="clock" style="font-size:72px;margin-top:10px">${mmss(runLeft() / 1000)}</div>
        ${next ? `<div class="muted" style="font-size:14px">then ${esc(next.title)} · ${next.minutes}m</div>` : ''}`;
      controls = `<div class="controls">
          <button class="btn" data-act="r-pause">${run.paused ? 'Resume' : 'Pause'}</button>
          <button class="btn primary" data-act="r-done">Done</button>
        </div>`;
    } else if (run.phase === 'between') {
      const nx = r.steps[run.idx + 1];
      center = `
        <div class="check">✓</div>
        <div class="muted">${esc(s.title)} done</div>
        <div class="upnext">UP NEXT</div>
        <div class="stepname">${esc(nx.title)}</div>
        <div class="muted num">${nx.minutes} min${nx.work ? ` · ${esc(nx.work)}` : ''}</div>`;
      controls = `<div class="controls">
          <button class="btn" data-act="r-end">End here</button>
          <button class="btn primary" data-act="r-next">Start</button>
        </div>`;
    } else {
      center = `
        <div class="check">✓</div>
        <div class="stepname">${esc(r.title)}</div>
        <div class="muted">complete</div>
        <ul class="recap">${r.steps.map(x => `<li>${esc(x.title)}</li>`).join('')}</ul>`;
      controls = `<div class="controls one"><button class="btn primary" data-act="r-close">Close</button></div>`;
    }

    $app.innerHTML = `
      <div class="run"><div class="inner">
        <div class="top"><span>${g.name}</span>
          ${run.phase === 'complete' ? '<span></span>' : '<button class="btn small ghost" data-act="r-exit">Exit</button>'}</div>
        ${segs}
        <div class="center">${center}</div>
        ${controls}
      </div></div>`;
    tick();
  }

  /* ----- drill ----- */

  function drillView() {
    const d = S.drill;
    if (V.summary) {
      const s = V.summary, a = avg(s.latencies);
      return `
        <div class="card">
          <p class="label">Session complete</p>
          <div class="row spread"><span>Rounds</span><b class="num">${s.rounds}</b></div>
          <div class="row spread"><span>Avg recovery latency</span><b class="num">${a == null ? '—' : a.toFixed(1) + ' s'}</b></div>
          <div class="row spread"><span>Drifts caught</span><b class="num">${s.catches}</b></div>
          <p class="muted" style="margin:12px 0 0;font-size:14px">${s.latencies.map((l, i) => `R${i + 1} ${l.toFixed(1)}s`).join(' · ') || 'No returns marked.'}</p>
        </div>
        <button class="btn primary block" data-act="summary-ok">Done</button>`;
    }

    const sessions = d.sessions;
    const recent = sessions.slice(-7).map(s => avg(s.latencies)).filter(x => x != null);
    const prior = sessions.slice(-14, -7).map(s => avg(s.latencies)).filter(x => x != null);
    const trend = recent.length
      ? `<p class="muted" style="margin:0 0 10px;font-size:14px">Last ${recent.length}: <b class="num" style="color:var(--text)">${avg(recent).toFixed(1)} s</b>${prior.length ? ` · previous ${prior.length}: <span class="num">${avg(prior).toFixed(1)} s</span>` : ''}</p>`
      : '';

    return `
      <div class="card">
        <p class="label">The rite</p>
        <p style="margin:0">Hold one object in tight focus. Then release it entirely and let attention drift.
        <b>When the focus chime sounds, tap the moment you're back on the object.</b> That's your recovery latency.</p>
      </div>
      <div class="card">
        <div class="stepper">
          ${stepper('focus', 'Focus (s)', d.focus)}
          ${stepper('release', 'Release (s)', d.release)}
          ${stepper('rounds', 'Rounds', d.rounds)}
        </div>
      </div>
      <button class="btn primary block" data-act="drill-start" style="margin-bottom:20px">Begin</button>
      <div class="card">
        <p class="label">Recovery latency</p>
        ${trend}
        ${sessions.length ? `<ul class="hist">${sessions.slice(-10).reverse().map(s => {
          const a = avg(s.latencies);
          const when = new Date(s.t).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
          return `<li><span>${esc(when)} <span class="muted">· ${s.rounds}r · ${s.catches} caught</span></span><b class="num">${a == null ? '—' : a.toFixed(1) + ' s'}</b></li>`;
        }).join('')}</ul>` : '<p class="muted" style="margin:0">No sessions yet. It should shorten over weeks.</p>'}
      </div>`;
  }

  function stepper(key, label, val) {
    return `<div class="step"><div class="v num">${val}</div><div class="k">${label}</div>
      <div class="pm"><button data-act="step" data-k="${key}" data-d="-1">−</button><button data-act="step" data-k="${key}" data-d="1">+</button></div></div>`;
  }

  function renderDrillRun() {
    const r = drillRun, d = S.drill, focus = r.phase === 'focus';
    const color = focus ? 'var(--focus)' : 'var(--release)';
    let tap;
    if (!focus) tap = `<button class="bigtap wait" disabled>Let it drift</button>`;
    else if (!r.locked) tap = `<button class="bigtap lock" data-act="lock">I'm back</button>`;
    else tap = `<button class="bigtap catch" data-act="catch">Caught a drift <span class="muted num">(${r.catches})</span></button>`;

    $app.innerHTML = `
      <div class="run"><div class="inner">
        <div class="top"><span class="num">Round ${r.round} / ${d.rounds}</span><button class="btn small ghost" data-act="drill-stop">End</button></div>
        <div class="center">
          <div class="dots">${Array.from({ length: d.rounds }, (_, i) => `<i class="${i + 1 < r.round ? 'on' : i + 1 === r.round ? 'now' : ''}"></i>`).join('')}</div>
          <div class="phase" style="color:${color}">${focus ? 'FOCUS' : 'RELEASE'}</div>
          <div class="clock" id="clock">${mmss((r.end - Date.now()) / 1000)}</div>
          <div class="bar" style="color:${color};max-width:280px"><i id="bar"></i></div>
          <div class="instr">${focus
            ? (r.locked ? 'Hold it. If you notice you drifted, tap and return.' : 'Return to the object. Tap the instant you are on it.')
            : 'Release the object entirely. Do not hold anything.'}</div>
        </div>
        ${tap}
      </div></div>`;
    tick();
  }

  function setDrillPhase(phase) {
    const sec = phase === 'focus' ? S.drill.focus : S.drill.release;
    drillRun.phase = phase;
    drillRun.start = Date.now();
    drillRun.end = drillRun.start + sec * 1000;
    drillRun.locked = false;
    beep(phase === 'focus' ? 880 : 440, 0.25);
    renderDrillRun();
  }

  function advanceDrill() {
    const r = drillRun;
    if (r.phase === 'focus') return setDrillPhase('release');
    if (r.round >= S.drill.rounds) return finishDrill(r.round);
    r.round++;
    setDrillPhase('focus');
  }

  function finishDrill(roundsDone) {
    const r = drillRun;
    stopTicker(); unlockScreen();
    drillRun = null;
    if (roundsDone > 0) {
      const s = { t: Date.now(), rounds: roundsDone, latencies: r.latencies, catches: r.catches };
      S.drill.sessions.push(s);
      if (S.drill.sessions.length > 500) S.drill.sessions.shift();
      save();
      V.summary = s;
      beep(660, 0.5);
    }
    render();
  }

  /* ---------- timers ---------- */

  function tick() {
    const clock = document.getElementById('clock');
    if (drillRun) {
      const r = drillRun, left = r.end - Date.now(), bar = document.getElementById('bar');
      if (left <= 0) return advanceDrill();
      if (clock) clock.textContent = mmss(left / 1000);
      if (bar) bar.style.width = (100 * (1 - left / (r.end - r.start))) + '%';
    } else if (run && run.phase === 'step') {
      const left = runLeft(), seg = document.getElementById('seg');
      if (!run.paused && left <= 0) return finishStep();
      if (clock) clock.textContent = mmss(left / 1000);
      if (seg) seg.style.width = (100 * (1 - left / run.total)) + '%';
    }
  }

  /* ---------- events ---------- */

  $app.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;

    switch (act) {
      case 'tab': V.tab = el.dataset.v; V.summary = null; render(); break;
      case 'gate': V.gate = el.dataset.v; render(); break;

      /* routines */
      case 'run': startRoutine(el.dataset.gate, el.dataset.id); break;
      case 'toggle': {
        const id = el.dataset.id, r = findRoutine(V.gate, id), v = !isDone(id);
        setDone(id, v);
        r.steps.forEach(s => setDone(s.id, v));
        render(); break;
      }
      case 'r-pause':
        if (run.paused) { run.end = Date.now() + run.remaining; run.paused = false; }
        else { run.remaining = run.end - Date.now(); run.paused = true; }
        renderRun(); break;
      case 'r-done': finishStep(); break;
      case 'r-next': beginStep(run.idx + 1); break;
      case 'r-end':
      case 'r-close': endRun(); break;
      case 'r-exit':
        if (run.phase !== 'step' || confirm('End the routine here? Finished steps stay done.')) endRun();
        break;

      /* editing */
      case 'add':
        V.edit = { gate: V.gate, isNew: true, fresh: true, r: routine('', '12:00', [step('', 10)]) };
        render(); break;
      case 'edit': {
        const r = findRoutine(V.gate, el.dataset.id);
        V.edit = { gate: V.gate, isNew: false, fresh: true, r: JSON.parse(JSON.stringify(r)) };
        render(); break;
      }
      case 's-add': syncEdit(); V.edit.r.steps.push(step('', 5)); render();
        setTimeout(() => { const f = document.getElementById('editform'); f && f.elements['st' + (V.edit.r.steps.length - 1)].focus(); }, 0);
        break;
      case 's-up': case 's-down': {
        syncEdit();
        const i = Number(el.dataset.i), j = act === 's-up' ? i - 1 : i + 1, st = V.edit.r.steps;
        [st[i], st[j]] = [st[j], st[i]];
        render(); break;
      }
      case 's-del': syncEdit(); V.edit.r.steps.splice(Number(el.dataset.i), 1); render(); break;
      case 'edit-cancel-bg': if (e.target !== el) break; // only when tapping the backdrop
      // fallthrough
      case 'edit-cancel': V.edit = null; render(); break;
      case 'delete':
        if (confirm('Delete this routine?')) {
          S.gates[V.edit.gate] = S.gates[V.edit.gate].filter(r => r.id !== V.edit.r.id);
          save(); V.edit = null; render();
        }
        break;

      /* drill */
      case 'step': {
        const k = el.dataset.k, d = Number(el.dataset.d);
        const lim = { focus: [10, 300, 5], release: [10, 300, 5], rounds: [1, 30, 1] }[k];
        S.drill[k] = Math.min(lim[1], Math.max(lim[0], S.drill[k] + d * lim[2]));
        save(); render(); break;
      }
      case 'drill-start':
        unlockAudio();
        drillRun = { round: 1, latencies: [], catches: 0 };
        lockScreen(); startTicker(); setDrillPhase('focus'); break;
      case 'lock':
        if (drillRun && drillRun.phase === 'focus' && !drillRun.locked) {
          drillRun.latencies.push(Math.round((Date.now() - drillRun.start) / 100) / 10);
          drillRun.locked = true;
          buzz(); renderDrillRun();
        }
        break;
      case 'catch':
        if (drillRun) { drillRun.catches++; buzz(); renderDrillRun(); }
        break;
      case 'drill-stop': {
        const r = drillRun;
        finishDrill(r.phase === 'release' ? r.round : r.round - 1); break;
      }
      case 'summary-ok': V.summary = null; render(); break;
    }
  });

  $app.addEventListener('submit', e => {
    if (e.target.id !== 'editform') return;
    e.preventDefault();
    syncEdit();
    const r = V.edit.r;
    r.title = r.title.trim() || 'Untitled';
    r.steps.forEach(s => { s.title = s.title.trim() || 'Step'; s.work = s.work.trim(); });
    const list = S.gates[V.edit.gate];
    const i = list.findIndex(x => x.id === r.id);
    if (i >= 0) list[i] = r; else list.push(r);
    save(); V.edit = null; render();
  });

  // keep "now" / "in Xm" fresh while idle
  setInterval(() => { if (!drillRun && !run && !V.edit) render(); }, 30000);

  render();

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
