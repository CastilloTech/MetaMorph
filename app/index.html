  async function backupMedia() {
    const total = S.media.reduce((t, x) => t + (x.size || 0), 0);
    if (total > 600e6 && !(await ask({ title: 'Large backup', text: `About ${fmtBytes(total)}. Building it may be slow on a phone. Continue?`, ok: 'Continue' }))) return;
    snack('Building media backup…');
    const JSZip = await loadZip(), zip = new JSZip(), meta = [];
    for (const x of S.media) {
      const blob = await mdb.get(x.id).catch(() => null);
      if (!blob) continue;
      const name = `media/${x.id}.${extOf(x.type)}`;
      zip.file(name, blob, { binary: true });
      meta.push({ ...x, thumb: thumbs[x.id] || x.thumb || null, file: name });
    }
    zip.file('manifest.json', JSON.stringify({ app: 'metamorph-media', exported: new Date().toISOString(), items: meta }, null, 1));
    const out = await zip.generateAsync({ type: 'blob', compression: 'STORE' });
    S.lastMediaBackup = Date.now(); save();
    const zipBlob = new Blob([out], { type: 'application/zip' });
    // building takes a moment, so ask for a fresh tap before opening the share sheet
    if (await ask({ title: 'Media backup ready', text: `${meta.length} items · ${fmtBytes(zipBlob.size)}. Save it somewhere off this phone (Drive, Files, email).`, ok: 'Save / share' }))
      deliver(zipBlob, `metamorph-media-${today()}.zip`, 'MetaMorph media backup');
  }
  async function restoreMedia(file) {
    try {
      snack('Reading backup…');
      const JSZip = await loadZip(), zip = await JSZip.loadAsync(file);
      const man = JSON.parse(await zip.file('manifest.json').async('string'));
      if (man.app !== 'metamorph-media') return snack('That isn’t a MetaMorph media backup.');
      let n = 0;
      for (const it of man.items) {
        if (S.media.some(x => x.id === it.id)) continue;
        const f = zip.file(it.file); if (!f) continue;
        const blob = new Blob([await f.async('arraybuffer')], { type: it.type });
        await mdb.put(it.id, blob);
        const { file: _, thumb: th, ...meta } = it;
        if (th) { await mdb.put('thumb:' + it.id, th); thumbs[it.id] = th; }
        S.media.push(meta); n++;
      }
      save(); render(); snack(n ? `Restored ${n} item${n === 1 ? '' : 's'}` : 'Everything in that backup is already here.');

    const e = V.sedit;
    return `<div class="sheet-bg ${e.fresh ? 'enter' : ''}" data-act="sup-cancel-bg">
      <form class="sheet" id="supform" autocomplete="off"><div class="grab" aria-hidden="true"></div>
        <h2>Edit item</h2>
        <div class="field"><label>Name</label><input name="name" required value="${esc(e.name)}"></div>
        <div class="opts" style="margin-bottom:12px">${SUP_CATS.map(c => `<label class="chip"><input type="radio" name="cat" value="${c}" ${e.cat === c ? 'checked' : ''}><span>${c}</span></label>`).join('')}</div>
        <div class="grid2">
          <div class="field"><label>Walmart price</label><input name="price" type="number" inputmode="decimal" min="0" step="0.01" value="${e.price ?? ''}"></div>
          <div class="field"><label>Quantity on list</label><input name="qty" type="number" inputmode="numeric" min="1" step="1" value="${e.qty || 1}"></div>
        </div>
        <div class="field"><label>Walmart product link (optional)</label><input name="url" type="url" placeholder="https://www.walmart.com/ip/…" value="${esc(e.url || '')}"></div>
        <a class="btn block" href="${walmartUrl(e)}" target="_blank" rel="noopener" style="margin-bottom:8px;text-align:center;text-decoration:none"><span class="wm">✱</span> Check price on Walmart</a>
        ${(e.history || []).length ? `<p class="label" style="margin-top:6px">Price history</p><ul class="flog">${e.history.slice(-6).reverse().map(h => `<li><span class="num">${new Date(h.t).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}</span><span class="num">${money(h.price)}</span></li>`).join('')}</ul>` : ''}
        <button class="btn primary block" type="submit" style="margin:12px 0 8px">Save</button>
        <div class="grid2"><button class="btn" type="button" data-act="sup-cancel">Cancel</button><button class="btn danger" type="button" data-act="sup-del" data-id="${e.id}">Delete</button></div>
      </form></div>`;
  }
  function setPrice(x, price) {
    if (price == null || isNaN(price)) return;
    price = Math.round(price * 100) / 100;
    x.history = x.history || [];
    if (!x.history.length || x.history[x.history.length - 1].price !== price) x.history.push({ t: Date.now(), price });
    x.price = price; x.priceAt = Date.now();
  }

  /* ----- feature law ----- */

  const F = () => S.features;
  const TRIALS_NEEDED = 30;

  function lintFeature(t) {
    const x = t.trim().toLowerCase();
    if (!x) return null;
    if (/[,;&+]|\band\b/.test(x)) return { lvl: 'warn', msg: 'One feature only. A Lantern given three bearings lights none of them.' };
    const notice = /^(notice|spot|watch for|listen for|catch)\b/.test(x);
    if (!notice && (/^(be|feel|get|have|win|close|achieve|succeed|make|become|improve|stop|try|land|nail|crush|do)\b/.test(x)
        || /\b(more|less|better|good day|confident|successful|happy|productive|great)\b/.test(x)))
      return { lvl: 'warn', msg: 'That’s an outcome, and the Lantern can’t aim at outcomes. Name something you could notice: “Notice …”' };
    if (notice) return { lvl: 'ok', msg: 'Loadable: something you could notice.' };
    return { lvl: 'info', msg: 'Tip: start with “Notice” and name something you could see or hear.' };
  }

  function featureView() {
    const f = F(), open = f.items.filter(x => !x.check), done = f.items.filter(x => x.check);
    const L = done.filter(x => x.mode === 'loaded'), C = done.filter(x => x.mode === 'control');
    const ar = a => a.length ? avg(a.map(x => x.check.rating)) : null;
    const ub = a => a.length ? Math.round(100 * a.filter(x => x.check.unbidden).length / a.length) : null;
    const la = ar(L), ca = ar(C);
    const enough = done.length >= TRIALS_NEEDED && L.length >= 8 && C.length >= 8;
    let verdict = '';
    if (enough) verdict = la - ca >= 0.5
      ? `<p class="hint ok">Loaded contexts are noticed more (+${(la - ca).toFixed(1)}). The Feature Law is holding for you.</p>`
      : `<p class="hint warn">No clear difference after ${done.length} trials. The book says to mark the Feature Law Speculative in your copy.</p>`;
    const lint = lintFeature(V.fDraft.text);
    return `
      <div class="card">
        <p class="label" style="margin:0">The Feature Law</p>
        <p class="lawq"><b>The Lantern biases perceptual features. It does not bias outcomes.</b> An intent you couldn’t <i>notice</i> gives it nothing to aim at.</p>
      </div>
      <div class="card">
        <p class="label">Load one feature</p>
        <div class="field"><label>For</label><input id="fctx" value="${esc(V.fDraft.ctx)}" placeholder="Today, a meeting, the gym…" autocomplete="off"></div>
        <div class="opts" style="margin:-4px 0 14px">${['Today', 'Meeting', 'Workout', 'Conversation'].map(c => `<button type="button" data-act="f-ctx" data-v="${c}" class="${V.fDraft.ctx === c ? 'on' : ''}">${c}</button>`).join('')}</div>
        <div class="field" style="margin-bottom:0"><label>The one thing you'll notice</label><input id="ftext" value="${esc(V.fDraft.text)}" placeholder="Notice the pause before they answer" autocomplete="off" autocapitalize="sentences" enterkeyhint="done"></div>
        <p class="hint ${lint ? lint.lvl : ''}" id="fhint">${lint ? esc(lint.msg) : ''}</p>
        <label class="checkrow"><input type="checkbox" id="fexp" ${f.experiment ? 'checked' : ''}> Experiment: about 1 in 3 loads becomes a control trial</label>
        <button class="btn primary block" data-act="f-load">Load feature · 30s hold</button>
      </div>
      ${open.length ? `<div class="card"><p class="label">Check in afterwards</p><ul class="flist">${open.slice().reverse().map(x => `<li><span>
          <div class="ctx">${esc(x.ctx || 'Context')} · ${new Date(x.t).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })}${x.mode === 'control' ? '<span class="mtag ctl">CONTROL</span>' : ''}</div>
          <div class="txt">${esc(x.text)}</div></span>
          <span class="row" style="gap:6px"><button class="btn small ghost" data-act="f-discard" data-id="${x.id}" aria-label="Discard this trial">✕</button><button class="btn small primary" data-act="f-check" data-id="${x.id}">Check in</button></span></li>`).join('')}</ul></div>` : ''}
      <div class="card">
        <p class="label">Is it working for you?</p>
        <div class="cmp">
          <div><b>${la == null ? '—' : la.toFixed(1)}</b><span>Loaded · noticed 0–4<br>${L.length} trial${L.length === 1 ? '' : 's'}${ub(L) != null ? ` · ${ub(L)}% unbidden` : ''}</span></div>
          <div><b>${ca == null ? '—' : ca.toFixed(1)}</b><span>Control · noticed 0–4<br>${C.length} trial${C.length === 1 ? '' : 's'}${ub(C) != null ? ` · ${ub(C)}% unbidden` : ''}</span></div>
        </div>
        <div class="prog"><i style="width:${Math.min(100, 100 * done.length / TRIALS_NEEDED)}%"></i></div>
        <p class="muted num" style="font-size:12px;margin:6px 0 0">${done.length}/${TRIALS_NEEDED} checked-in trials${enough ? '' : ' before a verdict (at least 8 of each kind)'}</p>
        ${verdict}
      </div>
      ${done.length ? `<div class="card"><p class="label">Recent</p><ul class="flist">${done.slice(-8).reverse().map(x => `<li><span>
          <div class="ctx">${esc(x.ctx || 'Context')} · ${new Date(x.t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}<span class="mtag ${x.mode === 'control' ? 'ctl' : ''}">${x.mode === 'control' ? 'CONTROL' : 'LOADED'}</span></div>
          <div class="txt">${esc(x.text)}</div></span><span class="num muted">${x.check.rating}/4</span></li>`).join('')}</ul></div>` : ''}`;
  }

  function renderFeatRun() {
    const x = F().items.find(i => i.id === featRun.id);
    if (!x) { featRun = null; return render(); }
    let center, controls;
    if (featRun.mode === 'control') {
      center = `<div class="phase" style="color:var(--release)">CONTROL TRIAL</div>
        <div class="holdtext">${esc(x.text)}</div>
        <div class="instr">Don’t rehearse it. Put it out of mind and go in as you normally would. You’ll check in the same way afterwards, so the two can be compared.</div>`;
      controls = `<div class="controls one"><button class="btn primary" data-act="f-done">Got it</button></div>`;
    } else if (featRun.held) {
      center = `${orb('chaos', 110, 'still')}
        <div class="phase" style="color:var(--ok)">LOADED</div>
        <div class="holdtext">${esc(x.text)}</div>
        <div class="instr">Go in. Check in afterwards from the Feature tab.</div>`;
      controls = `<div class="controls one"><button class="btn primary" data-act="f-done">Done</button></div>`;
    } else {
      center = `${orb('chaos', 110, 'still')}
        <div class="phase" style="color:var(--accent)">HOLD THE FEATURE</div>
        <div class="holdtext">${esc(x.text)}</div>
        <div class="clock" id="clock" style="font-size:56px">${mmss((featRun.end - Date.now()) / 1000)}</div>
        <div class="bar" style="color:var(--accent);max-width:240px"><i id="bar"></i></div>
        <div class="instr">Keep it in view until the context begins.</div>`;
      controls = `<div class="controls one"><button class="btn ghost" data-act="f-done">Skip the hold</button></div>`;
    }
    view.html = `<div class="run"><div class="inner">
      <div class="top"><span>${esc(x.ctx || 'Feature')}</span><span></span></div>
      <div class="center">${center}</div>${controls}</div></div>`;
    tick();
  }

  function checkSheet() {
    const c = V.fcheck, x = F().items.find(i => i.id === c.id);
    const opts = (k, list) => `<div class="opts" style="margin-bottom:16px">${list.map(([v, l]) =>
      `<button type="button" data-act="fc-set" data-k="${k}" data-v="${v}" class="${c[k] != null && String(c[k]) === String(v) ? 'on' : ''}">${l}</button>`).join('')}</div>`;
    return `<div class="sheet-bg ${c.fresh ? 'enter' : ''}" data-act="fc-cancel-bg"><div class="sheet"><div class="grab" aria-hidden="true"></div>
      <h2>Check in</h2>
      <p class="muted" style="margin:-6px 0 16px">${esc(x.ctx || 'Context')}: <b style="color:var(--text)">${esc(x.text)}</b></p>
      <p class="label">How often did you notice it?</p>
      ${opts('rating', [[0, 'Never'], [1, 'Once'], [2, 'A few times'], [3, 'Often'], [4, 'Constantly']])}
      <p class="label">Did it come up without you calling it?</p>
      ${opts('unbidden', [[1, 'Yes'], [0, 'No']])}
      <p class="label">When did it stop presenting? <span style="text-transform:none;letter-spacing:0">(optional)</span></p>
      ${opts('stopped', [['still', 'Still going'], ['lt1', 'Under 1h'], ['1to3', '1–3h'], ['gt3', '3h+'], ['never', 'Didn’t start']])}
      <button class="btn primary block" data-act="fc-save" ${c.rating == null || c.unbidden == null ? 'disabled' : ''}>Save check-in</button>
      <button class="btn ghost block" data-act="fc-cancel" style="margin-top:8px">Cancel</button>
    </div></div>`;
  }

  const anySheet = () => !!(V.cam || V.review || V.mup || V.mview || V.mcmp || V.woEx || V.nmeal || V.qa || V.edit || V.data || V.whatsNew || V.wedit || V.fcheck || V.tedit || V.nadd || V.ngoals || V.nprep || V.sedit || V.scan);

  /* ---------- timers ---------- */

  function tick() {
    const clock = document.getElementById('clock');
    if (drillRun) {
      // no countdown on screen: the drill only advances on its own clock
      if (Date.now() >= drillRun.end) advanceDrill();
    } else if (featRun && !featRun.held && featRun.end) {
      const left = featRun.end - Date.now(), bar = document.getElementById('bar');
      if (left <= 0) { featRun.held = true; stopTicker(); beep(784, 0.35); return renderFeatRun(); }
      if (clock) clock.textContent = mmss(left / 1000);
      if (bar) bar.style.width = (100 * (1 - left / 30000)) + '%';
    } else if (run && run.autoAt && run.phase !== 'step') {
      const left = run.autoAt - Date.now();
      if (left <= 0) return run.phase === 'between' ? beginStep(run.idx + 1) : chainNext();
      const a = document.getElementById('autoleft'), fg = document.getElementById('autofg');
      if (a) a.textContent = Math.ceil(left / 1000);
      if (fg) fg.style.strokeDashoffset = String(2 * Math.PI * 28 * (1 - left / AUTO_MS));
    } else if (run && run.phase === 'step') {
      const left = runLeft(), seg = document.getElementById('seg');
      if (!run.paused && left <= 0 && !run.over) return timeUp();
      if (clock) clock.textContent = run.over ? `+${mmss(-left / 1000)}` : mmss(left / 1000);
      document.querySelectorAll('[data-late-from]').forEach(x => { x.textContent = `late +${mmss((Date.now() - +x.dataset.lateFrom) / 1000)}`; });
      if (seg && !run.over) seg.style.width = (100 * (1 - left / run.total)) + '%';
    }
  }

  /* ---------- events ---------- */

  $app.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;

    switch (act) {
      case 'tab': V.slide = slideTo(visibleTabs(), V.tab, el.dataset.v); V.tab = el.dataset.v; V.summary = null; V.gateFx = V.tab === 'gates'; render(); break;
      case 'gate': V.gate = el.dataset.v; V.gateFx = true; render(); break;

      /* calendar */
      case 'cal': V.slide = slideTo(CALS, V.cal, el.dataset.v); V.cal = el.dataset.v; V.anchor = null; V.sel = null; render(); break;
      case 'cal-prev': case 'cal-next': {
        const a = parseKey(V.anchor || today()), dir = act === 'cal-next' ? 1 : -1;
        const nd = V.cal === 'month' ? new Date(a.getFullYear(), a.getMonth() + dir, 1) : addDays(a, 7 * dir);
        V.anchor = keyOf(nd);
        V.sel = V.cal === 'month' ? keyOf(nd) : keyOf(addDays(nd, -((nd.getDay() + 6) % 7)));
        if (keyOf(nd).slice(0, 7) === today().slice(0, 7) && V.cal === 'month') V.sel = today();
        V.slide = dir > 0 ? 'r' : 'l';
        render(); break;
      }
      case 'cal-today': V.slide = parseKey(V.anchor || today()) > new Date() ? 'l' : 'r'; V.anchor = null; V.sel = null; render(); break;
      case 'sel': if (swipe.justSwiped) break; V.sel = el.dataset.v; render(); break;
      case 'toggle-day': {
        // a finish time only means something when it's logged on the day itself
        const k = el.dataset.date, r = findRoutine(el.dataset.gate, el.dataset.id);
        if (isDone(r.id, k)) break;
        completeRoutine(r, true, k, k === today());
        render(); break;
      }

      /* now stack */
      case 'now-todo': V.tab = 'todo'; V.ttab = 'todo'; render(); scrollTo(0, 0); break;
      case 'now-workout': V.tab = 'gates'; V.gate = 'fitness'; V.wotab = 'log'; V.gateFx = true; render(); setTimeout(() => { const w = document.querySelector('.wo'); if (w) w.scrollIntoView({ block: 'start', behavior: 'smooth' }); }, 60); break;

      /* first-run setup */
      case 'onb-next': V.onboard.step++; render(); scrollTo(0, 0); break;
      case 'onb-back': V.onboard.step = Math.max(0, V.onboard.step - 1); render(); break;
      case 'onb-skip': V.onboard = null; S.onboarded = true; save(); render(); break;
      case 'onb-finish': finishOnboard(); break;

      /* updates */
      case 'update-later': V.update = null; render(); break;
      case 'update-now': applyUpdate(); break;
      case 'whatsnew-close-bg': if (e.target !== el) break;
      // fallthrough
      case 'whatsnew-close': V.whatsNew = false; S.seenVersion = APP_VERSION; save(); render(); break;

      /* backup */
      case 'data': V.data = true; render(); break;
      case 'data-close-bg': if (e.target !== el) break;
      // fallthrough
      case 'data-close': V.data = false; render(); break;
      case 'backup-save': {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(backupBlob());
        a.download = backupName();
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        markBackedUp(); break;
      }
      case 'backup-share': {
        const file = new File([backupBlob()], backupName(), { type: 'application/json' });
        navigator.share({ files: [file], title: 'MetaMorph backup' }).then(markBackedUp).catch(() => {});
        break;
      }
      case 'backup-restore': document.getElementById('restorefile').click(); break;
      case 'persist':
        (async () => {
          try { storageInfo.persisted = await navigator.storage.persist(); } catch (e) {}
          if (!storageInfo.persisted) snack('The browser declined. Installing the app to your home screen usually lets it protect storage.');
          render();
        })();
        break;

      /* routines */
      case 'run': if (swipe.justSwiped || isDone(el.dataset.id)) break; V.qa = null; startRoutine(el.dataset.gate, el.dataset.id); break;
      case 'qa-cancel-bg': if (e.target !== el) break;
      // fallthrough
      case 'qa-cancel': V.qa = null; render(); break;
      case 'qa-edit': {
        const q = V.qa, r = findRoutine(q.gate, q.id);
        V.qa = null; V.gate = q.gate;
        V.edit = { gate: q.gate, isNew: false, fresh: true, r: JSON.parse(JSON.stringify(r)) };
        render(); break;
      }
      case 'qa-skip': { const id = V.qa.id; undoable('Skipped for today', () => { (S.skip[today()] = S.skip[today()] || {})[id] = true; V.qa = null; }); break; }
      case 'unskip': if (S.skip[today()]) delete S.skip[today()][el.dataset.id]; save(); render(); break;
      case 'qa-todo-toggle': { const x = S.todos.find(t => t.id === V.qa.id); V.qa = null; if (x) setTodo(x, !x.done); render(); break; }
      case 'qa-todo-edit': { const x = S.todos.find(t => t.id === V.qa.id); V.qa = null; if (x) V.tedit = { ...x, fresh: true }; render(); break; }
      case 'qa-todo-tomorrow': { const x = S.todos.find(t => t.id === V.qa.id); V.qa = null; if (x) { x.date = keyOf(addDays(new Date(), 1)); save(); snack('Moved to tomorrow'); } render(); break; }
      case 'qa-todo-del': { const id = V.qa.id; undoable('Task deleted', () => { S.todos = S.todos.filter(t => t.id !== id); V.qa = null; }); break; }
      case 'reset-done': {
        const r = findRoutine(V.edit.gate, V.edit.r.id);
        if (r) ask({ title: 'Reset today’s completion?', text: 'Its finish time and overtime will be cleared.', ok: 'Reset', danger: true })
          .then(y => { if (y) { completeRoutine(r, false); render(); snack('Completion reset'); } });
        break;
      }
      case 'toggle': {
        const r = findRoutine(V.gate, el.dataset.id);
        if (isDone(r.id)) break;
        completeRoutine(r, true);
        render(); break;
      }
      case 'complete': completeRoutine(findRoutine(el.dataset.gate, el.dataset.id), true); buzz(); render(); break;
      case 'step-toggle': {
        const r = findRoutine(el.dataset.gate, el.dataset.id), x = r.steps[Number(el.dataset.i)], v = !isDone(x.id);
        if (isDone(r.id)) break;
        setDone(x.id, v);
        if (v && r.steps.every(y => isDone(y.id))) completeRoutine(r, true);
        buzz(); render(); break;
      }

      /* workouts */
      case 'wo-unit': WK().unit = el.dataset.v; save(); render(); break;
      case 'wo-tab': V.slide = slideTo(['log', 'history', 'exercises'], V.wotab || 'log', el.dataset.v); V.wotab = el.dataset.v; render(); break;
      case 'wo-start': WK().draft = { t: Date.now(), title: '', items: [], note: '' }; V.wotab = 'log'; save(); render(); break;
      case 'wo-repeat': {
        const x = WK().log.find(y => y.id === el.dataset.id);
        if (!x || WK().draft) break;
        WK().draft = { t: Date.now(), title: x.title || '', note: '',
          items: x.items.map(it => ({ name: it.name, kind: it.kind, bar: it.bar ?? null, sets: freshSets(it, it.kind) })) };
        V.wotab = 'log'; save(); render(); scrollTo(0, 0); break;
      }
      case 'wo-tchip': WK().draft.title = WK().draft.title === el.dataset.v ? '' : el.dataset.v; save(); render(); break;
      case 'wo-kind': V.woKind = el.dataset.v; render(); break;
      case 'wo-add': {
        const inp = document.getElementById('wo-new'), name = inp ? inp.value.trim() : '';
        if (!name) break;
        let lib = libFor(name);
        const kind = lib ? lib.kind : V.woKind;
        if (!lib) { lib = { name, kind, bar: kind === 'strength' && BAR_GUESS.test(name) ? barDefault() : null }; WK().library.push(lib); }
        const last = lastFor(name);
        const bar = kind === 'strength' ? (lib.bar ?? null) : null;
        let sets = last ? freshSets(last.it, kind) : [kind === 'strength' ? (bar != null ? { r: '', ps: '', bar } : { r: '', w: '' }) : { min: '', dist: '' }];
        // last time may have been logged without the bar; bring it in line
        if (bar != null) sets = sets.map(x => isBB(x) ? x : { r: x.r, hint: x.hint, bar, ps: x.w ? Math.max(0, (+x.w - bar) / 2) : '' });
        WK().draft.items.push({ name: lib.name, kind, bar, sets });
        V.woName = '';
        save(); render(); break;
      }
      case 'wo-bb': {
        const it = WK().draft.items[Number(el.dataset.i)], lib = libFor(it.name);
        if (it.bar != null) { it.sets = it.sets.map(x => ({ r: x.r, hint: x.hint, w: setW(x) || '' })); it.bar = null; }
        else { const bar = barDefault(); it.sets = it.sets.map(x => ({ r: x.r, hint: x.hint, bar, ps: x.w ? Math.max(0, (+x.w - bar) / 2) : '' })); it.bar = bar; }
        if (lib) lib.bar = it.bar;
        save(); render(); break;
      }
      case 'wo-bar': {
        const it = WK().draft.items[Number(el.dataset.i)], opts = BAR_OPTIONS(), nx = opts[(opts.indexOf(+it.bar) + 1) % opts.length];
        it.bar = nx; it.sets.forEach(x => { x.bar = nx; });
        const lib = libFor(it.name); if (lib) lib.bar = nx;
        save(); render(); break;
      }
      case 'wo-addset': {
        const it = WK().draft.items[Number(el.dataset.i)], l = it.sets[it.sets.length - 1];
        // same weight as the set before, reps left for you to fill in
        it.sets.push(l ? (it.kind === 'strength' ? { ...l, r: '', hint: l.r || l.hint } : { ...l, min: '', hint: l.min || l.hint }) : {});
        save(); render(); break;
      }
      case 'wo-rmset': WK().draft.items[Number(el.dataset.i)].sets.splice(Number(el.dataset.j), 1); save(); render(); break;
      case 'wo-rmex': WK().draft.items.splice(Number(el.dataset.i), 1); save(); render(); break;
      case 'wo-discard': undoable('Workout discarded', () => { WK().draft = null; }); break;
      case 'wo-finish': {
        const d = WK().draft;
        const items = d.items.map(it => ({ name: it.name, kind: it.kind, bar: it.bar ?? null,
          sets: it.sets.filter(x => it.kind === 'strength' ? +x.r > 0 : (+x.min > 0 || +x.dist > 0))
            .map(({ hint, ...x }) => (it.kind === 'strength' ? { ...x, r: +x.r, w: setW(x) } : x)) })).filter(it => it.sets.length);

  $app.addEventListener('change', e => {
    const t = e.target;
    if ((t.id === 'mfile' || t.id === 'mfilev') && t.files.length) {
      V.mup = { fresh: true, files: [...t.files], video: t.id === 'mfilev', tag: t.id === 'mfilev' ? 'form' : 'physique', pose: 'Front', exercise: '', date: today(), note: '' };
      t.value = ''; render(); return;
    }
    if (t.id === 'mzip' && t.files[0]) { restoreMedia(t.files[0]); t.value = ''; return; }
    if (t.dataset && t.dataset.mcmp && V.mcmp) { V.mcmp[t.dataset.mcmp] = t.value; loadCompare(); return; }
    if (t.dataset && t.dataset.sec) { S.sections[t.dataset.sec] = t.checked; save(); render(); }
    if (t.dataset && t.dataset.pref) { S.prefs[t.dataset.pref] = t.checked; save(); render(); }
    if (t.dataset && t.dataset.rm) { RM()[t.dataset.rm] = t.checked; save(); render(); }
    if (t.dataset && t.dataset.bprof) {
      const pr = B().profile, k = t.dataset.bprof;
      if (k === 'activity') pr.activity = +t.value;
      else {
        const ftEl = document.querySelector('[data-bprof=ft]'), inEl = document.querySelector('[data-bprof=in]');
        const total = (+ftEl.value || 0) * 12 + (+inEl.value || 0);
        pr.heightIn = total > 36 ? total : null;
      }
      save(); render();
    }
    if (t.dataset && t.dataset.prefTime && t.value) { S.prefs[t.dataset.prefTime] = t.value; save(); render(); snack(`New day now starts at ${clock(t.value)}`); }
    if (t.dataset && t.dataset.onbsec) V.onboard.sections[t.dataset.onbsec] = t.checked;
    if (t.dataset && t.dataset.onbstart) V.onboard.starters[t.dataset.onbstart] = t.checked;
    if (t.id === 'onb-wake' && t.value) V.onboard.wake = t.value;
    if (t.id === 'onb-bed' && t.value) V.onboard.bed = t.value;
    if (e.target.name === 'rt' || e.target.name === 'r_vary') { syncEdit(); render(); }
    if (e.target.name === 'w_unit') { syncWEdit(); render(); }
    if (e.target.id === 'fexp') { F().experiment = e.target.checked; save(); }
    if (e.target.id === 'restorefile' && e.target.files[0]) {
      e.target.files[0].text().then(txt => {
        let payload;
        try { payload = JSON.parse(txt); } catch (err) { return snack('That file is not a MetaMorph backup.'); }
        const data = payload && payload.app === 'metamorph' ? payload.data : payload;
        if (!valid(data)) return snack('That file is not a MetaMorph backup.');
        const when = payload.exported ? new Date(payload.exported).toLocaleString() : 'an unknown date';
        ask({ title: 'Restore this backup?', text: `From ${when}. Everything on this device will be replaced.`, ok: 'Restore', danger: true }).then(y => {
          if (!y) return;
          stopTicker(); run = null; drillRun = null;
          replaceState(data);
          S.run = null;
          save();
          V.data = false;
          render();
          snack('Backup restored');
        });
      });
    }
  });

  /* ---------- swipe a timeline item: right = held, left = undo ---------- */
  const swipe = { s: null, justSwiped: false };
  const TRIGGER = 80;
  $app.addEventListener('pointerdown', e => {
    if (drillRun && e.target.closest('#tapzone')) { e.preventDefault(); drillTap(); return; }
    const it = e.target.closest('.tl .it');
    // finished routines are locked: their finish time and overtime can't be swiped away
    if (!it || e.button > 0 || it.classList.contains('locked')) return;
    swipe.s = { it, li: it.parentElement, id: e.pointerId, x: e.clientX, y: e.clientY, dx: 0, on: false };
  });
  $app.addEventListener('pointermove', e => {
    const w = swipe.s;
    if (!w || e.pointerId !== w.id) return;
    const dx = e.clientX - w.x, dy = e.clientY - w.y;
    if (!w.on) {
      if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        w.on = true;
        try { w.it.setPointerCapture(e.pointerId); } catch (err) {}
      } else if (Math.abs(dy) > 10) { swipe.s = null; return; }
    }
    if (!w.on) return;
    w.dx = dx;
    w.it.classList.remove('snap');
    w.it.style.transform = `translateX(${dx}px)`;
    w.li.dataset.dir = dx > 0 ? 'r' : 'l';
    const armed = Math.abs(dx) > TRIGGER;
    if (armed !== w.li.classList.contains('armed')) { w.li.classList.toggle('armed', armed); if (armed) buzz(); }
  });
  function endSwipe(e) {
    const w = swipe.s;
    if (!w || e.pointerId !== w.id) return;
    swipe.s = null;
    if (!w.on) return;
    swipe.justSwiped = true;
    setTimeout(() => { swipe.justSwiped = false; }, 350);
    const go = Math.abs(w.dx) > TRIGGER && e.type === 'pointerup';
    w.it.classList.add('snap');
    w.it.style.transform = go ? `translateX(${w.dx > 0 ? '100%' : '-100%'})` : '';
    if (!go) { setTimeout(() => { delete w.li.dataset.dir; w.li.classList.remove('armed'); }, 250); return; }
    const v = w.dx > 0;
    if (w.it.dataset.todo) { const x = S.todos.find(t => t.id === w.it.dataset.id); if (x) setTodo(x, v); }
    else completeRoutine(findRoutine(w.it.dataset.gate, w.it.dataset.id), v);
    setTimeout(render, 220);
  }
  $app.addEventListener('pointerup', endSwipe);

  /* ---------- drag a sheet down by its handle to close it ---------- */
  const drag = { s: null };
  $app.addEventListener('pointerdown', e => {
    const g = e.target.closest('.sheet .grab');
    if (!g) return;
    const sh = g.closest('.sheet');
    drag.s = { sh, y: e.clientY, id: e.pointerId, dy: 0, t: Date.now() };
    try { g.setPointerCapture(e.pointerId); } catch (err) {}
    sh.style.transition = 'none';
  });
  $app.addEventListener('pointermove', e => {
    const d = drag.s;
    if (!d || e.pointerId !== d.id) return;
    d.dy = Math.max(0, e.clientY - d.y);
    d.sh.style.transform = `translateY(${d.dy}px)`;
  });
  function endDrag(e) {
    const d = drag.s;
    if (!d || e.pointerId !== d.id) return;
    drag.s = null;
    d.sh.style.transition = '';
    const fast = d.dy > 40 && d.dy / Math.max(1, Date.now() - d.t) > 0.6;
    if (d.dy > 110 || fast) {
      d.sh.style.transform = 'translateY(110%)';
      setTimeout(() => { const bg = d.sh.closest('.sheet-bg'); if (bg) bg.dispatchEvent(new MouseEvent('click', { bubbles: true })); }, 170);
    } else d.sh.style.transform = '';
  }
  $app.addEventListener('pointerup', endDrag);
  $app.addEventListener('pointercancel', endDrag);

  /* ---------- swipe the week/month calendar ---------- */
  const calSw = { s: null };
  $app.addEventListener('pointerdown', e => {
    const c = e.target.closest('.wk, .mo');
    calSw.s = c ? { x: e.clientX, y: e.clientY, id: e.pointerId } : null;
  });
  $app.addEventListener('pointerup', e => {
    const c = calSw.s;
    calSw.s = null;
    if (!c || e.pointerId !== c.id) return;
    const dx = e.clientX - c.x, dy = e.clientY - c.y;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 2) return;
    swipe.justSwiped = true;
    setTimeout(() => { swipe.justSwiped = false; }, 350);
    const btn = document.querySelector(dx < 0 ? '[data-act=cal-next]' : '[data-act=cal-prev]');
    if (btn) btn.click();
  });

  /* ---------- long-press a timeline item or task for quick actions ---------- */
  const press = { t: 0, x: 0, y: 0 };
  $app.addEventListener('pointerdown', e => {
    clearTimeout(press.t);
    const el = e.target.closest('.tl .it[data-id], .todos .tx[data-id]');
    if (!el || e.button > 0) return;
    press.x = e.clientX; press.y = e.clientY;
    press.t = setTimeout(() => {
      swipe.s = null;
      swipe.justSwiped = true;
      setTimeout(() => { swipe.justSwiped = false; }, 600);
      buzz();
      if (el.matches('.tl .it') && !el.dataset.todo) V.qa = { kind: 'routine', gate: el.dataset.gate, id: el.dataset.id, fresh: true };
      else V.qa = { kind: 'todo', id: el.dataset.id, fresh: true };
      render();
    }, 520);
  });
  $app.addEventListener('pointermove', e => { if (Math.hypot(e.clientX - press.x, e.clientY - press.y) > 8) clearTimeout(press.t); });
  ['pointerup', 'pointercancel'].forEach(t => $app.addEventListener(t, () => clearTimeout(press.t)));
  $app.addEventListener('contextmenu', e => { if (e.target.closest('.tl .it, .todos .tx')) e.preventDefault(); });
  $app.addEventListener('pointercancel', endSwipe);

  // live phrasing check for the Feature Law, without re-rendering while typing
  $app.addEventListener('input', e => {
    if (e.target.classList && e.target.classList.contains('wo-in') && WK().draft) {
      const t = e.target, it = WK().draft.items[Number(t.dataset.i)], x = it && it.sets[Number(t.dataset.j)];
      if (x) {
        x[t.dataset.f] = t.value === '' ? '' : +t.value; save();
        // keep the barbell total and plate list in step as you type
        const tot = document.getElementById(`tot-${t.dataset.i}-${t.dataset.j}`);
        if (tot && isBB(x)) tot.innerHTML = `${fmtWt(setW(x))}<small>${platesFor(x.ps)}</small>`;
      }
    }
    if (e.target.id === 'wo-title' && WK().draft) { WK().draft.title = e.target.value; save(); }
    if (e.target.dataset && e.target.dataset.rv && V.review) { const r = S.reviews[V.review] = S.reviews[V.review] || {}; r[e.target.dataset.rv] = e.target.value; save(); }
    // body form: keep a draft and update the body-fat preview as you type
    const bf0 = e.target.closest && e.target.closest('#bform');
    if (bf0) {
      const el = bf0.elements, d = { date: el.date.value };
      for (const k of ['weight', ...PARTS.map(p => p[0])]) if (el[k] && el[k].value !== '') d[k] = +el[k].value;
      V.bform = d;
      const pv = navyBF(d), box = bf0.querySelector('.bfprev');
      if (box) box.innerHTML = pv != null ? `Body fat: <b>${pv}%</b>${d.weight ? ` · lean ${Math.round(d.weight * (1 - pv / 100))} lb` : ''}` : '<span class="muted">Body fat appears once height, neck and waist are filled in.</span>';
    }
    if (e.target.id === 'wo-new') V.woName = e.target.value;
    if (e.target.id === 'wo-note' && WK().draft) { WK().draft.note = e.target.value; save(); }
    const ta = e.target.closest && e.target.closest('#todoadd');
    if (ta) V.todoDraft = { text: ta.elements.text.value, date: ta.elements.date.value, time: ta.elements.time.value };
    if (e.target.id === 'nsearch') {
      const q = e.target.value.toLowerCase();
      V.nadd.q = e.target.value;
      document.querySelectorAll('.foodlist li[data-name]').forEach(li => { li.hidden = !!q && !li.dataset.name.includes(q); });
    }
    if (e.target.closest && e.target.closest('#nprepf')) {
      syncPrep();
      const t = document.getElementById('preptot');
      if (t) t.innerHTML = prepTotalsText(V.nprep);
    }
    if (e.target.id === 'fctx') V.fDraft.ctx = e.target.value;
    if (e.target.id === 'ftext') {
      V.fDraft.text = e.target.value;
      const h = document.getElementById('fhint'), l = lintFeature(e.target.value);
      if (h) { h.className = 'hint ' + (l ? l.lvl : ''); h.textContent = l ? l.msg : ''; }
    }
  });

  $app.addEventListener('submit', e => {
    const f = e.target;
    if (f.id === 'mupf') {
      e.preventDefault();
      const u = V.mup, el = f.elements;
      const meta = { tag: u.tag, pose: u.pose, exercise: el.exercise ? el.exercise.value.trim() : '', date: el.date.value || today(), note: el.note.value.trim() };
      V.mup = null; render();
      importMedia(u.files, meta);
      return;
    }
    if (f.id === 'bform') {
      e.preventDefault();
      const el = f.elements, x = { id: uid(), t: Date.now(), date: el.date.value || today() };
      for (const k of ['weight', ...PARTS.map(p => p[0])]) if (el[k] && el[k].value !== '') x[k] = +el[k].value;
      if (Object.keys(x).length <= 3) return snack('Enter a weight or at least one measurement.');
      B().entries.push(x); V.bform = null; save(); render();
      const bf = navyBF(x);
      snack(bf != null ? `Saved · ${bf}% body fat` : 'Saved');
      return;
    }
    if (f.id === 'offform') { e.preventDefault(); const q = f.elements.q.value.trim(); if (q) runLookup(q); return; }
    if (f.id === 'supadd') {
      e.preventDefault();
      const name = f.elements.name.value.trim();
      if (!name) return;
      const x = { id: uid(), name, cat: V.supCat, price: null, priceAt: null, history: [], need: f.elements.need.checked, qty: 1, url: '' };
      if (f.elements.price.value !== '') setPrice(x, +f.elements.price.value);
      SUP().items.push(x); save(); render();
      const inp = document.querySelector('#supadd input[name=name]'); if (inp) inp.focus();
      return;
    }
    if (f.id === 'supform') {
      e.preventDefault();
      const x = SUP().items.find(y => y.id === V.sedit.id), el = f.elements;
      if (x) {
        x.name = el.name.value.trim() || x.name;
        x.cat = (f.querySelector('input[name=cat]:checked') || {}).value || x.cat;
        x.qty = Math.max(1, Math.round(+el.qty.value || 1));
        x.url = el.url.value.trim();
        if (el.price.value !== '') setPrice(x, +el.price.value);
      }
      save(); V.sedit = null; render();
      return;
    }
    if (f.id === 'todoadd') {
      e.preventDefault();
      const text = f.elements.text.value.trim();
      if (!text) return;
      const date = f.elements.date.value || (V.todoWhen === 'today' ? today() : V.todoWhen === 'tomorrow' ? keyOf(addDays(new Date(), 1)) : null);
      S.todos.push({ id: uid(), text, date, time: f.elements.time.value || null, done: false, doneAt: null, created: Date.now() });
      V.todoDraft = { text: '', date: '', time: '' };
      save(); render();
      const inp = document.querySelector('#todoadd input[name=text]'); if (inp) inp.focus();
      return;
    }
    if (f.id === 'todoform') {
      e.preventDefault();
      const x = S.todos.find(t => t.id === V.tedit.id);
      if (x) Object.assign(x, { text: f.elements.text.value.trim() || x.text, date: f.elements.date.value || null, time: f.elements.time.value || null });
      save(); V.tedit = null; render();
      return;
    }
    if (f.id === 'nnew') {
      e.preventDefault();
      const el = f.elements, p = +el.p.value || 0, c = +el.c.value || 0, fat = +el.f.value || 0;
      const item = { id: uid(), name: el.name.value.trim(), serving: el.serving.value.trim(), p, c, f: fat, kcal: el.kcal.value === '' ? kcalOf(p, c, fat) : +el.kcal.value };
      if (!item.name) return;
      if (el.keep.checked) N().foods.push(item);
      logFood(V.nadd.meal, item, Math.max(0.25, +el.qty.value || 1), el.keep.checked ? 'food' : 'quick', el.keep.checked ? item.id : null);
      V.nadd = null; buzz(); render();
      return;
    }
    if (f.id === 'nmealf') {
      e.preventDefault();
      if (!V.nmeal.items.length) return snack('Add at least one food to the meal.');
      N().meals.push({ id: uid(), name: f.elements.name.value.trim() || 'Meal', items: V.nmeal.items.map(x => ({ ...x })) });
      save(); V.nmeal = null; render(); snack('Meal saved. Log it from My meals or + Add.');
      return;
    }
    if (f.id === 'ngoalf') {
      e.preventDefault();
      for (const [m] of MAC) N().goals[m] = Math.max(0, Math.round(+f.elements[m].value || 0));
      // record from when these goals apply; earlier days keep theirs
      const gh = N().goalHist, k0 = today();
      if (gh.length && gh[gh.length - 1].from === k0) gh[gh.length - 1].goals = { ...N().goals }; else gh.push({ from: k0, goals: { ...N().goals } });
      save(); V.ngoals = null; render();
      return;
    }
    if (f.id === 'nprepf') {
      e.preventDefault();
      syncPrep();
      const ed = V.nprep, items = ed.items.filter(x => x.name.trim() || x.kcal !== '' || +x.p || +x.c || +x.f)
        .map(x => { const p = +x.p || 0, c = +x.c || 0, fat = +x.f || 0; return { name: x.name.trim() || 'Ingredient', kcal: x.kcal === '' ? kcalOf(p, c, fat) : x.kcal, p, c, f: fat }; });
      if (!items.length) return snack('Add at least one ingredient.');
      const t = prepTotals(items), n = ed.portions;
      N().preps.unshift({ id: uid(), name: ed.name.trim() || 'Meal prep', portions: n, left: n, made: today(), created: Date.now(), items,
        per: { kcal: t.kcal / n, p: t.p / n, c: t.c / n, f: t.f / n } });
      save(); V.nprep = null; render();
      return;
    }
    if (e.target.id === 'wcustom') {
      e.preventDefault();
      const v = Number(e.target.elements.amt.value);
      if (v > 0) {
        const st = wState();
        V.wFrom = Math.min(100, 100 * st.got / st.target);
        addWater(W().unit === 'oz' ? v * ML_OZ : v); buzz(); render();
      }
      return;
    }
    if (e.target.id === 'wform') {
      e.preventDefault();
      syncWEdit();
      const ed = V.wedit;
      Object.assign(W(), { unit: ed.unit, target: ed.target, pour: ed.pour, wake: ed.wake, bed: ed.bed, schedule: ed.schedule, scheduleInit: true });
      save(); V.wedit = null; render();
      return;
    }
    if (e.target.id !== 'editform') return;
    e.preventDefault();
    syncEdit();
    const r = V.edit.r;
    if (r.repeat.type === 'weekly' && !r.repeat.days.length) return snack('Pick at least one day of the week.');
    if (r.repeat.type === 'monthly' && !r.repeat.dates.length) return snack('Pick at least one date of the month.');
    r.title = r.title.trim() || 'Untitled';
    r.steps.forEach(s => { s.title = s.title.trim() || 'Step'; s.work = s.work.trim(); });
    const list = S.gates[V.edit.gate];
    const i = list.findIndex(x => x.id === r.id);
    if (i >= 0) list[i] = r; else list.push(r);
    save(); V.edit = null; render();
  });

  // keep "now" / "in Xm" fresh while idle
  const typing = () => $app.contains(document.activeElement) && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  let lastTouch = 0;
  ['touchstart', 'scroll', 'wheel'].forEach(t => addEventListener(t, () => { lastTouch = Date.now(); }, { passive: true }));
  setInterval(() => { if (!drillRun && !run && !featRun && !anySheet() && !swipe.s && !typing() && Date.now() - lastTouch > 4000) render(); }, 30000);

  // keep the focused field visible above the on-screen keyboard
  $app.addEventListener('focusin', e => {
    if (!e.target.matches || !e.target.matches('input, textarea, select') || !matchMedia('(pointer: coarse)').matches) return;
    setTimeout(() => { try { e.target.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (err) {} }, 320);
  });

  // after an update (or the first open of a new version), show what changed
  try {
    if (localStorage.getItem('metamorph.updated')) { V.whatsNew = true; localStorage.removeItem('metamorph.updated'); }
  } catch (e) {}
  if (S.seenVersion !== APP_VERSION) {
    if (fromLocal || lsOff) V.whatsNew = true;      // existing user on a new version
    else S.seenVersion = APP_VERSION;      // fresh install: nothing to announce
  }
  // first run gets a short setup; people who already use the app never see it
  if (!S.onboarded) {
    if (fromLocal || lsOff) S.onboarded = true;
    else V.onboard = { step: 0, wake: '07:00', bed: '22:30', sections: { ...S.sections }, starters: { hygiene: true, fitness: true, nutrition: true, sleep: true } };
  }

  if (lsOff && !fromLocal) {
    $app.innerHTML = `<div class="nexus" style="margin-top:30vh">${orb('chaos', 120, 'spin')}</div>`;
    booted.then(() => { resumeRun(); render(); loadThumbs(); });
  } else {
    resumeRun();
    render();
    booted.then(loadThumbs);
  }

  /* ---------- updates ---------- */

  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') scheduleReminderSync(); });

  let updating = false;
  function showUpdate(worker) {
    V.update = worker;
    V.toastFx = true;
    if (!run && !drillRun) render();
  }
  async function applyUpdate() {
    const w = V.update;
    if (!w) return;
    if (drillRun && !(await ask({ title: 'Update now?', text: 'Updating ends the current drill session.', ok: 'Update' }))) return;
    updating = true;
    try { localStorage.setItem('metamorph.updated', '1'); } catch (e) {}
    save();
    w.postMessage({ type: 'SKIP_WAITING' });
    // fallback in case the controller change event doesn't arrive
    setTimeout(() => location.reload(), 3000);
  }

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').then(reg => {
      const watch = w => w && w.addEventListener('statechange', () => {
        if (w.state === 'installed' && navigator.serviceWorker.controller) showUpdate(w);
      });
      // a new version may already be downloaded and waiting
      if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
      watch(reg.installing);
      reg.addEventListener('updatefound', () => watch(reg.installing));
      // look for new versions when the app comes back to the front, and hourly while open
      const check = () => reg.update().catch(() => {});
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
      setInterval(check, 60 * 60 * 1000);
    }).catch(() => {});

    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (updating) location.reload();
    });
  }
})();
</script>
</body>
</html>
