<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MetaMorph</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #0f1115;
    --surface: #171a21;
    --surface-2: #1f232c;
    --line: #2a2f3a;
    --text: #e8e6e1;
    --muted: #8b8f98;
    --accent: #c9a45c;
    --accent-ink: #1a1408;
    --focus: #c9a45c;
    --release: #6f8fb5;
    --ok: #6fae8b;
    --danger: #c46a6a;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-variant-emoji: text;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }

  #app { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
  header {
    padding: calc(14px + env(safe-area-inset-top)) 16px 10px;
    display: flex; align-items: baseline; justify-content: space-between;
  }
  header h1 { font-size: 20px; margin: 0; letter-spacing: .04em; font-weight: 600; }
  header .date { color: var(--muted); font-size: 14px; }
  main { flex: 1; padding: 4px 16px calc(96px + env(safe-area-inset-bottom)); }

  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
  }
  nav.tabs .inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  nav.tabs button { padding: 12px 2px; font-size: 14px; border-radius: 12px; color: var(--muted); font-weight: 600; transition: background .2s, color .2s; }
  nav.tabs button.on { background: var(--surface-2); color: var(--text); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .label { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; margin: 0 0 8px; }
  .muted { color: var(--muted); }
  .row { display: flex; align-items: center; gap: 12px; }
  .spread { justify-content: space-between; }
  .num { font-variant-numeric: tabular-nums; }

  .btn { padding: 14px 18px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); font-weight: 600; transition: transform .1s; }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.ghost { background: none; }
  .btn.danger { color: var(--danger); }
  .btn.block { width: 100%; }
  .btn.small { padding: 8px 12px; font-size: 14px; }
  .btn:disabled { opacity: .45; }

  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideup { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); } 50% { box-shadow: 0 0 0 6px transparent; } }

  /* ---------- orbs ---------- */
  .orb { display: block; filter: drop-shadow(0 0 10px color-mix(in srgb, var(--glow) 45%, transparent)); user-select: none; -webkit-user-drag: none; }
  .orb.spin { animation: spin 90s linear infinite; }
  .orb.enter { animation: enter .7s cubic-bezier(.2,.8,.2,1), spin 90s linear .7s infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes enter { from { opacity: 0; transform: scale(.55) rotate(-40deg); filter: drop-shadow(0 0 40px var(--glow)) brightness(1.6); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .orb.spin, .orb.enter { animation: none; } }

  .nexus { display: flex; flex-direction: column; align-items: center; margin: 4px 0 16px; text-align: center; }
  .nexus .orb { width: 150px; height: 150px; }
  .nexus .cap { margin-top: 8px; color: var(--muted); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
  .nexus .cap b { color: var(--text); font-weight: 600; }

  .gatehead { display: flex; align-items: center; gap: 16px; margin: 0 0 14px; }
  .gatehead .orb { width: 92px; height: 92px; flex: none; }
  .gatehead .nm { font-size: 22px; font-weight: 600; }
  .gatehead .sub { color: var(--muted); font-size: 14px; }

  /* ---------- calendar ---------- */
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-bottom: 16px; }
  .seg button { padding: 9px 4px; border-radius: 9px; color: var(--muted); font-weight: 600; font-size: 14px; transition: background .2s, color .2s; }
  .seg button.on { background: var(--surface-2); color: var(--text); }
  .calnav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .calnav .ttl { font-weight: 600; text-align: center; }
  .calnav .ttl small { display: block; color: var(--muted); font-weight: 400; font-size: 13px; }
  .calnav button.arrow { width: 40px; height: 40px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: 18px; }
  .linkbtn { color: var(--accent); font-size: 13px; font-weight: 600; }

  .wk { display: grid; grid-template-columns: 30px repeat(7, 1fr); gap: 6px 2px; align-items: center; }
  .wk .dh { text-align: center; font-size: 11px; color: var(--muted); padding: 6px 0; border-radius: 10px; cursor: pointer; }
  .wk .dh b { display: block; font-size: 15px; color: var(--text); font-weight: 600; }
  .wk .dh.today b { color: var(--accent); }
  .wk .dh.sel { background: var(--surface-2); }
  .wk .g .orb { width: 24px; height: 24px; filter: none; }
  .wk .c { height: 28px; display: grid; place-items: center; color: var(--line); cursor: pointer; }
  .ring { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--gcol); }
  .ring.full { background: var(--gcol); }
  .ring.part { background: linear-gradient(90deg, var(--gcol) 50%, transparent 50%); }
  .ring.miss { opacity: .3; }
  .ring.future { opacity: .35; border-style: dashed; }

  .mo { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .mo .wd { text-align: center; font-size: 11px; color: var(--muted); padding-bottom: 2px; }
  .mo .d { aspect-ratio: 1; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); padding: 5px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; min-width: 0; }
  .mo .d.blank { visibility: hidden; }
  .mo .d.today { border-color: var(--accent); }
  .mo .d.sel { background: var(--surface-2); border-color: var(--text); }
  .mo .n { font-size: 12px; color: var(--muted); }
  .mo .d.today .n { color: var(--accent); font-weight: 700; }
  .mo .bars { display: flex; gap: 2px; }
  .mo .bars i { flex: 1; height: 4px; border-radius: 2px; background: var(--gcol); }
  .mo .bars i.none { background: transparent; }
  .mo .bars i.miss { opacity: .18; }
  .mo .bars i.future { opacity: .35; }
  .mo .bars i.part { opacity: .6; }
  .legend { display: flex; gap: 14px; justify-content: center; margin: 12px 0 0; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }

  .daylist { list-style: none; margin: 0; padding: 0; }
  .daylist li { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .daylist li:first-child { border-top: 0; }
  .daylist .orb { width: 28px; height: 28px; filter: none; }
  .daylist .t { color: var(--muted); font-size: 13px; }
  .daylist .chk:disabled { opacity: .35; }

  /* ---------- today ---------- */
  .hero { border-color: var(--gc, var(--accent)); }
  .hero .top { display: flex; gap: 14px; align-items: center; }
  .hero .top .orb { width: 56px; height: 56px; flex: none; }
  .hero .when { color: var(--gc, var(--accent)); font-size: 12px; font-weight: 700; letter-spacing: .2em; }
  .hero .ti { font-size: 22px; font-weight: 600; margin: 4px 0 2px; }
  .hero .meta { color: var(--muted); font-size: 14px; }
  .hero .chain { margin: 12px 0 14px; font-size: 14px; color: var(--muted); }
  .hero .chain b { color: var(--text); font-weight: 500; }
  .hero .chain s { text-decoration: none; color: var(--ok); }

  .tl { list-style: none; margin: 8px 0 0; padding: 0; }
  .tl > li { position: relative; overflow: hidden; border-radius: 12px; }
  .tl .it { user-select: none; -webkit-user-select: none; display: grid; grid-template-columns: 66px 16px 1fr auto; gap: 10px; align-items: start; padding: 10px 0; position: relative;
            background: var(--bg); cursor: pointer; touch-action: pan-y; will-change: transform; }
  .tl .it.snap { transition: transform .25s cubic-bezier(.2,.8,.2,1); }
  .tl .it::before { content: ""; position: absolute; left: 81px; top: 0; bottom: 0; width: 2px; background: var(--line); }
  .tl > li:first-child .it::before { top: 14px; }
  .tl > li:last-child .it::before { bottom: calc(100% - 18px); }
  .tl .t { font-size: 13px; color: var(--muted); padding-top: 2px; text-align: right; }
  .tl .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--bg); border: 2px solid var(--line); margin-top: 4px; position: relative; z-index: 1; }
  .tl .it.done .dot { background: var(--ok); border-color: var(--ok); }
  .tl .it.now .dot { border-color: var(--accent); background: var(--accent); animation: pulse 2s infinite; }
  .tl .nm { font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .tl .nm .orb { width: 22px; height: 22px; filter: none; }
  .tl .sub { font-size: 13px; color: var(--muted); }
  .tl .it.done .nm { color: var(--muted); }
  .tl .st { font-size: 13px; color: var(--muted); padding-top: 2px; white-space: nowrap; }
  .tl .it.now .st { color: var(--accent); font-weight: 600; }
  .tl .it.done .st { color: var(--ok); }
  .swbg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; font-weight: 700; font-size: 14px; opacity: 0; transition: opacity .15s; }
  .swbg .l { color: #0d1a12; } .swbg .r { color: var(--text); }
  .tl > li[data-dir="r"] .swbg { opacity: 1; background: color-mix(in srgb, var(--ok) 55%, var(--bg)); }
  .tl > li[data-dir="l"] .swbg { opacity: 1; background: var(--surface-2); }
  .tl > li[data-dir="r"] .swbg .r, .tl > li[data-dir="l"] .swbg .l { visibility: hidden; }
  .tl > li.armed[data-dir="r"] .swbg { background: var(--ok); }
  .tl > li.armed[data-dir="l"] .swbg { background: var(--danger); }
  .swhint { text-align: center; color: var(--muted); font-size: 12px; margin: 6px 0 0; }

  /* ---------- slide transitions ---------- */
  @keyframes inR { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
  @keyframes inL { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
  .slide-r { animation: inR .28s cubic-bezier(.2,.8,.2,1); }
  .slide-l { animation: inL .28s cubic-bezier(.2,.8,.2,1); }
  @media (prefers-reduced-motion: reduce) { .slide-r, .slide-l { animation: none; } }

  /* ---------- update prompt ---------- */
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom)); max-width: 528px; margin: 0 auto;
           background: var(--surface-2); border: 1px solid var(--accent); border-radius: 14px; padding: 12px 12px 12px 14px;
           display: flex; align-items: center; gap: 12px; z-index: 15; box-shadow: 0 12px 30px rgba(0,0,0,.45); }
  .toast.anim { animation: rise .3s ease; }
  .toast .orb { width: 36px; height: 36px; flex: none; }
  .toast .msg { flex: 1; font-size: 13px; color: var(--muted); }
  .toast .msg b { display: block; font-size: 15px; color: var(--text); }
  .toast .btn { padding: 9px 12px; font-size: 14px; }
  .news { margin: 0 0 6px; padding-left: 20px; }
  .news li { margin: 6px 0; }
  .whatsnew-head { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
  .whatsnew-head .orb { width: 56px; height: 56px; }
  .whatsnew-head h2 { margin: 0; }

  /* ---------- drill ---------- */
  .orb.still { animation: none !important; filter: brightness(.72) saturate(.85); }
  .drillhero { display: flex; gap: 16px; align-items: center; }
  .drillhero .orb { width: 96px; height: 96px; flex: none; }
  .drillhero h2 { margin: 0 0 4px; font-size: 20px; }
  .bigstat { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .bigstat b { font-size: 40px; font-weight: 300; font-variant-numeric: tabular-nums; line-height: 1; }
  .delta { font-size: 13px; font-weight: 600; }
  .delta.good { color: var(--ok); }
  .delta.bad { color: var(--danger); }
  .spark { width: 100%; height: 44px; display: block; margin-top: 10px; }
  .setrow { display: grid; grid-template-columns: 84px 1fr; align-items: center; gap: 10px; margin: 0 0 10px; }
  .setrow > span { color: var(--muted); font-size: 14px; }
  .opts { display: flex; gap: 6px; flex-wrap: wrap; }
  .opts button { padding: 8px 10px; min-width: 46px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .opts button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  details.how summary { cursor: pointer; color: var(--muted); font-size: 14px; list-style: none; }
  details.how summary::-webkit-details-marker { display: none; }
  details.how ol { margin: 10px 0 0; padding-left: 20px; color: var(--muted); font-size: 14px; }
  details.how li { margin: 6px 0; }
  .run.drillrun .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
  .run.drillrun .orb { width: 210px; height: 210px; }
  .run.drillrun .legend2 { color: var(--muted); font-size: 13px; text-align: center; line-height: 1.7; }
  .tapzone { width: 100%; height: 132px; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: 17px; font-weight: 600; position: relative; overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  .tapzone .rip { position: absolute; inset: 0; background: var(--text); opacity: 0; pointer-events: none; }
  .tapzone.hit .rip { animation: rip .35s ease-out; }
  @keyframes rip { from { opacity: .12; } to { opacity: 0; } }
  .lat { display: flex; align-items: flex-end; gap: 4px; height: 70px; margin: 14px 0 4px; }
  .lat i { flex: 1; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 3px; opacity: .85; }
  .lat i.miss { background: transparent; border: 1px dashed var(--danger); opacity: .6; height: 100%; }
  .stats4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; text-align: center; }
  .stats4 b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stats4 span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

  /* ---------- water ---------- */
  :root { --water: #2fd3c6; }
  .vessel-wrap { display: grid; grid-template-columns: 116px 1fr; gap: 18px; align-items: center; }
  .vessel { position: relative; height: 230px; border: 2px solid var(--line); border-top: 0; border-radius: 0 0 26px 26px; overflow: hidden; background: var(--surface-2); }
  .vessel .fill { position: absolute; left: 0; right: 0; bottom: 0; transition: height .7s cubic-bezier(.2,.8,.2,1);
                  background: linear-gradient(180deg, color-mix(in srgb, var(--water) 80%, white), var(--water) 35%, color-mix(in srgb, var(--water) 65%, black)); }
  .vessel .fill::before { content: ""; position: absolute; left: -20%; right: -20%; top: -6px; height: 12px; background: color-mix(in srgb, var(--water) 65%, white); border-radius: 50%; opacity: .55; }
  .vessel .pace { position: absolute; left: 0; right: 0; height: 0; border-top: 2px dashed var(--text); opacity: .75; }
  .vessel .pace span { position: absolute; right: 6px; top: -17px; font-size: 10px; letter-spacing: .12em; color: var(--text); }
  .wbig { font-size: 34px; font-weight: 300; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .wbig small { font-size: 15px; color: var(--muted); }
  .pill { display: inline-block; padding: 5px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--surface-2); color: var(--muted); margin-top: 8px; }
  .pill.ok { background: color-mix(in srgb, var(--ok) 22%, var(--surface)); color: var(--ok); }
  .pill.behind { background: color-mix(in srgb, var(--accent) 22%, var(--surface)); color: var(--accent); }
  .pill.ahead { background: color-mix(in srgb, var(--water) 20%, var(--surface)); color: var(--water); }
  .quick { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .quick .btn { padding: 12px 6px; }
  .btn.water { background: var(--water); border-color: var(--water); color: #04201d; }
  .custom { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 8px; }
  .custom input, .wrow input { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; width: 100%; }
  .sched { list-style: none; margin: 0; padding: 0; }
  .sched li { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 15px; color: var(--muted); }
  .sched li:first-child { border-top: 0; }
  .sched .d { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); }
  .sched li.done .d { background: var(--water); border-color: var(--water); }
  .sched li.next { color: var(--text); font-weight: 600; }
  .sched li.next .d { border-color: var(--water); }
  .wlog { list-style: none; margin: 0; padding: 0; }
  .wlog li { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .wlog li:first-child { border-top: 0; }
  .wlog button { color: var(--muted); padding: 4px 8px; }
  .week7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; height: 110px; margin-top: 8px; }
  .week7 .col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .week7 .bw { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; position: relative; }
  .week7 .b { width: 100%; max-width: 26px; border-radius: 6px 6px 2px 2px; background: color-mix(in srgb, var(--water) 40%, var(--surface-2)); min-height: 2px; }
  .week7 .b.hit { background: var(--water); }
  .week7 .tl2 { position: absolute; left: -3px; right: -3px; border-top: 1px dashed var(--muted); opacity: .6; }
  .week7 .lbl { font-size: 11px; color: var(--muted); }
  .week7 .lbl.today { color: var(--water); font-weight: 700; }
  .wrow { display: grid; grid-template-columns: 1fr 1fr 40px; gap: 8px; align-items: center; margin-bottom: 8px; }
  .wrow button { height: 40px; border-radius: 10px; background: var(--surface-2); color: var(--muted); }
  .drop { width: 22px; height: 22px; display: block; margin: 0 auto; flex: none; }
  .toast .drop { width: 32px; height: 32px; }
  .toast.watert { border-color: var(--water); }

  /* ---------- feature law ---------- */
  .lawq { font-size: 15px; line-height: 1.5; margin: 6px 0 0; color: var(--muted); }
  .lawq b { color: var(--text); font-weight: 600; }
  .hint { font-size: 13px; margin: 6px 0 0; min-height: 18px; }
  .hint.warn { color: var(--accent); }
  .hint.ok { color: var(--ok); }
  .hint.info { color: var(--muted); }
  .flist { list-style: none; margin: 0; padding: 0; }
  .flist li { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .flist li:first-child { border-top: 0; }
  .flist .ctx { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .flist .txt { font-weight: 600; }
  .mtag { font-size: 10px; padding: 2px 7px; border-radius: 999px; background: var(--surface-2); color: var(--muted); margin-left: 6px; font-weight: 700; letter-spacing: .06em; }
  .mtag.ctl { color: var(--release); }
  .cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .cmp > div { background: var(--surface-2); border-radius: 12px; padding: 12px; text-align: center; }
  .cmp b { display: block; font-size: 26px; font-weight: 300; font-variant-numeric: tabular-nums; }
  .cmp span { font-size: 12px; color: var(--muted); }
  .prog { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin-top: 12px; }
  .prog i { display: block; height: 100%; background: var(--accent); }
  .holdtext { font-size: 26px; font-weight: 600; max-width: 20ch; line-height: 1.3; }
  .checkrow { display: flex; gap: 10px; align-items: center; margin: 10px 0 14px; font-size: 14px; color: var(--muted); }
  .checkrow input { width: 18px; height: 18px; accent-color: var(--accent); }

  /* ---------- routine clock ---------- */
  :root { --late: #f0a05a; }
  .late, .tag.late, .tl .st.late { color: var(--late) !important; }
  .clockbar { display: flex; gap: 3px; margin: 14px 0 6px; }
  .clockbar > span { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; min-width: 6px; }
  .clockbar > span > i { display: block; height: 100%; width: 0; background: var(--gc, var(--accent)); transition: width 1s linear; }
  .clockbar > span.done > i { width: 100% !important; background: var(--ok); }
  .clockbar.over > span:not(.done) > i { background: var(--late); }
  .clockbar.thin { margin: 6px 0 2px; }
  .clockbar.thin > span { height: 4px; }
  .cleft { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cleft.over { color: var(--late); font-weight: 600; }
  .hero .chain { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 0; }
  .stepchip { padding: 6px 11px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-size: 13px; color: var(--text); }
  .stepchip.done { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
  .chain .arrow { color: var(--muted); margin: 0 5px; }
  .tl .dot.sq { border-radius: 4px; }
  .tl .it.todo .nm { font-weight: 500; }
  .tl .it.todo.done .nm { text-decoration: line-through; }

  /* ---------- to-do ---------- */
  .todos { list-style: none; margin: 0; padding: 0; }
  .todos li { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .todos li:first-child { border-top: 0; }
  .todos .tx { cursor: pointer; min-width: 0; }
  .todos .tx > div:first-child { overflow-wrap: anywhere; }
  .todos li.done .tx > div:first-child { color: var(--muted); text-decoration: line-through; }
  .todos .t { font-size: 13px; color: var(--muted); }
  .todos .t.overdue { color: var(--late); }
  .todos .x { color: var(--muted); padding: 6px 8px; }
  .grouphead { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 0 8px; }
  .grouphead h3 { margin: 0; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .grouphead.overdue h3 { color: var(--late); }

  /* ---------- nutrition ---------- */
  .sechead { display: flex; justify-content: space-between; align-items: baseline; margin: 22px 0 10px; }
  .sechead h3 { margin: 0; font-size: 18px; }
  .mac { margin-bottom: 12px; font-size: 14px; }
  .mac:last-child { margin-bottom: 0; }
  .mbar { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; margin-top: 5px; }
  .mbar i { display: block; height: 100%; background: var(--gc, var(--accent)); border-radius: 4px; transition: width .5s; }
  .mbar i.over { background: var(--late) !important; }
  .meal + .meal { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .flog, .foodlist { list-style: none; margin: 8px 0 0; padding: 0; }
  .flog li, .foodlist li { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .flog li:first-child, .foodlist li:first-child { border-top: 0; }
  .flog .t, .foodlist .t { font-size: 12px; color: var(--muted); }
  .flog button { color: var(--muted); padding: 4px 8px; }
  .foodlist { max-height: 46vh; overflow-y: auto; }
  .search { width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .qty { display: inline-flex; align-items: center; gap: 10px; }
  .qty button { width: 34px; height: 34px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); font-size: 18px; }
  .qty b { min-width: 34px; text-align: center; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .grid4 .field input { padding: 10px 8px; }
  .ing { border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 8px; display: grid; gap: 8px; }
  .ing .top { display: grid; grid-template-columns: 1fr 40px; gap: 8px; }
  .ing input, .sheet select { width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 8px; color: var(--text); }
  .ing .top button { border-radius: 10px; background: var(--surface-2); color: var(--muted); }
  .ing .grid4 input { text-align: center; }
  .ing .lbls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; font-size: 11px; color: var(--muted); text-align: center; margin-bottom: -4px; }
  .preptot { background: var(--surface-2); border-radius: 12px; padding: 12px; font-size: 14px; margin: 6px 0 12px; }

  /* ---------- header + data sheet ---------- */
  header .right { display: flex; align-items: center; gap: 10px; }
  .iconbtn { position: relative; width: 34px; height: 34px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: 16px; display: grid; place-items: center; }
  .iconbtn .badge { position: absolute; top: -3px; right: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg); }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .kv:first-of-type { border-top: 0; }
  .kv .v { color: var(--muted); text-align: right; }
  .kv .v.good { color: var(--ok); }
  .kv .v.warn { color: var(--accent); }
  .stack { display: grid; gap: 8px; margin-top: 14px; }
  .note { color: var(--muted); font-size: 13px; margin: 12px 0 0; line-height: 1.5; }

  /* ---------- gates ---------- */
  .gatebar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-bottom: 14px; }
  .gatebar button { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 4px; text-align: center; transition: border-color .2s, background .2s; }
  .gatebar button.on { border-color: var(--gc); background: var(--surface-2); }
  .gatebar .orb { width: 40px; height: 40px; margin: 0 auto 2px; filter: none; transition: transform .25s, filter .25s; }
  .gatebar button.on .orb { transform: scale(1.12); filter: drop-shadow(0 0 8px var(--glow)); }
  .gatebar .nm { font-size: 12px; font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; }
  .gatebar .ct { font-size: 12px; color: var(--muted); display: block; }

  .rhead { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
  .chk { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; font-size: 16px; transition: background .2s, border-color .2s; }
  .chk.done { background: var(--ok); border-color: var(--ok); color: #0d1a12; }
  .rhead .t { color: var(--muted); font-size: 14px; }
  .rhead .ti { font-weight: 600; font-size: 17px; }
  .card.now { border-color: var(--gc, var(--accent)); }
  .tag { font-size: 11px; color: var(--accent); letter-spacing: .1em; text-transform: uppercase; margin-left: 6px; }

  .chainlist { list-style: none; margin: 12px 0 0; padding: 12px 0 0 0; border-top: 1px solid var(--line); }
  .chainlist li { display: grid; grid-template-columns: 66px 12px 1fr auto; gap: 10px; align-items: center; font-size: 14px; padding: 3px 0; position: relative; }
  .chainlist li + li::before { content: ""; position: absolute; left: 81px; top: -8px; height: 14px; width: 2px; background: var(--line); }
  .chainlist .t { color: var(--muted); text-align: right; font-size: 13px; }
  .chainlist .d { width: 8px; height: 8px; border-radius: 50%; background: var(--line); margin-left: 2px; }
  .chainlist li.done .d { background: var(--ok); }
  .chainlist .m { color: var(--muted); font-size: 13px; }
  .acts { display: flex; gap: 8px; margin-top: 12px; }
  .acts .btn { flex: 1; }

  /* ---------- drill ---------- */
  .stepper { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .step { background: var(--surface-2); border-radius: 12px; padding: 10px; text-align: center; }
  .step .v { font-size: 22px; font-weight: 600; }
  .step .k { font-size: 12px; color: var(--muted); }
  .step .pm { display: flex; justify-content: space-between; margin-top: 6px; }
  .step .pm button { width: 32px; height: 32px; border-radius: 8px; background: var(--surface); font-size: 18px; }
  .hist { list-style: none; margin: 0; padding: 0; }
  .hist li { display: flex; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .hist li:first-child { border-top: 0; }

  /* ---------- run screen ---------- */
  .run { position: fixed; inset: 0; background: var(--bg); z-index: 20; display: flex; flex-direction: column;
         padding: calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom)); animation: fade .25s ease; }
  .run .inner { max-width: 560px; width: 100%; margin: 0 auto; flex: 1; display: flex; flex-direction: column; }
  .run .top { display: flex; justify-content: space-between; align-items: center; color: var(--muted); gap: 12px; }
  .run .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; animation: rise .35s ease; }
  .phase { font-size: 15px; letter-spacing: .3em; font-weight: 700; }
  .clock { font-size: 84px; font-weight: 300; font-variant-numeric: tabular-nums; line-height: 1; }
  .instr { color: var(--muted); max-width: 30ch; font-size: 17px; }
  .ritual { font-size: 22px; max-width: 24ch; line-height: 1.35; }
  .stepname { font-size: 30px; font-weight: 600; max-width: 18ch; line-height: 1.2; }
  .bigtap { width: 100%; padding: 26px; border-radius: 18px; font-size: 20px; font-weight: 700; }
  .bigtap.lock { background: var(--focus); color: var(--accent-ink); }
  .bigtap.catch { background: var(--surface-2); border: 1px solid var(--line); }
  .bigtap.wait { background: none; border: 1px dashed var(--line); color: var(--muted); }
  .bar { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; width: 100%; }
  .bar > i { display: block; height: 100%; background: currentColor; width: 0; }
  .dots { display: flex; gap: 6px; justify-content: center; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--surface-2); }
  .dots i.on { background: var(--muted); }
  .dots i.now { background: var(--text); }
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .controls.one { grid-template-columns: 1fr; }

  .segs { display: flex; gap: 4px; margin: 14px 0 0; }
  .segs > span { height: 5px; border-radius: 3px; background: var(--surface-2); overflow: hidden; min-width: 8px; }
  .segs > span > i { display: block; height: 100%; width: 0; background: var(--gc, var(--accent)); }
  .segs > span.done > i { width: 100%; background: var(--ok); }
  .segs > span.over > i { width: 100% !important; background: var(--late); }
  .clock.late { color: var(--late); }
  .latebars { display: grid; gap: 6px; width: 100%; max-width: 420px; }
  .latebar { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 8px 8px 8px 14px; border-radius: 12px;
             background: color-mix(in srgb, var(--late) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--late) 45%, var(--line)); text-align: left; font-size: 14px; }
  .latebar b { color: var(--late); font-variant-numeric: tabular-nums; }
  .latebar .btn { padding: 7px 12px; font-size: 13px; }
  .recap .ot { color: var(--late); font-variant-numeric: tabular-nums; }
  .seglabels { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 8px; }
  .run .orb { width: 150px; height: 150px; margin-bottom: 6px; }
  .autonext { font-size: 15px; color: var(--muted); }
  .autonext b { color: var(--text); font-variant-numeric: tabular-nums; }
  .autoring { width: 64px; height: 64px; }
  .autoring circle { fill: none; stroke-width: 5; }
  .autoring .bg { stroke: var(--surface-2); }
  .autoring .fg { stroke: var(--gc, var(--accent)); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
  .check { width: 64px; height: 64px; border-radius: 50%; background: var(--ok); color: #0d1a12; display: grid; place-items: center; font-size: 30px; }
  .upnext { color: var(--muted); font-size: 12px; letter-spacing: .25em; font-weight: 700; margin-top: 18px; }
  .recap { list-style: none; padding: 0; margin: 4px 0 0; color: var(--muted); font-size: 15px; }
  .recap li::before { content: "✓  "; color: var(--ok); }

  /* ---------- sheet ---------- */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
  .sheet-bg.enter { animation: fade .2s ease; }
  .sheet-bg.enter .sheet { animation: slideup .28s cubic-bezier(.2,.8,.2,1); }
  .sheet { background: var(--surface); border-top-left-radius: 20px; border-top-right-radius: 20px; width: 100%; max-width: 560px;
           max-height: 92vh; overflow-y: auto; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); }
  .sheet h2 { margin: 0 0 14px; font-size: 18px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .field input, .srow input {
    width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px;
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .srow { border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 8px; display: grid; gap: 8px; }
  .srow .top { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: center; }
  .srow .hm { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .srow .hm label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip { position: relative; }
  .chip input { position: absolute; opacity: 0; pointer-events: none; }
  .chip span { display: block; min-width: 40px; text-align: center; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); font-size: 14px; cursor: pointer; }
  .chip input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .chips.days .chip span { min-width: 0; width: 38px; padding: 8px 0; }
  .rep .tag { margin-left: 0; }
  .srow .n { width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 13px; color: var(--muted); }
  .srow input { padding: 10px; }
  .srow .tools { display: flex; gap: 6px; justify-content: flex-end; }
  .srow .tools button { padding: 6px 10px; border-radius: 8px; background: var(--surface-2); font-size: 14px; color: var(--muted); }
  .srow .tools button:disabled { opacity: .35; }
  .total { color: var(--muted); font-size: 14px; margin: 4px 0 14px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(() => {
  'use strict';

  /* ---------- data ---------- */

  const GATES = [
    { id: 'sleep',     name: 'Sleep',     color: '#a66bff' },
    { id: 'fitness',   name: 'Fitness',   color: '#ff5a3c' },
    { id: 'nutrition', name: 'Nutrition', color: '#63d84a' },
    { id: 'hygiene',   name: 'Hygiene',   color: '#3d8bff' },
    // not a Gate: everything that doesn't fit the four, still on the timeline
    { id: 'other',     name: 'Other',     color: '#aab4c3', other: true },
  ];
  const orb = (id, size, cls = '') =>
    `<img class="orb ${cls}" src="img/orb-${id}.webp" width="${size}" height="${size}" alt="" style="--glow:${id === 'chaos' ? '#8a6bff' : gateOf(id).color}">`;
  const gateOf = id => GATES.find(g => g.id === id);

  const KEY = 'metamorph.v1';

  // Keep in step with CACHE in sw.js. Add a CHANGELOG entry for each release.
  const APP_VERSION = 10;
  const CHANGELOG = {
    10: [
      'When a step’s time is up, the next step starts and the unfinished one stays open in orange, counting overtime until you tap its Done',
      'If the last step runs over, its timer keeps going in orange (LATE) until you tap Done',
      'After you tap Done, the next step starts by itself after a 5-second countdown',
      'When a routine ends, the next routine on today’s timeline starts the same way if it’s due within 15 minutes',
      'Hold stops a countdown; Start now skips it',
    ],
    9: [
      'Routine timers run on the clock: a timer bar fills from the start time, steps check off as you go, and finishing late is marked with the time you finished',
      'Nutrition: calorie and macro tracking by meal, saved foods, and meal prep you cook once and log by the portion',
      'To-do list, with timed tasks shown on the timeline',
      'Other: a fifth section for activities that don’t fit the four Gates',
      'Feature Law and Switch Drill now share the Practice tab',
    ],
    8: [
      'Water: a fill vessel with a pace marker, an editable spaced schedule, reminders when a sip is due, and calendar alerts',
      'Feature: the Feature Law, with a phrasing check, a 30-second hold, check-ins and control trials',
      'Switch Drill redesign: the still chaos orb as the focus object, cues by sound and vibration only, and randomized release so the chime can’t be anticipated',
      'Water shows up in the Week and Month views',
    ],
    7: [
      'Element orbs for each Gate, and the chaos orb on the timeline and as the app icon',
      'Routines repeat daily, on chosen weekdays, or on dates of the month',
      'Day, Week and Month views, and you can check off past days',
      'Steps take hours and minutes; times show as 12-hour',
      'Swipe a timeline item right to mark it held, left to undo',
      'Backup & data (the ⋯ button): share, download and restore backups',
      'A routine in progress survives closing the app',
      'Routines that run past midnight count for the day they started',
      'This update prompt',
    ],
  };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  const step = (title, minutes, work = '') => ({ id: uid(), title, minutes, work });
  const routine = (title, start, steps, repeat = { type: 'daily' }) => ({ id: uid(), title, start, steps, repeat });

  function seed() {
    return {
      v: 2,
      gates: {
        sleep: [
          routine('Night routine', '22:00', [step('Tidy the room', 10), step('Wind-down', 20, 'No screens. Let the day go.')]),
        ],
        fitness: [
          routine('Training', '07:00', [step('Warm-up', 10), step('Train', 30), step('Cool-down', 5)]),
        ],
        nutrition: [
          routine('Breakfast', '08:00', [step('Eat', 20, 'Water and protein.')]),
          routine('Lunch',     '12:30', [step('Eat', 30, 'Water and protein.')]),
          routine('Dinner',    '18:30', [step('Eat', 30, 'Water and protein.')]),
        ],
        hygiene: [
          routine('Morning routine', '06:30', [step('Cold water', 2), step('Teeth', 3), step('Skincare', 5)]),
          routine('Evening routine', '21:30', [step('Teeth', 3), step('Shower', 12)]),
        ],
      },
      done: {},
      drill: { focus: 30, release: 30, rounds: 8, sessions: [] },
    };
  }

  // v1 stored single blocks; each becomes a one-step routine (ids kept so today's done marks survive)
  function migrate(s) {
    if (s.v === 1) {
      for (const g of Object.keys(s.gates)) {
        s.gates[g] = s.gates[g].map(b => ({
          id: b.id, title: b.title, start: b.start,
          steps: [step(b.title, Math.max(1, Number(b.minutes) || 1), b.work || '')],
        }));
      }
      s.v = 2;
    }
    return s;
  }

  const valid = s => s && (s.v === 1 || s.v === 2) && s.gates && s.done && s.drill;
  function normalize(s) {
    migrate(s);
    // routines saved before schedules existed repeat every day
    for (const g of Object.keys(s.gates)) for (const r of s.gates[g]) if (!r.repeat) r.repeat = { type: 'daily' };
    if (!s.created) s.created = Date.now();
    if (!('run' in s)) s.run = null;
    if (!('jitter' in s.drill)) s.drill.jitter = 8;
    if (!s.water) {
      const d = new Date();
      s.water = { unit: 'ml', target: 2500, pour: 250, wake: '07:00', bed: '22:00', schedule: [], scheduleInit: false, log: {}, snooze: {},
                  since: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}` };
    }
    if (!s.features) s.features = { items: [], experiment: true };
    if (!s.gates.other) s.gates.other = [];
    if (!s.fin) s.fin = {};
    if (!s.todos) s.todos = [];
    if (!s.nutri) s.nutri = { goals: { kcal: 2200, p: 150, c: 220, f: 70 }, foods: [], preps: [], log: {} };
    return s;
  }

  // A second copy in IndexedDB: if localStorage is lost, the app restores from it on the next open.
  const idb = (() => {
    let dbp = null;
    const open = () => dbp || (dbp = new Promise((res, rej) => {
      const q = indexedDB.open('metamorph', 1);
      q.onupgradeneeded = () => q.result.createObjectStore('kv');
      q.onsuccess = () => {
        const db = q.result;
        // let another tab or a newer version take over instead of blocking it
        db.onversionchange = () => { db.close(); dbp = null; };
        res(db);
      };
      q.onerror = () => rej(q.error);
    }));
    const tx = (mode, fn) => open().then(db => new Promise((res, rej) => {
      const t = db.transaction('kv', mode), out = fn(t.objectStore('kv'));
      t.oncomplete = () => res(out && out.result);
      t.onerror = () => rej(t.error);
    }));
    return {
      get: k => tx('readonly', st => st.get(k)),
      set: (k, v) => tx('readwrite', st => { st.put(v, k); }),
    };
  })();

  let fromLocal = false;
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (valid(s)) { fromLocal = true; return normalize(s); }
    } catch (e) {}
    return normalize(seed());
  }
  let mirrorTimer = null;
  // the IndexedDB copy is only written once we know it isn't needed for recovery
  let mirrorReady = false;
  function save() {
    const json = JSON.stringify(S);
    try { localStorage.setItem(KEY, json); } catch (e) {}
    if (!mirrorReady) return;
    clearTimeout(mirrorTimer);
    mirrorTimer = setTimeout(() => { idb.set('state', JSON.stringify(S)).catch(() => {}); }, 400);
  }

  const S = load();
  function replaceState(next) {
    for (const k of Object.keys(S)) delete S[k];
    Object.assign(S, normalize(next));
  }

  // all dates are the device's local time (follows the phone's timezone)
  const keyOf = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const today = () => keyOf(new Date());

  // keep a bit over a year of history for the week/month views
  (() => {
    const cutoff = addDays(new Date(), -400);
    for (const k of Object.keys(S.done)) if (parseKey(k) < cutoff) delete S.done[k];
    for (const k of Object.keys(S.fin)) if (parseKey(k) < cutoff) delete S.fin[k];
    for (const k of Object.keys(S.nutri.log)) if (parseKey(k) < cutoff) delete S.nutri.log[k];
    save();
  })();

  // ask the browser not to clear this app's storage under pressure
  const storageInfo = { persisted: null };
  (async () => {
    try {
      if (!navigator.storage || !navigator.storage.persist) return;
      storageInfo.persisted = await navigator.storage.persisted() || await navigator.storage.persist();
    } catch (e) {}
  })();

  // localStorage came back empty: recover from the IndexedDB copy if there is one
  if (!fromLocal) {
    idb.get('state').then(json => {
      const s = json && JSON.parse(json);
      if (valid(s)) {
        replaceState(s);
        resumeRun();
        render();
      }
    }).catch(() => {}).finally(() => { mirrorReady = true; save(); });
  } else {
    mirrorReady = true;
    idb.set('state', JSON.stringify(S)).catch(() => {});
  }

  /* ---------- helpers ---------- */

  const $app = document.getElementById('app');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const mmss = sec => {
    sec = Math.max(0, Math.ceil(sec));
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = String(sec % 60).padStart(2, '0');
    return h ? `${h}:${String(m).padStart(2, '0')}:${s}` : `${m}:${s}`;
  };
  const toMin = hhmm => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };
  // minutes since midnight -> "6:30 AM"
  const fromMin = m => {
    m = ((m % 1440) + 1440) % 1440;
    const h = Math.floor(m / 60);
    return `${h % 12 || 12}:${String(m % 60).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`;
  };
  const clock = hhmm => fromMin(toMin(hhmm));
  const fromMinHM = m => { m = ((m % 1440) + 1440) % 1440; return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; };
  const dur = m => m < 60 ? `${m}m` : `${Math.floor(m / 60)}h${m % 60 ? ' ' + String(m % 60).padStart(2, '0') + 'm' : ''}`;
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };

  const total = r => r.steps.reduce((t, s) => t + Number(s.minutes), 0);
  const stepStarts = r => { let t = toMin(r.start); return r.steps.map(s => { const a = t; t += Number(s.minutes); return a; }); };
  const sorted = list => [...list].sort((a, b) => toMin(a.start) - toMin(b.start));
  const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  function scheduledOn(r, d) {
    const rp = r.repeat || { type: 'daily' };
    if (rp.type === 'weekly') return rp.days.includes(d.getDay());
    if (rp.type === 'monthly') {
      const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(), n = d.getDate();
      // a 29th-31st date runs on the last day of shorter months
      return rp.dates.includes(n) || (n === last && rp.dates.some(x => x > last));
    }
    return true;
  }
  function repeatText(r) {
    const rp = r.repeat || { type: 'daily' };
    if (rp.type === 'weekly') {
      const d = [...rp.days].sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7));
      if (d.length === 7) return 'Every day';
      if (d.length === 5 && !d.includes(0) && !d.includes(6)) return 'Weekdays';
      if (d.length === 2 && d.includes(0) && d.includes(6)) return 'Weekends';
      return d.map(x => WD[x]).join(', ');
    }
    if (rp.type === 'monthly') {
      const ord = n => n + (n % 10 === 1 && n !== 11 ? 'st' : n % 10 === 2 && n !== 12 ? 'nd' : n % 10 === 3 && n !== 13 ? 'rd' : 'th');
      return 'Monthly on the ' + [...rp.dates].sort((a, b) => a - b).map(ord).join(', ');
    }
    return 'Every day';
  }
  const allRoutines = (d = new Date()) => GATES.flatMap(g => S.gates[g.id].filter(r => scheduledOn(r, d)).map(r => ({ gate: g.id, r })))
    .sort((a, b) => toMin(a.r.start) - toMin(b.r.start));

  const isDone = (id, k = today()) => !!(S.done[k] && S.done[k][id]);
  function setDone(id, v, k = today()) {
    S.done[k] = S.done[k] || {};
    if (v) S.done[k][id] = true; else delete S.done[k][id];
    save();
  }
  const stepsDone = (r, k = today()) => r.steps.filter(s => isDone(s.id, k)).length;

  function isNow(r) {
    const n = nowMin(), s = toMin(r.start), e = s + total(r);
    return e <= 1440 ? n >= s && n < e : n >= s || n < e - 1440;
  }
  // done | now | upcoming | open (time passed, not done)
  function status(r) {
    if (isDone(r.id)) return 'done';
    if (isNow(r)) return 'now';
    return toMin(r.start) > nowMin() ? 'upcoming' : 'open';
  }

  let ac = null;
  function unlockAudio() {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
    } catch (e) {}
  }
  function beep(freq = 660, d = 0.2, vib = 150) {
    try {
      unlockAudio();
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g).connect(ac.destination);
      o.start(t); o.stop(t + d + 0.05);
    } catch (e) {}
    try { vib && navigator.vibrate && navigator.vibrate(vib); } catch (e) {}
  }
  const buzz = () => { try { navigator.vibrate && navigator.vibrate(30); } catch (e) {} };

  let wake = null;
  async function lockScreen() { try { wake = await navigator.wakeLock.request('screen'); } catch (e) {} }
  function unlockScreen() { try { wake && wake.release(); } catch (e) {} wake = null; }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && (drillRun || run)) lockScreen();
  });

  /* ---------- view state ---------- */

  const V = { tab: 'today', gate: 'sleep', edit: null, summary: null, cal: 'day', anchor: null, sel: null, data: false, slide: null,
              update: null, whatsNew: false, wedit: null, wFrom: null, fcheck: null, fDraft: { ctx: 'Today', text: '' },
              ptab: 'feature', tedit: null, todoWhen: 'today', todoDraft: { text: '', date: '', time: '' }, nadd: null, ngoals: null, nprep: null };
  const TABS = ['today', 'gates', 'water', 'todo', 'practice'], CALS = ['day', 'week', 'month'];
  const slideTo = (list, from, to) => list.indexOf(to) > list.indexOf(from) ? 'r' : list.indexOf(to) < list.indexOf(from) ? 'l' : null;
  let drillRun = null;  // { phase: settle|focus|release, round, doneRounds, start, end, latencies[], catches, falseTaps, locked }
  let featRun = null;   // { id, mode: loaded|control, end, held }
  let run = null;       // { gate, rid, idx, phase: step|between|complete, total, end, paused, remaining }
  let ticker = null;

  function startTicker() { stopTicker(); ticker = setInterval(tick, 200); }
  function stopTicker() { clearInterval(ticker); ticker = null; }

  /* ---------- render ---------- */

  function render() {
    if (drillRun) return renderDrillRun();
    if (run) return renderRun();
    if (featRun) return renderFeatRun();

    const sheetScroll = document.querySelector('.sheet')?.scrollTop || 0;
    const dateStr = new Date().toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    let tz = '';
    try { tz = new Intl.DateTimeFormat(undefined, { timeZoneName: 'short' }).formatToParts(new Date()).find(x => x.type === 'timeZoneName').value; } catch (e) {}
    const body = { today: todayView, gates: gatesView, water: waterView, todo: todoView, practice: practiceView }[V.tab]();
    const wd = waterDue();
    $app.innerHTML = `
      <header><h1>MetaMorph</h1><div class="right"><span class="date">${esc(dateStr)}${tz ? ` · ${esc(tz)}` : ''}</span>
        <button class="iconbtn" data-act="data" aria-label="Backup and data">⋯${backupDue() ? '<span class="badge"></span>' : ''}</button></div></header>
      <main><div class="${V.slide ? 'slide-' + V.slide : ''}">${body}</div></main>
      <nav class="tabs"><div class="inner">
        ${[['today', 'Today'], ['gates', 'Gates'], ['water', 'Water'], ['todo', 'To-do'], ['practice', 'Practice']].map(([k, l]) =>
          `<button data-act="tab" data-v="${k}" class="${V.tab === k ? 'on' : ''}">${l}</button>`).join('')}
      </div></nav>
      ${V.edit ? editSheet() : ''}
      ${V.data ? dataSheet() : ''}
      ${V.whatsNew ? whatsNewSheet() : ''}
      ${V.wedit ? waterSheet() : ''}
      ${V.fcheck ? checkSheet() : ''}
      ${V.tedit ? todoSheet() : ''}
      ${V.nadd ? addFoodSheet() : ''}
      ${V.ngoals ? goalsSheet() : ''}
      ${V.nprep ? prepSheet() : ''}
      ${wd && V.tab !== 'water' && !anySheet() ? `
        <div class="toast watert ${V.toastFx || V.lastDue !== wd.next.id ? 'anim' : ''}" role="status">${DROP}
          <div class="msg"><b>Time for water</b>${fmtW(wd.next.cum - wd.got)} · since ${clock(wd.next.time)}</div>
          <button class="btn ghost" data-act="w-snooze" data-id="${wd.next.id}">Later</button>
          <button class="btn water" data-act="w-add" data-ml="${wd.next.cum - wd.got}">Log</button>
        </div>` : V.update && !anySheet() ? `
        <div class="toast ${V.toastFx ? 'anim' : ''}" role="status">${orb('chaos', 36)}
          <div class="msg"><b>Update ready</b>A new version of MetaMorph</div>
          <button class="btn ghost" data-act="update-later">Later</button>
          <button class="btn primary" data-act="update-now">Update</button>
        </div>` : ''}
    `;
    V.gateFx = false;
    V.slide = null;
    V.toastFx = false;
    if (wd && V.lastDue !== wd.next.id) { V.lastDue = wd.next.id; if (document.visibilityState === 'visible') buzz(); }
    if (V.data) V.data = 'open';
    if (V.wedit) V.wedit.fresh = false;
    if (V.fcheck) V.fcheck.fresh = false;
    for (const k of ['tedit', 'nadd', 'ngoals', 'nprep']) if (V[k]) V[k].fresh = false;
    updateClocks();
    // let the water fill rise from where it was
    if (V.wFrom != null) {
      V.wFrom = null;
      requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll('[data-h]').forEach(x => { x.style.height = x.dataset.h + '%'; })));
    }
    if (V.edit) {
      const sh = document.querySelector('.sheet');
      if (sh) sh.scrollTop = sheetScroll;
      V.edit.fresh = false;
    }
  }

  /* ----- today ----- */

  function chainText(r, current) {
    return r.steps.map((s, i) => {
      const t = esc(s.title);
      if (isDone(s.id)) return `<s>${t}</s>`;
      return i === current ? `<b>${t}</b>` : t;
    }).join(' → ');
  }

  function untilText(r) {
    let d = toMin(r.start) - nowMin();
    if (d < 0) d += 1440;
    return `in ${dur(d)}`;
  }

  function todayView() {
    const seg = `<div class="seg">${[['day', 'Day'], ['week', 'Week'], ['month', 'Month']].map(([k, l]) =>
      `<button data-act="cal" data-v="${k}" class="${V.cal === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;
    return seg + (V.cal === 'week' ? weekView() : V.cal === 'month' ? monthView() : dayView());
  }

  // held / scheduled for one gate on one date
  function gateDay(gid, d) {
    const k = keyOf(d), rs = S.gates[gid].filter(r => scheduledOn(r, d));
    return { n: rs.length, held: rs.filter(r => isDone(r.id, k)).length };
  }
  function mark(gd, d) {
    if (!gd.n) return 'none';
    if (gd.held >= gd.n) return 'full';
    if (gd.held) return 'part';
    // today isn't over yet, so unheld routines are still to come
    return keyOf(d) >= today() ? 'future' : 'miss';
  }

  function calNav(title, sub) {
    return `<div class="calnav">
      <button class="arrow" data-act="cal-prev" aria-label="Previous">‹</button>
      <div class="ttl">${title}<small>${sub}</small></div>
      <button class="arrow" data-act="cal-next" aria-label="Next">›</button>
    </div>`;
  }

  function dayDetail() {
    const k = V.sel || today(), d = parseKey(k), items = allRoutines(d), future = k > today();
    const label = k === today() ? 'Today' : d.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
    const held = items.filter(x => isDone(x.r.id, k)).length;
    return `<div class="card" style="margin-top:14px">
      <div class="row spread"><p class="label" style="margin:0">${esc(label)}</p><span class="muted num" style="font-size:13px">${items.length ? `${held}/${items.length} held` : ''}</span></div>
      ${items.length ? `<ul class="daylist" style="margin-top:6px">${items.map(({ gate, r }) => `
        <li>${orb(gate, 28)}
          <span><div style="font-weight:600">${esc(r.title)}</div><div class="t num">${clock(r.start)} · ${dur(total(r))}</div></span>
          <button class="chk ${isDone(r.id, k) ? 'done' : ''}" data-act="toggle-day" data-date="${k}" data-gate="${gate}" data-id="${r.id}" ${future ? 'disabled' : ''} aria-label="Mark held">✓</button>
        </li>`).join('')}</ul>` : '<p class="muted" style="margin:8px 0 0">Nothing scheduled.</p>'}
    </div>`;
  }

  function weekView() {
    const a = parseKey(V.anchor || today());
    const mon = addDays(a, -((a.getDay() + 6) % 7));
    const days = Array.from({ length: 7 }, (_, i) => addDays(mon, i));
    const sun = days[6];
    const fmt = d => d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    let held = 0, n = 0;
    for (const g of GATES) for (const d of days) { const x = gateDay(g.id, d); if (keyOf(d) <= today()) { held += x.held; n += x.n; } }
    const isThis = days.some(d => keyOf(d) === today());
    return `
      ${calNav(`${fmt(mon)} – ${fmt(sun)}`, isThis ? 'This week' : `<button class="linkbtn" data-act="cal-today">Back to this week</button>`)}
      <div class="card">
        <div class="wk">
          <span></span>
          ${days.map(d => { const k = keyOf(d); return `<div class="dh ${k === today() ? 'today' : ''} ${k === (V.sel || today()) ? 'sel' : ''}" data-act="sel" data-v="${k}">${WD[d.getDay()][0]}<b class="num">${d.getDate()}</b></div>`; }).join('')}
          ${GATES.map(g => `<span class="g" title="${g.name}">${orb(g.id, 24)}</span>` + days.map(d => {
            const m = mark(gateDay(g.id, d), d);
            return `<div class="c" data-act="sel" data-v="${keyOf(d)}">${m === 'none' ? '·' : `<i class="ring ${m}" style="--gcol:${g.color}"></i>`}</div>`;
          }).join('')).join('')}
          <span class="g" title="Water">${DROP}</span>${days.map(d => {
            const m = waterMark(d);
            return `<div class="c" data-act="sel" data-v="${keyOf(d)}">${m === 'none' ? '·' : `<i class="ring ${m}" style="--gcol:var(--water)"></i>`}</div>`;
          }).join('')}
        </div>
        <div class="legend"><span><i class="ring full" style="--gcol:var(--muted)"></i>held</span><span><i class="ring part" style="--gcol:var(--muted)"></i>partly</span><span><i class="ring miss" style="--gcol:var(--muted)"></i>missed</span></div>
        ${n ? `<p class="muted num" style="text-align:center;margin:10px 0 0;font-size:13px">${held}/${n} held so far · ${Math.round(100 * held / n)}%</p>` : ''}
      </div>
      ${dayDetail()}`;
  }

  function monthView() {
    const a = parseKey(V.anchor || today());
    const first = new Date(a.getFullYear(), a.getMonth(), 1);
    const daysIn = new Date(a.getFullYear(), a.getMonth() + 1, 0).getDate();
    const lead = (first.getDay() + 6) % 7;
    let held = 0, n = 0;
    const cells = [];
    for (let i = 0; i < lead; i++) cells.push('<div class="d blank"></div>');
    for (let day = 1; day <= daysIn; day++) {
      const d = new Date(a.getFullYear(), a.getMonth(), day), k = keyOf(d);
      const bars = GATES.map(g => {
        const x = gateDay(g.id, d);
        if (k <= today()) { held += x.held; n += x.n; }
        return `<i class="${mark(x, d)}" style="--gcol:${g.color}"></i>`;
      }).join('') + `<i class="${waterMark(d)}" style="--gcol:var(--water)"></i>`;
      cells.push(`<div class="d ${k === today() ? 'today' : ''} ${k === (V.sel || today()) ? 'sel' : ''}" data-act="sel" data-v="${k}"><span class="n num">${day}</span><span class="bars">${bars}</span></div>`);
    }
    const isThis = a.getFullYear() === new Date().getFullYear() && a.getMonth() === new Date().getMonth();
    const title = first.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    return `
      ${calNav(esc(title), isThis ? 'This month' : `<button class="linkbtn" data-act="cal-today">Back to this month</button>`)}
      <div class="card">
        <div class="mo">
          ${['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(x => `<div class="wd">${x}</div>`).join('')}
          ${cells.join('')}
        </div>
        <div class="legend" style="flex-wrap:wrap">${GATES.map(g => `<span><i class="ring full" style="--gcol:${g.color};width:10px;height:10px"></i>${g.name}</span>`).join('')}<span><i class="ring full" style="--gcol:var(--water);width:10px;height:10px"></i>Water</span></div>
        ${n ? `<p class="muted num" style="text-align:center;margin:10px 0 0;font-size:13px">${held}/${n} held so far · ${Math.round(100 * held / n)}%</p>` : ''}
      </div>
      ${dayDetail()}`;
  }

  function dayView() {
    const items = allRoutines(), k = today();
    const timed = S.todos.filter(x => x.date === k && x.time);
    const loose = S.todos.filter(x => !x.done && x.date && (x.date < k || (x.date === k && !x.time)));
    if (!items.length && !timed.length && !loose.length)
      return `<div class="nexus">${orb('chaos', 150, 'spin')}<div class="cap">Nothing scheduled today</div></div>`;

    const pick = items.find(x => status(x.r) === 'now')
      || items.find(x => status(x.r) === 'upcoming')
      || items.find(x => status(x.r) === 'open');

    let hero;
    if (pick) {
      const { gate, r } = pick, st = status(r), sd = stepsDone(r), g = gateOf(gate);
      const live = st === 'now' || st === 'open', w = windowOf(r);
      const when = st === 'now' ? 'NOW' : st === 'upcoming' ? `UP NEXT · ${untilText(r).toUpperCase()}` : 'OVERDUE';
      const chips = r.steps.map((x, i) => `<button class="stepchip ${isDone(x.id) ? 'done' : ''}" data-act="step-toggle" data-gate="${gate}" data-id="${r.id}" data-i="${i}">${isDone(x.id) ? '✓ ' : ''}${esc(x.title)}</button>`).join('<span class="arrow">→</span>');
      hero = `
        <div class="card hero" style="--gc:${g.color}">
          <div class="top">${orb(gate, 56)}<div>
          <div class="when">${when}</div>
          <div class="ti">${esc(r.title)}</div>
          <div class="meta">${g.name} · <span class="num">${clock(r.start)} – ${fromMin(toMin(r.start) + total(r))}</span> · ${dur(total(r))}</div>
          </div></div>
          ${live ? `${clockBar(r)}<div class="row spread"><span class="cleft" data-left="${w.end}"></span><span class="muted num" style="font-size:13px">${sd}/${r.steps.length} steps</span></div>` : ''}
          <div class="chain">${chips}</div>
          ${live
            ? `<div class="acts"><button class="btn" data-act="run" data-gate="${gate}" data-id="${r.id}">Open timer</button><button class="btn primary" data-act="complete" data-gate="${gate}" data-id="${r.id}">Complete</button></div>`
            : `<button class="btn primary block" data-act="run" data-gate="${gate}" data-id="${r.id}">Start early</button>`}
        </div>`;
    } else if (items.length) {
      hero = `<div class="card hero"><div class="when">ALL GATES HELD</div><div class="ti">Every routine is done today.</div></div>`;
    } else hero = '';

    const doneCount = items.filter(x => isDone(x.r.id)).length;
    const entries = [...items.map(x => ({ m: toMin(x.r.start), kind: 'r', ...x })), ...timed.map(t => ({ m: toMin(t.time), kind: 't', t }))]
      .sort((a, b) => a.m - b.m);
    return `
      <div class="nexus">${orb('chaos', 150, 'spin')}
        <div class="cap"><b class="num">${doneCount}/${items.length}</b> held today</div></div>
      ${hero}
      <div class="row spread" style="margin-top:18px"><p class="label" style="margin:0">Timeline</p><span class="muted num" style="font-size:13px">${doneCount}/${items.length} done</span></div>
      <ul class="tl">
        ${entries.map(en => en.kind === 't' ? todoTimelineItem(en.t) : (() => {
          const { gate, r } = en, st = status(r), sd = stepsDone(r);
          let right;
          if (st === 'done') { const fi = finText(r); right = `<span class="st ${fi.late ? 'late' : ''}">${fi.txt}</span>`; }
          else if (st === 'now') right = `<span class="st cleft" data-left="${windowOf(r).end}"></span>`;
          else if (st === 'upcoming') right = `<span class="st">${untilText(r)}</span>`;
          else right = `<span class="st late">${sd ? `${sd}/${r.steps.length} · ` : ''}overdue</span>`;
          return `<li style="--gc:${gateOf(gate).color}"><div class="swbg"><span class="l">✓ Held</span><span class="r">Undo</span></div>
            <div class="it ${st}" data-act="run" data-gate="${gate}" data-id="${r.id}">
            <span class="t num">${clock(r.start)}</span>

              <div class="sub">${r.steps.length > 1 ? r.steps.map(x => esc(x.title)).join(' → ') + ' · ' : ''}${dur(total(r))}</div>
              ${st === 'now' ? clockBar(r, true) : ''}</span>
            ${right}

      </ul>
      <p class="swhint">Swipe right to mark done · left to undo</p>
      ${loose.length ? `<div class="card" style="margin-top:14px"><div class="row spread"><p class="label" style="margin:0">To-do today</p><button class="linkbtn" data-act="tab" data-v="todo">Open list</button></div>
        <ul class="todos">${loose.map(todoRow).join('')}</ul></div>` : ''}`;

  /* ----- what's new ----- */

  function whatsNewSheet() {
    // 6 was the last version before "What's new" existed
    const from = typeof S.seenVersion === 'number' ? S.seenVersion : 6;
    const notes = Object.keys(CHANGELOG).map(Number).filter(v => v > from && v <= APP_VERSION)
      .sort((a, b) => b - a).flatMap(v => CHANGELOG[v]);
    return `
      <div class="sheet-bg enter" data-act="whatsnew-close-bg">
        <div class="sheet">
          <div class="whatsnew-head">${orb('chaos', 56, 'enter')}<div><h2>What's new</h2><span class="muted num">Version ${APP_VERSION}</span></div></div>
          <ul class="news">${(notes.length ? notes : ['Small fixes and improvements']).map(n => `<li>${esc(n)}</li>`).join('')}</ul>

  /* ----- backup / data ----- */

  const DAY = 864e5;
  const backupDue = () => Date.now() - (S.lastBackup || S.created) > 14 * DAY;
  function ago(t) {
    const d = Math.floor((Date.now() - t) / DAY);
    return d <= 0 ? 'today' : d === 1 ? 'yesterday' : `${d} days ago`;
  }
  function backupBlob() {
    const payload = { app: 'metamorph', exported: new Date().toISOString(), data: S };
    return new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json' });
  }
  const backupName = () => `metamorph-backup-${today()}.json`;
  function markBackedUp() { S.lastBackup = Date.now(); save(); render(); }

  function dataSheet() {
    const p = storageInfo.persisted;
    const canShare = !!(navigator.canShare && navigator.canShare({ files: [new File(['x'], 'x.json', { type: 'application/json' })] }));
    const nDays = Object.keys(S.done).length;
    return `
      <div class="sheet-bg ${V.data === true ? 'enter' : ''}" data-act="data-close-bg">
        <div class="sheet">
          <h2>Backup &amp; data</h2>
          <div class="kv"><span>Saved on this device</span><span class="v good">Automatically, every change</span></div>
          <div class="kv"><span>Second copy (IndexedDB)</span><span class="v ${typeof indexedDB !== 'undefined' ? 'good' : 'warn'}">${typeof indexedDB !== 'undefined' ? 'On' : 'Unavailable'}</span></div>
          <div class="kv"><span>Protected from auto-clearing</span><span class="v ${p ? 'good' : 'warn'}">${p === null ? 'Unknown' : p ? 'Yes' : 'Not granted'}</span></div>
          <div class="kv"><span>Last backup file</span><span class="v ${backupDue() ? 'warn' : 'good'}">${S.lastBackup ? ago(S.lastBackup) : 'Never'}</span></div>
          <div class="kv"><span>History</span><span class="v num">${nDays} day${nDays === 1 ? '' : 's'} · ${S.drill.sessions.length} drills</span></div>
          <div class="stack">
            ${canShare ? '<button class="btn primary block" data-act="backup-share">Share backup (Drive, Files…)</button>' : ''}
            <button class="btn ${canShare ? '' : 'primary'} block" data-act="backup-save">Download backup file</button>
            <button class="btn block" data-act="backup-restore">Restore from a backup file</button>
            <input type="file" id="restorefile" accept="application/json,.json" hidden>
            ${p ? '' : '<button class="btn block" data-act="persist">Ask browser to protect storage</button>'}
          </div>
          <p class="note">Everything is saved automatically on this device. Uninstalling the app or clearing site data
            erases it, so keep a backup file somewhere else (Drive, iCloud, email) and you can restore on any device.</p>
          <button class="btn ghost block" data-act="data-close" style="margin-top:8px">Close</button>
        </div>
      </div>`;
  }

  /* ----- gates ----- */

  function gatesView() {
    const g = gateOf(V.gate);
    const list = sorted(S.gates[V.gate]);
    const now0 = new Date();
    const todays = list.filter(r => scheduledOn(r, now0));
    return `
      <div class="gatebar">${GATES.map(x => {
        const rs = S.gates[x.id].filter(r => scheduledOn(r, now0)), n = rs.filter(r => isDone(r.id)).length;
        return `<button data-act="gate" data-v="${x.id}" class="${x.id === V.gate ? 'on' : ''}" style="--gc:${x.color}">
          ${orb(x.id, 40)}<span class="nm">${x.name}</span><span class="ct num">${n}/${rs.length}</span></button>`;
      }).join('')}</div>
      <div class="gatehead">${orb(g.id, 92, V.gateFx ? 'enter' : 'spin')}<div>
        <div class="nm" style="color:${g.color}">${g.name}</div>
        <div class="sub">${g.other ? 'Everything outside the four Gates<br>' : ''}${list.length} routine${list.length === 1 ? '' : 's'} · ${dur(list.reduce((t, r) => t + total(r), 0))} · ${todays.filter(r => isDone(r.id)).length}/${todays.length} ${g.other ? 'done' : 'held'} today</div>
      </div></div>
      ${list.map(r => {
        const on = scheduledOn(r, now0), done = isDone(r.id), now = on && isNow(r) && !done, starts = stepStarts(r), sd = stepsDone(r);
        const fi = done ? finText(r) : null;
        return `<div class="card ${now ? 'now' : ''}" style="--gc:${g.color}${on ? '' : ';opacity:.6'}">
          <div class="rhead">
            <button class="chk ${done ? 'done' : ''}" data-act="toggle" data-id="${r.id}" aria-label="Mark routine done">✓</button>
            <div>
              <div class="t num">${clock(r.start)} – ${fromMin(toMin(r.start) + total(r))} · ${dur(total(r))}${now ? '<span class="tag">now</span>' : ''}${fi ? `<span class="tag ${fi.late ? 'late' : ''}" style="${fi.late ? '' : 'color:var(--ok)'}">${fi.txt}</span>` : ''}</div>
              <div class="ti">${esc(r.title)}</div>
              <div class="t rep">${esc(repeatText(r))}${on ? '' : ' · <span class="tag">not today</span>'}</div>
            </div>
          </div>
          ${now ? `${clockBar(r, true)}<div class="cleft" data-left="${windowOf(r).end}"></div>` : ''}
          <ul class="chainlist">
            ${r.steps.map((x, i) => `<li class="${isDone(x.id) ? 'done' : ''}">
              <span class="t num">${fromMin(starts[i])}</span><span class="d"></span>
              <span>${esc(x.title)}${x.work ? ` <span class="muted">· ${esc(x.work)}</span>` : ''}</span>
              <span class="m num">${dur(x.minutes)}</span></li>`).join('')}
          </ul>
          <div class="acts">
            <button class="btn small" data-act="edit" data-id="${r.id}">Edit</button>
            <button class="btn small primary" data-act="run" data-gate="${V.gate}" data-id="${r.id}">${sd && !done ? 'Continue' : 'Start'}</button>
          </div>
        </div>`;
      }).join('') || `<p class="muted">No ${g.other ? 'activities' : 'routines for ' + g.name} yet.</p>`}
      <button class="btn block" data-act="add">+ Add ${g.other ? 'activity' : g.name + ' routine'}</button>
      ${V.gate === 'nutrition' ? nutritionPanel() : ''}`;
  }

  function editSheet() {
    const e = V.edit, r = e.r, n = r.steps.length;
    const t = total(r);
    return `
      <div class="sheet-bg ${e.fresh ? 'enter' : ''}" data-act="edit-cancel-bg">
        <form class="sheet" id="editform" autocomplete="off">
          <h2>${e.isNew ? 'New' : 'Edit'} ${gateOf(e.gate).name} routine</h2>
          <div class="grid2">
            <div class="field"><label>Name</label><input name="r_title" required value="${esc(r.title)}" placeholder="Morning routine"></div>
            <div class="field"><label>Starts at</label><input name="r_start" type="time" required value="${esc(r.start)}"></div>
          </div>
          <p class="label" style="margin-top:4px">Repeats</p>
          <div class="chips">
            ${[['daily', 'Every day'], ['weekly', 'Weekly'], ['monthly', 'Monthly']].map(([k, l]) =>
              `<label class="chip"><input type="radio" name="rt" value="${k}" ${r.repeat.type === k ? 'checked' : ''}><span>${l}</span></label>`).join('')}
          </div>
          ${r.repeat.type === 'weekly' ? `<div class="chips days">${[1, 2, 3, 4, 5, 6, 0].map(i =>
              `<label class="chip"><input type="checkbox" name="wd" value="${i}" ${(r.repeat.days || []).includes(i) ? 'checked' : ''}><span>${WD[i].slice(0, 2)}</span></label>`).join('')}</div>` : ''}
          ${r.repeat.type === 'monthly' ? `<div class="chips days">${Array.from({ length: 31 }, (_, j) => j + 1).map(i =>
              `<label class="chip"><input type="checkbox" name="md" value="${i}" ${(r.repeat.dates || []).includes(i) ? 'checked' : ''}><span class="num">${i}</span></label>`).join('')}</div>` : ''}
          <p class="label" style="margin-top:4px">Steps · chained in order</p>
          ${r.steps.map((s, i) => `
            <div class="srow">
              <div class="top">
                <span class="n">${i + 1}</span>
                <input name="st${i}" value="${esc(s.title)}" placeholder="Step" required>
              </div>
              <div class="hm">
                <label><input name="sh${i}" type="number" inputmode="numeric" min="0" max="23" value="${Math.floor(s.minutes / 60)}" aria-label="Hours">hr</label>
                <label><input name="sm${i}" type="number" inputmode="numeric" min="0" max="59" value="${s.minutes % 60}" aria-label="Minutes">min</label>
              </div>
              <input name="sw${i}" value="${esc(s.work)}" placeholder="Ritual line (optional)">
              <div class="tools">
                <button type="button" data-act="s-up" data-i="${i}" ${i === 0 ? 'disabled' : ''} aria-label="Move up">↑</button>
                <button type="button" data-act="s-down" data-i="${i}" ${i === n - 1 ? 'disabled' : ''} aria-label="Move down">↓</button>
                <button type="button" data-act="s-del" data-i="${i}" ${n === 1 ? 'disabled' : ''} aria-label="Remove step">✕</button>
              </div>
            </div>`).join('')}
          <button class="btn block" type="button" data-act="s-add" style="margin-bottom:8px">+ Add step</button>
          <div class="total num">${dur(t)} total · ends ${fromMin(toMin(r.start || '00:00') + t)}</div>
          <button class="btn primary block" type="submit" style="margin-bottom:8px">Save</button>
          <div class="grid2">
            <button class="btn" type="button" data-act="edit-cancel">Cancel</button>
            ${e.isNew ? '<span></span>' : '<button class="btn danger" type="button" data-act="delete">Delete</button>'}
          </div>
        </form>
      </div>`;
  }

  // pull typed values into V.edit before any re-render of the sheet
  function syncEdit() {
    const f = document.getElementById('editform');
    if (!f || !V.edit) return;
    const r = V.edit.r, el = f.elements;
    r.title = el.r_title.value;
    r.start = el.r_start.value || r.start;
    r.steps.forEach((s, i) => {
      s.title = el['st' + i].value;
      const h = Math.min(23, Math.max(0, Math.floor(Number(el['sh' + i].value) || 0)));
      const m = Math.min(59, Math.max(0, Math.floor(Number(el['sm' + i].value) || 0)));
      s.minutes = Math.max(1, h * 60 + m);
      s.work = el['sw' + i].value;
    });
    const type = (f.querySelector('input[name=rt]:checked') || {}).value || 'daily';
    const picked = name => [...f.querySelectorAll(`input[name=${name}]:checked`)].map(x => Number(x.value));
    const prev = r.repeat || {};
    r.repeat = { type };
    // keep earlier picks when switching between types, so nothing is lost by tapping around
    r.repeat.days = type === 'weekly' ? picked('wd') : (prev.days || []);
    r.repeat.dates = type === 'monthly' ? picked('md') : (prev.dates || []);
  }

  /* ----- routine run ----- */

  function findRoutine(gate, id) { return S.gates[gate].find(r => r.id === id); }

  // A run belongs to the day it started, so a routine finished after midnight still counts for that night.
  function startRoutine(gate, id) {
    const r = findRoutine(gate, id);
    if (!r) return;
    const key = today();
    let idx = r.steps.findIndex(s => !isDone(s.id, key));
    if (idx < 0 || isDone(r.id, key)) idx = 0;
    unlockAudio(); lockScreen(); startTicker();
    run = { gate, rid: id, idx, key };
    beginStep(idx);
  }

  // keep the run in saved state so closing the app doesn't lose it
  function saveRun() { S.run = run ? { ...run } : null; save(); }
  function resumeRun() {
    const r0 = S.run;
    if (!r0 || !findRoutine(r0.gate, r0.rid)) { S.run = null; return; }
    // abandon runs left open for more than a day
    if (Date.now() - (r0.paused ? Date.now() : r0.end) > DAY) { S.run = null; save(); return; }
    run = { ...r0, entered: true };
    startTicker();
    if (run.autoAt && run.autoAt < Date.now()) run.autoAt = Date.now() + 1500;
    lockScreen();
  }

  function beginStep(i) {
    const r = findRoutine(run.gate, run.rid);
    run.idx = i;
    run.phase = 'step';
    run.autoAt = null;
    run.over = false;
    run.total = Math.max(1, Number(r.steps[i].minutes)) * 60000;
    run.end = Date.now() + run.total;
    run.paused = false;
    beep(880, 0.3);
    saveRun();
    renderRun();
  }

  function finishStep() {
    const r = findRoutine(run.gate, run.rid);
    if (run.over) {
      run.late = run.late || {};
      run.late[r.steps[run.idx].id] = Math.round((Date.now() - run.end) / 1000);
      run.over = false;
    }
    setDone(r.steps[run.idx].id, true, run.key);
    if (run.idx >= r.steps.length - 1) {
      for (const o of [...(run.open || [])]) closeLate(o);
      setDone(r.id, true, run.key);
