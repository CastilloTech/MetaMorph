name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['app/**', 'src/**', 'tests/**', 'push/**', 'build.mjs', 'package.json', 'package-lock.json', '.github/workflows/pages.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build from src/
        run: npm run build
      - name: The committed app/index.html matches the build
        run: git diff --exit-code app/index.html || (echo "app/index.html is out of date - run npm run build and commit it" && exit 1)
      - name: Run all test suites
        run: node tests/run.js
      - name: Push server checks (encryption, signing, scheduling, companion chat)
        run: npm ci --prefix push && node push/test.mjs

  # only publishes when every test passes, and only from main
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
